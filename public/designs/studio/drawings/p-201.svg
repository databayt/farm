280.16 157.64,294.56 194.51,274.36 233.48,298.03" fill="none" stroke="#3d2b14" stroke-width="0.7" stroke-linejoin="round"/><text x="134.94" y="268.81" font-size="1.8" text-anchor="start" font-weight="normal" fill="#3d2b14">D1</text><polyline points="182.74,196.64 182.74,165.14 229.81,181.97" fill="none" stroke="#e08a1e" stroke-width="0.45" stroke-linejoin="round"/><text x="183.74" y="195.64" font-size="1.8" text-anchor="start" font-weight="normal" fill="#e08a1e">T1</text><polyline points="182.74,196.64 230.2,224.05 193.18,234.17" fill="none" stroke="#e08a1e" stroke-width="0.45" stroke-linejoin="round"/><text x="183.74" y="195.64" font-size="1.8" text-anchor="start" font-weight="normal" fill="#e08a1e">T2</text><polyline points="194.51,274.13 203.08,279.08 246.96,118.97 246.96,1.97" fill="none" stroke="#7a7a7a" stroke-width="0.7" stroke-linejoin="round"/><text x="195.51" y="273.13" font-size="1.8" text-anchor="start" font-weight="normal" fill="#7a7a7a">V1</text><polyline points="201.36,235.75 201.36,244.3 218.51,255.32 192.17,271.43 194.51,273.01" fill="none" stroke="#6b4f2a" stroke-width="0.7" stroke-linejoin="round"/><text x="202.36" y="234.75" font-size="1.8" text-anchor="start" font-weight="normal" fill="#6b4f2a">D2</text><polyline points="189.67,262.75 189.67,271.75 186.94,270.62 189.83,269.41 194.51,272.56" fill="none" stroke="#6b4f2a" stroke-width="0.45" stroke-linejoin="round"/><text x="190.67" y="261.75" font-size="1.8" text-anchor="start" font-weight="normal" fill="#6b4f2a">D3</text><polyline points="146.49,195.07 146.49,202.72 267.61,276.7" fill="none" stroke="#6b4f2a" stroke-width="0.7" stroke-linejoin="round"/><text x="147.49" y="194.07" font-size="1.8" text-anchor="start" font-weight="normal" fill="#6b4f2a">D4</text><polygon points="16.33,107.32 242.28,237.77 154.52,288.44 -71.43,157.99" fill="none" stroke="#999" stroke-width="0.2" stroke-linejoin="round"/><text x="25" y="30" font-size="2.4" text-anchor="start" font-weight="normal" fill="#111">Supply: PPR PN20, 20/25 mm. Hot leaves the 80 L heater at 60 C; a thermostatic mixer</text><text x="25" y="33.48" font-size="2.4" text-anchor="start" font-weight="normal" fill="#111">(TMV) delivers 41-44 C to the shower and basin; the kitchen sink gets direct hot (labelled).</text><text x="25" y="36.96" font-size="2.4" text-anchor="start" font-weight="normal" fill="#111">Drainage hangs in the void under the raised floor (the container is about 700 mm up),</text><text x="25" y="40.44" font-size="2.4" text-anchor="start" font-weight="normal" fill="#111">between cross-members: WC 110, shower and sink 50, basin 40, falls at least 1:40.</text><text x="25" y="43.92" font-size="2.4" text-anchor="start" font-weight="normal" fill="#111">Vent: 75 mm open vent up end B to 900 above the guardrail line (or an AAV inside).</text><text x="25" y="47.4" font-size="2.4" text-anchor="start" font-weight="normal" fill="#111">Kitchen sink waste runs separately to a grease trap and its own soak pit (STU-11).</text><rect x="290" y="261" width="120" height="26" fill="#fff" stroke="#111" stroke-width="0.4"/><line x1="290" y1="270" x2="410" y2="270" stroke="#111" stroke-width="0.2"/><line x1="290" y1="279" x2="410" y2="279" stroke="#111" stroke-width="0.2"/><line x1="370" y1="270" x2="370" y2="287" stroke="#111" stroke-width="0.2"/><text x="292" y="267" font-size="3.4" font-weight="bold">Farm container studios</text><text x="408" y="267" font-size="2.2" text-anchor="end">farm.databayt.org/docs/studio</text><text x="292" y="276" font-size="3.2">Pipework isometric (unit)</text><text x="372" y="276" font-size="5" font-weight="bold">P-201</text><text x="292" y="284.5" font-size="2.3">Scale NTS · Rev A · 2026-10-26 · mm</text><text x="372" y="284.5" font-size="2.6" font-weight="bold" fill="#b3261e">PRELIMINARY</text><text x="210.0" y="148.5" font-size="34" fill="#b3261e" fill-opacity="0.05" text-anchor="middle" transform="rotate(-18 210.0 148.5)">PRELIMINARY</text></svg>
