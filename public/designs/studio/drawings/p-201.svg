PPR PN20, 20/25 mm. Hot leaves the 80 L heater at 60 C; a thermostatic mixer</text><text x="25" y="33.48" font-size="2.4" text-anchor="start" font-weight="normal" fill="#111">(TMV) delivers 41-44 C to the shower and basin; the kitchen sink gets direct hot (labelled).</text><text x="25" y="36.96" font-size="2.4" text-anchor="start" font-weight="normal" fill="#111">Drainage hangs in the void under the raised floor (the container is about 700 mm up),</text><text x="25" y="40.44" font-size="2.4" text-anchor="start" font-weight="normal" fill="#111">between cross-members: WC 110, shower and sink 50, basin 40, falls at least 1:40.</text><text x="25" y="43.92" font-size="2.4" text-anchor="start" font-weight="normal" fill="#111">Vent: 75 mm open vent up end B to 900 above the guardrail line (or an AAV inside).</text><text x="25" y="47.4" font-size="2.4" text-anchor="start" font-weight="normal" fill="#111">Kitchen sink waste runs separately to a grease trap and its own soak pit (STU-11).</text><rect x="290" y="261" width="120" height="26" fill="#fff" stroke="#111" stroke-width="0.4"/><line x1="290" y1="270" x2="410" y2="270" stroke="#111" stroke-width="0.2"/><line x1="290" y1="279" x2="410" y2="279" stroke="#111" stroke-width="0.2"/><line x1="370" y1="270" x2="370" y2="287" stroke="#111" stroke-width="0.2"/><text x="292" y="267" font-size="3.4" font-weight="bold">Farm container studios</text><text x="408" y="267" font-size="2.2" text-anchor="end">farm.databayt.org/docs/studio</text><text x="292" y="276" font-size="3.2">Pipework isometric (unit)</text><text x="372" y="276" font-size="5" font-weight="bold">P-201</text><text x="292" y="284.5" font-size="2.3">Scale NTS · Rev A · 2026-10-26 · mm</text><text x="372" y="284.5" font-size="2.6" font-weight="bold" fill="#b3261e">PRELIMINARY</text><text x="210.0" y="148.5" font-size="34" fill="#b3261e" fill-opacity="0.05" text-anchor="middle" transform="rotate(-18 210.0 148.5)">PRELIMINARY</text></svg>
