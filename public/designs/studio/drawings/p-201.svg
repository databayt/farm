3,278.48 183.83,277.17 190.61,274.33 229.58,298" fill="none" stroke="#3d2b14" stroke-width="0.7" stroke-linejoin="round"/><text x="188.33" y="267.12" font-size="1.8" text-anchor="start" font-weight="normal" fill="#3d2b14">D1</text><polyline points="185.39,200.4 185.39,168.9 224.75,181.28" fill="none" stroke="#e08a1e" stroke-width="0.45" stroke-linejoin="round"/><text x="186.39" y="199.4" font-size="1.8" text-anchor="start" font-weight="normal" fill="#e08a1e">T1</text><polyline points="185.39,200.4 226.31,224.02 157.33,252.6" fill="none" stroke="#e08a1e" stroke-width="0.45" stroke-linejoin="round"/><text x="186.39" y="199.4" font-size="1.8" text-anchor="start" font-weight="normal" fill="#e08a1e">T2</text><polyline points="190.61,274.11 199.18,279.06 243.06,118.95 243.06,1.95" fill="none" stroke="#7a7a7a" stroke-width="0.7" stroke-linejoin="round"/><text x="191.61" y="273.11" font-size="1.8" text-anchor="start" font-weight="normal" fill="#7a7a7a">V1</text><polyline points="200.19,237.3 200.19,245.85 214.61,255.3 188.27,271.41 190.61,272.99" fill="none" stroke="#6b4f2a" stroke-width="0.7" stroke-linejoin="round"/><text x="201.19" y="236.3" font-size="1.8" text-anchor="start" font-weight="normal" fill="#6b4f2a">D2</text><polyline points="153.82,281.18 153.82,289.5 151.09,288.15 185.93,269.48 190.61,272.53" fill="none" stroke="#6b4f2a" stroke-width="0.45" stroke-linejoin="round"/><text x="154.82" y="280.18" font-size="1.8" text-anchor="start" font-weight="normal" fill="#6b4f2a">D3</text><polyline points="132.39,231.9 132.39,239.55 226.7,298.05" fill="none" stroke="#6b4f2a" stroke-width="0.7" stroke-linejoin="round"/><text x="133.39" y="230.9" font-size="1.8" text-anchor="start" font-weight="normal" fill="#6b4f2a">D4</text><polygon points="12.43,107.3 238.39,237.75 150.62,288.42 -75.33,157.97" fill="none" stroke="#999" stroke-width="0.2" stroke-linejoin="round"/><text x="25" y="30" font-size="2.4" text-anchor="start" font-weight="normal" fill="#111">Supply: PPR PN20, 20/25 mm. Hot leaves the 80 L heater at 60 C; a thermostatic mixer</text><text x="25" y="33.48" font-size="2.4" text-anchor="start" font-weight="normal" fill="#111">(TMV) delivers 41-44 C to the shower and basin; the kitchen sink gets direct hot (labelled).</text><text x="25" y="36.96" font-size="2.4" text-anchor="start" font-weight="normal" fill="#111">Drainage hangs in the void under the raised floor (the container is about 700 mm up),</text><text x="25" y="40.44" font-size="2.4" text-anchor="start" font-weight="normal" fill="#111">between cross-members: WC 110, shower and sink 50, basin 40, falls at least 1:40.</text><text x="25" y="43.92" font-size="2.4" text-anchor="start" font-weight="normal" fill="#111">Vent: 75 mm open vent up end B to 900 above the guardrail line (or an AAV inside).</text><text x="25" y="47.4" font-size="2.4" text-anchor="start" font-weight="normal" fill="#111">Kitchen sink waste runs separately to a grease trap and its own soak pit (STU-11).</text><rect x="290" y="261" width="120" height="26" fill="#fff" stroke="#111" stroke-width="0.4"/><line x1="290" y1="270" x2="410" y2="270" stroke="#111" stroke-width="0.2"/><line x1="290" y1="279" x2="410" y2="279" stroke="#111" stroke-width="0.2"/><line x1="370" y1="270" x2="370" y2="287" stroke="#111" stroke-width="0.2"/><text x="292" y="267" font-size="3.4" font-weight="bold">Farm container studios</text><text x="408" y="267" font-size="2.2" text-anchor="end">farm.databayt.org/docs/studio</text><text x="292" y="276" font-size="3.2">Pipework isometric (unit)</text><text x="372" y="276" font-size="5" font-weight="bold">P-201</text><text x="292" y="284.5" font-size="2.3">Scale NTS · Rev A · 2026-10-26 · mm</text><text x="372" y="284.5" font-size="2.6" font-weight="bold" fill="#b3261e">PRELIMINARY</text><text x="210.0" y="148.5" font-size="34" fill="#b3261e" fill-opacity="0.05" text-anchor="middle" transform="rotate(-18 210.0 148.5)">PRELIMINARY</text></svg>
