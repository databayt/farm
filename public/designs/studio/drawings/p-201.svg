="141.97" font-size="1.8" text-anchor="start" font-weight="normal" fill="#e34948">H1</text><polyline points="175.35,184.38 173.92,183.56" fill="none" stroke="#e34948" stroke-width="0.45" stroke-linejoin="round"/><text x="176.35" y="183.38" font-size="1.8" text-anchor="start" font-weight="normal" fill="#e34948">H2</text><polyline points="201.91,208.37 201.91,220.84 199.92,220.1 203.76,218.5 225.8,231.88" fill="none" stroke="#8b4a12" stroke-width="0.7" stroke-linejoin="round"/><text x="202.91" y="207.37" font-size="1.8" text-anchor="start" font-weight="normal" fill="#8b4a12">D1</text><polyline points="209.31,199.28 209.31,182.74 221.54,175.68" fill="none" stroke="#eda100" stroke-width="0.45" stroke-linejoin="round"/><text x="210.31" y="198.28" font-size="1.8" text-anchor="start" font-weight="normal" fill="#eda100">T1</text><polyline points="209.31,199.28 185.95,212.77 185.95,209.21" fill="none" stroke="#eda100" stroke-width="0.45" stroke-linejoin="round"/><text x="210.31" y="198.28" font-size="1.8" text-anchor="start" font-weight="normal" fill="#eda100">T2</text><polyline points="203.76,218.37 208.61,221.17 229.02,209.39 229.02,67" fill="none" stroke="#9a9893" stroke-width="0.7" stroke-linejoin="round"/><text x="204.76" y="217.37" font-size="1.8" text-anchor="start" font-weight="normal" fill="#9a9893">V1</text><polyline points="209.18,197.55 209.18,202.39 217.33,207.73 202.44,216.84 203.76,217.74" fill="none" stroke="#8b4a12" stroke-width="0.7" stroke-linejoin="round"/><text x="210.18" y="196.55" font-size="1.8" text-anchor="start" font-weight="normal" fill="#8b4a12">D2</text><polyline points="182.95,201.24 182.95,227.07 181.41,226.31 201.11,215.75 203.76,217.48" fill="none" stroke="#8b4a12" stroke-width="0.45" stroke-linejoin="round"/><text x="183.95" y="200.24" font-size="1.8" text-anchor="start" font-weight="normal" fill="#8b4a12">D3</text><polyline points="167.86,178.66 167.86,201.56 220.31,234.14" fill="none" stroke="#8b4a12" stroke-width="0.7" stroke-linejoin="round"/><text x="168.86" y="177.66" font-size="1.8" text-anchor="start" font-weight="normal" fill="#8b4a12">D4</text><polygon points="102.99,124.03 230.78,197.81 181.15,226.46 53.36,152.69" fill="none" stroke="#999" stroke-width="0.2" stroke-linejoin="round"/><text x="25" y="30" font-size="2.4" text-anchor="start" font-weight="normal" fill="#111">Supply: PPR PN20, 20/25 mm. Hot leaves the 80 L heater at 60 C; a thermostatic mixer</text><text x="25" y="33.48" font-size="2.4" text-anchor="start" font-weight="normal" fill="#111">(TMV) delivers 41-44 C to the shower and basin; the kitchen sink gets direct hot (labelled).</text><text x="25" y="36.96" font-size="2.4" text-anchor="start" font-weight="normal" fill="#111">Drainage hangs in the void under the raised floor (the container is about 700 mm up),</text><text x="25" y="40.44" font-size="2.4" text-anchor="start" font-weight="normal" fill="#111">between cross-members: WC 110, shower and sink 50, basin 40, falls at least 1:40.</text><text x="25" y="43.92" font-size="2.4" text-anchor="start" font-weight="normal" fill="#111">Vent: 75 mm open vent up end B to 900 above the guardrail line (or an AAV inside).</text><text x="25" y="47.4" font-size="2.4" text-anchor="start" font-weight="normal" fill="#111">Kitchen sink waste runs separately to a grease trap and its own soak pit (STU-11).</text><rect x="290" y="261" width="120" height="26" fill="#fff" stroke="#111" stroke-width="0.4"/><line x1="290" y1="270" x2="410" y2="270" stroke="#111" stroke-width="0.2"/><line x1="290" y1="279" x2="410" y2="279" stroke="#111" stroke-width="0.2"/><line x1="370" y1="270" x2="370" y2="287" stroke="#111" stroke-width="0.2"/><text x="292" y="267" font-size="3.4" font-weight="bold">Farm container studios</text><text x="408" y="267" font-size="2.2" text-anchor="end">farm.databayt.org/docs/studio</text><text x="292" y="276" font-size="3.2">Pipework isometric (unit)</text><text x="372" y="276" font-size="5" font-weight="bold">P-201</text><text x="292" y="284.5" font-size="2.3">Scale NTS · Rev A · 2026-10-26 · mm</text><text x="372" y="284.5" font-size="2.6" font-weight="bold" fill="#b3261e">PRELIMINARY</text><text x="210.0" y="148.5" font-size="34" fill="#b3261e" fill-opacity="0.05" text-anchor="middle" transform="rotate(-18 210.0 148.5)">PRELIMINARY</text></svg>
