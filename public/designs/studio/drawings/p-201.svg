66.16 190.74,276.51 187.24,275.2 194.02,272.37 232.99,296.04" fill="none" stroke="#3d2b14" stroke-width="0.7" stroke-linejoin="round"/><text x="191.74" y="265.16" font-size="1.8" text-anchor="start" font-weight="normal" fill="#3d2b14">D1</text><polyline points="188.8,198.43 188.8,166.93 228.16,179.31" fill="none" stroke="#e08a1e" stroke-width="0.45" stroke-linejoin="round"/><text x="189.8" y="197.43" font-size="1.8" text-anchor="start" font-weight="normal" fill="#e08a1e">T1</text><polyline points="188.8,198.43 229.72,222.06 160.74,250.63" fill="none" stroke="#e08a1e" stroke-width="0.45" stroke-linejoin="round"/><text x="189.8" y="197.43" font-size="1.8" text-anchor="start" font-weight="normal" fill="#e08a1e">T2</text><polyline points="194.02,272.14 202.59,277.09 246.47,116.98 246.47,-0.02" fill="none" stroke="#7a7a7a" stroke-width="0.7" stroke-linejoin="round"/><text x="195.02" y="271.14" font-size="1.8" text-anchor="start" font-weight="normal" fill="#7a7a7a">V1</text><polyline points="203.6,235.33 203.6,243.88 218.02,253.33 191.68,269.44 194.02,271.02" fill="none" stroke="#6b4f2a" stroke-width="0.7" stroke-linejoin="round"/><text x="204.6" y="234.33" font-size="1.8" text-anchor="start" font-weight="normal" fill="#6b4f2a">D2</text><polyline points="157.23,279.21 157.23,287.53 154.5,286.18 189.34,267.51 194.02,270.57" fill="none" stroke="#6b4f2a" stroke-width="0.45" stroke-linejoin="round"/><text x="158.23" y="278.21" font-size="1.8" text-anchor="start" font-weight="normal" fill="#6b4f2a">D3</text><polyline points="128.98,233.87 128.98,241.52 223.29,300.02" fill="none" stroke="#6b4f2a" stroke-width="0.7" stroke-linejoin="round"/><text x="129.98" y="232.87" font-size="1.8" text-anchor="start" font-weight="normal" fill="#6b4f2a">D4</text><polygon points="15.84,105.33 241.8,235.78 154.03,286.45 -71.92,156" fill="none" stroke="#999" stroke-width="0.2" stroke-linejoin="round"/><text x="25" y="30" font-size="2.4" text-anchor="start" font-weight="normal" fill="#111">Supply: PPR PN20, 20/25 mm. Hot leaves the 80 L heater at 60 C; a thermostatic mixer</text><text x="25" y="33.48" font-size="2.4" text-anchor="start" font-weight="normal" fill="#111">(TMV) delivers 41-44 C to the shower and basin; the kitchen sink gets direct hot (labelled).</text><text x="25" y="36.96" font-size="2.4" text-anchor="start" font-weight="normal" fill="#111">Drainage hangs in the void under the raised floor (the container is about 700 mm up),</text><text x="25" y="40.44" font-size="2.4" text-anchor="start" font-weight="normal" fill="#111">between cross-members: WC 110, shower and sink 50, basin 40, falls at least 1:40.</text><text x="25" y="43.92" font-size="2.4" text-anchor="start" font-weight="normal" fill="#111">Vent: 75 mm open vent up end B to 900 above the guardrail line (or an AAV inside).</text><text x="25" y="47.4" font-size="2.4" text-anchor="start" font-weight="normal" fill="#111">Kitchen sink waste runs separately to a grease trap and its own soak pit (STU-11).</text><rect x="290" y="261" width="120" height="26" fill="#fff" stroke="#111" stroke-width="0.4"/><line x1="290" y1="270" x2="410" y2="270" stroke="#111" stroke-width="0.2"/><line x1="290" y1="279" x2="410" y2="279" stroke="#111" stroke-width="0.2"/><line x1="370" y1="270" x2="370" y2="287" stroke="#111" stroke-width="0.2"/><text x="292" y="267" font-size="3.4" font-weight="bold">Farm container studios</text><text x="408" y="267" font-size="2.2" text-anchor="end">farm.databayt.org/docs/studio</text><text x="292" y="276" font-size="3.2">Pipework isometric (unit)</text><text x="372" y="276" font-size="5" font-weight="bold">P-201</text><text x="292" y="284.5" font-size="2.3">Scale NTS · Rev A · 2026-10-26 · mm</text><text x="372" y="284.5" font-size="2.6" font-weight="bold" fill="#b3261e">PRELIMINARY</text><text x="210.0" y="148.5" font-size="34" fill="#b3261e" fill-opacity="0.05" text-anchor="middle" transform="rotate(-18 210.0 148.5)">PRELIMINARY</text></svg>
