<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="Helvetica, Arial, sans-serif"><rect x="0" y="0" width="420" height="297" fill="#fff"/><rect x="10" y="10" width="400" height="277" fill="none" stroke="#111" stroke-width="0.5"/><text x="20" y="30" font-size="3" text-anchor="start" font-weight="bold" fill="#111">A (chosen): bath at the narrow-door end</text><rect x="20" y="35" width="115.96" height="45.04" fill="#fff" stroke="#111" stroke-width="0.4"/><rect x="47.6" y="79.44" width="60" height="1.2" fill="#d6ecf7" stroke="#1f6fd1" stroke-width="0.3"/><rect x="119.8" y="79.44" width="10.4" height="1.2" fill="#999" stroke="#111" stroke-width="0.3"/><rect x="20" y="35" width="32.8" height="43.4" fill="#e7dcef" stroke="#333" stroke-width="0.2"/><text x="36.4" y="57.5" font-size="2" text-anchor="middle" font-weight="normal" fill="#111">bed</text><rect x="52.8" y="35" width="55.4" height="12" fill="#efe0bf" stroke="#333" stroke-width="0.2"/><text x="80.5" y="41.8" font-size="2" text-anchor="middle" font-weight="normal" fill="#111">wardrobe + kitchen</text><rect x="109.6" y="35" width="26.36" height="45.04" fill="#cfe3f0" stroke="#333" stroke-width="0.2"/><text x="122.78" y="58.32" font-size="2" text-anchor="middle" font-weight="normal" fill="#111">bath</text><text x="20" y="86.04" font-size="2.4" text-anchor="start" font-weight="bold" fill="#1b6e2a">PASS: robust to +/-150 mm; one wet core; door becomes a window</text><text x="150" y="30" font-size="3" text-anchor="start" font-weight="bold" fill="#111">B: mirror (bath at end A)</text><rect x="150" y="35" width="115.96" height="45.04" fill="#fff" stroke="#111" stroke-width="0.4"/><rect x="177.6" y="79.44" width="60" height="1.2" fill="#d6ecf7" stroke="#1f6fd1" stroke-width="0.3"/><rect x="249.8" y="79.44" width="10.4" height="1.2" fill="#999" stroke="#111" stroke-width="0.3"/><rect x="150" y="35" width="26.2" height="45.04" fill="#cfe3f0" stroke="#333" stroke-width="0.2"/><text x="163.1" y="58.32" font-size="2" text-anchor="middle" font-weight="normal" fill="#111">bath</text><rect x="177.6" y="35" width="43.4" height="12" fill="#efe0bf" stroke="#333" stroke-width="0.2"/><text x="199.3" y="41.8" font-size="2" text-anchor="middle" font-weight="normal" fill="#111">kitchen + wardrobe</text><rect x="233.16" y="35" width="32.8" height="43.4" fill="#e7dcef" stroke="#333" stroke-width="0.2"/><text x="249.56" y="57.5" font-size="2" text-anchor="middle" font-weight="normal" fill="#111">bed</text><text x="150" y="86.04" font-size="2.4" text-anchor="start" font-weight="bold" fill="#b3261e">Works, but the bathroom has no window and the bed sits by the steps</text><text x="280" y="30" font-size="3" text-anchor="start" font-weight="bold" fill="#111">C: keep the narrow door as an entrance</text><rect x="280" y="35" width="115.96" height="45.04" fill="#fff" stroke="#111" stroke-width="0.4"/><rect x="307.6" y="79.44" width="60" height="1.2" fill="#d6ecf7" stroke="#1f6fd1" stroke-width="0.3"/><rect x="379.8" y="79.44" width="10.4" height="1.2" fill="#999" stroke="#111" stroke-width="0.3"/><rect x="280" y="35" width="32.8" height="43.4" fill="#e7dcef" stroke="#333" stroke-width="0.2"/><text x="296.4" y="57.5" font-size="2" text-anchor="middle" font-weight="normal" fill="#111">bed</text><rect x="312.8" y="35" width="45.2" height="12" fill="#efe0bf" stroke="#333" stroke-width="0.2"/><text x="335.4" y="41.8" font-size="2" text-anchor="middle" font-weight="normal" fill="#111">kitchen</text><rect x="364.4" y="35" width="31.56" height="23.6" fill="#cfe3f0" stroke="#333" stroke-width="0.2"/><text x="380.18" y="47.6" font-size="2" text-anchor="middle" font-weight="normal" fill="#111">bath 1.18 deep</text><rect x="364.4" y="58.6" width="31.56" height="21.44" fill="#ffffff" stroke="#333" stroke-width="0.2"/><text x="380.18" y="70.12" font-size="2" text-anchor="middle" font-weight="normal" fill="#111">entry hall</text><text x="280" y="86.04" font-size="2.4" text-anchor="start" font-weight="bold" fill="#b3261e">FAIL: WC side 364 &lt; 400, front 500 &lt; 600; 550 mm door</text><text x="20" y="120" font-size="2.6" text-anchor="start" font-weight="normal" fill="#111">Options checked by the generator against the same rules (scripts/studio/validate.py):</text><text x="20" y="123.77" font-size="2.6" text-anchor="start" font-weight="normal" fill="#111">WC centreline at least 400 from walls and 600 clear in front; shower tray at least 1,000 x 900; kitchen aisle at</text><text x="20" y="127.54" font-size="2.6" text-anchor="start" font-weight="normal" fill="#111">least 900 to the glass; door and drawer sweeps clear of solids; partition on the solid strip after the glazing.</text><text x="20" y="131.31" font-size="2.6" text-anchor="start" font-weight="normal" fill="#111">Layout A with the WC facing across the width passes at the photo estimate and at -150 / +150 mm (tests).</text><text x="20" y="135.08" font-size="2.6" text-anchor="start" font-weight="normal" fill="#111">A first version with the WC facing along the container failed if the glazing ended more than about 70 mm later.</text><text x="20" y="138.85" font-size="2.6" text-anchor="start" font-weight="normal" fill="#111">Precedents: Cleveland 20 ft (STU-46), Falcon (STU-47), Pod-Tainer (STU-48), container hotels (STU-49, STU-50).</text><rect x="290" y="261" width="120" height="26" fill="#fff" stroke="#111" stroke-width="0.4"/><line x1="290" y1="270" x2="410" y2="270" stroke="#111" stroke-width="0.2"/><line x1="290" y1="279" x2="410" y2="279" stroke="#111" stroke-width="0.2"/><line x1="370" y1="270" x2="370" y2="287" stroke="#111" stroke-width="0.2"/><text x="292" y="267" font-size="3.4" font-weight="bold">Farm container studios</text><text x="408" y="267" font-size="2.2" text-anchor="end">farm.databayt.org/docs/studio</text><text x="292" y="276" font-size="3.2">Layout options considered</text><text x="372" y="276" font-size="5" font-weight="bold">A-102</text><text x="292" y="284.5" font-size="2.3">Scale 1:50 · Rev A · 2026-10-26 · mm</text><text x="372" y="284.5" font-size="2.6" font-weight="bold" fill="#b3261e">PRELIMINARY</text><text x="210.0" y="148.5" font-size="34" fill="#b3261e" fill-opacity="0.05" text-anchor="middle" transform="rotate(-18 210.0 148.5)">PRELIMINARY</text></svg>
