555" stroke-width="0.13"/><line x1="191.6" y1="263" x2="91.6" y2="263" stroke="#333" stroke-width="0.18"/><line x1="190.6" y1="264" x2="192.6" y2="262" stroke="#111" stroke-width="0.3"/><line x1="90.6" y1="264" x2="92.6" y2="262" stroke="#111" stroke-width="0.3"/><text x="141.6" y="262.2" font-size="2.2" text-anchor="middle" font-weight="normal" fill="#111" transform="rotate(360 141.6 262.2)">slider 3000 (+/-150)</text><line x1="71.27" y1="267" x2="71.27" y2="262.4" stroke="#555" stroke-width="0.13"/><line x1="53.93" y1="267" x2="53.93" y2="262.4" stroke="#555" stroke-width="0.13"/><line x1="71.27" y1="263" x2="53.93" y2="263" stroke="#333" stroke-width="0.18"/><line x1="70.27" y1="264" x2="72.27" y2="262" stroke="#111" stroke-width="0.3"/><line x1="52.93" y1="264" x2="54.93" y2="262" stroke="#111" stroke-width="0.3"/><text x="62.6" y="262.2" font-size="2.2" text-anchor="middle" font-weight="normal" fill="#111" transform="rotate(360 62.6 262.2)">door 520</text><text x="260" y="40" font-size="2.6" text-anchor="start" font-weight="normal" fill="#111">Existing (photo 2026-10-25, not published):</text><text x="260" y="43.77" font-size="2.6" text-anchor="start" font-weight="normal" fill="#111">- standard 20 ft container on a raised steel deck,</text><text x="260" y="47.54" font-size="2.6" text-anchor="start" font-weight="normal" fill="#111">  deck about 700 above ground, steps at end B</text><text x="260" y="51.31" font-size="2.6" text-anchor="start" font-weight="normal" fill="#111">- sliding glass wall, white frames, about 3.0 x 2.25 m</text><text x="260" y="55.08" font-size="2.6" text-anchor="start" font-weight="normal" fill="#111">- narrow hinged steel door near end B (about 0.55 m)</text><text x="260" y="58.85" font-size="2.6" text-anchor="start" font-weight="normal" fill="#111">- yellow unit: original cargo doors at end B</text><text x="260" y="62.62" font-size="2.6" text-anchor="start" font-weight="normal" fill="#111">- one corner casting rests on a rock: level first</text><text x="260" y="66.39" font-size="2.6" text-anchor="start" font-weight="normal" fill="#111">- temporary wiring; timber lining in one unit</text><text x="260" y="70.16" font-size="2.6" text-anchor="start" font-weight="normal" fill="#111"></text><text x="260" y="73.93" font-size="2.6" text-anchor="start" font-weight="normal" fill="#111">Positions are scaled from the 6,058 mm length [E].</text><text x="260" y="77.7" font-size="2.6" text-anchor="start" font-weight="normal" fill="#111">Survey every unit before cutting (studio-site page).</text><text x="260" y="81.47" font-size="2.6" text-anchor="start" font-weight="normal" fill="#111"></text><text x="260" y="85.24" font-size="2.6" text-anchor="start" font-weight="normal" fill="#111">Structure: the glazed side is about 60 % open and</text><text x="260" y="89.01" font-size="2.6" text-anchor="start" font-weight="normal" fill="#111">no longer braces the box (STU-03). Do not cut the</text><text x="260" y="92.78" font-size="2.6" text-anchor="start" font-weight="normal" fill="#111">back or end walls; holes there max 152 mm each.</text><rect x="290" y="261" width="120" height="26" fill="#fff" stroke="#111" stroke-width="0.4"/><line x1="290" y1="270" x2="410" y2="270" stroke="#111" stroke-width="0.2"/><line x1="290" y1="279" x2="410" y2="279" stroke="#111" stroke-width="0.2"/><line x1="370" y1="270" x2="370" y2="287" stroke="#111" stroke-width="0.2"/><text x="292" y="267" font-size="3.4" font-weight="bold">Farm container studios</text><text x="408" y="267" font-size="2.2" text-anchor="end">farm.databayt.org/docs/studio</text><text x="292" y="276" font-size="3.2">Existing condition (photo-scaled)</text><text x="372" y="276" font-size="5" font-weight="bold">A-101</text><text x="292" y="284.5" font-size="2.3">Scale 1:30 · Rev A · 2026-10-26 · mm</text><text x="372" y="284.5" font-size="2.6" font-weight="bold" fill="#b3261e">PRELIMINARY</text><text x="210.0" y="148.5" font-size="34" fill="#b3261e" fill-opacity="0.05" text-anchor="middle" transform="rotate(-18 210.0 148.5)">PRELIMINARY</text></svg>
