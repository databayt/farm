 fill="#e3e8ea" stroke="#111" stroke-width="0.25"/><text x="301.4" y="106" font-size="1.9" text-anchor="middle" font-weight="normal" fill="#111">tile + adhesive</text><line x1="290" y1="38" x2="290" y2="40.3" stroke="#555" stroke-width="0.13"/><line x1="302.4" y1="38" x2="302.4" y2="40.3" stroke="#555" stroke-width="0.13"/><line x1="290" y1="40" x2="302.4" y2="40" stroke="#333" stroke-width="0.18"/><line x1="289" y1="41" x2="291" y2="39" stroke="#111" stroke-width="0.3"/><line x1="301.4" y1="41" x2="303.4" y2="39" stroke="#111" stroke-width="0.3"/><text x="296.2" y="39.2" font-size="2.2" text-anchor="middle" font-weight="normal" fill="#111">62</text><text x="30" y="144" font-size="3" text-anchor="start" font-weight="bold" fill="#111">PARTITION 70 (living | bath)</text><rect x="30" y="150" width="3.6" height="60" fill="#cdb68c" stroke="#111" stroke-width="0.25"/><text x="31.8" y="216" font-size="1.9" text-anchor="middle" font-weight="normal" fill="#111">marine ply 18</text><rect x="33.6" y="150" width="8" height="60" fill="#c9a06f" stroke="#111" stroke-width="0.25"/><text x="37.6" y="216" font-size="1.9" text-anchor="middle" font-weight="normal" fill="#111">stud 40 + rock wool</text><rect x="41.6" y="150" width="2.4" height="60" fill="#cfcfcf" stroke="#111" stroke-width="0.25"/><text x="42.8" y="216" font-size="1.9" text-anchor="middle" font-weight="normal" fill="#111">cement board 12</text><line x1="30" y1="148" x2="30" y2="150.3" stroke="#555" stroke-width="0.13"/><line x1="44" y1="148" x2="44" y2="150.3" stroke="#555" stroke-width="0.13"/><line x1="30" y1="150" x2="44" y2="150" stroke="#333" stroke-width="0.18"/><line x1="29" y1="151" x2="31" y2="149" stroke="#111" stroke-width="0.3"/><line x1="43" y1="151" x2="45" y2="149" stroke="#111" stroke-width="0.3"/><text x="37" y="149.2" font-size="2.2" text-anchor="middle" font-weight="normal" fill="#111">70</text><text x="160" y="144" font-size="3" text-anchor="start" font-weight="bold" fill="#111">FLOOR (living)</text><rect x="160" y="150" width="5.6" height="60" fill="#8a6a3a" stroke="#111" stroke-width="0.25"/><text x="162.8" y="216" font-size="1.9" text-anchor="middle" font-weight="normal" fill="#111">container ply 28 (treated)</text><rect x="165.6" y="150" width="0.2" height="60" fill="#777" stroke="#111" stroke-width="0.25"/><text x="165.7" y="216" font-size="1.9" text-anchor="middle" font-weight="normal" fill="#111">membrane</text><rect x="165.8" y="150" width="2.4" height="60" fill="#f2e6c9" stroke="#111" stroke-width="0.25"/><text x="167" y="216" font-size="1.9" text-anchor="middle" font-weight="normal" fill="#111">ply sheet 12</text><rect x="168.2" y="150" width="1" height="60" fill="#dccdb1" stroke="#111" stroke-width="0.25"/><text x="168.7" y="216" font-size="1.9" text-anchor="middle" font-weight="normal" fill="#111">oak SPC 5</text><line x1="160" y1="148" x2="160" y2="150.3" stroke="#555" stroke-width="0.13"/><line x1="169.2" y1="148" x2="169.2" y2="150.3" stroke="#555" stroke-width="0.13"/><line x1="160" y1="150" x2="169.2" y2="150" stroke="#333" stroke-width="0.18"/><line x1="159" y1="151" x2="161" y2="149" stroke="#111" stroke-width="0.3"/><line x1="168.2" y1="151" x2="170.2" y2="149" stroke="#111" stroke-width="0.3"/><text x="164.6" y="149.2" font-size="2.2" text-anchor="middle" font-weight="normal" fill="#111">46</text><text x="290" y="150" font-size="2.4" text-anchor="start" font-weight="normal" fill="#111">W1 (old door): 2 mm steel infill welded, foamed with</text><text x="290" y="153.48" font-size="2.4" text-anchor="start" font-weight="normal" fill="#111">the walls, up to 1,150; obscure louvre</text><text x="290" y="156.96" font-size="2.4" text-anchor="start" font-weight="normal" fill="#111">window above with insect mesh; the bathroom fan exits</text><text x="290" y="160.44" font-size="2.4" text-anchor="start" font-weight="normal" fill="#111">through the infill panel (no new hole in a bracing wall).</text><text x="290" y="163.92" font-size="2.4" text-anchor="start" font-weight="normal" fill="#111"></text><text x="290" y="167.4" font-size="2.4" text-anchor="start" font-weight="normal" fill="#111">Floor: never sand the treated plywood (STU-07); membrane, then 12 mm sheets.</text><text x="290" y="170.88" font-size="2.4" text-anchor="start" font-weight="normal" fill="#111">Drains pass between cross-members, never through them.</text><text x="290" y="174.36" font-size="2.4" text-anchor="start" font-weight="normal" fill="#111">Steel faces: rust converter + zinc primer before foam.</text><text x="290" y="177.84" font-size="2.4" text-anchor="start" font-weight="normal" fill="#111">Closed-cell spray foam, no gaps: no air path to the steel. No welding after foam.</text><rect x="290" y="261" width="120" height="26" fill="#fff" stroke="#111" stroke-width="0.4"/><line x1="290" y1="270" x2="410" y2="270" stroke="#111" stroke-width="0.2"/><line x1="290" y1="279" x2="410" y2="279" stroke="#111" stroke-width="0.2"/><line x1="370" y1="270" x2="370" y2="287" stroke="#111" stroke-width="0.2"/><text x="292" y="267" font-size="3.4" font-weight="bold">Farm container studios</text><text x="408" y="267" font-size="2.2" text-anchor="end">farm.databayt.org/docs/studio</text><text x="292" y="276" font-size="3.2">Build-up details</text><text x="372" y="276" font-size="5" font-weight="bold">A-401</text><text x="292" y="284.5" font-size="2.3">Scale 1:5 · Rev A2 · 2026-10-28 · mm</text><text x="372" y="284.5" font-size="2.6" font-weight="bold" fill="#b3261e">PRELIMINARY</text><text x="210.0" y="148.5" font-size="34" fill="#b3261e" fill-opacity="0.05" text-anchor="middle" transform="rotate(-18 210.0 148.5)">PRELIMINARY</text></svg>
