oke="#111" stroke-width="0.25"/><text x="317" y="118.5" font-size="2" text-anchor="start" font-weight="normal" fill="#111">B16 RCBO</text><line x1="312" y1="123" x2="312" y2="142" stroke="#111" stroke-width="0.25"/><text x="312" y="148" font-size="3.2" text-anchor="middle" font-weight="bold" fill="#111">C7</text><text x="312" y="153" font-size="2.4" text-anchor="middle" font-weight="normal" fill="#111">2.5 mm2</text><text x="312" y="158" font-size="2.2" text-anchor="middle" font-weight="normal" fill="#111">AC</text><text x="312" y="161.2" font-size="2.2" text-anchor="middle" font-weight="normal" fill="#111">provision</text><line x1="354" y1="106" x2="354" y2="112" stroke="#111" stroke-width="0.25"/><line x1="354" y1="112" x2="354" y2="115" stroke="#111" stroke-width="0.25"/><line x1="354" y1="115" x2="356.2" y2="119" stroke="#111" stroke-width="0.25"/><line x1="354" y1="120" x2="354" y2="123" stroke="#111" stroke-width="0.25"/><line x1="353" y1="115.4" x2="355" y2="114.6" stroke="#111" stroke-width="0.25"/><text x="357" y="118.5" font-size="2" text-anchor="start" font-weight="normal" fill="#111">B16</text><line x1="354" y1="123" x2="354" y2="142" stroke="#111" stroke-width="0.25"/><text x="354" y="148" font-size="3.2" text-anchor="middle" font-weight="bold" fill="#111">C8</text><text x="354" y="153" font-size="2.4" text-anchor="middle" font-weight="normal" fill="#111">2.5 mm2</text><text x="354" y="158" font-size="2.2" text-anchor="middle" font-weight="normal" fill="#111">Spare</text><line x1="186" y1="134" x2="312" y2="134" stroke="#111" stroke-width="0.25" stroke-dasharray="1.2 0.8"/><rect x="225" y="131" width="6" height="6" fill="#fff" stroke="#111" stroke-width="0.25"/><text x="228" y="135.6" font-size="2.2" text-anchor="middle" font-weight="normal" fill="#111">K</text><rect x="309" y="131" width="6" height="6" fill="#fff" stroke="#111" stroke-width="0.25"/><text x="312" y="135.6" font-size="2.2" text-anchor="middle" font-weight="normal" fill="#111">K</text><text x="188" y="132" font-size="2" text-anchor="start" font-weight="normal" fill="#111">relay</text><text x="30" y="186" font-size="2.8" text-anchor="start" font-weight="normal" fill="#111">The studio plugs in: any 230 V source protected at 32 A or less; the 32 A main breaker protects the inlet and tails whatever feeds them.</text><text x="30" y="190.06" font-size="2.8" text-anchor="start" font-weight="normal" fill="#111">Priority relay on C4: while the hob runs, contactor K sheds C5 and C7 (heater and AC).</text><text x="30" y="194.12" font-size="2.8" text-anchor="start" font-weight="normal" fill="#111">Diversified maximum demand about 30 A (AS-19), within the 32 A inlet. One RCBO 30 mA type A per circuit.</text><text x="30" y="198.18" font-size="2.8" text-anchor="start" font-weight="normal" fill="#111">TT earthing: the studio&#x27;s own earth rod at the board; never rely on the supply&#x27;s earth (STU-37).</text><text x="30" y="202.24" font-size="2.8" text-anchor="start" font-weight="normal" fill="#111">Ratings are design intent: a RURA class A electrician designs and certifies (STU-15), to RS 565-1:2011 (STU-14).</text><rect x="290" y="261" width="120" height="26" fill="#fff" stroke="#111" stroke-width="0.4"/><line x1="290" y1="270" x2="410" y2="270" stroke="#111" stroke-width="0.2"/><line x1="290" y1="279" x2="410" y2="279" stroke="#111" stroke-width="0.2"/><line x1="370" y1="270" x2="370" y2="287" stroke="#111" stroke-width="0.2"/><text x="292" y="267" font-size="3.4" font-weight="bold">Farm container studios</text><text x="408" y="267" font-size="2.2" text-anchor="end">farm.databayt.org/docs/studio</text><text x="292" y="276" font-size="3.2">Single-line diagram: inlet and unit board</text><text x="372" y="276" font-size="5" font-weight="bold">E-201</text><text x="292" y="284.5" font-size="2.3">Scale NTS · Rev A2 · 2026-10-28 · mm</text><text x="372" y="284.5" font-size="2.6" font-weight="bold" fill="#b3261e">PRELIMINARY</text><text x="210.0" y="148.5" font-size="34" fill="#b3261e" fill-opacity="0.05" text-anchor="middle" transform="rotate(-18 210.0 148.5)">PRELIMINARY</text></svg>
