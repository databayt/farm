1">WC, shower, basin</text><line x1="145" y1="172" x2="145" y2="185" stroke="#3d2b14" stroke-width="0.6"/><polygon points="145,185 146.2,183 143.8,183" fill="#3d2b14" stroke="#3d2b14" stroke-width="0.2" stroke-linejoin="round"/><rect x="130" y="185" width="30" height="10" fill="#fff" stroke="#111" stroke-width="0.35"/><text x="145" y="191" font-size="2.4" text-anchor="middle" font-weight="bold" fill="#111">IC3</text><rect x="190" y="180" width="52" height="22" fill="#fff" stroke="#111" stroke-width="0.35"/><text x="216" y="191" font-size="2.4" text-anchor="middle" font-weight="bold" fill="#111">Septic tank 4.0 m3</text><text x="216" y="194.4" font-size="1.9" text-anchor="middle" font-weight="normal" fill="#111">2 chambers: 2.67 + 1.33</text><line x1="160" y1="190" x2="190" y2="190" stroke="#3d2b14" stroke-width="0.6"/><polygon points="190,190 188,188.8 188,191.2" fill="#3d2b14" stroke="#3d2b14" stroke-width="0.2" stroke-linejoin="round"/><rect x="270" y="180" width="40" height="22" fill="#fff" stroke="#111" stroke-width="0.35"/><text x="290" y="191" font-size="2.4" text-anchor="middle" font-weight="bold" fill="#111">Soak pit / drain field</text><text x="290" y="194.4" font-size="1.9" text-anchor="middle" font-weight="normal" fill="#111">size from percolation</text><line x1="242" y1="190" x2="270" y2="190" stroke="#3d2b14" stroke-width="0.6"/><polygon points="270,190 268,188.8 268,191.2" fill="#3d2b14" stroke="#3d2b14" stroke-width="0.2" stroke-linejoin="round"/><rect x="190" y="215" width="52" height="14" fill="#fff" stroke="#111" stroke-width="0.35"/><text x="216" y="222" font-size="2.4" text-anchor="middle" font-weight="bold" fill="#111">Grease trap</text><text x="216" y="225.4" font-size="1.9" text-anchor="middle" font-weight="normal" fill="#111">3 kitchen sinks</text><rect x="270" y="215" width="40" height="14" fill="#fff" stroke="#111" stroke-width="0.35"/><text x="290" y="222" font-size="2.4" text-anchor="middle" font-weight="bold" fill="#111">Kitchen soak pit</text><text x="290" y="225.4" font-size="1.9" text-anchor="middle" font-weight="normal" fill="#111">separate (STU-11)</text><line x1="242" y1="222" x2="270" y2="222" stroke="#6b4f2a" stroke-width="0.6"/><polygon points="270,222 268,220.8 268,223.2" fill="#6b4f2a" stroke="#6b4f2a" stroke-width="0.2" stroke-linejoin="round"/><rect x="320" y="40" width="74" height="3.6" fill="#eee" stroke="#111" stroke-width="0.2"/><text x="321" y="42.5" font-size="1.9" text-anchor="start" font-weight="bold" fill="#111">Septic sizing, P = 8</text><text x="381" y="42.5" font-size="1.9" text-anchor="start" font-weight="bold" fill="#111">m3</text><rect x="320" y="43.6" width="74" height="3.6" fill="none" stroke="#999" stroke-width="0.12"/><text x="321" y="46.1" font-size="1.9" text-anchor="start" font-weight="normal" fill="#111">DRS 143 draft (STU-10)</text><text x="381" y="46.1" font-size="1.9" text-anchor="start" font-weight="normal" fill="#111">4.0</text><rect x="320" y="47.2" width="74" height="3.6" fill="none" stroke="#999" stroke-width="0.12"/><text x="321" y="49.7" font-size="1.9" text-anchor="start" font-weight="normal" fill="#111">2012 regulations (STU-11)</text><text x="381" y="49.7" font-size="1.9" text-anchor="start" font-weight="normal" fill="#111">2.96</text><rect x="320" y="50.8" width="74" height="3.6" fill="none" stroke="#999" stroke-width="0.12"/><text x="321" y="53.3" font-size="1.9" text-anchor="start" font-weight="normal" fill="#111">180P + 2,000 L (STU-09 style)</text><text x="381" y="53.3" font-size="1.9" text-anchor="start" font-weight="normal" fill="#111">3.44</text><rect x="320" y="54.4" width="74" height="3.6" fill="none" stroke="#999" stroke-width="0.12"/><text x="321" y="56.9" font-size="1.9" text-anchor="start" font-weight="normal" fill="#111">Design (largest, rounded)</text><text x="381" y="56.9" font-size="1.9" text-anchor="start" font-weight="normal" fill="#111">4.0</text><text x="320" y="70" font-size="2.2" text-anchor="start" font-weight="normal" fill="#111">Siting rules (check on the site plan):</text><text x="320" y="73.19" font-size="2.2" text-anchor="start" font-weight="normal" fill="#111">- at least 50 m from the borehole and any well</text><text x="320" y="76.38" font-size="2.2" text-anchor="start" font-weight="normal" fill="#111">  (2012 rules; DRS 143 draft: soak pit 18 m)</text><text x="320" y="79.57" font-size="2.2" text-anchor="start" font-weight="normal" fill="#111">- at least 50 m from the lake (LOC-01, LOC-02)</text><text x="320" y="82.76" font-size="2.2" text-anchor="start" font-weight="normal" fill="#111">- at least 3-7 m from buildings and the boundary</text><text x="320" y="85.95" font-size="2.2" text-anchor="start" font-weight="normal" fill="#111">- downhill of the borehole; tanker within 30 m</text><text x="320" y="89.14" font-size="2.2" text-anchor="start" font-weight="normal" fill="#111">- soak pit only where groundwater is more than</text><text x="320" y="92.33" font-size="2.2" text-anchor="start" font-weight="normal" fill="#111">  2.5 m down and percolation is 25-125 mm/h</text><text x="320" y="95.52" font-size="2.2" text-anchor="start" font-weight="normal" fill="#111">No guests until the system passes inspection.</text><rect x="290" y="261" width="120" height="26" fill="#fff" stroke="#111" stroke-width="0.4"/><line x1="290" y1="270" x2="410" y2="270" stroke="#111" stroke-width="0.2"/><line x1="290" y1="279" x2="410" y2="279" stroke="#111" stroke-width="0.2"/><line x1="370" y1="270" x2="370" y2="287" stroke="#111" stroke-width="0.2"/><text x="292" y="267" font-size="3.4" font-weight="bold">Farm container studios</text><text x="408" y="267" font-size="2.2" text-anchor="end">farm.databayt.org/docs/studio</text><text x="292" y="276" font-size="3.2">Site water and sanitation schematic</text><text x="372" y="276" font-size="5" font-weight="bold">P-301</text><text x="292" y="284.5" font-size="2.3">Scale NTS · Rev A · 2026-10-26 · mm</text><text x="372" y="284.5" font-size="2.6" font-weight="bold" fill="#b3261e">PRELIMINARY</text><text x="210.0" y="148.5" font-size="34" fill="#b3261e" fill-opacity="0.05" text-anchor="middle" transform="rotate(-18 210.0 148.5)">PRELIMINARY</text></svg>
