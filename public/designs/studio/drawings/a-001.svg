<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="Helvetica, Arial, sans-serif"><rect x="0" y="0" width="420" height="297" fill="#fff"/><rect x="10" y="10" width="400" height="277" fill="none" stroke="#111" stroke-width="0.5"/><text x="20" y="32" font-size="7" text-anchor="start" font-weight="bold" fill="#111">Container studios: three identical farm-stay guest units</text><text x="20" y="41" font-size="3.4" text-anchor="start" font-weight="normal" fill="#111">IKEA-style flat-pack fit-out of standard 20 ft containers · materials and fabrication in Kigali</text><text x="20" y="54" font-size="3" text-anchor="start" font-weight="normal" fill="#111">Net interior 5798 x 2252 x 2323 mm (13.1 m2) · Layout B (D-020)</text><text x="20" y="58.35" font-size="3" text-anchor="start" font-weight="normal" fill="#111">MALM-style bed up to 1,600 x 2,000 with two storage boxes, bedside table and lamp · sofa, low table, two chairs</text><text x="20" y="62.7" font-size="3" text-anchor="start" font-weight="normal" fill="#111">Galley 1600 mm on the bathroom wall: fridge, induction, sink; 80 L heater overhead</text><text x="20" y="67.05" font-size="3" text-anchor="start" font-weight="normal" fill="#111">Bathroom 1150 x 2252 mm · shower tray 1000 x 900</text><text x="20" y="71.4" font-size="3" text-anchor="start" font-weight="normal" fill="#111">Max demand about 33 A per unit (heater/hob priority relay) · feeder 10 mm2</text><text x="20" y="75.75" font-size="3" text-anchor="start" font-weight="normal" fill="#111">Shared septic 4.0 m3, 2 chambers 2:1 · storage tank 4.0 m3</text><text x="20" y="80.1" font-size="3" text-anchor="start" font-weight="normal" fill="#111">Roof terrace on the corner castings, open guardrail · tinted polycarbonate canopy over the front deck</text><text x="20" y="84.45" font-size="3" text-anchor="start" font-weight="normal" fill="#111"></text><text x="20" y="88.8" font-size="3" text-anchor="start" font-weight="normal" fill="#111">Status: PRELIMINARY. Opening positions are photo estimates (+/-150 mm, AS-14).</text><text x="20" y="93.15" font-size="3" text-anchor="start" font-weight="normal" fill="#111">Nothing is cut until study/studio/survey.csv is complete and the set is re-issued.</text><text x="20" y="97.5" font-size="3" text-anchor="start" font-weight="normal" fill="#111">Structural items (roof terrace, deck canopy, stair) need an engineer&#x27;s sign-off before guest use.</text><text x="20" y="101.85" font-size="3" text-anchor="start" font-weight="normal" fill="#111">Electrical ratings are design intent until a RURA class A electrician designs and certifies.</text><rect x="230" y="28" width="172" height="3.4" fill="#eee" stroke="#111" stroke-width="0.2"/><text x="231" y="30.3" font-size="1.9" text-anchor="start" font-weight="bold" fill="#111">No.</text><text x="253" y="30.3" font-size="1.9" text-anchor="start" font-weight="bold" fill="#111">Title</text><rect x="230" y="31.4" width="172" height="3.4" fill="none" stroke="#999" stroke-width="0.12"/><text x="231" y="33.7" font-size="1.9" text-anchor="start" font-weight="normal" fill="#111">A-001</text><text x="253" y="33.7" font-size="1.9" text-anchor="start" font-weight="normal" fill="#111">Cover and drawing index</text><rect x="230" y="34.8" width="172" height="3.4" fill="none" stroke="#999" stroke-width="0.12"/><text x="231" y="37.1" font-size="1.9" text-anchor="start" font-weight="normal" fill="#111">A-101</text><text x="253" y="37.1" font-size="1.9" text-anchor="start" font-weight="normal" fill="#111">Existing condition (photo-scaled)</text><rect x="230" y="38.2" width="172" height="3.4" fill="none" stroke="#999" stroke-width="0.12"/><text x="231" y="40.5" font-size="1.9" text-anchor="start" font-weight="normal" fill="#111">A-102</text><text x="253" y="40.5" font-size="1.9" text-anchor="start" font-weight="normal" fill="#111">Layout options considered</text><rect x="230" y="41.6" width="172" height="3.4" fill="none" stroke="#999" stroke-width="0.12"/><text x="231" y="43.9" font-size="1.9" text-anchor="start" font-weight="normal" fill="#111">A-103</text><text x="253" y="43.9" font-size="1.9" text-anchor="start" font-weight="normal" fill="#111">Furniture and dimension plan</text><rect x="230" y="45" width="172" height="3.4" fill="none" stroke="#999" stroke-width="0.12"/><text x="231" y="47.3" font-size="1.9" text-anchor="start" font-weight="normal" fill="#111">A-201</text><text x="253" y="47.3" font-size="1.9" text-anchor="start" font-weight="normal" fill="#111">Interior elevations: back wall and front wall</text><rect x="230" y="48.4" width="172" height="3.4" fill="none" stroke="#999" stroke-width="0.12"/><text x="231" y="50.7" font-size="1.9" text-anchor="start" font-weight="normal" fill="#111">A-202</text><text x="253" y="50.7" font-size="1.9" text-anchor="start" font-weight="normal" fill="#111">End elevations and cross-section</text><rect x="230" y="51.8" width="172" height="3.4" fill="none" stroke="#999" stroke-width="0.12"/><text x="231" y="54.1" font-size="1.9" text-anchor="start" font-weight="normal" fill="#111">A-401</text><text x="253" y="54.1" font-size="1.9" text-anchor="start" font-weight="normal" fill="#111">Build-up details</text><rect x="230" y="55.2" width="172" height="3.4" fill="none" stroke="#999" stroke-width="0.12"/><text x="231" y="57.5" font-size="1.9" text-anchor="start" font-weight="normal" fill="#111">S-101</text><text x="253" y="57.5" font-size="1.9" text-anchor="start" font-weight="normal" fill="#111">Roof terrace, deck canopy and stair: plan and elevation</text><rect x="230" y="58.6" width="172" height="3.4" fill="none" stroke="#999" stroke-width="0.12"/><text x="231" y="60.9" font-size="1.9" text-anchor="start" font-weight="normal" fill="#111">E-101</text><text x="253" y="60.9" font-size="1.9" text-anchor="start" font-weight="normal" fill="#111">Electrical layout plan</text><rect x="230" y="62" width="172" height="3.4" fill="none" stroke="#999" stroke-