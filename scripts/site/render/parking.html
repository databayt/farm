<!doctype html>
<!--
  /en/parking's 3D, in the pattern of the camp's (scripts/site/render/camp.html): the way in seen from the public
  road, built from src/components/parking/parking.json (the numbers the 2D draws) in compound.json's true metres:
  the outer gate and the sign wall lettered DIGITAL FARM in LED, the turn from the road, the green parking of grass
  pavers with its five bays, sett strips, eucalyptus wheel stops and shade trees, two plain cars for scale (no
  plates, no badges), the boundary hedge and the start of the rock road. The gate, the sign wall and the surfaces
  follow the homepage 3D (scripts/site/render/compound.html). Rendered two ways:

    ?mode=line  line drawing on a transparent ground   -> public/designs/parking/render/parking-line.png
    ?mode=real  materials, daylight and shadow         -> public/designs/parking/render/parking-real.webp
    &hero=1     real mode from eye level across the public road, 2400 x 1340, the rock road run on to the inner
                gate -> the stand-in parking-hero.jpg

    ?top=<layer>  real mode from straight above the parking, the road at the bottom, for the page's BuildUp:
                  ground (opaque: the lawn and the dug box) | sub | edging | pavers | grass | marks (transparent)
                  -> render/top-<layer>.webp; window.TAGS holds each piece's rectangle as fractions of the picture
                  (saved by render.mjs, then reshaped into render/top-pieces.json)
    ?item=<id>    one part on its own, transparent, 1600 x 1200, for the rails -> render/item/<id>.webp:
                  gate | sign | lantern | stop | tree | pavers | setts (the design's own meshes or a patch of them),
                  enclosure | duct (lighting.json parts), layers | trench | soakaway (drainage, cut open)
    ?view=light   the model view with the lighting circuit (parking.json lighting): &mode=line draws every duct run in
                  its colour and sets window.TAGS -> render/light-line.png + light-tags.json; &mode=real renders it
                  at dusk, the sign and the lantern lit -> render/light-real.webp
    ?view=drain   the same for where the rain goes (parking.json drainage): the falls as arrows, the trench and the
                  soakaway -> render/drain-line.png + drain-tags.json; real -> render/drain-real.webp

  Serve the repo root on a spare port, open this page at 2400 x 1100, and once body[data-ready] is set
  save the data URL in #out.
-->

<script type="module">
import * as THREE from "three"
import { OutlineEffect } from "three/addons/effects/OutlineEffect.js"
import { LineSegments2 } from "three/addons/lines/LineSegments2.js"

import { GTAOPass } from "three/addons/postprocessing/GTAOPass.js"

const Q = new URLSearchParams(location.search)
const TOP = Q.get("top"), ITEM = Q.get("item"), VIEW = Q.get("view") // VIEW: "light" | "drain"
// the model view draws in line unless asked for real; the build-up and the rail's parts are real unless asked for line
const LINE = TOP || ITEM ? Q.get("mode") === "line" : Q.get("mode") !== "real"
const HERO = !LINE && Q.get("hero") === "1"
const C = await (await fetch(`/src/components/parking/parking.json?${Date.now()}`)).json()
// the build-up's frame: the parking box and 0.8 m round it, in plan metres
const TB = [C.parking.box[0] - 0.8, C.parking.box[1] - 0.8, C.parking.box[2] + 0.8, C.parking.box[3] + 0.8]
const [FW, FH] = HERO ? [2400, 1340] : TOP ? [2400, Math.round((2400 * (TB[3] - TB[1])) / (TB[2] - TB[0]))] : ITEM ? [1600, 1200] : [2400, 1100]
document.getElementById("out").style.cssText = `width:${FW}px;height:${FH}px`
const INK = "#2b2a26", PAGE = "#ffffff"
const DUSK = !LINE && VIEW === "light" // the lighting's real view: after sunset, the sign and the lantern lit
// plan (x east, y south, compound.json's frame) -> three: x = x, y = height, z = -y. The public road then lies toward
// the camera, at +z, and seen from it the sign wall stands left of the gate, as on the homepage.

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true })
renderer.setClearColor(0xffffff, 0)
renderer.setPixelRatio(1)
renderer.setSize(FW, FH)
renderer.outputColorSpace = THREE.SRGBColorSpace
if (!LINE) {
  renderer.toneMapping = THREE.ACESFilmicToneMapping
  renderer.shadowMap.enabled = true
  renderer.shadowMap.type = THREE.PCFSoftShadowMap
}
const scene = new THREE.Scene()

// ------------------------------------------------------------ procedural textures (real mode)
let seed = 7
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647)
function tex(draw, w = 512, h = 512) {
  const c = document.createElement("canvas"); c.width = w; c.height = h
  seed = 7 // each texture draws its own sequence, so editing one never reshuffles another
  draw(c.getContext("2d"), w, h)
  const t = new THREE.CanvasTexture(c)
  t.colorSpace = THREE.SRGBColorSpace
  t.wrapS = t.wrapT = THREE.RepeatWrapping
  t.anisotropy = 8
  return t
}
const speckle = (g, w, h, n, light, dark, size = 2) => {
  for (let i = 0; i < n; i++) {
    g.fillStyle = rnd() > 0.5 ? light : dark
    g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * size, 1 + rnd() * size)
  }
}
const T = LINE ? {} : {
  grass: tex((g, w, h) => {
    g.fillStyle = "#6f9a4a"; g.fillRect(0, 0, w, h)
    speckle(g, w, h, 26000, "rgba(170,200,110,0.35)", "rgba(40,70,30,0.35)")
  }),
  // the dirt road, red-brown laterite with small stones
  murram: tex((g, w, h) => {
    g.fillStyle = "#a8683f"; g.fillRect(0, 0, w, h)
    speckle(g, w, h, 20000, "rgba(220,170,120,0.35)", "rgba(90,45,25,0.35)")
    for (let i = 0; i < 30; i++) { // wheel ruts and dust along the road
      g.fillStyle = `rgba(${rnd() > 0.5 ? "200,150,105" : "120,70,45"},${0.05 + rnd() * 0.06})`
      g.fillRect(0, rnd() * h, w, 4 + rnd() * 14)
    }
  }),
  // grass pavers, as on the homepage: a concrete grid with grass in its cells, 0.4 m a tile
  pavers: tex((g, w, h) => {
    g.fillStyle = "#b9b4a8"; g.fillRect(0, 0, w, h)
    const n = 4, s = w / n
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      g.fillStyle = (i + j) % 2 ? "#6f934a" : "#789c50"
      g.fillRect(i * s + s * 0.18, j * s + s * 0.18, s * 0.64, s * 0.64)
    }
    speckle(g, w, h, 6000, "rgba(255,255,255,0.2)", "rgba(0,0,0,0.15)")
  }, 256, 256),
  // grey granite setts in segmental arcs, as on the homepage: about 100 mm setts, mixed greys with the odd warm one,
  // sand in the joints; one tile is 1.6 m, an arc row every sett
  setts: tex((g, w, h) => {
    g.fillStyle = "#bdb5a5"; g.fillRect(0, 0, w, h)
    const st = w / 16, R0 = w * 0.95, cx = w / 2, cy = h + R0 - h * 0.2
    for (let r = R0 - h * 0.15; r < R0 + h * 1.25; r += st) {
      const span = Math.asin(Math.min(1, (w / 2 + st) / r)), n = Math.ceil((2 * span * r) / st)
      for (let i = 0; i < n; i++) {
        const a = -Math.PI / 2 - span + ((i + 0.5) * 2 * span) / n
        const [x, y] = [cx + r * Math.cos(a), cy + r * Math.sin(a)]
        if (y < -st || y > h + st) continue
        const tone = rnd(), k = 0.92 + rnd() * 0.16
        const c = tone > 0.86 ? [150, 132, 124] : tone > 0.6 ? [140, 140, 136] : tone > 0.3 ? [162, 161, 155] : [118, 120, 118]
        g.fillStyle = `rgb(${c.map((v) => Math.round(v * k)).join(",")})`
        g.save(); g.translate(x, y); g.rotate(a + Math.PI / 2)
        g.beginPath(); g.roundRect(-st / 2 + 2.5, -st / 2 + 2.5, st - 5, st - 5, 5); g.fill()
        g.restore()
      }
    }
  }),
  // a strip between bays: one row of the same setts, ten to the metre
  row: tex((g, w, h) => {
    g.fillStyle = "#bdb5a5"; g.fillRect(0, 0, w, h)
    const s = h / 10
    for (let i = 0; i < 10; i++) {
      const tone = rnd(), k = 0.9 + rnd() * 0.18, c = tone > 0.7 ? [142, 141, 137] : tone > 0.35 ? [160, 159, 153] : [121, 123, 121]
      g.fillStyle = `rgb(${c.map((v) => Math.round(v * k)).join(",")})`
      g.beginPath(); g.roundRect(3, i * s + 3, w - 6, s - 6, 4); g.fill()
    }
  }, 32, 320),
  // fieldstone: rounded stones of mixed size and tone in darker mortar; 1 m a tile
  stone: tex((g, w, h) => {
    g.fillStyle = "#6c6358"; g.fillRect(0, 0, w, h)
    for (let i = 0; i < 160; i++) {
      const x = rnd() * w, y = rnd() * h, rx = 14 + rnd() * 30, ry = 10 + rnd() * 20, tone = rnd()
      g.fillStyle = tone > 0.66 ? "#a8957a" : tone > 0.33 ? "#9a9184" : "#857a6b"
      g.beginPath(); g.ellipse(x, y, rx, ry, rnd() * Math.PI, 0, Math.PI * 2); g.fill()
    }
  }),
  // euphorbia: a mass of thin green stems, lighter at their tips
  hedge: tex((g, w, h) => {
    g.fillStyle = "#3d5e2c"; g.fillRect(0, 0, w, h)
    for (let i = 0; i < 1800; i++) {
      const x = rnd() * w, y = rnd() * h, a = -Math.PI / 2 + (rnd() - 0.5) * 1.4, len = 10 + rnd() * 26
      g.strokeStyle = rnd() > 0.45 ? `rgba(120,165,70,${0.5 + rnd() * 0.4})` : `rgba(55,90,40,${0.5 + rnd() * 0.4})`
      g.lineWidth = 1.5 + rnd() * 1.5; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len); g.stroke()
    }
  }, 256, 256),
  // a crown's foliage: dabs of leaf in light and shade
  foliage: tex((g, w, h) => {
    g.fillStyle = "#5a7842"; g.fillRect(0, 0, w, h)
    for (let i = 0; i < 5000; i++) {
      const t = rnd()
      g.fillStyle = t > 0.55 ? `rgba(125,158,88,${0.2 + rnd() * 0.25})` : `rgba(45,68,34,${0.18 + rnd() * 0.25})`
      g.beginPath(); g.ellipse(rnd() * w, rnd() * h, 1.5 + rnd() * 3, 1 + rnd() * 2, rnd() * Math.PI, 0, Math.PI * 2); g.fill()
    }
  }, 256, 256),
  sky: tex((g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h)
    gr.addColorStop(0, "#4a82c4"); gr.addColorStop(0.32, "#86b0dc"); gr.addColorStop(0.48, "#d6e4ee"); gr.addColorStop(1, "#d6e4ee")
    g.fillStyle = gr; g.fillRect(0, 0, w, h)
  }, 16, 512),
  // the dug box: red-brown subsoil, scraped flat, with the digger's tracks
  earth: tex((g, w, h) => {
    g.fillStyle = "#8a5634"; g.fillRect(0, 0, w, h)
    speckle(g, w, h, 22000, "rgba(200,140,95,0.35)", "rgba(70,38,20,0.35)")
    for (let i = 0; i < 18; i++) { g.fillStyle = `rgba(60,32,18,${0.05 + rnd() * 0.06})`; g.fillRect(0, rnd() * h, w, 6 + rnd() * 18) }
  }),
  // crushed stone, 20 to 40 mm, rolled
  gravel: tex((g, w, h) => {
    g.fillStyle = "#8f8a82"; g.fillRect(0, 0, w, h)
    for (let i = 0; i < 9000; i++) {
      const t = rnd(); g.fillStyle = t > 0.66 ? "#b2ada4" : t > 0.33 ? "#77736c" : "#9c968c"
      g.beginPath(); g.ellipse(rnd() * w, rnd() * h, 2 + rnd() * 4, 1.5 + rnd() * 3, rnd() * Math.PI, 0, Math.PI * 2); g.fill()
    }
  }),
  // the pavers as laid: the concrete grid, its cells of fresh topsoil not yet grown
  pavers0: tex((g, w, h) => {
    g.fillStyle = "#bdb8ac"; g.fillRect(0, 0, w, h)
    const n = 4, s = w / n
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { g.fillStyle = (i + j) % 2 ? "#6b4a33" : "#72503a"; g.fillRect(i * s + s * 0.18, j * s + s * 0.18, s * 0.64, s * 0.64) }
    speckle(g, w, h, 6000, "rgba(255,255,255,0.2)", "rgba(0,0,0,0.15)")
  }, 256, 256),
  concrete: tex((g, w, h) => {
    g.fillStyle = "#a9a59d"; g.fillRect(0, 0, w, h)
    speckle(g, w, h, 9000, "rgba(255,255,255,0.1)", "rgba(60,55,45,0.12)")
  }),
}
// metres one tile of each texture covers [along, across]
const TILE = { grass: [9, 9], murram: [4, 4], pavers: [0.4, 0.4], setts: [1.6, 1.6], row: [0.1, 1], stone: [1, 1], hedge: [0.9, 0.9],
  earth: [3, 3], gravel: [0.8, 0.8], pavers0: [0.4, 0.4], concrete: [1, 1] }
const MAP = { lawn: "grass", murram: "murram", pavers: "pavers", setts: "setts", row: "row", stone: "stone", hedge: "hedge",
  earth: "earth", gravel: "gravel", pavers0: "pavers0", concrete: "concrete" }

// DIGITAL FARM for the sign's panel, sized to it as the homepage's: LED letters in warm white with their glow on dark
// steel, or plain letters in the page's ink for the line drawing
function ledTexture() {
  const { box: [x0, , x1], panel } = C.sign
  const W = 2048, H = Math.round((W * (panel.y1 - panel.y0)) / (x1 - x0 - 2 * panel.inset)), text = panel.text
  const c = document.createElement("canvas"); c.width = W; c.height = H
  const g = c.getContext("2d")
  g.fillStyle = LINE ? PAGE : "#1b1c1e"; g.fillRect(0, 0, W, H)
  const font = (s) => { g.font = `700 ${s}px "Helvetica Neue", Helvetica, Arial, sans-serif`; g.letterSpacing = `${s * 0.06}px` }
  font(100)
  const size = (100 * W * 0.88) / g.measureText(text).width
  font(size)
  const m = g.measureText(text), y = H / 2 + (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2
  g.textAlign = "center"
  if (LINE) { g.fillStyle = INK; g.fillText(text, W / 2, y) }
  else {
    g.shadowColor = "rgba(255, 210, 140, 0.9)"
    for (const [blur, fill] of [[size * 0.3, "#ffd99a"], [size * 0.1, "#ffeccc"], [0, "#fff9ee"]]) {
      g.shadowBlur = blur; g.fillStyle = fill; g.fillText(text, W / 2, y)
    }
  }
  const t = new THREE.CanvasTexture(c)
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8
  return t
}

// ------------------------------------------------------------ materials
// thin parts get crease lines but no silhouette, so hinges and lamps stay fine in the line drawing
const THIN = new Set(["black", "hub", "headlamp", "taillamp"])
const MAT = {}
function mat(name) {
  if (MAT[name]) return MAT[name]
  let x
  if (name === "led") {
    const map = ledTexture()
    x = LINE ? new THREE.MeshBasicMaterial({ map })
      : new THREE.MeshStandardMaterial({ map, emissiveMap: map, emissive: "#ffffff", emissiveIntensity: HERO ? 1.15 : 1.6, roughness: 0.45, metalness: 0.2 })
    x.userData.outlineParameters = { visible: false }
  } else if (LINE) {
    x = new THREE.MeshBasicMaterial({ color: PAGE, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 })
    if (THIN.has(name)) x.userData.outlineParameters = { visible: false }
  } else {
    const std = (o) => new THREE.MeshStandardMaterial(o)
    x = {
      lawn: () => std({ map: T.grass, roughness: 1 }),
      murram: () => std({ map: T.murram, roughness: 1 }),
      pavers: () => std({ map: T.pavers, roughness: 0.95 }),
      setts: () => std({ map: T.setts, roughness: 0.9 }),
      row: () => std({ map: T.row, roughness: 0.9 }),
      stone: () => std({ map: T.stone, roughness: 0.95 }),
      gatewood: () => std({ color: "#b48f63", roughness: 0.8 }), // weathered pine, as the reference gate
      black: () => std({ color: "#26272b", roughness: 0.45, metalness: 0.5 }),
      lamp: () => std({ color: "#f6ecd2", roughness: 0.3, emissive: "#ffe2a8", emissiveIntensity: DUSK ? 6 : 0.25 }),
      earth: () => std({ map: T.earth, roughness: 1 }),
      gravel: () => std({ map: T.gravel, roughness: 1 }),
      pavers0: () => std({ map: T.pavers0, roughness: 0.95 }),
      concrete: () => std({ map: T.concrete, roughness: 0.95 }),
      sand: () => std({ color: "#cdb68a", roughness: 1 }),
      topsoil: () => std({ color: "#5d3f2a", roughness: 1 }),
      geotex: () => std({ color: "#e4e0d4", roughness: 1, side: THREE.DoubleSide }),
      box: () => std({ color: "#d8dbd7", roughness: 0.5 }), // the grey weatherproof box
      duct: () => std({ color: "#2b2c2e", roughness: 0.6 }),
      cable: () => std({ color: "#1a1a1a", roughness: 0.5 }),
      perf: () => std({ color: "#3a3c3a", roughness: 0.6 }),
      tapeY: () => std({ color: "#e8c22a", roughness: 0.7 }), // the warning tape over a duct
      sett0: () => std({ color: "#8c8b87", roughness: 0.85 }), sett1: () => std({ color: "#a2a19b", roughness: 0.85 }),
      sett2: () => std({ color: "#787a78", roughness: 0.85 }),
      log: () => std({ color: "#a37a52", roughness: 0.85 }), // eucalyptus, barked and oiled
      hedge: () => std({ map: T.hedge, roughness: 0.9 }),
      bark: () => std({ color: "#6f6253", roughness: 0.9 }),
      "gum-bark": () => std({ color: "#c9bfae", roughness: 0.9 }), // eucalyptus, pale and smooth
      gum: () => std({ color: "#6f8462", roughness: 0.95 }), // its grey-green crown
      leaf: () => std({ map: T.foliage, color: "#e2ecd6", roughness: 0.95 }),
      leaf2: () => std({ map: T.foliage, color: "#f4f8e8", roughness: 0.95 }),
      white: () => std({ color: "#eeeeec", roughness: 0.3, metalness: 0.3 }),
      silver: () => std({ color: "#a9adb1", roughness: 0.3, metalness: 0.6 }),
      glass: () => std({ color: "#12171b", roughness: 0.55, metalness: 0, envMapIntensity: 0.3, side: THREE.DoubleSide }),
      tyre: () => std({ color: "#1d1d1f", roughness: 0.9 }),
      trim: () => std({ color: "#2a2b2d", roughness: 0.7 }),
      hub: () => std({ color: "#bfc3c7", roughness: 0.35, metalness: 0.7 }),
      headlamp: () => std({ color: "#e3e7e9", roughness: 0.15, metalness: 0.3 }),
      taillamp: () => std({ color: "#9b2620", roughness: 0.25 }),
      sky: () => new THREE.MeshBasicMaterial({ map: T.sky, side: THREE.BackSide, fog: false, toneMapped: false }),
    }[name]?.() ?? std({ color: "#cccccc", roughness: 0.8 })
  }
  return (MAT[name] = x)
}

// ------------------------------------------------------------ geometry helpers (metres)
const meshes = []
let PARENT = scene
// what each mesh belongs to, for the rail's parts (?item=) and the build-up's layers (?top=): set before each part
let PART = "site", LAYER = null
let gseed = 3 // the hedge and the crowns' own sequence
const grnd = () => ((gseed = (gseed * 16807) % 2147483647) / 2147483647)
function worldUV(geo, [tu, tv]) { // each face takes the texture from its own plane, at true scale
  const pos = geo.attributes.position, nrm = geo.attributes.normal, uv = geo.attributes.uv
  if (!uv) return
  for (let i = 0; i < pos.count; i++) {
    const n = [Math.abs(nrm.getX(i)), Math.abs(nrm.getY(i)), Math.abs(nrm.getZ(i))]
    const axis = n.indexOf(Math.max(...n))
    const p = [pos.getX(i), pos.getY(i), pos.getZ(i)]
    const [a, b] = axis === 0 ? [2, 1] : axis === 2 ? [0, 1] : [0, 2]
    uv.setXY(i, p[a] / tu, p[b] / tv)
  }
  uv.needsUpdate = true
}
function add(geo, name, opts = {}) {
  if (!LINE && MAP[name] && !opts.keepUV) worldUV(geo, TILE[MAP[name]])
  const mesh = new THREE.Mesh(geo, mat(name))
  mesh.castShadow = !LINE && !opts.noShadow && !["lawn", "sky", "led"].includes(name)
  mesh.receiveShadow = !LINE && name !== "sky"
  if (opts.pos) mesh.position.set(...opts.pos)
  if (opts.rot) mesh.rotation.set(...opts.rot)
  if (opts.noEdges) mesh.userData.noEdges = true
  mesh.userData.part = PART; mesh.userData.layer = LAYER
  PARENT.add(mesh)
  meshes.push(mesh)
  return mesh
}
// a box in three's own axes (x, height, z), for the parts built inside a group
function box(x0, x1, y0, y1, z0, z1, name, opts) {
  return add(new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0), name, { pos: [(x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2], ...opts })
}
// a box over a plan rectangle, from height h0 to h1; the corners may come in any order
const blk = (xa, ya, xb, yb, h0, h1, name, opts) =>
  box(Math.min(xa, xb), Math.max(xa, xb), h0, h1, -Math.max(ya, yb), -Math.min(ya, yb), name, opts)
function cyl(x, y, r, h0, h, name, seg = 20, rTop = r) {
  return add(new THREE.CylinderGeometry(rTop, r, h, seg), name, { pos: [x, h0 + h / 2, -y] })
}
function ellipsoid(x, h, y, rx, rh, ry, name) {
  const m = add(new THREE.SphereGeometry(1, 20, 12), name, { pos: [x, h, -y] })
  m.scale.set(rx, rh, ry)
  return m
}
// shapes are drawn in plan (u = x, v = y), then laid flat and stood up by h: v turns into -z
function extrude(shape, h0, h, name, opts = {}) {
  const geo = new THREE.ExtrudeGeometry(shape, { depth: h, curveSegments: 24, bevelEnabled: false })

// No number plates and no badges.

  const cols = []
  for (let x = inner[0]; x < inner[2] - 0.01; x += 2) cols.push(frac(x, inner[1], Math.min(x + 2, inner[2]), inner[3]))
  const sx = PK.bays.slice(1).map((x) => frac(x - PK.strips.w / 2 - 0.02, y1 - PK.strips.l - 0.02, x + PK.strips.w / 2 + 0.02, y1 - e + 0.02))
  const st = PK.bays.slice(0, -1).map((b, i) => { const cx = (b + PK.bays[i + 1]) / 2, cy = y1 - PK.stops.at; return frac(cx - PK.stops.l / 2 - 0.03, cy - PK.stops.r - 0.03, cx + PK.stops.l / 2 + 0.03, cy + PK.stops.r + 0.03) })
  Object.assign(PIECES, {
    aspect: +(TW / TH).toFixed(5),
    sub: quarters,
    edging: [frac(x0, y0, x0 + e, y1), frac(x0, y1 - e, x1, y1), frac(x1 - e, y0, x1, y1), frac(x0, y0, x1, y0 + e)],
    pavers: cols, grass: cols, strips: sx, stops: st,
  })
}

// ------------------------------------------------------------ the rail's parts that the model has no single mesh for (?item=)
if (ITEM) {
  PART = ITEM
  // a block of grass pavers: 400 x 400 x 80 mm of concrete round sixteen cells, grassed, or with bare topsoil
  const paver = (x, y, z, grassed) => {
    const P = C.build.paver, n = 4, c = P.l / n, hole = c * 0.64
    const sh = new THREE.Shape([[0, 0], [P.l, 0], [P.l, P.w], [0, P.w]].map(([u, v]) => new THREE.Vector2(u, v)))
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      const u = i * c + (c - hole) / 2, v = j * c + (c - hole) / 2
      sh.holes.push(new THREE.Path([[u, v], [u + hole, v], [u + hole, v + hole], [u, v + hole]].map(([a, b]) => new THREE.Vector2(a, b))))
    }
    const g = new THREE.ExtrudeGeometry(sh, { depth: P.h, bevelEnabled: false })
    add(g, "concrete", { pos: [x, z, -y], rot: [-Math.PI / 2, 0, 0] })
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      const u = x + i * c + c / 2, v = y + j * c + c / 2
      blk(u - hole / 2, v - hole / 2, u + hole / 2, v + hole / 2, z, z + P.h - (grassed ? 0.004 : 0.015), "topsoil", { noEdges: true })
      if (grassed) for (let k = 0; k < 5; k++) { // a tuft of blades
        const bl = add(new THREE.ConeGeometry(0.006, 0.05 + rnd() * 0.03, 3), k % 2 ? "leaf" : "leaf2", { pos: [u + (rnd() - 0.5) * hole * 0.7, z + P.h + 0.02, -(v + (rnd() - 0.5) * hole * 0.7)], noEdges: true })
        bl.rotation.set((rnd() - 0.5) * 0.5, 0, (rnd() - 0.5) * 0.5)
      }
    }
  }
  const sett = (x, y, z, s = 0.1) => {
    const t = rnd()
    const m = blk(x - s / 2 + 0.006, y - s / 2 + 0.006, x + s / 2 - 0.006, y + s / 2 - 0.006, z, z + 0.08 + (rnd() - 0.5) * 0.01, t > 0.66 ? "sett0" : t > 0.33 ? "sett1" : "sett2")
    m.rotation.y = (rnd() - 0.5) * 0.08
  }
  if (ITEM === "pavers") {
    for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) paver(i * 0.4, j * 0.4, 0, j > 0)
  } else if (ITEM === "setts") {
    for (let i = 0; i < 10; i++) for (let j = 0; j < 6; j++) sett(i * 0.1 + (j % 2) * 0.05, j * 0.1, 0)
  } else if (ITEM === "enclosure") { // the weatherproof box: a grey body, its door, two glands below, the photocell on top
    const { w, d, h: [h0, h1] } = C.lighting.box
    // drawn with its door toward the camera (plan -y), the wall behind it
    blk(-w / 2, -(d - 0.02), w / 2, 0, h0, h1, "box")
    blk(-w / 2 + 0.01, -d, w / 2 - 0.01, -(d - 0.02), h0 + 0.01, h1 - 0.01, "box")
    blk(w / 2 - 0.05, -d - 0.012, w / 2 - 0.035, -d, (h0 + h1) / 2 - 0.04, (h0 + h1) / 2 + 0.04, "black") // the catch
    for (const x of [-0.08, 0.08]) cyl(x, -d / 2, 0.016, h0 - 0.03, 0.03, "black", 12)
    for (const x of [-0.08, 0.08]) cyl(x, -d / 2, 0.012, h0 - 0.35, 0.32, "duct", 12) // the ducts rising out of the ground
    cyl(0, -d / 2, 0.025, h1, 0.05, "white", 16) // the photocell
    blk(-0.4, 0, 0.4, 0.05, h0 - 0.35, h1 + 0.25, "stone") // the wall behind it
  } else if (ITEM === "duct") { // a coil of 50 mm duct, a length of armoured cable out of it, the warning tape
    for (let k = 0; k < 5; k++) add(new THREE.TorusGeometry(0.42, 0.025, 10, 64), "duct", { pos: [0, 0.025 + k * 0.05, 0], rot: [Math.PI / 2, 0, 0] })
    add(new THREE.CylinderGeometry(0.025, 0.025, 0.7, 16), "duct", { pos: [0.77, 0.025, -0.42], rot: [0, 0, Math.PI / 2] })
    add(new THREE.CylinderGeometry(0.008, 0.008, 0.35, 12), "cable", { pos: [1.29, 0.025, -0.42], rot: [0, 0, Math.PI / 2] })
    blk(0.55, 0.3, 1.45, 0.38, 0, 0.004, "tapeY")
  } else if (ITEM === "layers") { // the parking cut open, each layer stepped back so its top shows
    const L = 1.2, D = 0.8, { dig, subbase, bedding, paver: P } = C.build
    blk(0, 0, L, D, -dig - 0.25, -dig, "earth")
    blk(0.25, 0, L, D, -dig, -dig + subbase, "gravel")
    blk(0.5, 0, L, D, -dig + subbase, -dig + subbase + bedding, "sand")
    for (const y of [0, 0.4]) paver(0.8, y, -P.h, true)
  } else if (ITEM === "trench") { // a metre of the trench, cut open: the lining, the stone, the pipe
    const { w, depth, pipe: dp } = C.drainage.trench
    blk(-0.5, 0, -w / 2, 1, -depth - 0.2, 0, "earth"); blk(w / 2, 0, 0.5, 1, -depth - 0.2, 0, "earth"); blk(-w / 2, 0, w / 2, 1, -depth - 0.2, -depth, "earth")
    blk(-w / 2, 0, w / 2, 1, -depth, -depth + 0.005, "geotex")
    blk(-w / 2, 0.2, w / 2, 1, -depth + 0.005, -0.02, "gravel")
    add(new THREE.CylinderGeometry(dp / 2, dp / 2, 1, 24), "perf", { pos: [0, -depth + 0.1, -0.5], rot: [Math.PI / 2, 0, 0] })
    for (let k = 0; k < 8; k++) cyl(0.02 * (k % 2 ? 1 : -1), 0.05 + k * 0.12, 0.008, -depth + 0.1 + dp / 2 - 0.004, 0.006, "black", 8) // the slots
  } else if (ITEM === "soakaway") { // the pit cut open at a corner: stone in its geotextile wrap under a slab cover, the pipe in
    const { size: s, depth } = C.drainage.pit
    blk(0, 0, s, s, -depth, -0.1, "gravel")
    for (const [a, b, c2, d2] of [[0, s, s, s + 0.005], [s, 0, s + 0.005, s]]) blk(a, b, c2, d2, -depth, -0.1, "geotex") // the wrap, on the far sides
    blk(-0.05, -0.05, s + 0.05, s + 0.05, -0.1, 0, "concrete")
    add(new THREE.CylinderGeometry(0.055, 0.055, 0.7, 20), "perf", { pos: [s + 0.35, -0.3, -s / 2], rot: [0, 0, Math.PI / 2] })
  }
}

// ------------------------------------------------------------ the services' views: the box on the wall, the trench and the pit
const LCOL = { feed: "#1d4e89", lamp: "#2f7ed8", sign: "#d9822b" }
const DCOL = { fall: "#2f7ed8", trench: "#1d4e89", pit: "#5fb0ea" }
const runs = [] // [colour, width, ...a, ...b] for the line view
const seg3 = (col, wdt, [ax, ay, ah], [bx, by, bh]) => runs.push([col, wdt, ax, ah, -ay, bx, bh, -by])
const poly = (col, wdt, pts, h = 0.03) => { for (let i = 1; i < pts.length; i++) seg3(col, wdt, [...pts[i - 1], h], [...pts[i], h]) }
const arrow = (col, [ax, ay], [bx, by], h = 0.08) => { // a fall: from high to low, its head at the low end
  poly(col, 3, [[ax, ay], [bx, by]], h)
  const a = Math.atan2(by - ay, bx - ax), k = 0.5
  for (const s of [-1, 1]) poly(col, 3, [[bx, by], [bx - k * Math.cos(a + s * 0.45), by - k * Math.sin(a + s * 0.45)]], h)
}
// a polyline cut where it leaves the model view (the rock road is drawn to its first 40 %)
const clipY = (pts, ymax) => {
  const out = []
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i], q = pts[i - 1]
    if (p[1] <= ymax) { if (q && q[1] > ymax) out.push([q[0] + ((p[0] - q[0]) * (ymax - q[1])) / (p[1] - q[1]), ymax]); out.push(p) }
  }
  return out
}
const SPOTS = {} // each tag's point, in plan metres and height
if (VIEW === "light") {
  const LT = C.lighting, b = LT.box
  PART = "box"
  blk(b.x - b.w / 2, b.y, b.x + b.w / 2, b.y + b.d, b.h[0], b.h[1], "box")
  cyl(b.x, b.y + b.d / 2, 0.025, b.h[1], 0.05, "white", 16)
  const feed = clipY(LT.route.feed, 4.8)
  poly(LCOL.feed, 3.4, feed)
  poly(LCOL.lamp, 3.4, LT.route.lantern)
  seg3(LCOL.lamp, 3.4, [19.7, -6.3, 0.03], [19.7, -6.55, G.leaf + 0.3 + 0.16]) // up inside the pillar to the lantern
  seg3(LCOL.sign, 3.4, [b.x, b.y, (b.h[0] + b.h[1]) / 2], [b.x, S.box[1], (b.h[0] + b.h[1]) / 2]) // through the wall to the letters' driver
  seg3(LCOL.sign, 3.4, [b.x, S.box[1], (b.h[0] + b.h[1]) / 2], [b.x - 0.4, S.box[1], (S.panel.y0 + S.panel.y1) / 2])
  Object.assign(SPOTS, { LF: [...feed[0], 0.03], LD: [21, -2.3, 0.03], EB: [b.x, b.y + b.d, b.h[1]], SG: [15, S.box[1], S.panel.y1], L1: [19.7, -6.7, G.leaf + 0.3 + 0.42] })
} else if (VIEW === "drain") {
  const DR = C.drainage, t = DR.trench, p = DR.pit
  PART = "drain"
  if (!LINE) { // what shows of them: the trench's stone at the surface, the pit's slab
    blk(t.x - t.w / 2, t.y[0], t.x + t.w / 2, t.y[1], 0, 0.03, "gravel", { noShadow: true })
    blk(p.at[0] - p.size / 2, p.at[1] - p.size / 2, p.at[0] + p.size / 2, p.at[1] + p.size / 2, 0, 0.04, "concrete", { noShadow: true })
  }
  poly(DCOL.trench, 4, [[t.x, t.y[1]], [t.x, t.y[0]], p.at])
  const s = p.size / 2
  poly(DCOL.pit, 3.4, [[p.at[0] - s, p.at[1] - s], [p.at[0] + s, p.at[1] - s], [p.at[0] + s, p.at[1] + s], [p.at[0] - s, p.at[1] + s], [p.at[0] - s, p.at[1] - s]])
  for (const y of [-3.6, -1.6, 0.2]) arrow(DCOL.fall, [28.6, y], [9.2, y]) // the lot, falling to its west end
  for (const x of [21.4, 23]) arrow(DCOL.fall, [x, -5.1], [x, -7.3]) // the turn, back to the road
  for (const tt of [0.12, 0.3]) { // the rock road, crowned, to its edgings
    const [x, y] = bezier(tt), [nx, ny] = normal(tt)
    for (const sgn of [-1, 1]) arrow(DCOL.fall, [x + nx * 0.3 * sgn, y + ny * 0.3 * sgn], [x + nx * 1.9 * sgn, y + ny * 1.9 * sgn])
  }
  Object.assign(SPOTS, { P: [13.2, -2.6, 0.05], F1: [19, -1.6, 0.08], F2: [23, -6.4, 0.08], F3: [24.4, 3.0, 0.08], T1: [t.x, -2, 0.05], SK: [...p.at, 0.05] })
}
PART = "extra"

// ------------------------------------------------------------ what each view shows
for (const o of meshes) {
  const { part, layer } = o.userData
  o.visible = TOP ? layer === TOP : ITEM ? part === ITEM : part !== "top"
}

// ------------------------------------------------------------ camera
let camera
const fit = (margin) => { // fit the frame to what shows, each part's box projected on its own
  camera.updateMatrixWorld(); camera.updateProjectionMatrix()
  scene.updateMatrixWorld(true)
  let px = [Infinity, Infinity, -Infinity, -Infinity]
  const bb = new THREE.Box3()
  for (const o of meshes) {
    if (!o.visible || o.geometry.type.startsWith("Circle")) continue
    bb.setFromObject(o)
    for (const xx of [bb.min.x, bb.max.x]) for (const yy of [bb.min.y, bb.max.y]) for (const zz of [bb.min.z, bb.max.z]) {
      const p = new THREE.Vector3(xx, yy, zz).project(camera)
      const X = ((p.x + 1) / 2) * FW, Yp = ((1 - p.y) / 2) * FH
      px = [Math.min(px[0], X), Math.min(px[1], Yp), Math.max(px[2], X), Math.max(px[3], Yp)]
    }
  }
  let w = (px[2] - px[0]) * margin[0], h = (px[3] - px[1]) * margin[1]
  if (w / h > FW / FH) h = (w * FH) / FW; else w = (h * FW) / FH
  camera.setViewOffset(FW, FH, (px[0] + px[2]) / 2 - w / 2, (px[1] + px[3]) / 2 - h / 2, w, h)
}
const centre = new THREE.Vector3(19, 0, 3) // what the sun aims at
if (TOP) {
  // straight down, the public road at the bottom of the picture and the farm at the top, east to the right
  camera = new THREE.OrthographicCamera(-TW / 2, TW / 2, TH / 2, -TH / 2, 0.1, 100)
  const [cx, cy] = [(TB[0] + TB[2]) / 2, (TB[1] + TB[3]) / 2]
  camera.position.set(cx, 40, -cy); camera.up.set(0, 0, -1); camera.lookAt(cx, 0, -cy)
  centre.set(cx, 0, -cy)
  if (TOP === "ground") renderer.setClearColor(0xffffff, 1)
} else if (ITEM) {
  camera = new THREE.PerspectiveCamera(30, FW / FH, 0.05, 200)
  const bb = new THREE.Box3()
  for (const o of meshes) if (o.visible) bb.expandByObject(o)
  bb.getCenter(centre)
  const size = bb.getSize(new THREE.Vector3()).length()
  const [el, az] = [THREE.MathUtils.degToRad(26), THREE.MathUtils.degToRad(-32)]
  camera.position.set(centre.x + size * 2 * Math.cos(el) * Math.sin(az), centre.y + size * 2 * Math.sin(el), centre.z + size * 2 * Math.cos(el) * Math.cos(az))
  camera.lookAt(centre)
  fit([1.12, 1.12])
} else {
  camera = new THREE.PerspectiveCamera(HERO ? 54 : 22, FW / FH, 0.3, 900)
  if (HERO) {
    // eye level across the public road, level so verticals stay straight: the sign wall left, the gate right with the
    // rock road and the inner gate seen through it; the frame shifted down, as a shift lens would, for less sky
    camera.position.set(18.4, 1.55, 15.5)
    camera.lookAt(new THREE.Vector3(18.4, 1.55, 0))
    camera.setViewOffset(FW, FH, 0, FH * 0.04, FW, FH) // the horizon at 46 % from the top
    add(new THREE.SphereGeometry(600, 32, 16), "sky", { noEdges: true, keepUV: true })
    scene.fog = new THREE.Fog(0xd6e4ee, 40, 300)
  } else {
    // from beyond the road, centred as the homepage's view is, raised so the bays show over the sign wall and the hedge
    const target = new THREE.Vector3(18.5, 0.6, 2.5)
    const [el, az, dist] = [THREE.MathUtils.degToRad(44), 0, 80]
    camera.position.set(target.x + dist * Math.cos(el) * Math.sin(az), target.y + dist * Math.sin(el), target.z + dist * Math.cos(el) * Math.cos(az))
    camera.lookAt(target)
    fit([1.04, 1.08])
  }
}
camera.updateMatrixWorld(); camera.updateProjectionMatrix()
scene.updateMatrixWorld(true)

// each tag's spot in the frame, for the tagged figure; the build-up's pieces ride the same channel
if (TOP) window.TAGS = PIECES
else if (VIEW && LINE) window.TAGS = Object.entries(SPOTS).map(([id, [x, y, h]]) => {
  const v = new THREE.Vector3(x, h, -y).project(camera)
  return { id, x: +((v.x + 1) / 2).toFixed(4), y: +((1 - v.y) / 2).toFixed(4), edge: "" }
})

// ------------------------------------------------------------ render
if (LINE) {
  const lineMat = new LineMaterial({ color: INK, linewidth: 1.2, side: THREE.DoubleSide })
  lineMat.resolution.set(FW, FH)
  lineMat.userData.outlineParameters = { visible: false }
  for (const o of meshes) {
    if (o.userData.noEdges || !o.visible) continue
    const g = new LineSegmentsGeometry().fromEdgesGeometry(new THREE.EdgesGeometry(o.geometry, 30))
    const l = new LineSegments2(g, lineMat)
    l.matrixAutoUpdate = false; l.matrix.copy(o.matrixWorld)
    scene.add(l)
  }
  // the service in its colours, over the ink drawing and through whatever stands in front of it
  for (const [col, wdt, ...p] of runs) {
    const m = new LineMaterial({ color: col, linewidth: wdt, depthTest: false })
    m.resolution.set(FW, FH); m.userData.outlineParameters = { visible: false }
    const l = new LineSegments2(new LineSegmentsGeometry().setPositions(p), m)
    l.renderOrder = 10
    scene.add(l)
  }
  const ink = new THREE.Color(INK)
  new OutlineEffect(renderer, { defaultThickness: ITEM ? 0.004 : 0.0026, defaultColor: [ink.r, ink.g, ink.b] }).render(scene, camera)
} else {
  const pmrem = new THREE.PMREMGenerator(renderer)
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture
  scene.environmentIntensity = DUSK ? 0.08 : 0.4
  scene.add(new THREE.HemisphereLight(DUSK ? 0x5a6a90 : 0xeef3ff, DUSK ? 0x2a2a30 : 0x8a7a5a, DUSK ? 0.45 : HERO ? 0.8 : 0.9))
  // daylight: in the hero the sun is low behind the wall's left end, so the wall's shadow falls across the road toward
  // the viewer and the LED face sits in soft shade; in the model view it is high over the front left; at dusk only the
  // last of the sky; from straight above for the build-up, so no shadow crosses into a neighbouring piece
  const sun = new THREE.DirectionalLight(DUSK ? 0x8fa2c8 : 0xfff2de, DUSK ? 0.5 : HERO ? 2.8 : 2.7)
  sun.position.set(...(HERO ? [-18, 26, -40] : TOP ? [centre.x + 0.01, 30, centre.z + 0.01]
    : ITEM ? [centre.x - 14, centre.y + 20, centre.z + 12] : [-6, 30, 26]))
  sun.target.position.copy(centre)
  sun.castShadow = true
  sun.shadow.mapSize.set(4096, 4096)
  Object.assign(sun.shadow.camera, { left: -28, right: 28, top: 28, bottom: -28, near: 1, far: 120 })
  sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.02; sun.shadow.radius = 4
  scene.add(sun, sun.target)
  const composer = new EffectComposer(renderer)
  composer.setSize(FW, FH)
  composer.addPass(new RenderPass(scene, camera))
  if (!TOP) {
    const ao = new GTAOPass(scene, camera, FW, FH)
    ao.blendIntensity = 0.8
    ao.updateGtaoMaterial({ radius: ITEM ? 0.05 : 0.3, distanceExponent: 1.5, thickness: 1, scale: 1 })
    composer.addPass(ao)
  }
  composer.addPass(new OutputPass())
  composer.render()
}
document.getElementById("out").src = renderer.domElement.toDataURL("image/png")
document.body.dataset.ready = "1"
</script>
</body>
</html>
