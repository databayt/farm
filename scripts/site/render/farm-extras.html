<!doctype html>
<!--
  /en/farming's two smaller 3D views, in the pattern of the studio's and the field's: on the white page, seen from
  the front with a long lens, from src/components/farming/farming.json and public/designs/farming/data/plan.json.

    ?view=nursery  the seedling nursery: the shade-net house on its eucalyptus poles, the net off the front so its
                   two benches of trays show, the door at the end, the tap   -> render/nursery-line.png, nursery-real.webp
    ?view=fruit    a stretch of the fruit row behind the field's back fence: banana mats between avocado, mango,
                   lemon and papaya trees, at their 3 m spacing             -> render/fruit-line.png, fruit-real.webp
    &mode=line     line drawing on a transparent ground; otherwise materials and soft daylight

  node scripts/site/render.mjs scripts/site/render/farm-extras.html "view=nursery&mode=line" public/designs/farming/render/nursery-line.png
-->
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:#fff}#out{display:block;width:2400px;height:auto}</style>
<script type="importmap">
{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}
</script>
</head>
<body>
<img id="out" alt="">
<script type="module">
import * as THREE from "three"
import { OutlineEffect } from "three/addons/effects/OutlineEffect.js"
import { LineSegments2 } from "three/addons/lines/LineSegments2.js"
import { LineSegmentsGeometry } from "three/addons/lines/LineSegmentsGeometry.js"
import { LineMaterial } from "three/addons/lines/LineMaterial.js"
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js"
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js"
import { RenderPass } from "three/addons/postprocessing/RenderPass.js"
import { GTAOPass } from "three/addons/postprocessing/GTAOPass.js"
import { OutputPass } from "three/addons/postprocessing/OutputPass.js"

const Q = new URLSearchParams(location.search)
const VIEW = Q.get("view") ?? "nursery", LINE = Q.get("mode") === "line"
const [FW, FH] = VIEW === "fruit" ? [2400, 760] : [2400, 1100]
const F = await (await fetch(`/src/components/farming/farming.json?${Date.now()}`)).json()
const INK = "#2b2a26", PAGE = "#ffffff"

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true })
renderer.setClearColor(0xffffff, 0)
renderer.setPixelRatio(1)
renderer.setSize(FW, FH)
renderer.outputColorSpace = THREE.SRGBColorSpace
if (!LINE) { renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap }
const scene = new THREE.Scene()
if (!LINE) scene.background = new THREE.Color(12, 12, 12) // white page; tone mapping would dim plain white

// ------------------------------------------------------------ materials and helpers (metres)
let seed = 7
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647)
const COL = { pole: "#7c6650", net: "#5d6a5c", bench: "#9a7b58", tray: "#2e2f30", seedling: "#6fa043", soil: "#4a3626", ground: "#a98b6b",
  tap: "#8d9296", stem: "#7d8a52", leaf: "#4f7a35", banana: "#5f8f3a", trunk: "#6d5a48", avocado: "#3f6b2e", mango: "#4a7a34",
  lemon: "#5b8a3a", papaya: "#6a9a3e", fruit: "#d9b23a", lemonfruit: "#e8d24a", papayafruit: "#e09a3a", avo: "#3a4a22", bunch: "#9fb83e" }
const MAT = {}
function mat(name) {
  if (MAT[name]) return MAT[name]
  if (LINE) {
    const m = name === "net"
      ? new THREE.MeshBasicMaterial({ color: PAGE, transparent: true, opacity: 0, depthWrite: false })
      : new THREE.MeshBasicMaterial({ color: PAGE, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 })
    if (["seedling", "leaf", "net"].includes(name)) m.userData.outlineParameters = { visible: false }
    return (MAT[name] = m)
  }
  return (MAT[name] = name === "net"
    ? new THREE.MeshStandardMaterial({ color: COL.net, roughness: 1, transparent: true, opacity: 0.45, side: THREE.DoubleSide })
    : new THREE.MeshStandardMaterial({ color: COL[name] ?? "#cccccc", roughness: name === "tap" ? 0.35 : 0.9, metalness: name === "tap" ? 0.7 : 0, flatShading: ["leaf", "avocado", "mango", "lemon", "papaya", "banana"].includes(name) }))
}
const meshes = []
function add(geo, name, opts = {}) {
  const m = new THREE.Mesh(geo, mat(name))
  m.castShadow = !LINE && name !== "net" && name !== "ground"
  m.receiveShadow = !LINE
  if (opts.pos) m.position.set(...opts.pos)
  if (opts.rot) m.rotation.set(...opts.rot)
  if (opts.scale) m.scale.set(...opts.scale)
  if (opts.noEdges) m.userData.noEdges = true
  scene.add(m); meshes.push(m)
  return m
}
const blk = (x0, z0, x1, z1, y0, y1, name, opts) => add(new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0), name, { pos: [(x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2], ...opts })
const cyl = (x, z, r, y0, h, name, seg = 12, rTop = r) => add(new THREE.CylinderGeometry(rTop, r, h, seg), name, { pos: [x, y0 + h / 2, z] })
function pipe(a, b, r, name, seg = 6) {
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b)
  const m = add(new THREE.CylinderGeometry(r, r, A.distanceTo(B), seg), name, { pos: A.clone().add(B).multiplyScalar(0.5).toArray() })
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), B.sub(A).normalize())
  return m
}
function crown(x, z, r, y0, name, n = 5) { // a low-poly crown of a few lumps
  for (let k = 0; k < n; k++) add(new THREE.IcosahedronGeometry(1, 1), name, { pos: [x + (rnd() - 0.5) * r, y0 + r * (0.5 + rnd() * 0.35), z + (rnd() - 0.5) * r], scale: [r * (0.55 + rnd() * 0.25), r * (0.45 + rnd() * 0.2), r * (0.55 + rnd() * 0.25)], noEdges: LINE })
}

// ------------------------------------------------------------ the nursery: x along the house (the door at +x), z across, the front (+z) toward the viewer
if (VIEW === "nursery") {
  const N = F.nursery, L = N.l, W = N.w, Ht = N.h, b = N.bench, t = N.tray
  blk(-0.3, -0.3, L + 0.3, W + 0.3, -0.03, 0, "ground")
  // the frame: poles every 2 m on both long sides, a ridge pole and rafters for a low pitched roof, the net over the back and the roof
  for (let x = 0; x <= L + 1e-6; x += N.post) for (const z of [0, W]) cyl(x, z, 0.06, 0, Ht, "pole", 8, 0.055)
  for (const z of [0, W]) pipe([0, Ht, z], [L, Ht, z], 0.05, "pole")
  for (let x = 0; x <= L + 1e-6; x += N.post) pipe([x, Ht, 0], [x, Ht, W], 0.045, "pole")
  add(new THREE.PlaneGeometry(L, W), "net", { pos: [L / 2, Ht + 0.02, W / 2], rot: [-Math.PI / 2, 0, 0], noEdges: true }) // the net roof
  add(new THREE.PlaneGeometry(L, Ht), "net", { pos: [L / 2, Ht / 2, 0], noEdges: true }) // the back; the front is drawn open
  for (const x of [0, L]) { // the ends: net, with the door frame in the end at +x
    add(new THREE.PlaneGeometry(W, Ht), "net", { pos: [x, Ht / 2, W / 2], rot: [0, Math.PI / 2, 0], noEdges: true })
  }
  const d0 = W / 2 - N.door / 2, d1 = W / 2 + N.door / 2
  for (const z of [d0, d1]) cyl(L, z, 0.045, 0, 2.0, "pole", 8)
  pipe([L, 2.0, d0], [L, 2.0, d1], 0.045, "pole")
  // the two benches along the long sides, waist high, each a grid of trays of seedlings
  const BH = 0.8
  for (const z0 of [b.inset, W - b.inset - b.d]) {
    for (const x of [b.inset + 0.1, b.inset + b.l / 2, b.inset + b.l - 0.1]) for (const z of [z0 + 0.1, z0 + b.d - 0.1]) blk(x - 0.03, z - 0.03, x + 0.03, z + 0.03, 0, BH - 0.04, "bench")
    blk(b.inset, z0, b.inset + b.l, z0 + b.d, BH - 0.04, BH, "bench")
    const along = Math.floor(b.l / t.l), across = Math.floor(b.d / t.w)
    for (let i = 0; i < along; i++) for (let j = 0; j < across; j++) {
      const x = b.inset + 0.04 + i * t.l, z = z0 + 0.04 + j * t.w
      blk(x, z, x + t.l - 0.03, z + t.w - 0.03, BH, BH + 0.05, "tray")
      if (!LINE) for (let s = 0; s < 6; s++) add(new THREE.SphereGeometry(0.035, 6, 4), "seedling", { pos: [x + 0.05 + (s % 3) * 0.17, BH + 0.08, z + 0.07 + Math.floor(s / 3) * 0.13], scale: [1, 0.7, 1], noEdges: true })
    }
  }
  // the tap on its standpipe by the door
  pipe([N.tap.x, 0, N.tap.y], [N.tap.x, 0.75, N.tap.y], 0.025, "tap")
  pipe([N.tap.x, 0.75, N.tap.y], [N.tap.x - 0.12, 0.75, N.tap.y], 0.02, "tap")
}

// ------------------------------------------------------------ the fruit row: one turn of its pattern, x along the row, the field's back fence behind (-z)
if (VIEW === "fruit") {
  const fr = F.fruit, pat = fr.pattern, sp = fr.spacing
  const len = (pat.length - 1) * sp
  blk(-1.8, -1.8, len + 1.8, 1.2, -0.03, 0, "ground")
  // the field's back fence behind the row: posts and wire, 1.5 m
  for (let x = -1.5; x <= len + 1.5 + 1e-6; x += 3) cyl(x, -1.6, 0.05, 0, 1.5, "pole", 8)
  for (const y of [0.4, 0.9, 1.4]) pipe([-1.5, y, -1.6], [len + 1.5, y, -1.6], 0.01, "tap", 4)
  pat.forEach((kind, k) => {
    const x = k * sp, r = fr.kinds[kind].r
    if (kind === "banana") { // a mat of three stems, each crowned with long arching leaves and one hanging bunch
      for (let s = 0; s < 3; s++) {
        const sx = x + (rnd() - 0.5) * 0.6, sz = (rnd() - 0.5) * 0.6, h = 2.2 + rnd() * 0.8
        cyl(sx, sz, 0.11, 0, h, "stem", 8, 0.08)
        for (let l = 0; l < 7; l++) {
          const a = (l / 7) * Math.PI * 2 + rnd(), ln = r * (0.9 + rnd() * 0.4)
          const leaf = add(new THREE.BoxGeometry(ln, 0.02, 0.36), "banana", { pos: [sx + Math.cos(a) * ln * 0.45, h + 0.15, sz + Math.sin(a) * ln * 0.45], noEdges: LINE })
          leaf.rotation.set(0, -a, -0.45 - rnd() * 0.3)
        }
        if (s === 0) add(new THREE.CylinderGeometry(0.16, 0.08, 0.5, 8), "bunch", { pos: [sx + 0.25, h - 0.55, sz + 0.1] })
      }
    } else { // a young grafted tree: a trunk and a rounded crown, a few fruit on the outside
      const h = kind === "papaya" ? 2.6 : 1.4
      cyl(x, 0, kind === "papaya" ? 0.09 : 0.07, 0, h, "trunk", 8, 0.05)
      if (kind === "papaya") { // papaya: a single stem crowned with a few big leaves, fruit clustered under them
        for (let l = 0; l < 7; l++) { const a = (l / 7) * Math.PI * 2; const lf = add(new THREE.BoxGeometry(1.1, 0.02, 0.6), "papaya", { pos: [x + Math.cos(a) * 0.55, h + 0.1, Math.sin(a) * 0.55], noEdges: LINE }); lf.rotation.set(0, -a, -0.35) }
        for (let f = 0; f < 5; f++) { const a = (f / 5) * Math.PI * 2; add(new THREE.SphereGeometry(0.13, 10, 8), "papayafruit", { pos: [x + Math.cos(a) * 0.12, h - 0.25, Math.sin(a) * 0.12], scale: [1, 1.5, 1] }) }
      } else {
        crown(x, 0, r, h - 0.3, kind, 6)
        const fruitMat = kind === "lemon" ? "lemonfruit" : kind === "avocado" ? "avo" : "fruit"
        for (let f = 0; f < 6; f++) { const a = (f / 6) * Math.PI * 2 + rnd(); add(new THREE.SphereGeometry(0.07, 8, 6), fruitMat, { pos: [x + Math.cos(a) * r * 0.75, h + r * (0.3 + rnd() * 0.4), Math.sin(a) * r * 0.75], scale: kind === "lemon" ? [1, 1, 1] : [0.9, 1.3, 0.9] }) }
      }
    }
  })
}

// ------------------------------------------------------------ camera: straight on from the front, a long lens, a little down
const bb = new THREE.Box3()
for (const o of meshes) bb.expandByObject(o)
const mid = bb.getCenter(new THREE.Vector3())
const camera = new THREE.PerspectiveCamera(18, FW / FH, 0.3, 300)
const [el, dist] = [THREE.MathUtils.degToRad(VIEW === "nursery" ? 32 : 18), 40]
camera.position.set(mid.x, mid.y + dist * Math.sin(el), mid.z + dist * Math.cos(el))
camera.lookAt(mid)
camera.updateMatrixWorld(); camera.updateProjectionMatrix(); scene.updateMatrixWorld(true)
{
  let px = [Infinity, Infinity, -Infinity, -Infinity]
  for (const xx of [bb.min.x, bb.max.x]) for (const yy of [bb.min.y, bb.max.y]) for (const zz of [bb.min.z, bb.max.z]) {
    const p = new THREE.Vector3(xx, yy, zz).project(camera)
    const X = ((p.x + 1) / 2) * FW, Y = ((1 - p.y) / 2) * FH
    px = [Math.min(px[0], X), Math.min(px[1], Y), Math.max(px[2], X), Math.max(px[3], Y)]
  }
  let w = (px[2] - px[0]) * 1.06, h = (px[3] - px[1]) * 1.1
  if (w / h > FW / FH) h = (w * FH) / FW; else w = (h * FW) / FH
  camera.setViewOffset(FW, FH, (px[0] + px[2]) / 2 - w / 2, (px[1] + px[3]) / 2 - h / 2, w, h)
}

// ------------------------------------------------------------ render
if (LINE) {
  const lineMat = new LineMaterial({ color: INK, linewidth: 1.2, side: THREE.DoubleSide })
  lineMat.resolution.set(FW, FH)
  lineMat.userData.outlineParameters = { visible: false }
  for (const o of meshes) {
    if (o.userData.noEdges) continue
    const l = new LineSegments2(new LineSegmentsGeometry().fromEdgesGeometry(new THREE.EdgesGeometry(o.geometry, 30)), lineMat)
    l.matrixAutoUpdate = false; l.matrix.copy(o.matrixWorld); scene.add(l)
  }
  const ink = new THREE.Color(INK)
  new OutlineEffect(renderer, { defaultThickness: 0.003, defaultColor: [ink.r, ink.g, ink.b] }).render(scene, camera)
} else {
  const pmrem = new THREE.PMREMGenerator(renderer)
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture
  scene.environmentIntensity = 0.45
  scene.add(new THREE.HemisphereLight(0xeef3ff, 0x7a6a4a, 1.0))
  const sun = new THREE.DirectionalLight(0xfff1dc, 2.4)
  sun.position.set(mid.x - 8, 14, mid.z + 10); sun.target.position.copy(mid)
  sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096)
  Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 60 })
  sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.02; sun.shadow.radius = 6
  scene.add(sun, sun.target)
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.ShadowMaterial({ opacity: 0.14 }))
  ground.rotation.x = -Math.PI / 2; ground.position.set(mid.x, -0.035, mid.z); ground.receiveShadow = true
  scene.add(ground)
  const composer = new EffectComposer(renderer)
  composer.setSize(FW, FH)
  composer.addPass(new RenderPass(scene, camera))
  const ao = new GTAOPass(scene, camera, FW, FH); ao.blendIntensity = 0.7
  composer.addPass(ao); composer.addPass(new OutputPass()); composer.render()
}
document.getElementById("out").src = renderer.domElement.toDataURL("image/png")
document.body.dataset.ready = "1"
</script>
</body>
</html>
