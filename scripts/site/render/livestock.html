<!doctype html>
<!--

  straight on from the paddock, verticals straight, the roof off so the pens show, on the white page. Built from
  src/components/livestock/livestock.json (the numbers the 2D draws): the shelter of upright eucalyptus poles on its
  fieldstone plinth, straw litter, a slatted bamboo sleeping platform in each pen, hay racks, the boarded feed
  store, the palisade windbreak behind, the two post-and-rail yards with the lane between them, troughs, climbing
  stones, the guarded shade tree, the tank, the fodder baskets and the three compost bays, and the starting herd:
  6 local goats and 4 fat-tailed hair sheep. The tree's crown is cut like the roof: from this height it would hide
  the sheep pen and the store. Rendered three ways:

    ?mode=line  line drawing on a transparent ground   -> public/designs/livestock/render/livestock-line.png
    ?mode=real  materials, daylight and soft shadow    -> public/designs/livestock/render/livestock-real.webp
    &hero=1     real mode, thatch and crown on, from eye level in the paddock, 2400 x 1340
                -> public/designs/livestock/render/livestock-hero.jpg, the stand-in hero and the Nano Banana layout reference

  node scripts/site/render.mjs scripts/site/render/livestock.html "mode=line" public/designs/livestock/render/livestock-line.png
-->

<script type="module">
import * as THREE from "three"
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js"
import { OutlineEffect } from "three/addons/effects/OutlineEffect.js"
import { LineSegments2 } from "three/addons/lines/LineSegments2.js"
import { LineSegmentsGeometry } from "three/addons/lines/LineSegmentsGeometry.js"
import { LineMaterial } from "three/addons/lines/LineMaterial.js"
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js"
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js"
import { RenderPass } from "three/addons/postprocessing/RenderPass.js"
import { GTAOPass } from "three/addons/postprocessing/GTAOPass.js"
import { OutputPass } from "three/addons/postprocessing/OutputPass.js"

const Q = new URLSearchParams(location.search)
const LINE = Q.get("mode") !== "real"
const HERO = !LINE && Q.get("hero") === "1"
const [FW, FH] = HERO ? [2400, 1340] : [2400, 1400]
const C = await (await fetch(`/src/components/livestock/livestock.json?${Date.now()}`)).json()
const INK = "#2b2a26", PAGE = "#ffffff"
// plan (x right, y toward the yards) -> three: x = x, y = height, z = y; the camera stands in the paddock, at +z

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true })
renderer.setClearColor(0xffffff, 0)
renderer.setPixelRatio(1)
renderer.setSize(FW, FH)
renderer.outputColorSpace = THREE.SRGBColorSpace
if (!LINE) {
  renderer.toneMapping = THREE.ACESFilmicToneMapping
  renderer.shadowMap.enabled = true
  renderer.shadowMap.type = THREE.PCFSoftShadowMap
}
const scene = new THREE.Scene()
// white page ground, as the studio's; in real mode tone mapping would dim plain white to grey, so it starts brighter
if (!LINE && !HERO) scene.background = new THREE.Color(12, 12, 12)

// ------------------------------------------------------------ procedural textures (real mode)
let seed = 7
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647)
function tex(draw, w = 512, h = 512) {
  const c = document.createElement("canvas"); c.width = w; c.height = h
  seed = 7
  draw(c.getContext("2d"), w, h)
  const t = new THREE.CanvasTexture(c)
  t.colorSpace = THREE.SRGBColorSpace
  t.wrapS = t.wrapT = THREE.RepeatWrapping
  t.anisotropy = 8
  return t
}
function strands(g, w, h, n, light, dark, len = 30) {
  for (let i = 0; i < n; i++) {
    const x = rnd() * w, y = rnd() * h, a = rnd() * Math.PI, l = 6 + rnd() * len
    g.strokeStyle = rnd() > 0.5 ? `rgba(${light},${0.3 + rnd() * 0.4})` : `rgba(${dark},${0.2 + rnd() * 0.3})`
    g.lineWidth = 1 + rnd(); g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke()
  }
}
const T = LINE ? {} : {
  // the yards: trodden red-brown earth with straw scattered over it
  earth: tex((g, w, h) => {
    g.fillStyle = "#8a6a4c"; g.fillRect(0, 0, w, h)
    for (let i = 0; i < 14000; i++) { g.fillStyle = rnd() > 0.5 ? "rgba(170,135,100,0.25)" : "rgba(70,50,35,0.25)"; g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 3, 1 + rnd() * 3) }
    strands(g, w, h, 900, "214,186,120", "140,115,60", 22)
  }),
  // the litter in the pens: deep straw
  straw: tex((g, w, h) => { g.fillStyle = "#b99d5c"; g.fillRect(0, 0, w, h); strands(g, w, h, 3000, "232,212,150", "120,100,50") }),
  // the lane and the plinth's top: packed earth
  packed: tex((g, w, h) => {
    g.fillStyle = "#9b7d5e"; g.fillRect(0, 0, w, h)
    for (let i = 0; i < 9000; i++) { g.fillStyle = rnd() > 0.5 ? "rgba(190,160,125,0.2)" : "rgba(80,60,40,0.2)"; g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 2, 1 + rnd() * 2) }
  }),
  // eucalyptus poles: grey-brown bark in long streaks
  bark: tex((g, w, h) => {
    g.fillStyle = "#7c6650"; g.fillRect(0, 0, w, h)
    for (let i = 0; i < 500; i++) { g.fillStyle = `rgba(${rnd() > 0.5 ? "160,140,115" : "60,45,32"},${0.1 + rnd() * 0.2})`; g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 3, 20 + rnd() * 120) }
  }, 256, 512),
  // the store's boards, weathered
  boards: tex((g, w, h) => {
    g.fillStyle = "#94785a"; g.fillRect(0, 0, w, h)
    for (let i = 0; i < 10; i++) { g.fillStyle = `rgba(${rnd() > 0.5 ? "190,165,125" : "70,55,40"},${0.08 + rnd() * 0.1})`; g.fillRect(0, (i * h) / 10, w, h / 10); g.fillStyle = "rgba(40,28,18,0.55)"; g.fillRect(0, ((i + 1) * h) / 10 - 2, w, 2) }
  }),
  hay: tex((g, w, h) => { g.fillStyle = "#b9a35a"; g.fillRect(0, 0, w, h); strands(g, w, h, 2600, "230,210,140", "110,105,45") }),
  compost: tex((g, w, h) => {
    g.fillStyle = "#4a3626"; g.fillRect(0, 0, w, h)
    for (let i = 0; i < 9000; i++) { g.fillStyle = rnd() > 0.6 ? "rgba(120,95,55,0.35)" : "rgba(25,18,12,0.35)"; g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 3, 1 + rnd() * 3) }
  }),
  thatch: tex((g, w, h) => { g.fillStyle = "#8d7550"; g.fillRect(0, 0, w, h); for (let i = 0; i < 4200; i++) { const x = rnd() * w, y = rnd() * h; g.strokeStyle = rnd() > 0.5 ? `rgba(190,165,115,${0.3 + rnd() * 0.3})` : `rgba(70,55,35,${0.3 + rnd() * 0.3})`; g.lineWidth = 1 + rnd(); g.beginPath(); g.moveTo(x, y); g.lineTo(x + (rnd() - 0.5) * 4, y + 20 + rnd() * 30); g.stroke() } }),
  grass: tex((g, w, h) => { g.fillStyle = "#6f9a4a"; g.fillRect(0, 0, w, h); for (let i = 0; i < 26000; i++) { g.fillStyle = rnd() > 0.5 ? "rgba(170,200,110,0.35)" : "rgba(40,70,30,0.35)"; g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 2, 1 + rnd() * 2) } }),
  weave: tex((g, w, h) => { g.fillStyle = "#a07a48"; g.fillRect(0, 0, w, h); for (let y = 0; y < h; y += 8) for (let x = 0; x < w; x += 16) { g.fillStyle = (x / 16 + y / 8) % 2 ? "rgba(60,40,20,0.35)" : "rgba(220,190,140,0.25)"; g.fillRect(x, y, 16, 7) } }, 128, 128),
  sky: tex((g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, "#9bb5c8"); gr.addColorStop(0.45, "#d9dde0"); gr.addColorStop(1, "#d9dde0"); g.fillStyle = gr; g.fillRect(0, 0, w, h) }, 16, 512),
}
// metres one tile covers [along, across]
const TILE = { earth: [2.5, 2.5], straw: [1, 1], packed: [2, 2], bark: [0.4, 2], boards: [1.5, 1.5], hay: [0.6, 0.6], compost: [1, 1], thatch: [1.2, 1.2], grass: [9, 9], weave: [0.3, 0.3] }
const MAP = { yard: "earth", litter: "straw", packed: "packed", pole: "bark", board: "boards", hay: "hay", compost: "compost", thatch: "thatch", lawn: "grass", basket: "weave" }

// ------------------------------------------------------------ materials
// thin parts get crease lines but no silhouette, so slats, rails and horns stay fine in the line drawing
const THIN = new Set(["horn", "hoof", "bamboo", "rope"])
const COATS = { brown: "#7a4a2a", black: "#2b2522", tan: "#b48654", white: "#e6dfd2", wool: "#ece5d6" }
const MAT = {}
function mat(name) {
  if (MAT[name]) return MAT[name]
  let x
  if (LINE) {
    if (name === "water") x = new THREE.MeshBasicMaterial({ color: PAGE, transparent: true, opacity: 0, depthWrite: false })
    else x = new THREE.MeshBasicMaterial({ color: PAGE, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 })
    if (THIN.has(name)) x.userData.outlineParameters = { visible: false }
  } else {
    const std = (o) => new THREE.MeshStandardMaterial(o)
    if (COATS[name]) x = std({ color: COATS[name], roughness: name === "wool" ? 1 : 0.85 })
    else x = {
      yard: () => std({ map: T.earth, roughness: 1 }),
      litter: () => std({ map: T.straw, roughness: 1 }),
      packed: () => std({ map: T.packed, roughness: 1 }),
      pole: () => std({ map: T.bark, roughness: 0.9 }),
      board: () => std({ map: T.boards, roughness: 0.85 }),
      bamboo: () => std({ color: "#c9ae6e", roughness: 0.6 }),
      stone: () => std({ color: "#8d877c", roughness: 0.95, flatShading: true }),
      rope: () => std({ color: "#c2a874", roughness: 1 }),
      trough: () => std({ map: T.boards, color: "#c8b9a5", roughness: 0.85 }),
      water: () => new THREE.MeshPhysicalMaterial({ color: "#7aa6b8", roughness: 0.05, transparent: true, opacity: 0.7 }),
      tank: () => std({ color: "#33503a", roughness: 0.5 }),
      block: () => std({ color: "#9b958b", roughness: 0.95 }),
      hay: () => std({ map: T.hay, roughness: 1 }),
      sack: () => std({ color: "#e8e1cf", roughness: 0.95 }),
      mineral: () => std({ color: "#b56a4a", roughness: 0.7 }),
      compost: () => std({ map: T.compost, roughness: 1 }),
      basket: () => std({ map: T.weave, roughness: 0.95 }),
      fodder: () => std({ color: "#5d7d3a", roughness: 0.9 }),
      trunk: () => std({ color: "#6d5a48", roughness: 0.9 }),
      leaf: () => std({ color: "#4f6f36", roughness: 0.9, flatShading: true }),
      thatch: () => std({ map: T.thatch, roughness: 1, side: THREE.DoubleSide }),
      lawn: () => std({ map: T.grass, roughness: 1 }),
      face: () => std({ color: "#211c19", roughness: 0.85 }),
      horn: () => std({ color: "#7d6e5e", roughness: 0.6 }),
      hoof: () => std({ color: "#3a332d", roughness: 0.6 }),
      sky: () => new THREE.MeshBasicMaterial({ map: T.sky, side: THREE.BackSide, fog: false, toneMapped: false }),
    }[name]?.() ?? std({ color: "#cccccc", roughness: 0.8 })
  }
  return (MAT[name] = x)
}

// ------------------------------------------------------------ geometry helpers (metres)
const meshes = []
let PARENT = scene
function worldUV(geo, [tu, tv]) { // each face takes the texture from its own plane, at true scale
  const pos = geo.attributes.position, nrm = geo.attributes.normal, uv = geo.attributes.uv
  if (!uv) return
  for (let i = 0; i < pos.count; i++) {
    const n = [Math.abs(nrm.getX(i)), Math.abs(nrm.getY(i)), Math.abs(nrm.getZ(i))]
    const axis = n.indexOf(Math.max(...n))
    const p = [pos.getX(i), pos.getY(i), pos.getZ(i)]
    const [a, b] = axis === 0 ? [2, 1] : axis === 2 ? [0, 1] : [0, 2]
    uv.setXY(i, p[a] / tu, p[b] / tv)
  }
  uv.needsUpdate = true
}
function add(geo, name, opts = {}) {
  if (!LINE && MAP[name] && !opts.keepUV) worldUV(geo, TILE[MAP[name]])
  const mesh = new THREE.Mesh(geo, mat(name))
  mesh.castShadow = !LINE && !["lawn", "sky", "yard", "packed"].includes(name)
  mesh.receiveShadow = !LINE && name !== "sky"
  if (opts.pos) mesh.position.set(...opts.pos)
  if (opts.rot) mesh.rotation.set(...opts.rot)
  if (opts.noEdges) mesh.userData.noEdges = true
  if (opts.noFrame) mesh.userData.noFrame = true
  PARENT.add(mesh)
  meshes.push(mesh)
  return mesh
}
function blk(xa, za, xb, zb, y0, y1, name, opts) {
  const [x0, x1, z0, z1] = [Math.min(xa, xb), Math.max(xa, xb), Math.min(za, zb), Math.max(za, zb)]
  return add(new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0), name, { pos: [(x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2], ...opts })
}
function soft(x0, z0, x1, z1, y0, y1, r, name) {
  return add(new RoundedBoxGeometry(x1 - x0, y1 - y0, z1 - z0, 3, r), name, { pos: [(x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2] })
}
function cyl(x, z, r, y0, h, name, seg = 20, rTop = r) {
  return add(new THREE.CylinderGeometry(rTop, r, h, seg), name, { pos: [x, y0 + h / 2, z] })
}
function pipe(a, b, r, name, seg = 6) {
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b)
  const mesh = add(new THREE.CylinderGeometry(r, r, A.distanceTo(B), seg), name, { pos: A.clone().add(B).multiplyScalar(0.5).toArray() })
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), B.sub(A).normalize())
  return mesh
}
// a round pole standing from y0 to y1, its top a little uneven as cut by hand
const pole = (x, z, r, y0, y1, seg = 7) => cyl(x, z, r, y0, y1 - y0, "pole", seg, r * 0.92)

// ------------------------------------------------------------ the plan
const { shelter: S, pens: P, platform: PF, fittings: FT, yards: Y, palisade: PA, stones: ST, tree: TR, tank: TK,
  baskets: BK, compost: CO, animals: AN } = C
const L = S.l / 2, W = S.d / 2, WALL = S.wall
const FL = S.plinth.h // the plinth's top, the pens' floor
const LIT = FL + 0.05 // the top of the straw litter
const EAVE = S.roof.eaves
const STORE = P.list.find((p) => p.id === "store")
const PENS = P.list.filter((p) => p.id !== "store")
const [LANE0, LANE1] = Y.lane
const RAILS = [0.35, 0.78, 1.18]

// ------------------------------------------------------------ the ground: the yards' earth and straw, the lane, the plinth
blk(Y.goats.x0, W + S.plinth.edge, LANE0, Y.y1, -0.02, 0.02, "yard")
blk(LANE1, W + S.plinth.edge, Y.sheep.x1, Y.y1, -0.02, 0.02, "yard")
blk(Y.goats.x0, W, -L - S.plinth.edge, W + S.plinth.edge, -0.02, 0.02, "yard")
blk(L + S.plinth.edge, W, Y.sheep.x1, W + S.plinth.edge, -0.02, 0.02, "yard")
blk(LANE0, W + S.plinth.edge, LANE1, Y.y1 + 0.6, -0.02, 0.015, "packed") // the lane, on out of the gate toward the paddock
// the path behind the store to the tank, the baskets and the compost bays
blk(L + S.plinth.edge, -W - 0.4, CO.x0 + CO.bay + 0.3, W, -0.02, 0.015, "packed")
if (HERO) {
  T.grass.repeat.set(10, 10)
  add(new THREE.CircleGeometry(60, 64), "lawn", { rot: [-Math.PI / 2, 0, 0], keepUV: true, pos: [0, -0.025, 2] })
}
// the plinth: rammed earth edged in fieldstones, the straw litter on top in the pens
{
  const e = S.plinth.edge
  blk(-L - e + 0.12, -W - e + 0.12, L + e - 0.12, W + e - 0.12, 0, FL, "packed")
  seed = 11
  const ring = (x0, z0, x1, z1) => {
    const n = Math.round(Math.hypot(x1 - x0, z1 - z0) / 0.3)
    for (let k = 0; k < n; k++) {
      const x = x0 + ((x1 - x0) * (k + 0.5)) / n, z = z0 + ((z1 - z0) * (k + 0.5)) / n
      const s = add(new THREE.DodecahedronGeometry(1, 0), "stone", { pos: [x, FL / 2, z], rot: [rnd() * 3, rnd() * 3, rnd() * 3] })
      s.scale.set(0.16 + rnd() * 0.04, FL / 2 + 0.01, 0.14 + rnd() * 0.04)
    }
  }
  const [a, b, c, d] = [-L - e + 0.13, L + e - 0.13, -W - e + 0.13, W + e - 0.13]
  ring(a, d, b, d); ring(a, c, a, d); ring(b, c, b, d)
  for (const p of PENS) blk(p.x0 === -L ? -L + WALL : p.x0 + 0.02, -W + WALL, p.x1 - 0.02, W, FL, LIT, "litter")
}

// ------------------------------------------------------------ the shelter: upright split poles at the back and the ends to the eaves
{
  const r = WALL / 2
  for (let x = -L + r; x <= L - r + 1e-6; x += 2 * r * 0.98) pole(x, -W + r, r, FL, EAVE + (rnd() - 0.5) * 0.06)
  for (let z = -W + 3 * r; z <= W - r + 1e-6; z += 2 * r * 0.98) pole(-L + r, z, r, FL, EAVE + (rnd() - 0.5) * 0.06)
  // the east end: poles beside the store's door, which opens onto the path behind
  const door = 0.7
  for (let z = -W + 3 * r; z <= W - r + 1e-6; z += 2 * r * 0.98) if (z < -0.02 || z > door + 0.02) pole(L - r, z, r, FL, EAVE + (rnd() - 0.5) * 0.06)
  // the posts along the open front carry the eaves beam; the wall plates along the back and the ends
  for (const x of [-L + r, PENS[1].x0, PENS[2].x0, STORE.x0, L - r]) pole(x, W - r, 0.07, FL, EAVE + 0.15, 9)
  pipe([-L, EAVE + 0.1, W - r], [L, EAVE + 0.1, W - r], 0.08, "pole", 9)
  pipe([-L, EAVE + 0.04, -W + r], [L, EAVE + 0.04, -W + r], 0.07, "pole", 9)
  for (const x of [-L + r, L - r]) pipe([x, EAVE + 0.04, -W], [x, EAVE + 0.04, W], 0.07, "pole", 9)
  // the store's boarded walls: its west wall, its front onto the sheep yard, its door shut on a hasp
  blk(STORE.x0 - 0.03, -W + WALL, STORE.x0 + 0.03, W, FL, EAVE, "board")
  blk(STORE.x0, W - 0.06, L - WALL, W, FL, EAVE, "board")
  blk(L - 0.04, 0, L + 0.01, door, FL, FL + 1.9, "board")
  blk(L + 0.01, 0.06, L + 0.03, 0.18, FL + 1.0, FL + 1.06, "pole")
}

// ------------------------------------------------------------ the pens: pole hurdles between them, a gate onto each yard
function rails(x0, z0, x1, z1, y0, heights, r = 0.035) {
  for (const h of heights) pipe([x0, y0 + h, z0], [x1, y0 + h, z1], r, "pole", 7)
}
function gate(x0, z0, x1, z1, y0, h) { // shut: a frame of thin poles with a diagonal brace
  pole(x0, z0, 0.03, y0, y0 + h); pole(x1, z1, 0.03, y0, y0 + h)
  rails(x0, z0, x1, z1, y0, [0.12, h / 2, h - 0.04], 0.028)
  pipe([x0, y0 + 0.12, z0], [x1, y0 + h - 0.04, z1], 0.025, "pole", 6)
}
for (const p of PENS.slice(1)) { // the hurdles between the pens
  for (const z of [-W + WALL, 0, W - 0.04]) pole(p.x0, z, 0.045, FL, FL + 1.25)
  rails(p.x0, -W + WALL, p.x0, W, FL, RAILS)
}
for (const [i, p] of PENS.entries()) { // each pen's front, a gate at its east end
  const a = p.x1 - 0.1 - P.gate, x0 = i ? p.x0 : -L + WALL
  if (a - x0 > 0.1) { pole(x0 + 0.04, W - 0.04, 0.045, FL, FL + 1.25); rails(x0, W - 0.04, a, W - 0.04, FL, RAILS) }
  pole(a, W - 0.04, 0.045, FL, FL + 1.25)
  gate(a + 0.04, W - 0.04, p.x1 - 0.14, W - 0.04, FL + 0.04, 1.1)
}

// ------------------------------------------------------------ in each pen: the sleeping platform, the hay rack, the mineral box
for (const p of PENS) {
  const px0 = (p.x0 === -L ? p.x0 + WALL : p.x0 + 0.04) + 0.03, px1 = p.x1 - 0.07
  const z0 = -W + WALL + 0.02, z1 = -W + WALL + PF.d, top = LIT + PF.h
  for (const x of [px0 + 0.04, px1 - 0.04]) for (const z of [z0 + 0.04, z1 - 0.04]) pole(x, z, 0.035, LIT - 0.02, top - 0.03)
  for (const z of [z0 + 0.05, z1 - 0.05]) pipe([px0, top - 0.05, z], [px1, top - 0.05, z], 0.035, "pole", 7)
  for (let x = px0 + 0.03; x < px1 - 0.02; x += LINE ? 0.11 : 0.065) pipe([x, top - 0.01, z0], [x, top - 0.01, z1], 0.025, "bamboo", 6)
  // the rack on the west side, off the floor: a pole frame, slanted bars, hay
  const rx0 = px0, rx1 = px0 + FT.rack.d, rz0 = z1 + 0.15, rz1 = rz0 + p.rack, y0 = LIT + FT.rack.y0, y1 = y0 + FT.rack.h
  for (const z of [rz0, rz1]) pole(rx0 + 0.04, z, 0.035, LIT, y1)
  pipe([rx0 + 0.04, y1, rz0], [rx0 + 0.04, y1, rz1], 0.03, "pole", 7)
  blk(rx0, rz0, rx1, rz1, y0 - 0.05, y0, "board")
  for (let z = rz0 + 0.08; z < rz1 - 0.04; z += LINE ? 0.15 : 0.1) pipe([rx1, y1 - 0.02, z], [rx0 + 0.06, y0, z], 0.012, "pole", 5)
  if (!LINE) soft(rx0 + 0.06, rz0 + 0.04, rx1 - 0.02, rz1 - 0.04, y0, y1 - 0.1, 0.08, "hay")
  if (p.head) { // the mineral box on the east hurdle, for this species alone
    blk(px1 - FT.mineral.d, rz0, px1, rz0 + FT.mineral.w, LIT + 0.5, LIT + 0.7, "board")
    if (!LINE) blk(px1 - FT.mineral.d + 0.02, rz0 + 0.02, px1 - 0.02, rz0 + FT.mineral.w - 0.02, LIT + 0.68, LIT + 0.71, "mineral")
  }
}

// ------------------------------------------------------------ the feed store: sacks on a pallet, a shelf
{
  const [x0, x1] = [STORE.x0 + 0.12, STORE.x1 - 0.18]
  blk(x0, -1.2, x1, 0.2, FL, FL + 0.12, "board")
  for (const [z, k] of [[-0.95, 0], [-0.5, 0], [-0.05, 0], [-0.72, 1], [-0.27, 1]]) soft(x0 + 0.05, z - 0.19, x1 - 0.05, z + 0.19, FL + 0.12 + k * 0.2, FL + 0.32 + k * 0.2, 0.06, "sack")
  blk(STORE.x0 + 0.1, -W + WALL, L - WALL, -W + WALL + 0.35, FL + 1.3, FL + 1.33, "board")
}

// ------------------------------------------------------------ the yards: posts and three lashed rails, the lane, gates, troughs
function fence(x0, z0, x1, z1, gaps = []) {
  const len = Math.hypot(x1 - x0, z1 - z0), n = Math.max(1, Math.ceil(len / Y.post))
  for (let k = 0; k <= n; k++) {
    const x = x0 + ((x1 - x0) * k) / n, z = z0 + ((z1 - z0) * k) / n
    pole(x, z, 0.06, 0, Y.h + 0.12 + (rnd() - 0.5) * 0.06, 8)
    if (!LINE) for (const h of RAILS) cyl(x, z, 0.068, h - 0.05, 0.1, "rope", 8) // the sisal lashing at each rail
  }
  rails(x0, z0, x1, z1, 0, RAILS, 0.04)
}
const SW = W + S.plinth.edge
fence(Y.goats.x0, W, -L - S.plinth.edge, W)
fence(Y.goats.x0, W, Y.goats.x0, Y.y1)
fence(Y.goats.x0, Y.y1, LANE0, Y.y1)
fence(L + S.plinth.edge, W, Y.sheep.x1, W)
fence(Y.sheep.x1, W, Y.sheep.x1, Y.y1)
fence(Y.sheep.x1, Y.y1, LANE1, Y.y1)
for (const [i, x] of [LANE0, LANE1].entries()) {
  fence(x, SW, x, 4)
  fence(x, 4 + Y.gate, x, Y.y1)
  gate(x, 4.04, x, 4 + Y.gate - 0.04, 0.02, 1.1)
  // the lane's two gate leaves to the paddock, shut
  gate(x + (i ? -0.04 : 0.04), Y.y1, (LANE0 + LANE1) / 2 + (i ? 0.02 : -0.02), Y.y1, 0.02, 1.1)
}
for (const p of PENS.filter((p) => p.trough)) { // a float trough in each yard, in the shade of the eaves
  const t0 = (p.x0 + p.x1) / 2 - p.trough / 2 - 0.4, z0 = W + 0.4, z1 = z0 + FT.trough.d, h = FT.trough.h
  for (const x of [t0 + 0.1, t0 + p.trough - 0.1]) blk(x - 0.03, z0 + 0.02, x + 0.03, z1 - 0.02, 0, h - 0.18, "pole")
  blk(t0, z0, t0 + p.trough, z1, h - 0.2, h, "trough")
  blk(t0 + 0.04, z0 + 0.04, t0 + p.trough - 0.04, z1 - 0.04, h - 0.06, h - 0.03, "water", { noEdges: true })
}

// ------------------------------------------------------------ the palisade windbreak behind the shelter
for (let x = PA.x0; x <= PA.x1 + 1e-6; x += 0.14) pole(x, PA.y, 0.06, 0, PA.h + (rnd() - 0.5) * 0.12, 7)
rails(PA.x0, PA.y - 0.08, PA.x1, PA.y - 0.08, 0, [0.4, PA.h - 0.35], 0.04)

// ------------------------------------------------------------ stones to climb, the shade tree in its guard
const stoneTop = []
seed = 23
for (const s of ST.list) {
  const h = s.r * 0.85
  const m = add(new THREE.DodecahedronGeometry(1, 0), "stone", { pos: [s.x, h * 0.45, s.y], rot: [rnd(), rnd() * 3, rnd()] })
  m.scale.set(s.r, h, s.r * 0.78)
  stoneTop.push(h * 0.45 + h * 0.8)
}
{
  cyl(TR.x, TR.y, 0.14, 0, HERO ? 3.2 : 1.6, "trunk", 12, 0.1)
  for (let k = 0; k < 7; k++) { const a = (k / 7) * Math.PI * 2; pole(TR.x + Math.cos(a) * TR.guard, TR.y + Math.sin(a) * TR.guard, 0.035, 0, 1.3) }
  for (const h of [0.5, 1.15]) for (let k = 0; k < 7; k++) {
    const a = (k / 7) * Math.PI * 2, b = ((k + 1) / 7) * Math.PI * 2
    pipe([TR.x + Math.cos(a) * TR.guard, h, TR.y + Math.sin(a) * TR.guard], [TR.x + Math.cos(b) * TR.guard, h, TR.y + Math.sin(b) * TR.guard], 0.025, "pole", 6)
  }
  if (HERO) { // the crown, only at eye level
    seed = 31
    for (let k = 0; k < 9; k++) {
      const m = add(new THREE.IcosahedronGeometry(1, 1), "leaf", { pos: [TR.x + (rnd() - 0.5) * 2.2, 3.4 + rnd() * 1.4, TR.y + (rnd() - 0.5) * 2.2] })
      m.scale.setScalar(0.8 + rnd() * 0.6)
    }
  }
}

// ------------------------------------------------------------ behind the store: the tank, the fodder baskets, the compost bays
{
  const sh = TK.stand
  blk(TK.x - TK.r - 0.05, TK.y - TK.r - 0.05, TK.x + TK.r + 0.05, TK.y + TK.r + 0.05, 0, sh, "block")
  cyl(TK.x, TK.y, TK.r, sh, TK.h, "tank", 32, TK.r * 0.96)
  cyl(TK.x, TK.y, 0.16, sh + TK.h, 0.06, "tank", 16)
  for (const b of BK.list) {
    cyl(b.x, b.y, b.r * 0.85, 0, 0.5, "basket", 24, b.r)
    if (!LINE) soft(b.x - b.r * 0.7, b.y - b.r * 0.7, b.x + b.r * 0.7, b.y + b.r * 0.7, 0.36, 0.58, 0.08, "fodder")
  }
  const b = CO.bay
  for (let k = 0; k < CO.n; k++) {
    const z0 = CO.y0 + k * b, z1 = z0 + b
    for (const [x, z] of [[CO.x0, z0], [CO.x0 + b, z0], [CO.x0 + b, z1], [CO.x0, z1]]) pole(x, z, 0.05, 0, 1.05)
    rails(CO.x0, z0, CO.x0 + b, z0, 0, [0.25, 0.55, 0.85], 0.035) // the dividers, open to the path on the west
    rails(CO.x0 + b, z0, CO.x0 + b, z1, 0, [0.25, 0.55, 0.85], 0.035)
    if (k === CO.n - 1) rails(CO.x0, z1, CO.x0 + b, z1, 0, [0.25, 0.55, 0.85], 0.035)
    // fresh litter, a turning heap, finished compost
    const heap = add(new THREE.SphereGeometry(1, 18, 10, 0, Math.PI * 2, 0, Math.PI / 2), k ? "compost" : "litter", { pos: [CO.x0 + b / 2, 0, (z0 + z1) / 2] })
    heap.scale.set(b * 0.42, [0.6, 0.5, 0.35][k], b * 0.42)
  }
}

// ------------------------------------------------------------ the roof, at eye level only: grass thatch on a pole gable
if (HERO) {
  const o = S.roof.over, rise = S.roof.ridge - EAVE, half = W + o
  const len = Math.hypot(half, rise), a = Math.atan2(rise, half)
  for (const s of [1, -1]) {
    const r = add(new THREE.BoxGeometry(S.l + 2 * o, 0.25, len), "thatch", { pos: [0, EAVE + rise / 2 + 0.1, (s * half) / 2] })
    r.rotation.x = s * a
  }
  for (const s of [1, -1]) pole(s * (L - WALL / 2), 0, 0.07, EAVE, S.roof.ridge)
}

// ------------------------------------------------------------ the herd: 6 goats and 4 sheep
function ellipsoid(x, y, z, rx, ry, rz, name, rotZ = 0) {
  const m = add(new THREE.SphereGeometry(1, 22, 14), name, { pos: [x, y, z], rot: [0, 0, rotZ] })
  m.scale.set(rx, ry, rz)
  return m
}
function animal(a, sheep) {
  const inside = Math.abs(a.x) < L && Math.abs(a.y) < W
  const base = a.on !== undefined ? stoneTop[a.on] : inside ? LIT : 0.02
  const g = new THREE.Group()
  g.position.set(a.x, base, a.y); g.rotation.y = THREE.MathUtils.degToRad(-a.h)
  scene.add(g); PARENT = g
  const coat = a.coat, head = sheep ? "face" : coat
  const [bx, by, bz, cy] = sheep ? [0.4, 0.23, 0.2, 0.52] : [0.37, 0.18, 0.15, 0.48]
  ellipsoid(0, cy, 0, bx, by, bz, coat)
  const legH = sheep ? 0.32 : 0.34
  for (const dx of [bx * 0.62, -bx * 0.65]) for (const dz of [bz * 0.5, -bz * 0.5]) {
    cyl(dx, dz, 0.026, 0.04, legH, sheep ? "wool" : coat, 8, 0.036)
    cyl(dx, dz, 0.024, 0, 0.04, "hoof", 8)
  }
  const nb = [bx * 0.8, cy + by * 0.35, 0], nt = [bx * 1.2, cy + by * 1.45, 0]
  pipe(nb, nt, sheep ? 0.075 : 0.055, sheep ? "wool" : coat, 10)
  ellipsoid(nt[0] + 0.07, nt[1] + 0.02, 0, 0.12, 0.07, sheep ? 0.07 : 0.06, head, -0.55)
  for (const s of [1, -1]) {
    // ears: the sheep's droop, the goat's stand out sideways
    const e = add(new THREE.BoxGeometry(0.08, 0.015, 0.035), head, { pos: [nt[0] - 0.01, nt[1] + 0.03, s * (sheep ? 0.08 : 0.075)], rot: [s * (sheep ? 0.9 : 0.25), s * 1.2, 0] })
    e.userData.noEdges = LINE
    if (!sheep) pipe([nt[0] + 0.02, nt[1] + 0.07, s * 0.025], [nt[0] - 0.05, nt[1] + 0.12, s * 0.04], 0.012, "horn", 6)
  }
  if (sheep) ellipsoid(-bx * 1.02, cy - 0.08, 0, 0.07, 0.12, 0.09, "wool") // the fat tail
  else pipe([-bx * 0.95, cy + 0.06, 0], [-bx * 1.1, cy + 0.15, 0], 0.016, coat, 6)
  PARENT = scene
}
for (const a of AN.goats) animal(a, false)
for (const a of AN.sheep) animal(a, true)

// ------------------------------------------------------------ camera
const camera = new THREE.PerspectiveCamera(HERO ? 40 : 20, FW / FH, 0.3, 300)
if (HERO) {
  // eye level in the paddock, front-left, the shelter and yards right of centre, open ground bottom-left for the words
  camera.position.set(-9.5, 1.5, 15.5)
  camera.lookAt(new THREE.Vector3(-0.5, 1.4, 2.5))
  add(new THREE.SphereGeometry(150, 32, 16), "sky", { noEdges: true, keepUV: true })
  scene.fog = new THREE.Fog(0xdfe2e2, 30, 140)
} else {
  // straight on from the paddock, as the studio's front view, but from far off with a long lens and looking down,
  // so the pens show over the fences and the yards keep their proportions; the view offset frames the model
  const target = new THREE.Vector3(-0.4, 0.6, 2.6)
  const [el, dist] = [THREE.MathUtils.degToRad(38), 48]
  camera.position.set(target.x, target.y + dist * Math.sin(el), target.z + dist * Math.cos(el))
  camera.lookAt(target)
}
camera.updateMatrixWorld(); camera.updateProjectionMatrix()
scene.updateMatrixWorld(true)
if (!HERO) { // fit the frame to the model
  const bb = new THREE.Box3()
  for (const o of meshes) if (!o.userData.noFrame) bb.expandByObject(o)
  let px = [Infinity, Infinity, -Infinity, -Infinity]
  for (const xx of [bb.min.x, bb.max.x]) for (const yy of [bb.min.y, bb.max.y]) for (const zz of [bb.min.z, bb.max.z]) {
    const p = new THREE.Vector3(xx, yy, zz).project(camera)
    const X = ((p.x + 1) / 2) * FW, Yp = ((1 - p.y) / 2) * FH
    px = [Math.min(px[0], X), Math.min(px[1], Yp), Math.max(px[2], X), Math.max(px[3], Yp)]
  }
  let w = (px[2] - px[0]) * 1.04, h = (px[3] - px[1]) * 1.06
  if (w / h > FW / FH) h = (w * FH) / FW; else w = (h * FW) / FH
  camera.setViewOffset(FW, FH, (px[0] + px[2]) / 2 - w / 2, (px[1] + px[3]) / 2 - h / 2, w, h)
}

// ------------------------------------------------------------ render
if (LINE) {
  const lineMat = new LineMaterial({ color: INK, linewidth: 1.2, side: THREE.DoubleSide })
  lineMat.resolution.set(FW, FH)
  lineMat.userData.outlineParameters = { visible: false }
  for (const o of meshes) {
    if (o.userData.noEdges) continue
    const g = new LineSegmentsGeometry().fromEdgesGeometry(new THREE.EdgesGeometry(o.geometry, 30))
    const l = new LineSegments2(g, lineMat)
    l.matrixAutoUpdate = false; l.matrix.copy(o.matrixWorld)
    scene.add(l)
  }
  const ink = new THREE.Color(INK)
  new OutlineEffect(renderer, { defaultThickness: 0.003, defaultColor: [ink.r, ink.g, ink.b] }).render(scene, camera)
} else {
  const pmrem = new THREE.PMREMGenerator(renderer)
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture
  scene.environmentIntensity = 0.45
  scene.add(new THREE.HemisphereLight(0xeef3ff, 0x8a7a5a, HERO ? 0.7 : 1.0))
  // soft daylight from the front left, as the studio's; at eye level a lower, warmer sun
  const sun = new THREE.DirectionalLight(HERO ? 0xffe2bd : 0xfff3e0, HERO ? 2.6 : 2.4)
  sun.position.set(-8, HERO ? 7 : 12, 10)
  sun.target.position.set(-0.5, 0, 2.5)
  sun.castShadow = true
  sun.shadow.mapSize.set(4096, 4096)
  Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10, near: 1, far: 60 })
  sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.02; sun.shadow.radius = 4
  scene.add(sun, sun.target)
  if (!HERO) { // the white page around the yard takes only the shadows
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.ShadowMaterial({ opacity: 0.14 }))
    ground.rotation.x = -Math.PI / 2; ground.position.y = -0.021; ground.receiveShadow = true
    scene.add(ground)
  }
  const composer = new EffectComposer(renderer)
  composer.setSize(FW, FH)
  composer.addPass(new RenderPass(scene, camera))
  const ao = new GTAOPass(scene, camera, FW, FH)
  ao.blendIntensity = 0.8
  ao.updateGtaoMaterial({ radius: 0.3, distanceExponent: 1.5, thickness: 1, scale: 1 })
  composer.addPass(ao)
  composer.addPass(new OutputPass())
  composer.render()
}
document.getElementById("out").src = renderer.domElement.toDataURL("image/png")
document.body.dataset.ready = "1"
</script>
</body>
