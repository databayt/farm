<!doctype html>
<!--
  /en/bar's 3D, in the pattern of the camp's (scripts/site/render/camp.html): the compound's bar seen from the
  courtyard, built from src/components/bar/bar.json (the numbers the 2D draws). The shell follows the homepage
  model (scripts/site/render/compound.html: oxide paint, corrugations, frame, cargo doors, stone plinth, the
  propped flap) and the 2026-10-25 footage of the red container (assets/library/footage/2026-10-25/IMG_3195, IMG_3196); the
  fit-out takes the studio's finishes (scripts/studio/render/room.html: Medium Oak joinery, off-white lining).
  The roof is off so the inside shows over the hatch. Outside, D-065's lounge: today's steel ledge under the hatch
  and a deck with two deep chairs and a low table at each end. Rendered two ways:

    ?mode=line  line drawing on a transparent ground   -> public/designs/bar/render/bar-line.png
    ?mode=real  materials, low sun and shadow          -> public/designs/bar/render/bar-real.webp
    &hero=1     real mode, roof on, from eye level on the lawn, 2400 x 1340 -> the stand-in bar-hero.jpg
    ?view=water&mode=line     the same view with the fit-out in grey and the water in its colours (bar.json's water:
                              every run, dashed under the floor, every point drawn and in window.TAGS)
                                                            -> render/water-line.png + water-tags.json
    ?view=water&mode=real     the same view rendered, the pipes drawn as they are   -> render/water-real.webp
    ?view=electric&mode=...   the same for bar.json's electric: the board, every circuit up to the ceiling, along
                              its own track and down to its points                  -> render/electric-line.png, -real.webp
    ?item=<id>                one piece on its own, rendered, transparent, for a rail: the equipment (coffee,
                              grinder, fridge, sink, shelves, store, chair, table) or a service part
                              (a water point's `item`, an electric point's `model`, ppr, upvc) -> render/<rail>/<id>.webp

  Serve the repo root on a spare port, open this page at 2400 x 1100, and once body[data-ready] is set
  save the data URL in #out.
-->

<body>
<img id="out" alt="">
<script type="module">
import * as THREE from "three"
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js"
import { OutlineEffect } from "three/addons/effects/OutlineEffect.js"
import { LineSegments2 } from "three/addons/lines/LineSegments2.js"
import { LineSegmentsGeometry } from "three/addons/lines/LineSegmentsGeometry.js"
import { LineMaterial } from "three/addons/lines/LineMaterial.js"
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js"
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js"
import { RenderPass } from "three/addons/postprocessing/RenderPass.js"
import { GTAOPass } from "three/addons/postprocessing/GTAOPass.js"
import { OutputPass } from "three/addons/postprocessing/OutputPass.js"

const Q = new URLSearchParams(location.search)
const ITEM = Q.get("item"), VIEW = Q.get("view")
const LINE = Q.get("mode") !== "real" && !ITEM
const HERO = !LINE && !ITEM && Q.get("hero") === "1"
const [FW, FH] = HERO ? [2400, 1340] : ITEM ? [1200, 900] : [2400, 1100]
const C = await (await fetch(`/src/components/bar/bar.json?${Date.now()}`)).json()
const INK = "#2b2a26", PAGE = "#ffffff"
// plan (x right, y toward the hatch) -> three: x = x, y = height, z = y; the camera stands in the courtyard, at +z

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true })
renderer.setClearColor(0xffffff, 0)
renderer.setPixelRatio(1)
renderer.setSize(FW, FH)
renderer.outputColorSpace = THREE.SRGBColorSpace
if (!LINE) {
  renderer.toneMapping = THREE.ACESFilmicToneMapping
  renderer.shadowMap.enabled = true
  renderer.shadowMap.type = THREE.PCFSoftShadowMap
}
const scene = new THREE.Scene()

// ------------------------------------------------------------ procedural textures (real mode)
let seed = 7
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647)
function tex(draw, w = 512, h = 512) {
  const c = document.createElement("canvas"); c.width = w; c.height = h
  seed = 7
  draw(c.getContext("2d"), w, h)
  const t = new THREE.CanvasTexture(c)
  t.colorSpace = THREE.SRGBColorSpace
  t.wrapS = t.wrapT = THREE.RepeatWrapping
  t.anisotropy = 8
  return t
}
const T = LINE ? {} : {
  // one corrugation's light and shade across, as compound.html; the paint tints it
  corr: tex((g, w, h) => {
    for (let x = 0; x < w; x++) {
      const p = x / w
      const v = p < 0.3 ? 0.95 : p < 0.42 ? 0.95 - (p - 0.3) * 2.2 : p < 0.72 ? 0.69 : p < 0.84 ? 0.69 + (p - 0.72) * 1.5 : 0.87
      g.fillStyle = `rgb(${Math.round(255 * v)},${Math.round(255 * v)},${Math.round(255 * v)})`
      g.fillRect(x, 0, 1, h)
    }
    for (let i = 0; i < 260; i++) { // weathering: a few chips and streaks, as on the container today
      g.fillStyle = `rgba(60,30,20,${0.04 + rnd() * 0.08})`
      g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 3, 2 + rnd() * 20)
    }
  }, 64, 256),
  // pine under a Medium Oak finish (room.html's pine, simplified): golden amber, grain along u
  oak: tex((g, w, h) => {
    g.fillStyle = "#c58c52"; g.fillRect(0, 0, w, h)
    for (let s = 0; s < 5; s++) {
      g.fillStyle = rnd() > 0.5 ? `rgba(232,186,122,${0.05 + rnd() * 0.1})` : `rgba(138,84,38,${0.04 + rnd() * 0.08})`
      g.fillRect(0, (s * h) / 5, w, h / 5)
    }
    for (let i = 0; i < 1800; i++) {
      const x = rnd() * w, y = rnd() * h, len = 20 + rnd() * 110
      g.strokeStyle = rnd() > 0.35 ? `rgba(116,70,30,${0.04 + rnd() * 0.08})` : `rgba(244,206,148,${0.04 + rnd() * 0.07})`
      g.lineWidth = 0.6 + rnd() * 0.7
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + len, y + (rnd() - 0.5) * 1.5); g.stroke()
    }
  }, 1024, 512),
  boards: tex((g, w, h) => { // deck boards, 140 mm each across the tile
    g.fillStyle = "#a9774a"; g.fillRect(0, 0, w, h)
    const n = 10
    for (let i = 0; i < n; i++) {
      g.fillStyle = `rgba(${rnd() > 0.5 ? "230,180,120" : "90,55,25"},${0.05 + rnd() * 0.1})`
      g.fillRect(0, (i * h) / n, w, h / n)
      g.fillStyle = "rgba(50,30,15,0.55)"; g.fillRect(0, ((i + 1) * h) / n - 2, w, 2)
    }
    for (let j = 0; j < 200; j++) { g.fillStyle = `rgba(110,70,35,${0.05 + rnd() * 0.08})`; g.fillRect(rnd() * w, rnd() * h, 30 + rnd() * 160, 1 + rnd()) }
  }),
  planks: tex((g, w, h) => { // the oak floor inside
    g.fillStyle = "#c39466"; g.fillRect(0, 0, w, h)
    const n = 8
    for (let i = 0; i < n; i++) {
      const off = rnd() * w
      g.fillStyle = `rgba(${rnd() > 0.5 ? "235,195,140" : "120,80,45"},${0.06 + rnd() * 0.1})`
      g.fillRect(0, (i * h) / n, w, h / n)
      g.fillStyle = "rgba(70,45,25,0.35)"; g.fillRect(0, ((i + 1) * h) / n - 1, w, 1); g.fillRect(off, (i * h) / n, 1, h / n)
    }
  }),
  grass: tex((g, w, h) => {
    g.fillStyle = "#6f9a4a"; g.fillRect(0, 0, w, h)
    for (let i = 0; i < 26000; i++) {
      g.fillStyle = rnd() > 0.5 ? "rgba(170,200,110,0.35)" : "rgba(40,70,30,0.35)"
      g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 2, 1 + rnd() * 2)
    }
  }),
  stone: tex((g, w, h) => { // fieldstone in darker mortar, as compound.html
    g.fillStyle = "#6c6358"; g.fillRect(0, 0, w, h)
    for (let i = 0; i < 160; i++) {
      const x = rnd() * w, y = rnd() * h, rx = 14 + rnd() * 30, ry = 10 + rnd() * 20, tone = rnd()
      g.fillStyle = tone > 0.66 ? "#a8957a" : tone > 0.33 ? "#9a9184" : "#857a6b"
      g.beginPath(); g.ellipse(x, y, rx, ry, rnd() * Math.PI, 0, Math.PI * 2); g.fill()
    }
  }),
  sky: tex((g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h)
    // the upper half of the sphere is the sky: deep blue overhead to a warm peach at the horizon
    gr.addColorStop(0, "#6f9fd0"); gr.addColorStop(0.3, "#a9c4dc"); gr.addColorStop(0.47, "#f2d3ac"); gr.addColorStop(1, "#f2d3ac")
    g.fillStyle = gr; g.fillRect(0, 0, w, h)
  }, 16, 512),
}
// metres one tile covers [along, across]
const TILE = { corr: [0.278, 2.6], oak: [1.2, 0.6], boards: [1.4, 1.4], planks: [1.6, 1.6], grass: [9, 9], stone: [1, 1] }
const MAP = { oxide: "corr", oak: "oak", deck: "boards", floor: "planks", lawn: "grass", stone: "stone" }

// ------------------------------------------------------------ materials
const OXIDE = "#8a3227"
// thin parts get crease lines but no silhouette, so struts, legs and bottles stay fine in the line drawing
const THIN = new Set(["black", "steel", "frame", "bottle", "glass", "cup"])
const MAT = {}
function mat(name) {
  if (MAT[name]) return MAT[name]
  if (name.startsWith("svc-")) return (MAT[name] = svcMat(name))
  if (name === "rib") { // corrugations: the wall's paint, no silhouette in the line drawing
    if (!LINE) return (MAT[name] = mat("oxide"))
    const m = new THREE.MeshBasicMaterial({ color: PAGE, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 })
    m.userData.outlineParameters = { visible: false }
    return (MAT[name] = m)
  }
  let x
  if (LINE) {
    if (name === "glass" || name === "fridgeglass") x = new THREE.MeshBasicMaterial({ color: PAGE, transparent: true, opacity: 0, depthWrite: false })
    else x = new THREE.MeshBasicMaterial({ color: PAGE, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 })
    if (THIN.has(name)) x.userData.outlineParameters = { visible: false }
  } else {
    const std = (o) => new THREE.MeshStandardMaterial(o)
    x = {
      oxide: () => std({ map: T.corr, color: OXIDE, roughness: 0.55, metalness: 0.15 }),
      frame: () => std({ color: new THREE.Color(OXIDE).multiplyScalar(0.86), roughness: 0.5, metalness: 0.2 }),
      underside: () => std({ color: "#c8754a", roughness: 0.6, metalness: 0.1 }), // the flap's inner face: faded orange, as the hatch panels today
      lining: () => std({ color: "#f0ece3", roughness: 0.85 }), // off-white satin, the studio's walls
      floor: () => std({ map: T.planks, roughness: 0.6 }),
      oak: () => std({ map: T.oak, roughness: 0.6 }),
      deck: () => std({ map: T.boards, roughness: 0.8 }),
      stone: () => std({ map: T.stone, roughness: 0.95 }),
      lawn: () => std({ map: T.grass, roughness: 1 }),
      steel: () => std({ color: "#c7cacd", roughness: 0.28, metalness: 0.9 }),
      black: () => std({ color: "#26272b", roughness: 0.45, metalness: 0.5 }),
      white: () => std({ color: "#f2f2f0", roughness: 0.4 }),
      fridgeglass: () => new THREE.MeshPhysicalMaterial({ color: "#d8e4ea", roughness: 0.05, transparent: true, opacity: 0.35, depthWrite: false }),
      fridgelit: () => std({ color: "#fdfbf4", emissive: "#fff6e0", emissiveIntensity: 0.6, roughness: 0.6 }),
      glass: () => new THREE.MeshPhysicalMaterial({ color: "#eef4f4", roughness: 0.05, transparent: true, opacity: 0.45, depthWrite: false }),
      bottle: () => std({ color: "#7c8f5a", roughness: 0.15, metalness: 0.1, transparent: true, opacity: 0.85 }),
      amber: () => std({ color: "#9a5a22", roughness: 0.15, transparent: true, opacity: 0.85 }),
      cup: () => std({ color: "#f4f1ea", roughness: 0.35 }),
      jar: () => std({ color: "#e4d3a6", roughness: 0.3 }),
      crate: () => std({ color: "#b98250", roughness: 0.8 }), // the deck's bearers
      cushion: () => std({ color: "#d9cfbb", roughness: 0.95 }), // outdoor canvas, natural
      lamp: () => std({ color: "#fff3d6", roughness: 0.3, emissive: "#ffcf7a", emissiveIntensity: 2.2 }),
      sky: () => new THREE.MeshBasicMaterial({ map: T.sky, side: THREE.BackSide, fog: false, toneMapped: false }),
    }[name]?.() ?? std({ color: "#cccccc", roughness: 0.8 })
  }
  return (MAT[name] = x)
}

// ------------------------------------------------------------ geometry helpers (metres)
const meshes = []
let PARENT = scene
// ITEMS: the rail pieces the next meshes belong to (?item=); SVCMARK: they are a service's, inked in its views
let ITEMS = [], SVCMARK = false
// TAG: "cut" for the hatch wall and its flap, "open" for the units' carcasses: both left out of a service view
let TAG = null
function worldUV(geo, [tu, tv]) { // each face takes the texture from its own plane, at true scale
  const pos = geo.attributes.position, nrm = geo.attributes.normal, uv = geo.attributes.uv
  if (!uv) return
  for (let i = 0; i < pos.count; i++) {
    const n = [Math.abs(nrm.getX(i)), Math.abs(nrm.getY(i)), Math.abs(nrm.getZ(i))]
    const axis = n.indexOf(Math.max(...n))
    const p = [pos.getX(i), pos.getY(i), pos.getZ(i)]
    const [a, b] = axis === 0 ? [2, 1] : axis === 2 ? [0, 1] : [0, 2]
    uv.setXY(i, p[a] / tu, p[b] / tv)
  }
  uv.needsUpdate = true
}
function add(geo, name, opts = {}) {
  if (!LINE && MAP[name] && !opts.keepUV) worldUV(geo, TILE[MAP[name]])
  const mesh = new THREE.Mesh(geo, mat(name))
  mesh.userData.items = ITEMS; mesh.userData.svc = SVCMARK; mesh.userData.tag = TAG
  mesh.castShadow = !LINE && !["glass", "fridgeglass", "lawn", "sky"].includes(name)
  mesh.receiveShadow = !LINE && name !== "sky"
  if (opts.pos) mesh.position.set(...opts.pos)
  if (opts.rot) mesh.rotation.set(...opts.rot)
  if (opts.noEdges) mesh.userData.noEdges = true
  PARENT.add(mesh)
  meshes.push(mesh)
  return mesh
}
function blk(xa, za, xb, zb, y0, y1, name, opts) {
  const [x0, x1, z0, z1] = [Math.min(xa, xb), Math.max(xa, xb), Math.min(za, zb), Math.max(za, zb)]
  return add(new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0), name, { pos: [(x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2], ...opts })
}
function soft(x0, z0, x1, z1, y0, y1, r, name) {
  return add(new RoundedBoxGeometry(x1 - x0, y1 - y0, z1 - z0, 3, r), name, { pos: [(x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2] })
}
function cyl(x, z, r, y0, h, name, seg = 20, rTop = r) {
  return add(new THREE.CylinderGeometry(rTop, r, h, seg), name, { pos: [x, y0 + h / 2, z] })
}
function pipe(a, b, r, name, seg = 6) {
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b)
  const mesh = add(new THREE.CylinderGeometry(r, r, A.distanceTo(B), seg), name, { pos: A.clone().add(B).multiplyScalar(0.5).toArray() })
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), B.sub(A).normalize())
  return mesh
}

// ------------------------------------------------------------ ground, plinth, deck
const { container: K, hatch: H, ledge: LE, deck: D, lounge: LO, inside: I } = C
const L = K.l / 2, W = K.w / 2, t = K.wall, Y0 = K.plinth, Y1 = Y0 + K.h
const ix = L - t, iz = W - t, FL = Y0 + K.floor // the inside faces and the inside floor
const sill = Y0 + H.sill, head = Y0 + H.head
if (!LINE) {
  T.grass.repeat.set(10, 10)
  add(new THREE.CircleGeometry(40, 64), "lawn", { rot: [-Math.PI / 2, 0, 0], keepUV: true })
}
blk(-L - 0.1, -W - 0.1, L + 0.1, W + 0.1, 0, Y0, "stone")
TAG = "cut" // the deck and its lounge also stay out of a service view, so its low camera sees under the counters
blk(D.x0, W + 0.1, D.x1, W + D.d, 0, D.h - 0.03, "crate", { noEdges: !LINE }) // bearers, hidden under the boards
blk(D.x0, W + 0.1, D.x1, W + D.d, D.h - 0.03, D.h, "deck")
blk(D.step.x0, W + D.d, D.step.x1, W + D.d + D.step.d, 0, D.h / 2, "deck") // one step down to the lawn, at the hatch
TAG = null

// ------------------------------------------------------------ the steel box
// Corner posts and rails as compound.html's container(); walls a hair inside them; the roof off (cutaway)
// except in the hero. The courtyard wall is cut for the hatch, the north end carries the cargo doors.
const fr = (x0, z0, x1, z1, y0, y1) => blk(x0, z0, x1, z1, y0, y1, "frame")
for (const cx of [-L, L]) for (const cz of [-W, W]) fr(cx, cz, cx + Math.sign(-cx) * 0.15, cz + Math.sign(-cz) * 0.15, Y0, Y1)
for (const [y, h] of [[Y0, 0.14], [Y1 - 0.1, 0.1]]) {
  fr(-L, -W, L, -W + 0.12, y, y + h); fr(-L, W - 0.12, L, W, y, y + h)
  fr(-L, -W, -L + 0.12, W, y, y + h); fr(L - 0.12, -W, L, W, y, y + h)
}
const wy0 = Y0 + 0.14, wy1 = Y1 - 0.1
blk(-L + 0.02, -W + 0.02, L - 0.02, -W + t, wy0, wy1, "oxide") // back wall
blk(-L + 0.02, -W + 0.02, -L + t, W - 0.02, wy0, wy1, "oxide") // south end
blk(L - t, -W + 0.02, L - 0.02, W - 0.02, wy0, wy1, "oxide") // north end, the cargo doors
// the courtyard wall in three pieces round the hatch
TAG = "cut"
blk(-L + 0.02, W - t, H.x0, W - 0.02, wy0, wy1, "oxide")
blk(H.x1, W - t, L - 0.02, W - 0.02, wy0, wy1, "oxide")
blk(H.x0, W - t, H.x1, W - 0.02, wy0, sill, "oxide")
blk(H.x0, W - t, H.x1, W - 0.02, head, wy1, "oxide")
TAG = null
if (HERO) blk(-L + 0.02, -W + 0.02, L - 0.02, W - 0.02, Y1 - 0.06, Y1 - 0.02, "oxide") // the roof
// the inside: oak floor, off-white lining on the walls
blk(-ix, -iz, ix, iz, Y0 + 0.14, FL, "floor")
blk(-ix, -iz, ix, -iz + 0.02, FL, wy1, "lining")
blk(-ix, -iz, -ix + 0.02, iz, FL, wy1, "lining")
blk(ix - 0.02, -iz, ix, iz, FL, wy1, "lining")
// the corrugations on both long walls, skipped at the hatch
{
  const pitch = LINE ? 0.556 : 0.278
  for (const [z, out] of [[W, 1], [-W, -1]]) {
    for (let a = -L + 0.25; a <= L - 0.25; a += pitch) {
      if (out === 1 && a > H.x0 - 0.1 && a < H.x1 + 0.1) continue
      TAG = out === 1 ? "cut" : null
      blk(a - 0.04, z - out * 0.015, a + 0.04, z + out * 0.03, Y0 + 0.16, Y1 - 0.12, "rib")
      TAG = null
    }
  }
  // and on the end walls
  for (const x of [-L, L]) for (let a = -W + 0.25; a <= W - 0.25; a += pitch * 1.5)
    blk(x - Math.sign(x) * 0.015, a - 0.04, x + Math.sign(x) * 0.03, a + 0.04, Y0 + 0.16, Y1 - 0.12, "rib")
}
// the cargo doors at the north end: two leaves, four locking bars, handles
for (const k of [0.2, 0.36, 0.64, 0.8]) cyl(L + 0.05, -W + K.w * k, 0.022, Y0 + 0.2, K.h - 0.4, "steel", 8)
blk(L + 0.03, -0.01, L + 0.045, 0.01, Y0 + 0.16, Y1 - 0.12, "black")

// ------------------------------------------------------------ the hatch, the flap and the counter
TAG = "cut"
blk(H.x0 - 0.06, W - 0.02, H.x1 + 0.06, W + 0.04, head, head + 0.06, "frame") // the head trim
for (const x of [H.x0 - 0.06, H.x1]) blk(x, W - 0.02, x + 0.06, W + 0.04, sill, head + 0.06, "frame")
{
  // the flap: the cut-out panel, hinged at the head, swung up and out; corrugated outside, orange inside
  const g = new THREE.Group()
  g.position.set(0, head + 0.03, W + 0.03)
  g.rotation.x = -THREE.MathUtils.degToRad(H.flap.angle) // hanging down, then up and out toward +z
  PARENT.add(g); PARENT = g
  const fh = H.head - H.sill
  blk(H.x0, 0, H.x1, 0.03, -fh, 0, "oxide")
  blk(H.x0, -0.004, H.x1, 0, -fh, 0, "underside")
  for (let a = H.x0 + 0.15; a < H.x1 - 0.1; a += LINE ? 0.556 : 0.278) blk(a - 0.04, 0.03, a + 0.04, 0.06, -fh + 0.05, -0.05, "rib")
  blk(H.x0, 0.0, H.x1, 0.06, -fh, -fh + 0.05, "frame")
  // a warm light bar under the flap, over the counter
  blk(H.x0 + 0.2, -0.03, H.x1 - 0.2, -0.004, -fh + 0.15, -fh + 0.19, LINE ? "black" : "lamp")
  PARENT = scene
  scene.updateMatrixWorld(true)
  // two struts from the frame below the sill to the flap's outer edge
  const tip = new THREE.Vector3(0, -fh + 0.08, 0.0).applyMatrix4(g.matrixWorld)
  for (const x of [H.x0 + 0.12, H.x1 - 0.12]) pipe([x, sill - 0.05, W + 0.04], [x, tip.y, tip.z], 0.014, "black")
  TAG = null
  if (!LINE) {
    const spot = new THREE.PointLight(0xffc27a, 1.2, 3, 2)
    spot.position.set(0, tip.y - 0.3, (W + tip.z) / 2); scene.add(spot)
  }
}
TAG = "cut"
{
  // today's steel ledge under the hatch, the shelf drinks are handed over on, on three brackets

const NRM = { "+y": [0, 0, 1], "-y": [0, 0, -1], "+x": [1, 0, 0], "-x": [-1, 0, 0], down: [0, -1, 0] }
// a box on a device's face: du along the wall, dv up it (along plan y on the ceiling), from `off` to `off + d` out of it
function frame(at, f) {
  const n = NRM[f] ?? NRM["+y"], side = f === "+x" || f === "-x"
  return { n, p: P3(at), u: side ? [0, 0, 1] : [1, 0, 0], v: f === "down" ? [0, 0, 1] : [0, 1, 0], side }
}
function onFace(at, f, du, dv, w, h, d, off, name) {
  const { n, p, u, v, side } = frame(at, f)
  const pos = [0, 1, 2].map((i) => p[i] + u[i] * du + v[i] * dv + n[i] * (off + d / 2))
  return add(new THREE.BoxGeometry(...(f === "down" ? [w, d, h] : side ? [d, h, w] : [w, h, d])), name, { pos })
}
function onDisc(at, f, du, dv, r, d, off, name) {
  const { n, p, u, v } = frame(at, f)
  const pos = [0, 1, 2].map((i) => p[i] + u[i] * du + v[i] * dv + n[i] * (off + d / 2))
  const m = add(new THREE.CylinderGeometry(r, r, d, 28), name, { pos })
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3(...n))
  return m
}

      const [a, b] = [P3(path[i - 1]), P3(path[i])]
      if (LINE) SVC.lines.push({ colour: COL[r.system], width: r.system === "waste" ? 4 : 3, dashed: (path[i - 1][2] + path[i][2]) / 2 < -0.02, p: [...a, ...b] })
      else pipe(a, b, r.dn / 2000, r.system === "waste" ? "svc-pvc" : "svc-ppr", 12)
    }
    SVC.tags = C.water.points.filter((p) => p.at)
  }
  if (VIEW === "electric") {
    // each circuit up from the board into the ceiling, along its own track across the room, then down to its points
    const E = C.electric, B = E.board, top = B.h + B.hh / 2
    const runTo = (k, p, colour) => {
      const yt = E.track0 - k * 0.06
      const pts = [[B.x + (k - 5) * 0.025, B.y, top], [B.x + (k - 5) * 0.025, B.y, CEH], [B.x + (k - 5) * 0.025, yt, CEH], [p.at[0], yt, CEH], [p.at[0], p.at[1], CEH], p.at]
      for (let i = 1; i < pts.length; i++) {
        const [a, b] = [P3(pts[i - 1]), P3(pts[i])]
        if (a.every((v, j) => Math.abs(v - b[j]) < 1e-3)) continue
        if (LINE) SVC.lines.push({ colour, width: 3, dashed: false, p: [...a, ...b] })
        else pipe(a, b, 0.01, "svc-conduit", 8)
      }
    }
    E.circuits.forEach((c, k) => {
      for (const p of E.points.filter((q) => q.circuit === c.id && q.at)) runTo(k, p, E.colours[c.group])
    })
    for (const p of E.points.filter((q) => q.control && q.at)) runTo(E.circuits.length, p, E.colours.spare)
    SVC.tags = E.points.filter((p) => p.at)
  }
  SVCMARK = false
}

// the material of a service part: white in the line drawing with an ink outline, so it stands out of the grey fit-out
function svcMat(name) {
  if (LINE) {
    const m = new THREE.MeshBasicMaterial({ color: PAGE, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 })
    const ink = new THREE.Color(INK)
    m.userData.outlineParameters = { color: [ink.r, ink.g, ink.b] }
    return m
  }
  const std = (o) => new THREE.MeshStandardMaterial(o)
  return ({
    "svc-white": () => std({ color: "#f4f4f1", roughness: 0.4 }),
    "svc-opal": () => std({ color: "#fffaf0", emissive: "#fff2d8", emissiveIntensity: 0.7, roughness: 0.5 }),
    "svc-grey": () => std({ color: "#b4b8bc", roughness: 0.5 }),
    "svc-dark": () => std({ color: "#26272b", roughness: 0.4, metalness: 0.3 }),
    "svc-steel": () => std({ color: "#c9ccce", roughness: 0.3, metalness: 0.85 }),
    "svc-yellow": () => std({ color: "#f2c230", roughness: 0.45 }),
    "svc-red": () => std({ color: "#c62a1f", roughness: 0.4 }),
    "svc-blue": () => std({ color: "#2d5fa8", roughness: 0.4 }),
    "svc-brass": () => std({ color: "#c39a45", roughness: 0.35, metalness: 0.8 }),
    "svc-ppr": () => std({ color: "#5f8f5a", roughness: 0.5 }), // PP-R supply pipe, green
    "svc-pvc": () => std({ color: "#8e9398", roughness: 0.55 }), // uPVC drain, grey
    "svc-conduit": () => std({ color: "#f1f0ec", roughness: 0.5 }),
    "svc-copper": () => std({ color: "#b8733f", roughness: 0.35, metalness: 0.8 }),
    "svc-lid": () => std({ color: "#6b6b6b", roughness: 0.9 }),
    "svc-trap": () => std({ color: "#4c5a52", roughness: 0.6 }),
  }[name] ?? (() => std({ color: "#cccccc" })))()
}

// warm light inside
if (!LINE) for (const x of [-1.6, 0, 1.6]) {
  const l = new THREE.PointLight(0xffc98a, HERO ? 3.2 : 2.0, 4.5, 2)
  l.position.set(x, Y1 - 0.4, 0); scene.add(l)
  if (HERO) { // pendants in the hero, where the roof holds them
    pipe([x, Y1 - 0.06, -0.05], [x, Y1 - 0.5, -0.05], 0.004, "black", 4)
    cyl(x, -0.05, 0.06, Y1 - 0.62, 0.12, "lamp", 16, 0.03)
  }
}

// ------------------------------------------------------------ camera
// a service view leaves the hatch wall out and opens the units, so the pipes and devices inside show
if (VIEW) for (const m of meshes) if (m.userData.tag) m.visible = false
// a piece on its own: everything else hidden
if (ITEM) for (const m of meshes) m.visible = m.userData.items.includes(ITEM)
const camera = new THREE.PerspectiveCamera(HERO ? 38 : ITEM ? 30 : 22, FW / FH, 0.3, 300)
if (ITEM) {
  // a three-quarter view from in front and a little above; a device looks out of its wall, a ceiling light down
  const p = [...C.water.points, ...C.electric.points].find((q) => q.item === ITEM || q.model === ITEM)
  // the work counter's units face the aisle, away from the hatch
  const f = { fridge: "-y", sink: "-y" }[ITEM] ?? (p?.item ? "" : p?.face ?? "")
  const [az, el] = f === "-y" ? [155, 18] : f === "-x" ? [-60, 15] : f === "down" ? [-25, -35] : [-25, 18]
  const bb = new THREE.Box3()
  for (const o of meshes) if (o.visible) bb.expandByObject(o)
  const target = bb.getCenter(new THREE.Vector3()), r = bb.getSize(new THREE.Vector3()).length() / 2
  const [a, e] = [THREE.MathUtils.degToRad(az), THREE.MathUtils.degToRad(el)]
  camera.position.set(target.x + 10 * r * Math.cos(e) * Math.sin(a), target.y + 10 * r * Math.sin(e), target.z + 10 * r * Math.cos(e) * Math.cos(a))
  camera.lookAt(target)
} else if (HERO) {
  // eye level on the lawn, front-left, the bar right of centre and open lawn bottom-left for the words
  camera.position.set(-6.5, 1.55, 9.5)
  camera.lookAt(new THREE.Vector3(-1.6, 1.55, 0))
  add(new THREE.SphereGeometry(150, 32, 16), "sky", { noEdges: true, keepUV: true })
  scene.fog = new THREE.Fog(0xe9dccb, 30, 140)
} else {
  // from the courtyard, raised so the inside shows over the counter
  const target = new THREE.Vector3(0, 1.1, 0.6)
  const [el, dist] = [THREE.MathUtils.degToRad(VIEW ? 24 : 46), 34]
  camera.position.set(-dist * Math.cos(el) * Math.sin(0.28), target.y + dist * Math.sin(el), target.z + dist * Math.cos(el) * Math.cos(0.28))
  camera.lookAt(target)
}
camera.updateMatrixWorld(); camera.updateProjectionMatrix()
scene.updateMatrixWorld(true)
if (!HERO) { // fit the frame to the model
  const bb = new THREE.Box3()
  for (const o of meshes) if (o.visible && !o.geometry.type.startsWith("Circle")) bb.expandByObject(o)
  let px = [Infinity, Infinity, -Infinity, -Infinity]
  for (const xx of [bb.min.x, bb.max.x]) for (const yy of [bb.min.y, bb.max.y]) for (const zz of [bb.min.z, bb.max.z]) {
    const p = new THREE.Vector3(xx, yy, zz).project(camera)
    const X = ((p.x + 1) / 2) * FW, Yp = ((1 - p.y) / 2) * FH
    px = [Math.min(px[0], X), Math.min(px[1], Yp), Math.max(px[2], X), Math.max(px[3], Yp)]
  }
  let w = (px[2] - px[0]) * 1.06, h = (px[3] - px[1]) * 1.1
  if (w / h > FW / FH) h = (w * FH) / FW; else w = (h * FW) / FH
  camera.setViewOffset(FW, FH, (px[0] + px[2]) / 2 - w / 2, (px[1] + px[3]) / 2 - h / 2, w, h)
}

// ------------------------------------------------------------ render
if (LINE) {
  // in a service view the fit-out drops to grey, so the service in ink and colour stands out
  const GREY = "#bab8b2", ink = new THREE.Color(VIEW ? GREY : INK)
  const edgeMat = (colour) => {
    const m = new LineMaterial({ color: colour, linewidth: 1.3, side: THREE.DoubleSide })
    m.resolution.set(FW, FH); m.userData.outlineParameters = { visible: false }
    return m
  }
  const lineMat = edgeMat(VIEW ? GREY : INK), svcLine = edgeMat(INK)
  for (const o of meshes) {
    if (o.userData.noEdges || !o.visible) continue
    const g = new LineSegmentsGeometry().fromEdgesGeometry(new THREE.EdgesGeometry(o.geometry, 30))
    const l = new LineSegments2(g, o.userData.svc ? svcLine : lineMat)
    l.matrixAutoUpdate = false; l.matrix.copy(o.matrixWorld)
    scene.add(l)
  }
  if (VIEW) {
    for (const r of SVC.lines) {
      const m = new LineMaterial({ color: r.colour, linewidth: r.width, dashed: r.dashed, dashSize: 0.1, gapSize: 0.07 })
      m.resolution.set(FW, FH); m.userData.outlineParameters = { visible: false }
      const l = new LineSegments2(new LineSegmentsGeometry().setPositions(r.p), m)
      if (r.dashed) { l.computeLineDistances(); m.depthTest = false } // hidden in the floor or the plinth: drawn through it
      scene.add(l)
    }
    window.TAGS = SVC.tags.map((p) => {
      const v = new THREE.Vector3(...P3(p.at)).project(camera)
      return { id: p.id, x: +((v.x + 1) / 2).toFixed(4), y: +((1 - v.y) / 2).toFixed(4), edge: "" }
    })
  }
  new OutlineEffect(renderer, { defaultThickness: 0.003, defaultColor: [ink.r, ink.g, ink.b] }).render(scene, camera)
} else {
  const pmrem = new THREE.PMREMGenerator(renderer)
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture
  scene.environmentIntensity = 0.4
  scene.add(new THREE.HemisphereLight(0xeef3ff, 0x8a7a5a, HERO ? 0.6 : 0.9))
  // low sun from the front left: late afternoon over the courtyard
  const sun = new THREE.DirectionalLight(HERO ? 0xffd9a8 : 0xfff0d8, HERO ? 3.0 : 2.6)
  sun.position.set(-10, HERO ? 5 : 9, 9)
  sun.castShadow = true
  sun.shadow.mapSize.set(4096, 4096)
  Object.assign(sun.shadow.camera, { left: -7, right: 7, top: 7, bottom: -7, near: 1, far: 50 })
  sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.02; sun.shadow.radius = 4
  scene.add(sun)
  if (ITEM) { // a piece on its own takes only its shadow, on the transparent ground
    const bb = new THREE.Box3()
    for (const o of meshes) if (o.visible) bb.expandByObject(o)
    const c = bb.getCenter(new THREE.Vector3())
    const g = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.ShadowMaterial({ opacity: 0.16 }))
    g.rotation.x = -Math.PI / 2; g.position.set(c.x, bb.min.y - 0.002, c.z); g.receiveShadow = true
    scene.add(g)
  }
  const composer = new EffectComposer(renderer)
  composer.setSize(FW, FH)
  composer.addPass(new RenderPass(scene, camera))
  const ao = new GTAOPass(scene, camera, FW, FH)
  ao.blendIntensity = 0.8
  ao.updateGtaoMaterial({ radius: 0.3, distanceExponent: 1.5, thickness: 1, scale: 1 })
  composer.addPass(ao)
  composer.addPass(new OutputPass())
  composer.render()
}
document.getElementById("out").src = renderer.domElement.toDataURL("image/png")
document.body.dataset.ready = "1"
</script>
</body>
</html>
