<!doctype html>
<!--
  /en/galley's 3D, in the pattern of the office's (scripts/site/render/office.html): the galley seen from the
  courtyard with its front wall and roof off, built from src/components/galley/galley.json (the numbers the 2D
  draws). The box follows the homepage model (scripts/site/render/compound.html): a teal 40 ft container with
  ribs on a stone plinth, two red doors with a glazed panel and two white-framed windows along the front. The
  fit-out is a working kitchen: stainless steel benches and equipment, white wipe-clean linings, a grey resin
  floor. Rendered two ways:

    ?mode=line  line drawing on a transparent ground   -> public/designs/galley/render/galley-line.png
    ?mode=real  materials, daylight and shadow         -> public/designs/galley/render/galley-real.webp
    &hero=1     real mode, front wall and roof on, from eye level in the courtyard, 2400 x 1340 -> the stand-in galley-hero.jpg

  Serve the repo root on a spare port, open this page at 2400 x 1000, and once body[data-ready] is set
  save the data URL in #out (scripts/site/render.mjs does both).
-->
<html>
<head>
<meta charset="utf-8">
<style>
html,body{margin:0;background:#fff}
#out{display:block;width:2400px;height:auto}
</style>
<script type="importmap">
{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}
</script>
</head>
<body>
<img id="out" alt="">
<script type="module">
import * as THREE from "three"
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js"
import { OutlineEffect } from "three/addons/effects/OutlineEffect.js"
import { LineSegments2 } from "three/addons/lines/LineSegments2.js"
import { LineSegmentsGeometry } from "three/addons/lines/LineSegmentsGeometry.js"
import { LineMaterial } from "three/addons/lines/LineMaterial.js"
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js"
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js"
import { RenderPass } from "three/addons/postprocessing/RenderPass.js"
import { GTAOPass } from "three/addons/postprocessing/GTAOPass.js"
import { OutputPass } from "three/addons/postprocessing/OutputPass.js"

const Q = new URLSearchParams(location.search)
const LINE = Q.get("mode") !== "real"
const HERO = !LINE && Q.get("hero") === "1"
const [FW, FH] = HERO ? [2400, 1340] : [2400, 1000]
const C = await (await fetch(`/src/components/galley/galley.json?${Date.now()}`)).json()
const INK = "#2b2a26", PAGE = "#ffffff"
// plan (x right from the west end, y toward the front) -> three: x = x, y = height, z = y; the camera stands in
// the courtyard, at +z

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true })
renderer.setClearColor(0xffffff, 0)
renderer.setPixelRatio(1)
renderer.setSize(FW, FH)
renderer.outputColorSpace = THREE.SRGBColorSpace
if (!LINE) {
  renderer.toneMapping = THREE.ACESFilmicToneMapping
  renderer.shadowMap.enabled = true
  renderer.shadowMap.type = THREE.PCFSoftShadowMap
}
const scene = new THREE.Scene()

// ------------------------------------------------------------ procedural textures (real mode)
let seed = 7
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647)
function tex(draw, w = 512, h = 512) {
  const c = document.createElement("canvas"); c.width = w; c.height = h
  seed = 7
  draw(c.getContext("2d"), w, h)
  const t = new THREE.CanvasTexture(c)
  t.colorSpace = THREE.SRGBColorSpace
  t.wrapS = t.wrapT = THREE.RepeatWrapping
  t.anisotropy = 8
  return t
}
const T = LINE ? {} : {
  // the container's corrugation, as compound.html: light and shade across one pitch, a few streaks down it
  corr: tex((g, w, h) => {
    for (let x = 0; x < w; x++) {
      const p = x / w
      const v = p < 0.3 ? 0.95 : p < 0.42 ? 0.95 - (p - 0.3) * 2.2 : p < 0.72 ? 0.69 : p < 0.84 ? 0.69 + (p - 0.72) * 1.5 : 0.87
      g.fillStyle = `rgb(${Math.round(255 * v)},${Math.round(255 * v)},${Math.round(255 * v)})`
      g.fillRect(x, 0, 1, h)
    }
    for (let i = 0; i < 40; i++) {
      g.fillStyle = `rgba(30,50,50,${0.02 + rnd() * 0.04})`
      g.fillRect(rnd() * w, rnd() * h * 0.3, 1 + rnd() * 3, h * (0.3 + rnd() * 0.7))
    }
  }, 64, 256),
  // fieldstone in darker mortar for the plinth and the steps, as compound.html and the bar's
  stone: tex((g, w, h) => {
    g.fillStyle = "#6c6358"; g.fillRect(0, 0, w, h)
    for (let i = 0; i < 160; i++) {
      const x = rnd() * w, y = rnd() * h, rx = 14 + rnd() * 30, ry = 10 + rnd() * 20, tone = rnd()
      g.fillStyle = tone > 0.66 ? "#a8957a" : tone > 0.33 ? "#9a9184" : "#857a6b"
      g.beginPath(); g.ellipse(x, y, rx, ry, rnd() * Math.PI, 0, Math.PI * 2); g.fill()
    }
  }),
  // brushed stainless: fine streaks along the piece
  brushed: tex((g, w, h) => {
    g.fillStyle = "#d3d6d8"; g.fillRect(0, 0, w, h)
    for (let i = 0; i < 700; i++) {
      g.fillStyle = rnd() > 0.5 ? `rgba(255,255,255,${0.05 + rnd() * 0.08})` : `rgba(70,74,80,${0.04 + rnd() * 0.06})`
      g.fillRect(0, rnd() * h, w, 1)
    }
  }, 64, 512),
  // the grey resin floor, a fine non-slip grit
  resin: tex((g, w, h) => {
    g.fillStyle = "#7d7871"; g.fillRect(0, 0, w, h)
    for (let i = 0; i < 14000; i++) {
      g.fillStyle = rnd() > 0.5 ? "rgba(255,255,255,0.09)" : "rgba(45,42,38,0.1)"
      g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 1.5, 1 + rnd() * 1.5)
    }
  }),
  grass: tex((g, w, h) => {
    g.fillStyle = "#6f9a4a"; g.fillRect(0, 0, w, h)
    for (let i = 0; i < 26000; i++) {
      g.fillStyle = rnd() > 0.5 ? "rgba(170,200,110,0.35)" : "rgba(40,70,30,0.35)"
      g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 2, 1 + rnd() * 2)
    }
  }),
  // the hero's sky: daylight blue, paler to a soft haze at the horizon (the hero sees about 20 degrees of it)
  sky: tex((g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h)
    gr.addColorStop(0, "#3f7fc4"); gr.addColorStop(0.36, "#78a9da"); gr.addColorStop(0.45, "#bcd3e8"); gr.addColorStop(0.5, "#e2e9ee"); gr.addColorStop(1, "#e2e9ee")
    g.fillStyle = gr; g.fillRect(0, 0, w, h)
  }, 16, 512),
}
// metres one tile covers [along, across]
const TILE = { teal: [0.278, 2.6], stone: [1, 1], steel: [1.2, 0.6], floor: [2, 2] }

// ------------------------------------------------------------ materials
const TEAL = "#3e8a86" // compound.html's teal
// thin parts get crease lines but no silhouette, so legs, taps, frames and handles stay fine in the line drawing
const THIN = new Set(["red", "white-frame", "leg", "black", "wire"])
const MAT = {}
function mat(name) {
  if (MAT[name]) return MAT[name]
  if (name === "rib") { // the corrugations: the wall's paint, no silhouette in the line drawing
    if (!LINE) return (MAT[name] = mat("teal"))
    const m = new THREE.MeshBasicMaterial({ color: PAGE, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 })
    m.userData.outlineParameters = { visible: false }
    return (MAT[name] = m)
  }
  let x
  if (LINE) {
    x = new THREE.MeshBasicMaterial({ color: PAGE, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 })
    if (name === "glass") x = new THREE.MeshBasicMaterial({ color: PAGE, transparent: true, opacity: 0, depthWrite: false })
    if (THIN.has(name)) x.userData.outlineParameters = { visible: false }
  } else {
    const std = (o) => new THREE.MeshStandardMaterial(o)
    x = {
      teal: () => std({ map: T.corr, color: TEAL, roughness: 0.55, metalness: 0.15 }),
      frame: () => std({ color: new THREE.Color(TEAL).multiplyScalar(0.86), roughness: 0.5, metalness: 0.2 }),
      stone: () => std({ map: T.stone, roughness: 0.95 }),
      door: () => std({ color: "#a62b22", roughness: 0.5, metalness: 0.2 }), // the doors, red as the homepage's
      red: () => std({ color: "#7e2f26", roughness: 0.45, metalness: 0.35 }), // the doors' frames
      "white-frame": () => std({ color: "#f1f0eb", roughness: 0.4 }), // the windows' frames
      wall: () => std({ color: "#f3f3f0", roughness: 0.42 }), // white wipe-clean panels
      floor: () => std({ map: T.resin, roughness: 0.75 }),
      steel: () => std({ map: T.brushed, roughness: 0.34, metalness: 0.82 }), // stainless, brushed
      leg: () => std({ color: "#bfc3c6", roughness: 0.3, metalness: 0.85 }),
      wire: () => std({ color: "#c4c8cb", roughness: 0.35, metalness: 0.8 }),
      plate: () => std({ color: "#3c3d40", roughness: 0.45, metalness: 0.7 }), // the griddle's steel plate
      black: () => std({ color: "#232427", roughness: 0.55, metalness: 0.2 }),
      ring: () => std({ color: "#1c1d1f", roughness: 0.6, metalness: 0.3 }),
      oil: () => std({ color: "#b98a2f", roughness: 0.12, metalness: 0.1 }),
      white: () => std({ color: "#f4f3ef", roughness: 0.35 }), // plates, bowls, tubs, the dispensers
      locker: () => std({ color: "#e9eae6", roughness: 0.45, metalness: 0.2 }), // the cleaning cupboard, powder-coated
      sack: () => std({ color: "#d9cba9", roughness: 0.95 }),
      box: () => std({ color: "#c7a77d", roughness: 0.9 }), // cardboard
      jar: () => std({ color: "#e3c98a", roughness: 0.2 }),
      can: () => std({ color: "#e2b73a", roughness: 0.5 }), // oil in yellow cans
      crate: () => std({ color: "#b98250", roughness: 0.8 }), // timber crates for the harvest
      board: () => std({ color: "#e8ebe4", roughness: 0.6 }), // chopping boards
      leaf: () => std({ color: "#4f7a33", roughness: 0.8 }),
      cabbage: () => std({ color: "#9cbc68", roughness: 0.75 }),
      tomato: () => std({ color: "#c0432a", roughness: 0.45 }),
      carrot: () => std({ color: "#dd7a2c", roughness: 0.6 }),
      onion: () => std({ color: "#8c4a5a", roughness: 0.5 }),
      egg: () => std({ color: "#efe0c2", roughness: 0.5 }),
      tray: () => std({ color: "#cbb896", roughness: 0.95 }), // the egg tray, moulded fibre
      fruit: () => std({ color: "#e0a23a", roughness: 0.5 }),
      food: () => std({ color: "#c98b3e", roughness: 0.7 }), // a plated dinner
      greens: () => std({ color: "#5f8a3a", roughness: 0.8 }),
      apron: () => std({ color: "#3a4a5c", roughness: 0.9 }),
      bin: () => std({ color: "#5c6a60", roughness: 0.55 }),
      extinguisher: () => std({ color: "#b3261e", roughness: 0.4, metalness: 0.2 }),
      lamp: () => std({ color: "#fff1dc", roughness: 0.3, emissive: "#ff9e52", emissiveIntensity: 1.6 }), // the heat lamps
      lawn: () => std({ map: T.grass, roughness: 1 }),
      sky: () => new THREE.MeshBasicMaterial({ map: T.sky, side: THREE.BackSide, fog: false, toneMapped: false }),
      glass: () => new THREE.MeshPhysicalMaterial({ color: "#d3e3e8", roughness: 0.05, metalness: 0.1, transparent: true, opacity: 0.3, depthWrite: false }),
    }[name]?.() ?? std({ color: "#cccccc", roughness: 0.8 })
  }
  return (MAT[name] = x)
}

// ------------------------------------------------------------ geometry helpers (metres)
const meshes = []
// texture coordinates at true scale: each face takes the texture from its own plane; with grain, along the
// piece's longest side (the stainless), without it u runs along the wall (the corrugations)
function worldUV(geo, [tu, tv], grain = true) {
  const pos = geo.attributes.position, nrm = geo.attributes.normal, uv = geo.attributes.uv
  if (!uv) return
  geo.computeBoundingBox()
  const size = geo.boundingBox.getSize(new THREE.Vector3()).toArray()
  const long = size.indexOf(Math.max(...size))
  for (let i = 0; i < pos.count; i++) {
    const n = [Math.abs(nrm.getX(i)), Math.abs(nrm.getY(i)), Math.abs(nrm.getZ(i))]
    const axis = n.indexOf(Math.max(...n))
    const p = [pos.getX(i), pos.getY(i), pos.getZ(i)]
    let [a, b] = axis === 0 ? [2, 1] : axis === 2 ? [0, 1] : [0, 2]
    if (grain && b === long) [a, b] = [b, a] // the grain along the piece
    uv.setXY(i, p[a] / tu, p[b] / tv)
  }
  uv.needsUpdate = true
}
function add(geo, name, opts = {}) {
  const tile = TILE[name === "rib" ? "teal" : name]
  if (!LINE && tile) worldUV(geo, tile, name !== "teal" && name !== "rib")
  const mesh = new THREE.Mesh(geo, mat(name))
  mesh.castShadow = !LINE && !["glass", "lawn", "sky"].includes(name) && !opts.noShadow
  mesh.receiveShadow = !LINE && name !== "sky"
  if (opts.pos) mesh.position.set(...opts.pos)
  if (opts.rot) mesh.rotation.set(...opts.rot)
  if (opts.noEdges) mesh.userData.noEdges = true
  scene.add(mesh)
  meshes.push(mesh)
  return mesh
}
// a box over a plan rectangle (x, z in any order), from height y0 to y1. Geometry is built in place, so the
// textures land at world scale
function blk(xa, za, xb, zb, y0, y1, name, opts) {
  const [x0, x1, z0, z1] = [Math.min(xa, xb), Math.max(xa, xb), Math.min(za, zb), Math.max(za, zb)]
  const g = new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0)
  g.translate((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2)
  return add(g, name, opts)
}
function soft(xa, za, xb, zb, y0, y1, r, name) {
  const [x0, x1, z0, z1] = [Math.min(xa, xb), Math.max(xa, xb), Math.min(za, zb), Math.max(za, zb)]
  return add(new RoundedBoxGeometry(x1 - x0, y1 - y0, z1 - z0, 4, r), name, { pos: [(x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2] })
}
function cyl(x, z, r, y0, h, name, seg = 24, rTop = r) {
  return add(new THREE.CylinderGeometry(rTop, r, h, seg), name, { pos: [x, y0 + h / 2, z] })
}
function pipe(a, b, r, name, seg = 8) {
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b)
  const mesh = add(new THREE.CylinderGeometry(r, r, A.distanceTo(B), seg), name, { pos: A.clone().add(B).multiplyScalar(0.5).toArray() })
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), B.sub(A).normalize())
  return mesh
}
// a knob on a front face that looks toward +z
const knob = (x, y, z) => add(new THREE.CylinderGeometry(0.022, 0.022, 0.03, 12), "black", { pos: [x, y, z + 0.015], rot: [Math.PI / 2, 0, 0] })
function ball(x, y, z, r, name, seg = 10) {
  return add(new THREE.SphereGeometry(r, seg, Math.max(6, seg - 2)), name, { pos: [x, y, z] })
}

// ------------------------------------------------------------ the plinth, the steps, the box
const { container: K, front: FR, worktop: WT, basin: BA, hooks: HK, cold: CO, dry: DR, line: LN, hood: HD,
  bench: BE, pass: PA, cleaning: CL, bins: BI, plates: PL, fire: FI } = C
const L = K.l, H = K.w / 2, Y0 = K.plinth, HC = K.h, TOP = Y0 + HC
const FL = Y0 + K.floor, CE = Y0 + K.ceiling // inside: the finished floor, the ceiling
const { x0: ix0, x1: ix1, y0: iz0, y1: iz1 } = K.inner
if (!LINE) {
  T.grass.repeat.set(HERO ? 20 : 10, HERO ? 20 : 10)
  add(new THREE.CircleGeometry(HERO ? 60 : 30, 64), "lawn", { rot: [-Math.PI / 2, 0, 0], pos: [L / 2, 0, 1] })
}
blk(-0.1, -H - 0.1, L + 0.1, H + 0.1, 0, Y0, "stone") // the plinth, 100 mm proud all round
for (const [a, b] of FR.doors) {
  // two stone steps up to each door: the plinth's height, then the sill
  const { d, over } = FR.steps
  blk(a - over, H + 0.1, b + over, H + 0.1 + d, 0, Y0, "stone")
  blk(a - over, H + 0.1 + d, b + over, H + 0.1 + 2 * d, 0, Y0 / 2, "stone")
}
// the openings in the front wall, west to east: [from, to, bottom, top]
const OPEN = [...FR.doors.map(([a, b]) => [a, b, Y0 + FR.door[0], Y0 + FR.door[1]]),
  ...FR.windows.map(([a, b]) => [a, b, Y0 + FR.window[0], Y0 + FR.window[1]])].sort((p, q) => p[0] - q[0])
{
  // the container: floor, the back wall and both ends in teal steel with their corrugations outside, the corner
  // posts and rails in a deeper shade; the front wall and the roof off, so the kitchen shows (on in the hero)
  const e = 0.03
  blk(0, -H, L, H, Y0, Y0 + 0.14, "frame") // the bottom rails and floor bearers
  blk(0, -H, L, -H + e, Y0 + 0.14, TOP - 0.1, "teal")
  blk(0, -H, e, H, Y0 + 0.14, TOP - 0.1, "teal")
  blk(L - e, -H, L, H, Y0 + 0.14, TOP - 0.1, "teal")
  for (const x of [0, L - 0.15]) for (const z of [-H, H - 0.15]) blk(x, z, x + 0.15, z + 0.15, Y0, TOP, "frame")
  blk(0, -H, L, -H + 0.12, TOP - 0.1, TOP, "frame")
  for (const x of [0, L - 0.12]) blk(x, -H, x + 0.12, H, TOP - 0.1, TOP, "frame")
  // ribs: along the back wall outside, and across both end walls
  for (let a = 0.35; a <= L - 0.35; a += 0.278) blk(a - 0.04, -H - 0.03, a + 0.04, -H + 0.005, Y0 + 0.16, TOP - 0.12, "rib")
  for (const x of [-0.03, L - 0.005]) for (let a = -H + 0.3; a <= H - 0.3; a += 0.278) blk(x, a - 0.04, x + 0.035, a + 0.04, Y0 + 0.16, TOP - 0.12, "rib")
  // inside: the floor, white linings on the back and both ends
  blk(ix0 - 0.07, iz0 - 0.07, ix1 + 0.07, H, Y0 + 0.14, FL, "floor")
  blk(e, iz0 - 0.06, L - e, iz0, FL, CE, "wall")
  blk(e, iz0, ix0, iz1 + 0.07, FL, CE, "wall")
  blk(ix1, iz0, L - e, iz1 + 0.07, FL, CE, "wall")
  // the front's bottom rail, the threshold the doors close on
  blk(0, H - 0.1, L, H, Y0 + 0.14, FL + 0.01, "frame")
}

// ------------------------------------------------------------ the front wall, the doors, the windows and the roof (hero)
if (HERO) {
  // the wall cut for the openings: the steel skin outside, the white lining inside; the reveals show both
  const wall = (z0, z1, y0, y1, name) => {
    let x = 0.15
    for (const [a, b, lo, hi] of OPEN) {
      blk(x, z0, a, z1, y0, y1, name)
      if (lo - y0 > 0.03) blk(a, z0, b, z1, y0, lo, name)
      blk(a, z0, b, z1, hi, y1, name)
      x = b
    }
    blk(x, z0, L - 0.15, z1, y0, y1, name)
  }
  wall(H - 0.03, H, Y0 + 0.14, TOP - 0.1, "teal")
  wall(iz1, H - 0.03, FL, CE, "wall")
  blk(0, H - 0.12, L, H, TOP - 0.1, TOP, "frame") // the front top rail
  blk(0.02, -H + 0.02, L - 0.02, H - 0.02, TOP - 0.06, TOP - 0.02, "teal") // the roof
  blk(ix0, iz0, ix1, iz1, CE, CE + 0.02, "wall") // the ceiling
  // ribs along the front, skipped at the openings, as compound.html
  for (let a = 0.35; a <= L - 0.35; a += 0.278) {
    if (OPEN.some(([o0, o1]) => a > o0 - 0.1 && a < o1 + 0.1)) continue
    blk(a - 0.04, H - 0.005, a + 0.04, H + 0.03, Y0 + 0.16, TOP - 0.12, "rib")
  }
  // the doors as the homepage draws them: red steel leaves with a glazed upper panel in red frames, shut; the
  // handle on the side away from the hinge (the staff door hinges west, the service door east)
  FR.doors.forEach(([a, b], k) => {
    const [lo, hi] = [Y0 + FR.door[0], Y0 + FR.door[1]]
    const [g0, g1, p0, p1] = [a + 0.18, b - 0.18, lo + (hi - lo) * 0.55, hi - 0.2]
    const leaf = (x0, x1, y0, y1) => blk(x0, H - 0.07, x1, H - 0.025, y0, y1, "door")
    leaf(a, b, lo, p0); leaf(a, b, p1, hi); leaf(a, g0, p0, p1); leaf(g1, b, p0, p1)
    blk(g0, H - 0.05, g1, H - 0.045, p0, p1, "glass")
    const hx = k === 0 ? b - 0.1 : a + 0.1
    blk(hx - 0.02, H - 0.025, hx + 0.02, H + 0.01, lo + 0.98, lo + 1.06, "black")
    blk(k === 0 ? hx - 0.13 : hx - 0.02, H + 0.01, k === 0 ? hx + 0.02 : hx + 0.13, H + 0.035, lo + 1.0, lo + 1.03, "black")
    blk(a - 0.06, H, a, H + 0.055, lo, hi + 0.06, "red"); blk(b, H, b + 0.06, H + 0.055, lo, hi + 0.06, "red")
    blk(a, H, b, H + 0.055, hi, hi + 0.06, "red")
  })
  // the windows: white frames proud of the wall, a sill, the mullion between the two panes
  for (const [a, b] of FR.windows) {
    const [lo, hi] = [Y0 + FR.window[0], Y0 + FR.window[1]], m = (a + b) / 2
    blk(a, H - 0.06, b, H - 0.05, lo, hi, "glass")
    blk(a - 0.06, H, a, H + 0.055, lo - 0.06, hi + 0.06, "white-frame"); blk(b, H, b + 0.06, H + 0.055, lo - 0.06, hi + 0.06, "white-frame")
    blk(a, H, b, H + 0.055, hi, hi + 0.06, "white-frame")
    blk(a - 0.08, H, b + 0.08, H + 0.08, lo - 0.06, lo, "white-frame")
    blk(m - 0.03, H - 0.06, m + 0.03, H + 0.03, lo, hi, "white-frame")
    for (const x of [a + 0.02, b - 0.02]) blk(x - 0.02, H - 0.07, x + 0.02, H - 0.03, lo, hi, "white-frame")
    blk(a, H - 0.07, b, H - 0.03, hi - 0.04, hi, "white-frame"); blk(a, H - 0.07, b, H - 0.03, lo, lo + 0.04, "white-frame")
  }
  // the extract out through the roof: the duct, a curb and an upblast fan over the hood
  const [fx, fz] = [(HD.x0 + HD.x1) / 2, iz0 + 0.35]
  blk(fx - 0.3, fz - 0.3, fx + 0.3, fz + 0.3, TOP - 0.02, TOP + HD.fan.curb, "steel")
  cyl(fx, fz, HD.fan.r * 0.9, TOP + HD.fan.curb, 0.06, "leg", 32)
  cyl(fx, fz, HD.fan.r, TOP + HD.fan.curb + 0.06, HD.fan.h - 0.06, "steel", 32, HD.fan.r * 0.78)
  cyl(fx, fz, HD.fan.r * 0.6, TOP + HD.fan.curb + HD.fan.h, 0.03, "black", 32)
}

// ------------------------------------------------------------ the long worktop under the windows, its two sinks
{
  const { x0, x1, d, h, t, shelf, sinks } = WT, z0 = iz1 - d, z1 = iz1, top = FL + h
  const bowls = sinks.map((s) => ({ ...s, a: s.x - s.w / 2, b: s.x + s.w / 2, c0: z0 + (d - s.d) / 2, c1: z0 + (d - s.d) / 2 + s.d }))
  // the stainless top, cut round the bowls, its front edge turned down along the aisle
  let x = x0
  for (const s of bowls) {
    blk(x, z0, s.a, z1, top - t, top, "steel")
    blk(s.a, z0, s.b, s.c0, top - t, top, "steel"); blk(s.a, s.c1, s.b, z1, top - t, top, "steel")
    x = s.b
  }
  blk(x, z0, x1, z1, top - t, top, "steel")
  blk(x0, z0, x1, z0 + 0.012, top - 0.07, top - t, "steel")
  if (HERO) blk(x0, z1 - 0.012, x1, z1, top, top + WT.upstand, "steel") // the upstand, on the front wall
  // each bowl a deep box hung under its cut-out, the waste down into the floor, a mixer tap on the back edge
  for (const s of bowls) {
    const y = top - s.depth
    blk(s.a, s.c0, s.b, s.c1, y - 0.012, y, "steel")
    blk(s.a, s.c0, s.a + 0.012, s.c1, y, top - t, "steel"); blk(s.b - 0.012, s.c0, s.b, s.c1, y, top - t, "steel")
    blk(s.a + 0.012, s.c0, s.b - 0.012, s.c0 + 0.012, y, top - t, "steel"); blk(s.a + 0.012, s.c1 - 0.012, s.b - 0.012, s.c1, y, top - t, "steel")
    cyl(s.x, (s.c0 + s.c1) / 2, 0.03, FL, y - 0.012 - FL, "leg", 12)
    const tz = z1 - 0.04
    cyl(s.x, tz, 0.024, top, 0.34, "leg", 12)
    pipe([s.x, top + 0.34, tz], [s.x, top + 0.34, tz - 0.24], 0.014, "leg")
    pipe([s.x, top + 0.34, tz - 0.24], [s.x, top + 0.27, tz - 0.24], 0.014, "leg")
    if (s.id === "wash") {
      // the pre-rinse spray: a riser beside the tap, an arm out over the bowl, the hose down to the spray head
      const rx = s.b - 0.08
      cyl(rx, tz, 0.016, top, 1.0, "leg", 10)
      pipe([rx, top + 1.0, tz], [rx, top + 1.0, tz - 0.24], 0.012, "leg")
      pipe([rx, top + 1.0, tz - 0.24], [rx, top + 0.5, tz - 0.24], 0.01, "black")
      cyl(rx, tz - 0.24, 0.028, top + 0.4, 0.1, "leg", 12)
    }
  }
  // stainless legs at 1.3 m or less along both edges, the undershelf between the sinks
  const stops = [x0 + 0.04, ...bowls.flatMap((s) => [s.a - 0.05, s.b + 0.05]), x1 - 0.04]
  for (let i = 0; i < stops.length; i += 2) {
    const [a, b] = [stops[i], stops[i + 1]], n = Math.ceil((b - a) / 1.3)
    for (let k = 0; k <= n; k++) for (const z of [z0 + 0.05, z1 - 0.05]) {
      const lx = a + ((b - a) * k) / n
      blk(lx - 0.02, z - 0.02, lx + 0.02, z + 0.02, FL, top - t, "leg")
    }
    blk(a - 0.02, z0 + 0.03, b + 0.02, z1 - 0.03, FL + shelf - 0.02, FL + shelf, "steel")
  }
  // on the harvest bench by the staff door: the morning's picking in two timber crates, greens and tomatoes
  const crate = (cx, greens) => {
    const [a, b, c0, c1] = [cx - 0.27, cx + 0.27, z0 + 0.1, z0 + 0.46]
    blk(a, c0, b, c1, top, top + 0.02, "crate")
    for (const [p, q, r, s] of [[a, a + 0.02, c0, c1], [b - 0.02, b, c0, c1], [a, b, c0, c0 + 0.02], [a, b, c1 - 0.02, c1]]) blk(p, r, q, s, top, top + 0.22, "crate")
    if (LINE) return
    for (let i = 0; i < 4; i++) for (let j = 0; j < 3; j++) {
      const [px, pz] = [a + 0.08 + i * 0.125, c0 + 0.07 + j * 0.11]
      if (greens) ball(px, top + 0.17, pz, 0.075, (i + j) % 2 ? "cabbage" : "leaf", 8)
      else ball(px, top + 0.16, pz, 0.045, (i * 3 + j) % 4 ? "tomato" : "onion", 8)
    }
  }
  crate(x0 + 0.35, true)
  crate(x0 + 0.95, false)
  // under the harvest bench, more crates; under the prep bench, pots and tubs; under the dish drop, wash racks
  for (const cx of [x0 + 0.35, x0 + 0.95]) {
    blk(cx - 0.27, z0 + 0.1, cx + 0.27, z0 + 0.46, FL + shelf, FL + shelf + 0.2, "crate")
    if (!LINE) for (let i = 0; i < 4; i++) ball(cx - 0.18 + i * 0.12, FL + shelf + 0.2, z0 + 0.28, 0.05, i % 2 ? "carrot" : "onion", 8)
  }
  const px0 = bowls[0].b
  for (const [cx, r, hh] of [[px0 + 0.5, 0.19, 0.3], [px0 + 1.1, 0.16, 0.22], [px0 + 1.6, 0.13, 0.16]]) {
    cyl(cx, z0 + 0.3, r, FL + shelf, hh, "steel", 24)
    if (cx === px0 + 0.5) cyl(cx, z0 + 0.3, r + 0.01, FL + shelf + hh, 0.02, "steel", 24) // its lid
  }
  for (let k = 0; k < 3; k++) soft(px0 + 2.1 + k * 0.36, z0 + 0.12, px0 + 2.42 + k * 0.36, z0 + 0.5, FL + shelf, FL + shelf + 0.2, 0.015, "white")
  // on the prep bench: chopping boards, a bowl of chopped greens, onions and tomatoes waiting
  for (const cx of [px0 + 0.75, px0 + 1.9]) blk(cx - 0.25, z0 + 0.12, cx + 0.25, z0 + 0.47, top, top + 0.02, "board")
  cyl(px0 + 2.75, z0 + 0.28, 0.16, top, 0.11, "steel", 24, 0.19)
  if (!LINE) {
    cyl(px0 + 2.75, z0 + 0.28, 0.165, top + 0.08, 0.02, "greens", 24)
    for (const [dx, dz, n] of [[0.62, 0.22, "onion"], [0.82, 0.32, "onion"], [0.95, 0.2, "tomato"], [1.75, 0.3, "carrot"]]) ball(px0 + dx, top + 0.06, z0 + dz, 0.04, n, 8)
  }
  // the dish drop: two wash racks, one of plates standing to drain, and a stack waiting by the door
  const dx0 = bowls[1].b
  for (const k of [0, 1]) {
    const a = dx0 + 0.12 + k * 0.56
    blk(a, z0 + 0.06, a + 0.5, z0 + 0.56, top, top + 0.012, "wire")
    for (const [p, q, r, s] of [[a, a + 0.012, z0 + 0.06, z0 + 0.56], [a + 0.488, a + 0.5, z0 + 0.06, z0 + 0.56], [a, a + 0.5, z0 + 0.06, z0 + 0.072], [a, a + 0.5, z0 + 0.548, z0 + 0.56]]) blk(p, r, q, s, top, top + 0.1, "wire")
    if (k === 0) for (let i = 0; i < (LINE ? 4 : 7); i++) {
      const plate = add(new THREE.CylinderGeometry(0.12, 0.12, 0.014, 24), "white", { pos: [a + 0.1 + i * (LINE ? 0.1 : 0.05), top + 0.13, z0 + 0.31], rot: [0, 0, Math.PI / 2] })
      plate.userData.noEdges = !LINE
    }
  }
  for (let i = 0; i < 6; i++) cyl(x1 - 0.14, z0 + 0.3, 0.12, top + i * 0.016, 0.014, "white", 24)
  // under the dish drop, the spare racks
  for (let i = 0; i < 2; i++) blk(dx0 + 0.15, z0 + 0.06, dx0 + 0.65, z0 + 0.56, FL + shelf + i * 0.11, FL + shelf + 0.1 + i * 0.11, "wire")
}

// ------------------------------------------------------------ the staff door's corner: the hand-wash basin, soap, towels, apron hooks
{
  const { x0, x1, d, h } = BA, z0 = iz1 - d, z1 = iz1, top = FL + h, cx = (x0 + x1) / 2
  // a stainless basin on a pedestal: its bowl, the rim, the hands-free spout from the back
  blk(x0, z0, x1, z1, top - 0.16, top - 0.15, "steel")
  for (const [a, b, c, e] of [[x0, x0 + 0.03, z0, z1], [x1 - 0.03, x1, z0, z1], [x0, x1, z0, z0 + 0.03], [x0, x1, z1 - 0.03, z1]]) blk(a, c, b, e, top - 0.15, top, "steel")
  blk(x0, z0, x1, z0 + 0.015, top - 0.32, top - 0.15, "steel") // the knee panel
  cyl(cx, (z0 + z1) / 2, 0.05, FL, top - 0.32 - FL, "steel", 16)
  pipe([cx, top + 0.12, z1 - 0.02], [cx, top + 0.12, z1 - 0.16], 0.012, "leg")
  cyl(cx, z1 - 0.02, 0.02, top, 0.12, "leg", 10)
  // on the end wall: the paper towels and the soap
  blk(ix0, 0.45, ix0 + 0.1, 0.72, FL + 1.05, FL + 1.4, "white")
  blk(ix0, 0.82, ix0 + 0.08, 0.94, FL + 1.12, FL + 1.32, "white")
  // the apron hooks, and two aprons hanging
  blk(ix0, HK.y0, ix0 + 0.02, HK.y1, FL + HK.h - 0.03, FL + HK.h + 0.03, "leg")
  for (const y of [HK.y0 + 0.1, HK.y1 - 0.1]) {
    pipe([ix0 + 0.02, FL + HK.h, y], [ix0 + 0.07, FL + HK.h + 0.03, y], 0.008, "leg")
    blk(ix0 + 0.02, y - 0.15, ix0 + 0.035, y + 0.15, FL + HK.h - 0.75, FL + HK.h - 0.02, "apron")
  }
}

// ------------------------------------------------------------ cold storage across from the staff door: the freezer, the two-door fridge
for (const u of CO.units) {
  const z0 = iz0, z1 = iz0 + CO.d, [a, b] = [u.x0 + 0.005, u.x1 - 0.005]
  for (const lx of [a + 0.05, b - 0.05]) for (const lz of [z0 + 0.08, z1 - 0.08]) cyl(lx, lz, 0.022, FL, 0.1, "leg", 10)
  blk(a, z0, b, z1 - 0.03, FL + 0.1, FL + CO.h, "steel")
  const dw = (b - a) / u.doors
  for (let k = 0; k < u.doors; k++) {
    const [d0, d1] = [a + k * dw + 0.004, a + (k + 1) * dw - 0.004]
    blk(d0, z1 - 0.03, d1, z1, FL + 0.12, FL + CO.h - 0.14, "steel")
    const hx = u.doors === 1 || k === 0 ? d1 - 0.05 : d0 + 0.05 // handles at the free edge
    blk(hx - 0.012, z1, hx + 0.012, z1 + 0.035, FL + 0.95, FL + 1.45, "black")
  }
  blk(a, z1 - 0.03, b, z1, FL + CO.h - 0.13, FL + CO.h - 0.02, "black") // the control strip
}

// ------------------------------------------------------------ the dry store: shelving, sacks below, tubs, oil, jars and tins above
{
  const { x0, x1, d, shelves } = DR, z0 = iz0, z1 = iz0 + d, top = FL + shelves.at(-1) + 0.05
  for (const x of [x0 + 0.015, (x0 + x1) / 2, x1 - 0.015]) for (const z of [z0 + 0.015, z1 - 0.015]) blk(x - 0.015, z - 0.015, x + 0.015, z + 0.015, FL, top, "leg")
  for (const y of shelves) blk(x0, z0, x1, z1, FL + y - 0.025, FL + y, "steel")
  // each shelf draws its own sequence, so the line drawing and the render stock the shelves the same
  const row = (y, w, gap, put) => {
    seed = 11 + Math.round(y * 100)
    for (let x = x0 + 0.05; x + w < x1 - 0.04; x += w + gap) { if (rnd() < 0.12) { x += 0.1; continue } put(x, y) }
  }
  // sacks of rice, maize flour and beans on the bottom shelf
  row(FL + shelves[0], 0.44, 0.04, (x, y) => soft(x, z0 + 0.06, x + 0.44, z1 - 0.05, y, y + 0.22, 0.05, "sack"))
  // lidded tubs and cans of oil
  row(FL + shelves[1], 0.26, 0.05, (x, y) => (rnd() > 0.35 ? (cyl(x + 0.13, (z0 + z1) / 2, 0.13, y, 0.28, "white", 20), cyl(x + 0.13, (z0 + z1) / 2, 0.135, y + 0.28, 0.025, "white", 20))
    : blk(x + 0.03, z0 + 0.1, x + 0.23, z1 - 0.1, y, y + 0.3, "can")))
  // jars and tins
  row(FL + shelves[2], 0.1, 0.03, (x, y) => (rnd() > 0.5 ? cyl(x + 0.05, (z0 + z1) / 2 - 0.05, 0.05, y, 0.18, "jar", 14) : cyl(x + 0.05, (z0 + z1) / 2, 0.045, y, 0.12, "leg", 14)))
  // cartons and packets
  row(FL + shelves[3], 0.3, 0.04, (x, y) => blk(x, z0 + 0.06, x + 0.3, z1 - 0.06, y, y + 0.2 + rnd() * 0.1, "box"))
  // paper rolls and foil on top
  row(FL + shelves[4], 0.22, 0.06, (x, y) => blk(x, z0 + 0.08, x + 0.22, z1 - 0.08, y, y + 0.12, rnd() > 0.5 ? "white" : "box"))
}

// ------------------------------------------------------------ the cooking line under the hood: range, griddle, fryer
{
  const z0 = iz0, z1 = iz0 + LN.d, top = FL + LN.h
  blk(HD.x0, iz0, HD.x1, iz0 + 0.01, top, FL + HD.y0, "steel") // the splashback, up to the hood
  for (const u of LN.units) {
    const [a, b] = [u.x0 + 0.004, u.x1 - 0.004], cx = (a + b) / 2
    for (const lx of [a + 0.05, b - 0.05]) for (const lz of [z0 + 0.08, z1 - 0.08]) cyl(lx, lz, 0.022, FL, 0.12, "leg", 10)
    blk(a, z0 + 0.01, b, z1, FL + 0.12, top - 0.03, "steel")
    blk(a, z0 + 0.01, b, z1, top - 0.03, top, "steel")
    if (u.id === "range") {
      // six rings over an oven: the rings two rows of three, the oven door with its window and handle, knobs
      for (const k of [1, 3, 5]) for (const dz of [0.2, 0.44]) {
        const rx = a + ((b - a) * k) / 6
        cyl(rx, z0 + dz, 0.09, top, 0.012, "ring", 28)
        cyl(rx, z0 + dz, 0.035, top + 0.012, 0.006, "leg", 16)
      }
      blk(a + 0.06, z1, b - 0.06, z1 + 0.012, FL + 0.18, top - 0.16, "steel")
      blk(a + 0.2, z1 + 0.012, b - 0.2, z1 + 0.016, FL + 0.34, top - 0.3, "black")
      pipe([a + 0.14, top - 0.2, z1 + 0.05], [b - 0.14, top - 0.2, z1 + 0.05], 0.012, "leg")
      for (const x of [a + 0.14, b - 0.14]) pipe([x, top - 0.2, z1 + 0.012], [x, top - 0.2, z1 + 0.05], 0.008, "leg")
      for (const k of [1, 3, 5]) for (const s of [-1, 1]) knob(a + ((b - a) * k) / 6 + s * 0.06, top - 0.08, z1)
      // on the rings: a stockpot, a saucepan, a frying pan
      const [r1, r3] = [a + (b - a) / 6, a + ((b - a) * 3) / 6]
      cyl(r1, z0 + 0.2, 0.17, top + 0.012, 0.3, "steel", 28)
      for (const s of [-1, 1]) pipe([r1 + s * 0.17, top + 0.27, z0 + 0.2], [r1 + s * 0.22, top + 0.27, z0 + 0.2], 0.012, "leg")
      cyl(r3, z0 + 0.2, 0.11, top + 0.012, 0.13, "steel", 24)
      pipe([r3, top + 0.11, z0 + 0.31], [r3, top + 0.12, z0 + 0.52], 0.01, "black")
      cyl(a + ((b - a) * 5) / 6, z0 + 0.44, 0.13, top + 0.012, 0.05, "black", 24)
      pipe([a + ((b - a) * 5) / 6 + 0.12, top + 0.05, z0 + 0.5], [a + ((b - a) * 5) / 6 + 0.3, top + 0.08, z0 + 0.62], 0.012, "black")
    } else if (u.id === "griddle") {
      // a steel plate behind a grease channel, splash guards at the back and the sides, two knobs
      blk(a + 0.03, z0 + 0.04, b - 0.03, z1 - 0.1, top, top + 0.025, "plate")
      blk(a + 0.03, z1 - 0.1, b - 0.03, z1 - 0.05, top - 0.01, top + 0.012, "black")
      blk(a + 0.02, z0 + 0.02, b - 0.02, z0 + 0.04, top, top + 0.12, "steel")
      for (const x of [a + 0.02, b - 0.04]) blk(x, z0 + 0.04, x + 0.02, z1 - 0.12, top, top + 0.08, "steel")
      for (const s of [-1, 1]) knob(cx + s * 0.12, top - 0.08, z1)
    } else {
      // the fryer: the tank of oil, two baskets hung up to drain on the back rail, a knob
      blk(a + 0.05, z0 + 0.12, b - 0.05, z1 - 0.12, top - 0.01, top + 0.002, LINE ? "steel" : "oil")
      blk(a + 0.03, z0 + 0.03, b - 0.03, z0 + 0.06, top, top + 0.2, "steel")
      for (const k of [0, 1]) {
        const w = (b - a - 0.15) / 2, bx = a + 0.05 + k * (w + 0.05)
        blk(bx, z0 + 0.07, bx + w, z0 + 0.32, top + 0.06, top + 0.2, "wire")
        pipe([bx + w / 2, top + 0.15, z0 + 0.32], [bx + w / 2, top + 0.17, z0 + 0.52], 0.01, "black")
      }
      knob(cx, top - 0.08, z1)
    }
  }
}

// ------------------------------------------------------------ the canopy hood, its duct
{
  const { x0, x1, d, y0 } = HD, z0 = iz0, z1 = iz0 + d, y = FL + y0
  blk(x0, z0, x1, z1, y, CE, "steel")
  blk(x0 - 0.01, z1 - 0.04, x1 + 0.01, z1 + 0.01, y - 0.05, y, "steel") // the grease gutter round its lower edge
  for (const x of [x0 - 0.01, x1 - 0.04]) blk(x, z0, x + 0.05, z1, y - 0.05, y, "steel")
  const [fx, fz] = [(x0 + x1) / 2, iz0 + 0.35]
  blk(fx - HD.duct / 2, fz - HD.duct / 2, fx + HD.duct / 2, fz + HD.duct / 2, CE, TOP - 0.02, "steel")
}

// ------------------------------------------------------------ the cold bench: an undercounter fridge, breakfast's eggs and fruit on top
{
  const { x0, x1, d, h } = BE, z0 = iz0, z1 = iz0 + d, top = FL + h
  for (const lx of [x0 + 0.06, x1 - 0.06]) for (const lz of [z0 + 0.08, z1 - 0.08]) cyl(lx, lz, 0.022, FL, 0.1, "leg", 10)
  blk(x0 + 0.01, z0, x1 - 0.01, z1 - 0.03, FL + 0.1, top - 0.04, "steel")
  for (const k of [0, 1]) {
    const [d0, d1] = [x0 + 0.015 + k * (x1 - x0 - 0.03) / 2 + 0.004, x0 + 0.015 + (k + 1) * (x1 - x0 - 0.03) / 2 - 0.004]
    blk(d0, z1 - 0.03, d1, z1, FL + 0.13, top - 0.07, "steel")
    blk(d0 + 0.08, z1, d1 - 0.08, z1 + 0.03, top - 0.12, top - 0.1, "black")
  }
  blk(x0, z0, x1, z1, top - 0.04, top, "steel")
  // a tray of eggs, a bowl of fruit, a jug of milk
  blk(x0 + 0.12, z0 + 0.15, x0 + 0.42, z0 + 0.45, top, top + 0.03, "tray")
  if (!LINE) for (let i = 0; i < 6; i++) for (let j = 0; j < 5; j++) ball(x0 + 0.15 + i * 0.048, top + 0.05, z0 + 0.185 + j * 0.058, 0.022, "egg", 8).scale.y = 1.25
  cyl(x0 + 0.75, z0 + 0.3, 0.13, top, 0.1, "white", 24, 0.17)
  if (!LINE) for (const [dx, dz] of [[-0.06, -0.03], [0.06, 0.02], [0, 0.07], [0.02, -0.07]]) ball(x0 + 0.75 + dx, top + 0.12, z0 + 0.3 + dz, 0.05, "fruit", 10)
  cyl(x0 + 1.15, z0 + 0.3, 0.07, top, 0.22, "white", 20, 0.06)
}

// ------------------------------------------------------------ the pass: a heated cupboard, the gantry and its heat lamps, plates
{
  const { x0, x1, d, h, gantry, shelf } = PA, z0 = iz0, z1 = iz0 + d, top = FL + h
  for (const lx of [x0 + 0.06, x1 - 0.06]) for (const lz of [z0 + 0.08, z1 - 0.08]) cyl(lx, lz, 0.022, FL, 0.12, "leg", 10)
  blk(x0 + 0.01, z0, x1 - 0.01, z1 - 0.03, FL + 0.12, top - 0.03, "steel")
  // two sliding doors, one in front of the other, with recessed pulls
  const m = (x0 + x1) / 2
  blk(x0 + 0.03, z1 - 0.03, m + 0.04, z1 - 0.012, FL + 0.16, top - 0.08, "steel")
  blk(m - 0.04, z1 - 0.012, x1 - 0.03, z1, FL + 0.16, top - 0.08, "steel")
  blk(x0 + 0.07, z1 - 0.012, x0 + 0.17, z1 - 0.008, top - 0.24, top - 0.2, "black")
  blk(x1 - 0.17, z1, x1 - 0.07, z1 + 0.004, top - 0.24, top - 0.2, "black")
  blk(x0, z0, x1, z1, top - 0.03, top, "steel")
  for (const x of [x0 + 0.04, x1 - 0.04]) blk(x - 0.02, z0 + 0.02, x + 0.02, z0 + 0.06, top, FL + gantry, "leg")
  blk(x0, z0, x1, z0 + shelf, FL + gantry, FL + gantry + 0.03, "steel")
  for (const k of [0.2, 0.5, 0.8]) cyl(x0 + (x1 - x0) * k, z0 + shelf / 2 + 0.02, 0.07, FL + gantry - 0.09, 0.09, LINE ? "steel" : "lamp", 20, 0.05)
  // bowls on the gantry, dinner's first plates on the pass
  for (const k of [0.33, 0.66]) for (let i = 0; i < 4; i++) cyl(x0 + (x1 - x0) * k, z0 + 0.16, 0.08, FL + gantry + 0.03 + i * 0.05, 0.05, "white", 20, 0.1)
  for (const [k, dz] of [[0.18, 0.32], [0.42, 0.38], [0.62, 0.3], [0.84, 0.36]]) {
    const px = x0 + (x1 - x0) * k, pz = z0 + dz
    cyl(px, pz, 0.13, top, 0.02, "white", 28)
    if (!LINE) { ball(px - 0.03, top + 0.04, pz, 0.06, "food", 10).scale.y = 0.5; ball(px + 0.05, top + 0.035, pz + 0.02, 0.045, "greens", 10).scale.y = 0.6 }
  }
}

// ------------------------------------------------------------ the east end: the cleaning cupboard, the bins, the plate cupboard, the fire point
{
  const { x0, x1, d, h } = CL, z0 = iz0, z1 = iz0 + d, m = (x0 + x1) / 2
  blk(x0 + 0.01, z0, x1 - 0.01, z1, FL + 0.06, FL + h, "locker")
  blk(m - 0.002, z1, m + 0.002, z1 + 0.004, FL + 0.08, FL + h - 0.02, "black")
  for (const s of [-1, 1]) blk(m + s * 0.04 - 0.01, z1, m + s * 0.04 + 0.01, z1 + 0.03, FL + 1.0, FL + 1.2, "black")
  blk(x0 + 0.01, z0, x1 - 0.01, z1 - 0.02, FL, FL + 0.06, "black") // its plinth
}
for (const y of BI.y) {
  const [x0, x1, z0, z1] = [ix1 - BI.off - BI.d, ix1 - BI.off, y - BI.w / 2, y + BI.w / 2]
  soft(x0 + 0.01, z0 + 0.01, x1 - 0.01, z1 - 0.01, FL, FL + BI.h - 0.065, 0.03, "bin")
  soft(x0, z0, x1, z1, FL + BI.h - 0.06, FL + BI.h, 0.02, "bin")
  blk(x0 - 0.07, y - 0.08, x0 + 0.02, y + 0.08, FL + 0.02, FL + 0.05, "black") // the pedal
}
{
  const { x0, y0, h } = PL, top = FL + h
  blk(x0 + 0.01, y0 + 0.02, ix1, iz1, FL + 0.1, top - 0.04, "steel")
  for (const k of [0, 1]) {
    const [d0, d1] = [x0 + 0.02 + k * (ix1 - x0 - 0.03) / 2 + 0.004, x0 + 0.02 + (k + 1) * (ix1 - x0 - 0.03) / 2 - 0.004]
    blk(d0, y0, d1, y0 + 0.02, FL + 0.12, top - 0.07, "steel")
    blk(k ? d0 + 0.04 : d1 - 0.06, y0 - 0.03, k ? d0 + 0.06 : d1 - 0.04, y0, top - 0.3, top - 0.12, "black")
  }
  blk(x0, y0, ix1, iz1, top - 0.04, top, "steel")
  blk(x0 + 0.02, y0 + 0.1, ix1 - 0.02, y0 + 0.5, FL, FL + 0.1, "black") // its plinth
  // stacks of clean plates and a tub of cutlery on top
  for (const [dx, n] of [[0.2, 8], [0.48, 6]]) for (let i = 0; i < n; i++) cyl(x0 + dx, (y0 + iz1) / 2, 0.12, top + i * 0.016, 0.014, "white", 24)
  cyl(x0 + 0.76, (y0 + iz1) / 2, 0.07, top, 0.14, "steel", 16)
}
{
  // the fire point on the east end wall: the extinguisher on its bracket, the fire blanket's case above
  const z = FI.y
  blk(ix1 - 0.04, z - 0.05, ix1, z + 0.05, FL + 0.36, FL + 0.39, "black")
  cyl(ix1 - 0.1, z, 0.075, FL + 0.39, 0.44, "extinguisher", 20)
  cyl(ix1 - 0.1, z, 0.03, FL + 0.83, 0.06, "black", 12)
  pipe([ix1 - 0.1, FL + 0.88, z], [ix1 - 0.17, FL + 0.84, z + 0.02], 0.008, "black")
  blk(ix1 - 0.09, z - 0.14, ix1, z + 0.14, FL + 1.2, FL + 1.5, "extinguisher")
}

// ------------------------------------------------------------ camera
scene.updateMatrixWorld(true)
const camera = new THREE.PerspectiveCamera(HERO ? 34 : 30, FW / FH, 0.3, 300)
if (HERO) {
  // eye level in the courtyard, in front of the west end, the galley right of centre and open lawn bottom-left
  // for the words
  camera.position.set(-6.5, 1.6, 13.5)
  camera.lookAt(new THREE.Vector3(0.92, 1.4, 1.63))
  add(new THREE.SphereGeometry(150, 32, 16), "sky", { noEdges: true })
  scene.fog = new THREE.Fog(0xe2e9ee, 35, 140)
} else {
  // the front view, a little from the west end, raised so the back wall shows over the worktop
  const target = new THREE.Vector3(L / 2, FL + 0.7, 0)
  const [el, az, dist] = [THREE.MathUtils.degToRad(33), THREE.MathUtils.degToRad(-6), 24]
  camera.position.set(target.x + dist * Math.cos(el) * Math.sin(az), target.y + dist * Math.sin(el), target.z + dist * Math.cos(el) * Math.cos(az))
  camera.lookAt(target)
}
camera.updateMatrixWorld(); camera.updateProjectionMatrix()
if (!HERO) { // fit the frame to the model
  const bb = new THREE.Box3()
  for (const o of meshes) if (!o.geometry.type.startsWith("Circle")) bb.expandByObject(o)
  let px = [Infinity, Infinity, -Infinity, -Infinity]
  for (const xx of [bb.min.x, bb.max.x]) for (const yy of [bb.min.y, bb.max.y]) for (const zz of [bb.min.z, bb.max.z]) {
    const p = new THREE.Vector3(xx, yy, zz).project(camera)
    const X = ((p.x + 1) / 2) * FW, Yp = ((1 - p.y) / 2) * FH
    px = [Math.min(px[0], X), Math.min(px[1], Yp), Math.max(px[2], X), Math.max(px[3], Yp)]
  }
  let w = (px[2] - px[0]) * 1.05, h = (px[3] - px[1]) * 1.08
  if (w / h > FW / FH) h = (w * FH) / FW; else w = (h * FW) / FH
  camera.setViewOffset(FW, FH, (px[0] + px[2]) / 2 - w / 2, (px[1] + px[3]) / 2 - h / 2, w, h)
}

// ------------------------------------------------------------ render
if (LINE) {
  const lineMat = new LineMaterial({ color: INK, linewidth: 1.2, side: THREE.DoubleSide })
  lineMat.resolution.set(FW, FH)
  lineMat.userData.outlineParameters = { visible: false }
  for (const o of meshes) {
    if (o.userData.noEdges) continue
    o.updateMatrixWorld(true)
    const g = new LineSegmentsGeometry().fromEdgesGeometry(new THREE.EdgesGeometry(o.geometry, 30))
    const l = new LineSegments2(g, lineMat)
    l.matrixAutoUpdate = false; l.matrix.copy(o.matrixWorld)
    scene.add(l)
  }
  const ink = new THREE.Color(INK)
  new OutlineEffect(renderer, { defaultThickness: 0.0024, defaultColor: [ink.r, ink.g, ink.b] }).render(scene, camera)
} else {
  const pmrem = new THREE.PMREMGenerator(renderer)
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture
  scene.environmentIntensity = HERO ? 0.4 : 0.45
  scene.add(new THREE.HemisphereLight(0xeef3ff, 0x8a7a5a, HERO ? 0.75 : 0.9))
  // daylight from the front, over the left shoulder
  const sun = new THREE.DirectionalLight(0xfff2de, HERO ? 2.8 : 2.6)
  sun.position.set(L / 2 - 9, HERO ? 14 : 12, 11)
  sun.target.position.set(L / 2, 0, 0); scene.add(sun.target)
  sun.castShadow = true
  sun.shadow.mapSize.set(4096, 4096)
  Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 7, bottom: -7, near: 1, far: 50 })
  sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.02; sun.shadow.radius = 4
  scene.add(sun)
  // the kitchen's own light along the room, clear of the hood's steel, and the hood's light over the line
  for (const x of [2.4, 8.4, 10.9]) {
    const l = new THREE.PointLight(0xfff6ea, HERO ? 1.6 : 1.3, 6, 2)
    l.position.set(x, CE - 0.15, 0.35); scene.add(l)
  }
  const hl = new THREE.PointLight(0xfff1dc, 1.0, 2.6, 2)
  hl.position.set((HD.x0 + HD.x1) / 2, FL + HD.y0 - 0.12, iz0 + 0.55); scene.add(hl)
  const composer = new EffectComposer(renderer)
  composer.setSize(FW, FH)
  composer.addPass(new RenderPass(scene, camera))
  const ao = new GTAOPass(scene, camera, FW, FH)
  ao.blendIntensity = 0.8
  ao.updateGtaoMaterial({ radius: 0.3, distanceExponent: 1.5, thickness: 1, scale: 1 })
  composer.addPass(ao)
  composer.addPass(new OutputPass())
  composer.render()
}
document.getElementById("out").src = renderer.domElement.toDataURL("image/png")
document.body.dataset.ready = "1"
</script>
</body>
</html>
