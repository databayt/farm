<!doctype html>
<!--
  /en/guest-room's 3D, in the pattern of the camp's (scripts/site/render/camp.html): one guest room seen from
  the front with its front wall and ceiling off, built from src/components/guest-room/guest-room.json (the
  numbers the 2D draws). The shell follows the compound's guest-rooms builder (scripts/site/render/compound.html:
  saffron containers on a stone plinth, red-framed barred windows, a red door, the timber veranda) and the
  2026-10-25 footage (assets/reference/room, rooms): cream linings, the red steel posts and beam where the two
  containers were joined. Floor planks and Medium Oak furniture come from the studio's room
  (scripts/studio/render/room.html). Rendered two ways:

    ?mode=line  line drawing on a transparent ground   -> public/designs/guest-room/render/guest-room-line.png
    ?mode=real  materials, daylight and shadow         -> public/designs/guest-room/render/guest-room-real.webp
    &view=electric  the wiring in the same view (guest-room.json `electric`, built by room-services.js): line mode
                draws the room faint, every device dark and each circuit's conduit route in its colour, and sets
                window.TAGS -> render/electric-line.png + render/electric-tags.json; real mode shows the finished
                devices -> render/electric-real.webp
    &item=<id>  one piece on its own, real mode, 1200 x 900 on a transparent ground: the furniture (bed, mattress,
                bedding, bedside, lamp, bench, wardrobe, desk, chair, hooks, rug, verandachair, verandatable)
                -> render/furniture/<id>.webp, or a device by its model (board, ceiling, switch2, wallfan, usb,
                socket2, isolator, alarm) -> render/electric/<id>.webp

  Serve the repo root on a spare port, open this page at 2400 x 1800, and once body[data-ready] is set
  save the data URL in #out.
-->
<html>
<head>
<meta charset="utf-8">
<style>
html,body{margin:0;background:#fff}
#out{display:block;width:2400px;height:1800px}
</style>
<script type="importmap">
{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}
</script>
</head>
<body>
<img id="out" alt="">
<script type="module">
import * as THREE from "three"
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js"
import { OutlineEffect } from "three/addons/effects/OutlineEffect.js"
import { LineSegments2 } from "three/addons/lines/LineSegments2.js"
import { LineSegmentsGeometry } from "three/addons/lines/LineSegmentsGeometry.js"
import { LineMaterial } from "three/addons/lines/LineMaterial.js"
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js"
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js"
import { RenderPass } from "three/addons/postprocessing/RenderPass.js"
import { GTAOPass } from "three/addons/postprocessing/GTAOPass.js"
import { OutputPass } from "three/addons/postprocessing/OutputPass.js"
import { services, frameItem, itemGround } from "./room-services.js"

const Q = new URLSearchParams(location.search)
const LINE = Q.get("mode") !== "real"
const ITEM = Q.get("item"), ELEC = Q.get("view") === "electric"
const [FW, FH] = ITEM ? [1200, 900] : [2400, 1800]
let TAG = "" // the piece being built, for ?item=
const C = await (await fetch(`/src/components/guest-room/guest-room.json?${Date.now()}`)).json()
const INK = "#2b2a26", PAGE = "#ffffff"
// plan (x right, y toward the door) -> three: x = x, y = height, z = y; the camera stands in front, at +z

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true })
renderer.setClearColor(0xffffff, 0)
renderer.setPixelRatio(1)
renderer.setSize(FW, FH)
renderer.outputColorSpace = THREE.SRGBColorSpace
if (!LINE) {
  renderer.toneMapping = THREE.ACESFilmicToneMapping
  renderer.shadowMap.enabled = true
  renderer.shadowMap.type = THREE.PCFSoftShadowMap
}
const scene = new THREE.Scene()

// ------------------------------------------------------------ procedural textures (real mode)
let seed = 7
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647)
function tex(draw, w = 512, h = 512) {
  const c = document.createElement("canvas"); c.width = w; c.height = h
  seed = 7 // each texture draws its own fresh sequence, so editing one never reshuffles another
  draw(c.getContext("2d"), w, h)
  const t = new THREE.CanvasTexture(c)
  t.colorSpace = THREE.SRGBColorSpace
  t.wrapS = t.wrapT = THREE.RepeatWrapping
  t.anisotropy = 8
  return t
}
const T = LINE ? {} : {
  // pine under a medium-oak finish, as the studio's furniture (room.html): golden amber, soft patina, fine grain
  pine: tex((g, w, h) => {
    g.fillStyle = "#ae7a48"; g.fillRect(0, 0, w, h)
    const staves = 5, sh = h / staves
    for (let s = 0; s < staves; s++) {
      g.fillStyle = rnd() > 0.5 ? `rgba(232,186,122,${0.05 + rnd() * 0.1})` : `rgba(138,84,38,${0.04 + rnd() * 0.08})`
      g.fillRect(0, s * sh, w, sh)
    }
    g.filter = "blur(12px)"
    for (let i = 0; i < 70; i++) {
      g.fillStyle = rnd() > 0.45 ? `rgba(146,88,38,${0.07 + rnd() * 0.12})` : `rgba(238,196,132,${0.07 + rnd() * 0.12})`
      g.beginPath(); g.ellipse(rnd() * w, rnd() * h, 50 + rnd() * 170, 8 + rnd() * 24, 0, 0, Math.PI * 2); g.fill()
    }
    g.filter = "none"
    for (let i = 0; i < 2600; i++) {
      const x = rnd() * w, y = rnd() * h, len = 20 + rnd() * 110
      g.strokeStyle = rnd() > 0.35 ? `rgba(116,70,30,${0.04 + rnd() * 0.08})` : `rgba(244,206,148,${0.04 + rnd() * 0.07})`
      g.lineWidth = 0.6 + rnd() * 0.7
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + len, y + (rnd() - 0.5) * 1.5); g.stroke()
    }
  }, 1024, 512),
  // natural oak planks, as the studio's floor: honey-tan boards of varied tone, fine joints, long grain
  planks: tex((g, w, h) => {
    const tones = ["#b98b5b", "#c39663", "#a97c4f", "#bd9264", "#ae8255", "#c79b6a", "#b38556"]
    const rows = 18, rh = h / rows
    let last = -1
    for (let r = 0; r < rows; r++) {
      let x = -Math.floor(rnd() * 700)
      while (x < w) {
        const len = 384 + Math.floor(rnd() * 384), y0 = r * rh
        let i = Math.floor(rnd() * tones.length); if (i === last) i = (i + 1) % tones.length; last = i
        g.fillStyle = tones[i]; g.fillRect(x, y0, len, rh)
        for (let k = 0; k < 7; k++) {
          const y = y0 + rnd() * rh
          g.strokeStyle = `rgba(110,72,38,${0.08 + rnd() * 0.14})`; g.lineWidth = 0.7 + rnd() * 1.4
          g.beginPath(); g.moveTo(x, y)
          g.bezierCurveTo(x + len * 0.3, y + (rnd() - 0.5) * 6, x + len * 0.7, y + (rnd() - 0.5) * 6, x + len, y + (rnd() - 0.5) * 4)
          g.stroke()
        }
        g.fillStyle = "rgba(70,44,22,0.55)"; g.fillRect(x, y0, 2, rh)
        x += len
      }
      g.fillStyle = "rgba(70,44,22,0.5)"; g.fillRect(0, r * rh, w, 2)
    }
  }, 2048, 1024),
  // the containers' corrugation, one 278 mm pitch across the tile
  corr: tex((g, w, h) => {
    const grd = g.createLinearGradient(0, 0, w, 0)
    for (const [t, c] of [[0, "#c9c9c9"], [0.2, "#ffffff"], [0.5, "#e6e6e6"], [0.7, "#a9a9a9"], [1, "#c9c9c9"]]) grd.addColorStop(t, c)
    g.fillStyle = grd; g.fillRect(0, 0, w, h)
  }, 64, 64),
  boards: tex((g, w, h) => {
    g.fillStyle = "#b98250"; g.fillRect(0, 0, w, h)
    for (let j = 0; j < 90; j++) {
      g.fillStyle = `rgba(110,70,35,${0.05 + rnd() * 0.08})`
      g.fillRect(rnd() * w, rnd() * h, 1 + rnd(), 30 + rnd() * 160)
    }
    for (let x = 0; x < w; x += w / 4) { g.fillStyle = "rgba(60,38,20,0.5)"; g.fillRect(x, 0, 3, h) } // board joints
  }),
  grass: tex((g, w, h) => {
    g.fillStyle = "#6f9a4a"; g.fillRect(0, 0, w, h)
    for (let i = 0; i < 26000; i++) {
      g.fillStyle = rnd() > 0.5 ? "rgba(170,200,110,0.35)" : "rgba(40,70,30,0.35)"
      g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 2, 1 + rnd() * 2)
    }
  }),
  stone: tex((g, w, h) => {
    g.fillStyle = "#8f6a55"; g.fillRect(0, 0, w, h)
    for (let r = 0; r < 4; r++) for (let c = 0; c < 6; c++) {
      g.fillStyle = ["#9c7660", "#85604c", "#a07a62", "#7d5a48"][Math.floor(rnd() * 4)]
      g.fillRect(c * w / 6 + (r % 2) * w / 12 + 3, r * h / 4 + 3, w / 6 - 6, h / 4 - 6)
    }
  }, 256, 256),
  rug: tex((g, w, h) => { // a flat-woven rug: cream ground, rust and teal bands, an ochre border
    g.fillStyle = "#e8dcc4"; g.fillRect(0, 0, w, h)
    g.strokeStyle = "#c9973a"; g.lineWidth = 18; g.strokeRect(9, 9, w - 18, h - 18)
    for (const [y, c] of [[0.22, "#b5523a"], [0.3, "#2f4f5a"], [0.7, "#2f4f5a"], [0.78, "#b5523a"]]) { g.fillStyle = c; g.fillRect(30, y * h, w - 60, h * 0.035) }
    g.fillStyle = "rgba(181,82,58,0.8)"
    for (let i = 0; i < 5; i++) { // a row of diamonds down the middle
      const cx = w * (0.18 + i * 0.16), cy = h / 2
      g.beginPath(); g.moveTo(cx, cy - 40); g.lineTo(cx + 30, cy); g.lineTo(cx, cy + 40); g.lineTo(cx - 30, cy); g.closePath(); g.fill()
    }
    for (let i = 0; i < 9000; i++) { g.fillStyle = rnd() > 0.5 ? "rgba(255,255,255,0.07)" : "rgba(60,40,20,0.07)"; g.fillRect(rnd() * w, rnd() * h, 2, 1) }
  }, 512, 384),
}

// ------------------------------------------------------------ materials
const THIN = new Set(["bar", "leg", "hook", "black"])
const MAT = {}
function mat(name) {
  if (MAT[name]) return MAT[name]
  let x
  if (LINE) {
    if (name === "cut") x = new THREE.MeshBasicMaterial({ color: "#111111" })
    else if (name === "glass") x = new THREE.MeshBasicMaterial({ color: PAGE, transparent: true, opacity: 0, depthWrite: false })
    else x = new THREE.MeshBasicMaterial({ color: PAGE, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 })
    if (THIN.has(name)) x.userData.outlineParameters = { visible: false }
  } else {
    const std = (o) => new THREE.MeshStandardMaterial(o)
    x = {
      wall: () => std({ color: "#ecdcae", roughness: 0.9 }), // cream linings, as the rooms today
      saffron: () => std({ map: T.corr, color: "#d9a21b", roughness: 0.55, metalness: 0.15 }),
      frame: () => std({ color: "#bb8b17", roughness: 0.5, metalness: 0.2 }), // the container's rails
      cut: () => std({ color: "#2c2c2c", roughness: 0.9 }),
      red: () => std({ color: "#b0262a", roughness: 0.45, metalness: 0.3 }), // door, window frames, the joint's posts
      bar: () => std({ color: "#a32428", roughness: 0.45, metalness: 0.3 }),
      floor: () => std({ map: T.planks, color: "#d1c8c1", roughness: 0.55 }),
      pine: () => std({ map: T.pine, roughness: 0.62 }), // Medium Oak, ~rgb(215,162,103) lit
      leg: () => std({ map: T.pine, roughness: 0.62 }),
      timber: () => std({ map: T.boards, roughness: 0.75 }),
      stone: () => std({ map: T.stone, roughness: 0.95 }),
      linen: () => std({ color: "#f7f6f2", roughness: 0.9 }),
      duvet: () => std({ color: "#f1f1ee", roughness: 0.92 }),
      throw: () => std({ color: "#c99a2e", roughness: 0.95 }),
      cushion: () => std({ color: "#d9cdb6", roughness: 0.95 }),
      shade: () => std({ color: "#efe6d4", roughness: 0.9, emissive: "#ffd9a0", emissiveIntensity: 0.35, side: THREE.DoubleSide }),
      rug: () => std({ map: T.rug, roughness: 1 }),
      lawn: () => std({ map: T.grass, roughness: 1 }),
      black: () => std({ color: "#1f2023", roughness: 0.45, metalness: 0.5 }),
      hook: () => std({ color: "#1f2023", roughness: 0.45, metalness: 0.5 }),
      lamp: () => std({ color: "#fff3d6", roughness: 0.3, emissive: "#ffcf7a", emissiveIntensity: 1.2 }),
      leaf: () => std({ color: "#4f7d3a", roughness: 0.7 }),
      leaf2: () => std({ color: "#3f6b30", roughness: 0.7 }),
      pot: () => std({ color: "#d9d4cc", roughness: 0.8 }),
      towel: () => std({ color: "#d8cdbd", roughness: 0.95 }),
      view: () => std({ color: "#cfe0d6", roughness: 0.9, emissive: "#cfe0d6", emissiveIntensity: 0.35 }), // daylight beyond the glass
      glass: () => new THREE.MeshPhysicalMaterial({ color: "#e4f1f3", roughness: 0.04, transparent: true, opacity: 0.18, depthWrite: false }),
    }[name]?.() ?? std({ color: "#cccccc", roughness: 0.8 })
  }
  return (MAT[name] = x)
}

// ------------------------------------------------------------ geometry helpers (metres)
const meshes = []
// textures at true scale, each face projecting from its own plane along the piece's longest side
const TILE = { pine: [1.2, 0.6], leg: [1.2, 0.6], floor: [4.8, 2.4], saffron: [0.278, 2.6], timber: [1.4, 1.4], stone: [1.2, 0.6] }
function boardUV(geo, tile, name) {
  geo.computeBoundingBox()
  const size = geo.boundingBox.getSize(new THREE.Vector3()).toArray()
  const long = name === "saffron" ? 0 : size.indexOf(Math.max(...size))
  const pos = geo.attributes.position, nrm = geo.attributes.normal, uv = geo.attributes.uv
  if (!uv) return
  const du = name === "pine" ? (meshes.length * 0.618034) % 1 : 0, dv = name === "pine" ? (meshes.length * 0.414214) % 1 : 0
  for (let i = 0; i < pos.count; i++) {
    const n = [Math.abs(nrm.getX(i)), Math.abs(nrm.getY(i)), Math.abs(nrm.getZ(i))]
    const plane = [0, 1, 2].filter((a) => a !== n.indexOf(Math.max(...n)))
    const ua = plane.includes(long) ? long : size[plane[0]] >= size[plane[1]] ? plane[0] : plane[1]
    const va = plane.find((a) => a !== ua)
    const p = [pos.getX(i), pos.getY(i), pos.getZ(i)]
    uv.setXY(i, du + p[ua] / tile[0], dv + p[va] / tile[1])
  }
  uv.needsUpdate = true
}
function add(geo, name, opts = {}) {
  if (!LINE && TILE[name]) boardUV(geo, TILE[name], name)
  const mesh = new THREE.Mesh(geo, mat(name))
  mesh.castShadow = !LINE && !["glass", "lawn", "floor", "rug", "view"].includes(name)
  mesh.receiveShadow = !LINE
  if (opts.pos) mesh.position.set(...opts.pos)
  if (opts.rot) mesh.rotation.set(...opts.rot)
  if (opts.noEdges) mesh.userData.noEdges = true
  mesh.userData.tag = TAG
  scene.add(mesh)
  meshes.push(mesh)
  return mesh
}
// a box over a plan rectangle (three x, z), from height y0 to y1, optionally with rounded edges
function blk(xa, za, xb, zb, y0, y1, name, r = 0) {
  const [x0, x1, z0, z1] = [Math.min(xa, xb), Math.max(xa, xb), Math.min(za, zb), Math.max(za, zb)]
  const [w, h, d] = [x1 - x0, y1 - y0, z1 - z0]
  const rr = Math.min(r, w / 2 - 1e-4, h / 2 - 1e-4, d / 2 - 1e-4)
  const geo = rr > 0 ? new RoundedBoxGeometry(w, h, d, 4, rr) : new THREE.BoxGeometry(w, h, d)
  return add(geo, name, { pos: [(x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2] })
}
function cyl(x, z, r, y0, h, name, seg = 24, rTop = r) {
  return add(new THREE.CylinderGeometry(rTop, r, h, seg), name, { pos: [x, y0 + h / 2, z] })
}
function pipe(a, b, r, name) {
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b)
  const mesh = add(new THREE.CylinderGeometry(r, r, A.distanceTo(B), 8), name, { pos: A.clone().add(B).multiplyScalar(0.5).toArray() })
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), B.sub(A).normalize())
  return mesh
}
// a wall cut by the section: the body, then a thin dark cap on its cut top, as on the studio's
function cutWall(x0, z0, x1, z1, y0, y1, name = "wall") {
  blk(x0, z0, x1, z1, y0, y1, name)
  blk(x0, z0, x1, z1, y1 - 0.004, y1 + 0.002, "cut")
}
function plant(x, y, z, s = 1) {
  cyl(x, z, 0.08 * s, y, 0.18 * s, "pot", 32, 0.1 * s)
  for (let i = 0; i < 11; i++) {
    const a = (i / 11) * Math.PI * 2
    const leaf = add(new THREE.SphereGeometry(0.075 * s, 20, 14), i % 2 ? "leaf" : "leaf2")
    leaf.scale.set(0.45, 1.6, 1)
    leaf.position.set(x + Math.cos(a) * 0.06 * s, y + (0.27 + (i % 3) * 0.05) * s, z + Math.sin(a) * 0.06 * s)
    leaf.rotation.set(Math.sin(a) * 0.55, a, Math.cos(a) * 0.55)
  }
}

const { block, room, joint, door, window: win, veranda, bed, bedsides, bench, wardrobe, desk, hooks, rug } = C
const OX = block.w / 2, OZ = block.d / 2, IX = room.w / 2, IZ = room.d / 2
const FY = block.plinth + block.rail // the floor's top
const TOP = block.plinth + block.height // the containers' top
const V = OZ + veranda.d

// ------------------------------------------------------------ the lawn, the plinth, the veranda
if (!LINE && !ITEM) {
  T.grass.repeat.set(10, 10)
  add(new THREE.CircleGeometry(30, 64), "lawn", { rot: [-Math.PI / 2, 0, 0] })
}
blk(-OX, -OZ - 0.1, OX, OZ, 0, block.plinth, "stone")
blk(-OX, OZ, OX, V, 0.12, block.plinth + 0.12, "timber") // the veranda, the block's length (this room's share)
blk(veranda.step.x0, V, veranda.step.x1, V + veranda.step.d, 0, 0.2, "timber") // the step down from the door
const VY = block.plinth + 0.12

// ------------------------------------------------------------ the shell
// The back wall stands full height with its barred window; the partitions to the neighbouring rooms stand
// either side; the front wall is cut down to its bottom rail and a low curb, the door's gap open.
blk(-IX, -IZ, IX, IZ, FY - 0.03, FY, "floor")
{
  const [a, b, s, hd] = [win.back.x0, win.back.x1, FY + win.back.sill, FY + win.back.head]
  const [z0, z1] = [-OZ, -IZ]
  // one panel each for the steel and the lining, the window cut out of both, so no seam runs up the wall
  const holed = (x0, x1, y0, y1, za, zb, name) => {
    const sh = new THREE.Shape([new THREE.Vector2(x0, y0), new THREE.Vector2(x1, y0), new THREE.Vector2(x1, y1), new THREE.Vector2(x0, y1)])
    sh.holes.push(new THREE.Path([new THREE.Vector2(a, s), new THREE.Vector2(a, hd), new THREE.Vector2(b, hd), new THREE.Vector2(b, s)]))
    return add(new THREE.ExtrudeGeometry(sh, { depth: zb - za, bevelEnabled: false }), name, { pos: [0, 0, za] })
  }
  holed(-OX, OX, block.plinth, TOP, z0, z0 + 0.03, "saffron") // the steel, outside
  holed(-IX, IX, FY, TOP, z0 + 0.03, z1, "wall") // the lining
  blk(-IX, z0 + 0.03, IX, z1, TOP - 0.004, TOP + 0.002, "cut")
  barredWindow(a, b, s, hd, z0, z1, -1)
}
for (const sgn of [-1, 1]) cutWall(sgn * IX, -OZ, sgn * OX, OZ, FY - 0.14, TOP) // the partitions
blk(-OX, OZ - 0.04, OX, OZ, block.plinth, FY, "frame") // the front's bottom rail
cutWall(-IX, IZ, door.x0, OZ - 0.04, FY, FY + 0.12)
cutWall(door.x1, IZ, IX, OZ - 0.04, FY, FY + 0.12)
blk(door.x0, IZ, door.x1, OZ, FY - 0.01, FY + 0.012, "timber") // the threshold
// the joint: a red steel post against each partition, a beam across overhead
for (const sgn of [-1, 1]) blk(sgn * IX, joint.y - joint.post / 2, sgn * (IX - joint.post), joint.y + joint.post / 2, FY, FY + room.h, "red")
blk(-IX, joint.y - 0.05, IX, joint.y + 0.05, FY + room.h - 0.12, FY + room.h, "red").visible = !ELEC // the electric view leaves the beam off, so the back wall shows

// a red-framed window, barred, across a wall from z0 to z1 (out: which side is outside)
function barredWindow(a, b, s, hd, z0, z1, out) {
  const zo = out < 0 ? z0 : z1, zi = out < 0 ? z1 : z0
  const zm = (z0 + z1) / 2
  blk(a, zo, b, zo + out * -0.01, s, hd, "view") // the day outside, seen through the glass
  blk(a, zm - 0.004, b, zm + 0.004, s, hd, "glass")
  const f = 0.05
  for (const [x0, x1, y0, y1] of [[a, a + f, s, hd], [b - f, b, s, hd], [a, b, s, s + f], [a, b, hd - f, hd], [(a + b) / 2 - 0.02, (a + b) / 2 + 0.02, s, hd]])
    blk(x0, zm - 0.03, x1, zm + 0.03, y0, y1, "red")
  for (let x = a + 0.11; x < b - 0.06; x += 0.11) blk(x - 0.008, zi - out * 0.01, x + 0.008, zi - out * 0.025, s, hd, "bar") // bars, inside
  for (const y of [s + (hd - s) * 0.5]) blk(a, zi - out * 0.01, b, zi - out * 0.025, y - 0.008, y + 0.008, "bar")
  blk(a - 0.03, zi, b + 0.03, zi - out * 0.05, s - 0.03, s, "wall") // the sill
}

// the door, open in against the right: a red steel leaf with a barred glass panel in its upper half
{
  const x = door.x1 - 0.045, [z0, z1] = [IZ - (door.x1 - door.x0) + 0.02, IZ], y0 = FY + 0.01, y1 = FY + door.h
  blk(x, z0, x + 0.045, z1, y0, y1, "red", 0.006)
  const [g0, g1] = [y0 + door.h * 0.55, y1 - 0.18]
  blk(x - 0.003, z0 + 0.15, x + 0.048, z1 - 0.15, g0, g1, "glass")
  for (let z = z0 + 0.25; z < z1 - 0.18; z += 0.12) blk(x - 0.012, z - 0.008, x - 0.003, z + 0.008, g0, g1, "bar")
  blk(x - 0.07, z0 + 0.06, x - 0.003, z0 + 0.09, FY + 1.02, FY + 1.05, "black") // the handle
}

// ------------------------------------------------------------ the bed, bedsides and lamps, the bench
TAG = "rug"
blk(-rug.w / 2, rug.y - rug.d / 2, rug.w / 2, rug.y + rug.d / 2, FY, FY + 0.012, "rug")
const B0 = -IZ, B1 = -IZ + bed.l
{
  const [x0, x1] = [-bed.w / 2, bed.w / 2]
  TAG = "bed"
  blk(x0, B0, x1, B0 + 0.05, FY, FY + bed.headboard, "pine", 0.008) // the headboard on the back wall
  blk(x0, B0 + 0.05, x1, B1, FY, FY + bed.frame, "pine", 0.01) // a solid frame, MALM look
  const m = FY + bed.frame
  TAG = "mattress"
  blk(x0 + 0.02, B0 + 0.07, x1 - 0.02, B1 - 0.02, m - 0.04, m + bed.mattress - 0.04, "linen", 0.05)
  const t = m + bed.mattress - 0.04
  TAG = "bedding"
  blk(x0 + 0.005, B0 + 0.75, x1 - 0.005, B1 + 0.01, t - 0.07, t + 0.04, "duvet", 0.05) // the duvet
  blk(x0, B0 + 0.75, x1, B0 + 0.95, t - 0.04, t + 0.07, "duvet", 0.03) // turned down
  blk(x0 - 0.01, B1 - 0.5, x1 + 0.01, B1 - 0.15, t + 0.0, t + 0.06, "throw", 0.02)
  for (const px of [x0 + 0.1, 0.05]) blk(px, B0 + 0.12, px + bed.w / 2 - 0.15, B0 + 0.55, t - 0.02, t + 0.14, "linen", 0.06) // pillows
  blk(-0.25, B0 + 0.5, 0.25, B0 + 0.62, t + 0.0, t + 0.25, "cushion", 0.05) // a cushion against the pillows
}
for (const sgn of [-1, 1]) {
  TAG = sgn < 0 ? "bedside" : "bedside#2"
  const x0 = sgn < 0 ? -bed.w / 2 - bedsides.gap - bedsides.w : bed.w / 2 + bedsides.gap, x1 = x0 + bedsides.w
  const [z0, z1, h, lg] = [B0, B0 + bedsides.d, FY + bedsides.h, 0.036]
  blk(x0, z0, x1, z1, h - 0.035, h, "pine", 0.006)
  for (const lx of [x0, x1 - lg]) for (const lz of [z0, z1 - lg]) blk(lx, lz, lx + lg, lz + lg, FY, h - 0.035, "leg", 0.003)
  blk(x0 + lg, z0 + lg, x1 - lg, z1 - lg, FY + 0.18, FY + 0.198, "pine", 0.003)
  const cx = (x0 + x1) / 2, cz = (z0 + z1) / 2 + 0.03
  TAG = sgn < 0 ? "lamp" : "lamp#2"
  cyl(cx, cz, 0.07, h, 0.024, "black", 32, 0.06)
  cyl(cx, cz, 0.007, h + 0.024, 0.26, "black", 8)
  const shade = add(new THREE.CylinderGeometry(0.1, 0.13, 0.18, 48, 1, true), "shade", { pos: [cx, h + 0.33, cz] })
  if (!LINE) { const l = new THREE.PointLight(0xffd9a0, 0.6, 1.6); l.position.set(cx, h + 0.3, cz); scene.add(l) }
}
{
  TAG = "bench"
  const z0 = B1 + bench.gap, z1 = z0 + bench.d, h = FY + bench.h, [x0, x1] = [-bench.w / 2, bench.w / 2]
  for (let k = 0; k < 4; k++) { const a = z0 + k * (bench.d / 4) + 0.005; blk(x0, a, x1, a + bench.d / 4 - 0.01, h - 0.03, h, "pine", 0.004) } // slats
  for (const x of [x0 + 0.04, x1 - 0.08]) {
    blk(x, z0 + 0.02, x + 0.04, z0 + 0.06, FY, h - 0.03, "leg"); blk(x, z1 - 0.06, x + 0.04, z1 - 0.02, FY, h - 0.03, "leg")
    blk(x, z0 + 0.02, x + 0.04, z1 - 0.02, FY + 0.12, FY + 0.15, "leg")
  }
  TAG = "towels"
  blk(x0 + 0.12, z0 + 0.06, x0 + 0.62, z1 - 0.04, h, h + 0.04, "towel", 0.01) // folded towels
  blk(x0 + 0.14, z0 + 0.08, x0 + 0.6, z1 - 0.06, h + 0.04, h + 0.08, "towel", 0.01)
}

// ------------------------------------------------------------ the wardrobe, the desk and chair, the hooks
{
  TAG = "wardrobe"
  const { x0, y0, d, w, h } = wardrobe, x1 = x0 + d
  blk(x0, y0, x1, y0 + w, FY, FY + h, "pine", 0.008)
  blk(x1, y0 + w / 2 - 0.002, x1 + 0.004, y0 + w / 2 + 0.002, FY + 0.06, FY + h - 0.04, "cut") // the doors' meeting line
  for (const s of [-1, 1]) blk(x1 + 0.004, y0 + w / 2 + s * 0.05 - 0.008, x1 + 0.02, y0 + w / 2 + s * 0.05 + 0.008, FY + 0.9, FY + 1.2, "black")
  blk(x0 + 0.02, y0 + 0.02, x1 - 0.02, y0 + w - 0.02, FY, FY + 0.06, "cut") // the plinth's shadow gap
}
{
  TAG = "desk"
  const z1 = IZ, z0 = IZ - desk.d, h = FY + desk.h, lg = 0.04
  blk(desk.x0, z0, desk.x1, z1, h - 0.03, h, "pine", 0.006)
  for (const x of [desk.x0, desk.x1 - lg]) for (const z of [z0, z1 - lg]) blk(x, z, x + lg, z + lg, FY, h - 0.03, "leg")
  blk(desk.x0 + lg, z1 - 0.03, desk.x1 - lg, z1, h - 0.15, h - 0.03, "pine") // the back rail
  TAG = "deskprops"
  plant(desk.x0 + 0.15, h, z1 - 0.15, 0.85)
  // a small reading lamp on the desk, and a notebook
  const lx = desk.x1 - 0.18, lz = z1 - 0.15
  cyl(lx, lz, 0.06, h, 0.02, "black", 32); cyl(lx, lz, 0.007, h + 0.02, 0.3, "black", 8)
  add(new THREE.CylinderGeometry(0.07, 0.1, 0.13, 40, 1, true), "shade", { pos: [lx, h + 0.36, lz] })
  blk(desk.x0 + 0.4, z0 + 0.1, desk.x0 + 0.62, z0 + 0.4, h, h + 0.015, "cushion", 0.003)
  // the chair, facing the window, its back to the room
  TAG = "chair"
  const { w, d: cd, seat, back, y } = desk.chair, cx = (desk.x0 + desk.x1) / 2
  const [cx0, cx1, cz0, cz1] = [cx - w / 2, cx + w / 2, y - cd / 2, y + cd / 2]
  blk(cx0, cz0, cx1, cz1, FY + seat - 0.03, FY + seat, "pine", 0.006)
  for (const x of [cx0, cx1 - 0.035]) for (const z of [cz0, cz1 - 0.035]) blk(x, z, x + 0.035, z + 0.035, FY, FY + seat - 0.03, "leg")
  for (const x of [cx0, cx1 - 0.035]) blk(x, cz0, x + 0.035, cz0 + 0.035, FY + seat, FY + back, "leg")
  blk(cx0, cz0, cx1, cz0 + 0.025, FY + back - 0.16, FY + back, "pine", 0.004) // the backrest
}
{
  TAG = "hooks"
  const x = IX - 0.02, h = FY + hooks.h
  blk(x, hooks.y0, IX, hooks.y1, h - 0.05, h + 0.05, "pine", 0.003)
  const n = 4
  for (let i = 0; i < n; i++) {
    const z = hooks.y0 + ((i + 0.5) * (hooks.y1 - hooks.y0)) / n
    pipe([x, h, z], [x - 0.07, h + 0.02, z], 0.007, "hook")
  }
  TAG = "towel"
  blk(x - 0.04, hooks.y0 + 0.1, x - 0.005, hooks.y0 + 0.36, h - 0.55, h - 0.02, "towel", 0.01) // a towel hung on the first
}

// ------------------------------------------------------------ the veranda: two chairs and a table
{
  const { w, d, seat, back } = veranda.chair
  for (const [k, [cx, cz]] of veranda.chairs.entries()) {
    TAG = k ? "verandachair#2" : "verandachair"
    const [x0, x1, z0, z1] = [cx - w / 2, cx + w / 2, cz - d / 2, cz + d / 2] // its back toward the wall
    blk(x0, z0 + 0.05, x1, z1, VY + seat - 0.03, VY + seat, "pine")
    for (let i = 0; i < 3; i++) blk(x0, z0 + 0.02, x1, z0 + 0.05, VY + seat + 0.08 + i * 0.13, VY + seat + 0.18 + i * 0.13, "pine")
    for (const x of [x0 + 0.03, x1 - 0.03]) {
      pipe([x, VY, z1 - 0.03], [x, VY + seat, z0 + 0.1], 0.015, "leg")
      pipe([x, VY, z0 + 0.03], [x, VY + back, z0 + 0.035], 0.015, "leg")
    }
  }
  const { x, y, r, h } = veranda.table
  TAG = "verandatable"
  cyl(x, y, r, VY + h - 0.03, 0.03, "pine", 32)
  cyl(x, y, 0.025, VY + 0.02, h - 0.05, "leg", 8)
  cyl(x, y, 0.16, VY, 0.02, "leg", 24)
  cyl(x, y, 0.05, VY + h, 0.03, "black", 6); cyl(x, y, 0.04, VY + h + 0.03, 0.11, "lamp", 6); cyl(x, y, 0.05, VY + h + 0.14, 0.03, "black", 6)
}

TAG = ""

// ------------------------------------------------------------ the electrical installation (guest-room.json electric)
const E = C.electric
const S = services({ scene, meshes, LINE, floor: FY, ceiling: room.h })
if (ELEC || ITEM) S.build(E.points)

// ------------------------------------------------------------ camera: the front view
scene.updateMatrixWorld(true)
const ITEM_VIEW = { wardrobe: [1, 0.6, 0.75], hooks: [-1, 0.6, 0.75] }
const target = new THREE.Vector3(0, 1.0, 0.7)
const [el, dist] = [THREE.MathUtils.degToRad(36), 30]
const camera = new THREE.PerspectiveCamera(22, FW / FH, 0.5, 200)
let itemBox = null
if (ITEM) {
  const view = S.viewOf(E.points, ITEM) ?? new THREE.Vector3(...(ITEM_VIEW[ITEM] ?? [0.75, 0.6, 1]))
  itemBox = frameItem({ camera, meshes, item: ITEM, view, FW, FH }).bb
} else {
camera.position.set(0, target.y + dist * Math.sin(el), target.z + dist * Math.cos(el))
camera.lookAt(target)
camera.updateMatrixWorld(); camera.updateProjectionMatrix()
scene.updateMatrixWorld(true)
const bb = new THREE.Box3()
for (const o of meshes) if (!o.geometry.type.startsWith("Circle")) bb.expandByObject(o)
let px = [Infinity, Infinity, -Infinity, -Infinity]
for (const xx of [bb.min.x, bb.max.x]) for (const yy of [bb.min.y, bb.max.y]) for (const zz of [bb.min.z, bb.max.z]) {
  const p = new THREE.Vector3(xx, yy, zz).project(camera)
  const X = ((p.x + 1) / 2) * FW, Yp = ((1 - p.y) / 2) * FH
  px = [Math.min(px[0], X), Math.min(px[1], Yp), Math.max(px[2], X), Math.max(px[3], Yp)]
}
let w = (px[2] - px[0]) * 1.08, h = (px[3] - px[1]) * 1.08
if (w / h > FW / FH) h = (w * FH) / FW; else w = (h * FW) / FH
camera.setViewOffset(FW, FH, (px[0] + px[2]) / 2 - w / 2, (px[1] + px[3]) / 2 - h / 2, w, h)
}

// ------------------------------------------------------------ render
if (LINE) {
  // the electric view draws the room faint, so the devices and the runs read first
  const lines = (color, linewidth) => {
    const x = new LineMaterial({ color, linewidth })
    x.resolution.set(FW, FH)
    x.userData.outlineParameters = { visible: false }
    return x
  }
  const lineMat = ELEC ? lines(0xbdbdbd, 1.2) : lines(INK, 1.3), devMat = lines(0x141414, 1.6)
  for (const o of meshes) {
    if (o.userData.noEdges || o.material === MAT.cut || !o.visible) continue
    o.updateMatrixWorld(true)
    const g = new LineSegmentsGeometry().fromEdgesGeometry(new THREE.EdgesGeometry(o.geometry, 30))
    const l = new LineSegments2(g, o.userData.elec ? devMat : lineMat)
    l.matrixAutoUpdate = false; l.matrix.copy(o.matrixWorld)
    scene.add(l)
  }
  if (ELEC) {
    for (const m of Object.values(MAT)) m.userData.outlineParameters = { ...m.userData.outlineParameters, color: [0.74, 0.74, 0.74] }
    MAT.cut?.color.set("#a3a3a3")
    S.runs(E.points, E.circuits, "DB", camera, FW, FH)
    window.TAGS = S.tags(E.points, camera)
  }
  const ink = new THREE.Color(INK)
  MAT.cut && (MAT.cut.userData.outlineParameters = { visible: false })
  new OutlineEffect(renderer, { defaultThickness: 0.003, defaultColor: [ink.r, ink.g, ink.b] }).render(scene, camera)
} else {
  const pmrem = new THREE.PMREMGenerator(renderer)
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture
  scene.environmentIntensity = 0.45
  scene.add(new THREE.HemisphereLight(0xeef3ff, 0x8a7a5a, 0.85))
  const sun = new THREE.DirectionalLight(0xfff0d8, 2.6)
  sun.position.set(-6, 11, 9) // from the front, over the left shoulder
  sun.castShadow = true
  sun.shadow.mapSize.set(4096, 4096)
  Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 40 })
  sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.02; sun.shadow.radius = 4
  scene.add(sun)
  if (ITEM) itemGround(scene, itemBox)
  const composer = new EffectComposer(renderer)
  composer.setSize(FW, FH)
  composer.addPass(new RenderPass(scene, camera))
  const ao = new GTAOPass(scene, camera, FW, FH)
  ao.blendIntensity = 0.8
  ao.updateGtaoMaterial({ radius: 0.3, distanceExponent: 1.5, thickness: 1, scale: 1 })
  composer.addPass(ao)
  composer.addPass(new OutputPass())
  composer.render()
}
document.getElementById("out").src = renderer.domElement.toDataURL("image/png")
document.body.dataset.ready = "1"
</script>
