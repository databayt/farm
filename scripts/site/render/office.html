<!doctype html>
<!--
  /en/office's 3D, in the pattern of the camp's (scripts/site/render/camp.html): the office seen from the
  front with its front wall off, built from src/components/office/office.json (the numbers the 2D draws).
  The box follows the homepage model (scripts/site/render/compound.html, rowUnit): a saffron 20 ft container
  with ribs, raised 0.8 m on a red steel frame, a timber deck in front, red pipe railings and the stair at the
  deck's end. The furniture follows the studio's (scripts/studio/render/room.html): off-white linings, an oak
  floor, Medium Oak furniture. Rendered two ways:

    ?mode=line  line drawing on a transparent ground   -> public/designs/office/render/office-line.png
    ?mode=real  materials, daylight and shadow         -> public/designs/office/render/office-real.webp
    &view=electric  the wiring in the same view (office.json `electric`, built by room-services.js): line mode
                draws the room faint, every device dark and each circuit's run in its colour, dashed under the floor
                to the reception's floor box, and sets window.TAGS -> render/electric-line.png + electric-tags.json;
                real mode shows the finished devices -> render/electric-real.webp
    &view=network   the same for the network (office.json `network`): the cabinet, its router, switch, gateway and
                UPS, the access point and the data outlets -> render/network-line.png + network-tags.json
    &item=<id>  one piece on its own, real mode, 1200 x 900 on a transparent ground: the furniture and equipment
                (table, woodchair, reception, officechair, monitor, desk, shelves, printer, screen, ac)
                -> render/furniture/<id>.webp; a device by its model -> render/electric/<id>.webp or render/network/<id>.webp

  Serve the repo root on a spare port, open this page at 2400 x 1100, and once body[data-ready] is set
  save the data URL in #out.
-->
<html>
<head>
<meta charset="utf-8">
<style>
html,body{margin:0;background:#fff}
#out{display:block;width:2400px;height:1100px}
</style>
<script type="importmap">
{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}
</script>
</head>
<body>
<img id="out" alt="">
<script type="module">
import * as THREE from "three"
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js"
import { OutlineEffect } from "three/addons/effects/OutlineEffect.js"
import { LineSegments2 } from "three/addons/lines/LineSegments2.js"
import { LineSegmentsGeometry } from "three/addons/lines/LineSegmentsGeometry.js"
import { LineMaterial } from "three/addons/lines/LineMaterial.js"
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js"
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js"
import { RenderPass } from "three/addons/postprocessing/RenderPass.js"
import { GTAOPass } from "three/addons/postprocessing/GTAOPass.js"
import { OutputPass } from "three/addons/postprocessing/OutputPass.js"
import { services, frameItem, itemGround } from "./room-services.js"

const Q = new URLSearchParams(location.search)
const LINE = Q.get("mode") !== "real"
const ITEM = Q.get("item"), ELEC = Q.get("view") === "electric", NET = Q.get("view") === "network"
const [FW, FH] = ITEM ? [1200, 900] : [2400, 1100]
let TAG = "" // the piece being built, for ?item=
const C = await (await fetch(`/src/components/office/office.json?${Date.now()}`)).json()
const INK = "#2b2a26", PAGE = "#ffffff"
// plan (x right from the stair end, y toward the deck) -> three: x = x, y = height, z = y; the camera stands
// in front of the deck, at +z

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true })
renderer.setClearColor(0xffffff, 0)
renderer.setPixelRatio(1)
renderer.setSize(FW, FH)
renderer.outputColorSpace = THREE.SRGBColorSpace
if (!LINE) {
  renderer.toneMapping = THREE.ACESFilmicToneMapping
  renderer.shadowMap.enabled = true
  renderer.shadowMap.type = THREE.PCFSoftShadowMap
}
const scene = new THREE.Scene()

// ------------------------------------------------------------ procedural textures (real mode)
let seed = 7
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647)
function tex(draw, w = 512, h = 512) {
  const c = document.createElement("canvas"); c.width = w; c.height = h
  seed = 7
  draw(c.getContext("2d"), w, h)
  const t = new THREE.CanvasTexture(c)
  t.colorSpace = THREE.SRGBColorSpace
  t.wrapS = t.wrapT = THREE.RepeatWrapping
  t.anisotropy = 8
  return t
}
const T = LINE ? {} : {
  // the container's corrugation, as compound.html: light and shade across one pitch, a few streaks down it
  corr: tex((g, w, h) => {
    for (let x = 0; x < w; x++) {
      const p = x / w
      const v = p < 0.3 ? 0.95 : p < 0.42 ? 0.95 - (p - 0.3) * 2.2 : p < 0.72 ? 0.69 : p < 0.84 ? 0.69 + (p - 0.72) * 1.5 : 0.87
      g.fillStyle = `rgb(${Math.round(255 * v)},${Math.round(255 * v)},${Math.round(255 * v)})`
      g.fillRect(x, 0, 1, h)
    }
    for (let i = 0; i < 40; i++) {
      g.fillStyle = `rgba(60,40,30,${0.02 + rnd() * 0.04})`
      g.fillRect(rnd() * w, rnd() * h * 0.3, 1 + rnd() * 3, h * (0.3 + rnd() * 0.7))
    }
  }, 64, 256),
  // eucalyptus deck boards, 140 mm wide, along u
  boards: tex((g, w, h) => {
    const n = 10, bh = h / n
    for (let i = 0; i < n; i++) {
      const k = 0.88 + rnd() * 0.2
      g.fillStyle = `rgb(${Math.round(196 * k)},${Math.round(139 * k)},${Math.round(85 * k)})`
      g.fillRect(0, i * bh, w, bh)
      for (let j = 0; j < 30; j++) {
        g.fillStyle = `rgba(110,70,35,${0.05 + rnd() * 0.08})`
        g.fillRect(rnd() * w, i * bh + rnd() * bh, 20 + rnd() * 120, 1)
      }
      g.fillStyle = "rgba(60,38,20,0.55)"; g.fillRect(0, i * bh, w, 2)
    }
  }),
  // natural oak planks as the studio's floor: honey-tan boards of varied tone, fine joints, long grain
  planks: tex((g, w, h) => {
    const tones = ["#b98b5b", "#c39663", "#a97c4f", "#bd9264", "#ae8255", "#c79b6a", "#b38556"]
    const rows = 8, rh = h / rows
    for (let r = 0; r < rows; r++) {
      let x = -Math.floor(rnd() * 300)
      while (x < w) {
        const len = 200 + Math.floor(rnd() * 220), y0 = r * rh
        g.fillStyle = tones[Math.floor(rnd() * tones.length)]; g.fillRect(x, y0, len, rh)
        for (let i = 0; i < 6; i++) {
          const y = y0 + rnd() * rh
          g.strokeStyle = `rgba(110,72,38,${0.08 + rnd() * 0.14})`; g.lineWidth = 0.7 + rnd() * 1.2
          g.beginPath(); g.moveTo(x, y)
          g.bezierCurveTo(x + len * 0.3, y + (rnd() - 0.5) * 5, x + len * 0.7, y + (rnd() - 0.5) * 5, x + len, y + (rnd() - 0.5) * 3)
          g.stroke()
        }
        g.fillStyle = "rgba(70,44,22,0.55)"; g.fillRect(x, y0, 2, rh)
        x += len
      }
      g.fillStyle = "rgba(70,44,22,0.5)"; g.fillRect(0, r * rh, w, 2)
    }
  }, 1024, 512),
  // pine in a Medium Oak finish, as the studio's furniture (~215,162,103 when lit): fine grain along u
  oak: tex((g, w, h) => {
    g.fillStyle = "#b9824c"; g.fillRect(0, 0, w, h)
    g.filter = "blur(10px)"
    for (let i = 0; i < 50; i++) {
      g.fillStyle = rnd() > 0.45 ? `rgba(146,88,38,${0.06 + rnd() * 0.1})` : `rgba(238,196,132,${0.06 + rnd() * 0.1})`
      g.beginPath(); g.ellipse(rnd() * w, rnd() * h, 60 + rnd() * 160, 8 + rnd() * 20, 0, 0, Math.PI * 2); g.fill()
    }
    g.filter = "none"
    for (let i = 0; i < 1800; i++) {
      const x = rnd() * w, y = rnd() * h, len = 20 + rnd() * 110
      g.strokeStyle = rnd() > 0.35 ? `rgba(116,70,30,${0.04 + rnd() * 0.08})` : `rgba(244,206,148,${0.04 + rnd() * 0.07})`
      g.lineWidth = 0.6 + rnd() * 0.7
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + len, y + (rnd() - 0.5) * 1.5); g.stroke()
    }
  }, 1024, 512),
  grass: tex((g, w, h) => {
    g.fillStyle = "#6f9a4a"; g.fillRect(0, 0, w, h)
    for (let i = 0; i < 26000; i++) {
      g.fillStyle = rnd() > 0.5 ? "rgba(170,200,110,0.35)" : "rgba(40,70,30,0.35)"
      g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 2, 1 + rnd() * 2)
    }
  }),
  // the farm's map on the wall screen: lake, lawn, the compound's blocks in their paints
  map: tex((g, w, h) => {
    g.fillStyle = "#8fb06a"; g.fillRect(0, 0, w, h)
    g.fillStyle = "#6b8ea3"; g.beginPath(); g.ellipse(w * 0.5, h * 1.05, w * 0.7, h * 0.32, 0, 0, Math.PI * 2); g.fill()
    g.fillStyle = "#e4d6b4"; g.fillRect(w * 0.08, h * 0.16, w * 0.84, h * 0.5)
    for (const [x, y, ww, hh, c] of [[0.1, 0.18, 0.08, 0.4, "#3e8a86"], [0.2, 0.18, 0.04, 0.2, "#8a3227"], [0.3, 0.56, 0.12, 0.07, "#d9a21b"],
      [0.46, 0.56, 0.12, 0.07, "#8a3227"], [0.62, 0.56, 0.12, 0.07, "#8a3227"], [0.3, 0.18, 0.3, 0.07, "#3e8a86"], [0.66, 0.18, 0.2, 0.07, "#8a8a8a"]]) {
      g.fillStyle = c; g.fillRect(w * x, h * y, w * ww, h * hh)
    }
    g.strokeStyle = "#f6f2e8"; g.lineWidth = 3; g.strokeRect(w * 0.08, h * 0.16, w * 0.84, h * 0.5)
  }, 512, 300),
  // box files and binders on the open shelves: spines in a few office colours
  files: tex((g, w, h) => {
    g.fillStyle = "#f0ece3"; g.fillRect(0, 0, w, h)
    let x = 0
    const cols = ["#2f4f6a", "#d8d2c4", "#a63a2c", "#3c3c3c", "#c9973a", "#e9e4d8", "#4c6e4a"]
    while (x < w) {
      const bw = 18 + rnd() * 26, bh = h * (0.7 + rnd() * 0.3)
      g.fillStyle = cols[Math.floor(rnd() * cols.length)]; g.fillRect(x, h - bh, bw - 2, bh)
      g.fillStyle = "rgba(255,255,255,0.7)"; g.fillRect(x + bw * 0.2, h - bh * 0.6, bw * 0.5, bh * 0.18)
      x += bw + (rnd() > 0.85 ? 30 : 0)
    }
  }, 512, 128),
}
// metres one tile covers [along, across]
const TILE = { saffron: [0.278, 2.6], timber: [1.4, 1.4], floor: [2.4, 1.2], oak: [1.2, 0.6] }

// ------------------------------------------------------------ materials
const SAFFRON = "#d9a21b"
// thin parts get crease lines but no silhouette, so railings and legs stay fine in the line drawing
const THIN = new Set(["red", "white-frame", "steel", "leg", "black", "cage"])
const MAT = {}
function mat(name) {
  if (MAT[name]) return MAT[name]
  if (name === "rib") { // the corrugations: the wall's paint, no silhouette in the line drawing
    if (!LINE) return (MAT[name] = mat("saffron"))
    const m = new THREE.MeshBasicMaterial({ color: PAGE, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 })
    m.userData.outlineParameters = { visible: false }
    return (MAT[name] = m)
  }
  let x
  if (LINE) {
    x = new THREE.MeshBasicMaterial({ color: PAGE, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 })
    if (name === "glass") x = new THREE.MeshBasicMaterial({ color: PAGE, transparent: true, opacity: 0, depthWrite: false })
    if (THIN.has(name)) x.userData.outlineParameters = { visible: false }
  } else {
    const std = (o) => new THREE.MeshStandardMaterial(o)
    x = {
      saffron: () => std({ map: T.corr, color: SAFFRON, roughness: 0.55, metalness: 0.15 }),
      frame: () => std({ color: new THREE.Color(SAFFRON).multiplyScalar(0.86), roughness: 0.5, metalness: 0.2 }),
      red: () => std({ color: "#7e2f26", roughness: 0.45, metalness: 0.35 }), // the frame, railings
      "white-frame": () => std({ color: "#f1f0eb", roughness: 0.4 }),
      steel: () => std({ color: "#b8bdc1", roughness: 0.3, metalness: 0.85 }),
      timber: () => std({ map: T.boards, roughness: 0.75 }),
      wall: () => std({ color: "#f0ece3", roughness: 0.88 }), // off-white painted linings
      floor: () => std({ map: T.planks, color: "#d1c8c1", roughness: 0.55 }),
      oak: () => std({ map: T.oak, roughness: 0.6 }), // the furniture, Medium Oak
      white: () => std({ color: "#f3f2ee", roughness: 0.5 }),
      cage: () => std({ color: "#f3f2ee", roughness: 0.5 }), // the fan's guard, thin in the line drawing
      black: () => std({ color: "#232427", roughness: 0.55, metalness: 0.2 }),
      mesh: () => std({ color: "#2b2c30", roughness: 0.9 }), // the chairs' mesh and seats
      leg: () => std({ color: "#9c9fa3", roughness: 0.35, metalness: 0.8 }),
      screen: () => std({ map: T.map, roughness: 0.3, emissive: "#ffffff", emissiveMap: T.map, emissiveIntensity: 0.25 }),
      monitor: () => std({ color: "#1d2a35", roughness: 0.2, emissive: "#4d6a80", emissiveIntensity: 0.25 }),
      files: () => std({ map: T.files, roughness: 0.8 }),
      pot: () => std({ color: "#d9d4c8", roughness: 0.8 }),
      soil: () => std({ color: "#4a3626", roughness: 1 }),
      leaf: () => std({ color: "#5f7c46", roughness: 0.9 }),
      leaf2: () => std({ color: "#76924f", roughness: 0.9 }),
      lawn: () => std({ map: T.grass, roughness: 1 }),
      glass: () => new THREE.MeshPhysicalMaterial({ color: "#d3e3e8", roughness: 0.05, metalness: 0.1, transparent: true, opacity: 0.35, depthWrite: false }),
    }[name]?.() ?? std({ color: "#cccccc", roughness: 0.8 })
  }
  return (MAT[name] = x)
}

// ------------------------------------------------------------ geometry helpers (metres)
const meshes = []
// texture coordinates at true scale: each face takes the texture from its own plane
function worldUV(geo, [tu, tv]) {
  const pos = geo.attributes.position, nrm = geo.attributes.normal, uv = geo.attributes.uv
  if (!uv) return
  geo.computeBoundingBox()
  const size = geo.boundingBox.getSize(new THREE.Vector3()).toArray()
  const long = size.indexOf(Math.max(...size))
  for (let i = 0; i < pos.count; i++) {
    const n = [Math.abs(nrm.getX(i)), Math.abs(nrm.getY(i)), Math.abs(nrm.getZ(i))]
    const axis = n.indexOf(Math.max(...n))
    const p = [pos.getX(i), pos.getY(i), pos.getZ(i)]
    let [a, b] = axis === 0 ? [2, 1] : axis === 2 ? [0, 1] : [0, 2]
    if (b === long) [a, b] = [b, a] // the grain along the piece
    uv.setXY(i, p[a] / tu, p[b] / tv)
  }
  uv.needsUpdate = true
}
function add(geo, name, opts = {}) {
  const tile = TILE[name === "rib" ? "saffron" : name]
  if (!LINE && tile) worldUV(geo, tile)
  const mesh = new THREE.Mesh(geo, mat(name))
  mesh.castShadow = !LINE && name !== "glass" && name !== "lawn" && !opts.noShadow
  mesh.receiveShadow = !LINE
  if (opts.pos) mesh.position.set(...opts.pos)
  if (opts.rot) mesh.rotation.set(...opts.rot)
  if (opts.noEdges) mesh.userData.noEdges = true
  mesh.userData.tag = TAG
  scene.add(mesh)
  meshes.push(mesh)
  return mesh
}
// a box over a plan rectangle (x, z in any order), from height y0 to y1. Geometry is built in place, so the
// textures land at world scale
function blk(xa, za, xb, zb, y0, y1, name, opts) {
  const [x0, x1, z0, z1] = [Math.min(xa, xb), Math.max(xa, xb), Math.min(za, zb), Math.max(za, zb)]
  const g = new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0)
  g.translate((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2)
  return add(g, name, opts)
}
function soft(xa, za, xb, zb, y0, y1, r, name) {
  const [x0, x1, z0, z1] = [Math.min(xa, xb), Math.max(xa, xb), Math.min(za, zb), Math.max(za, zb)]
  return add(new RoundedBoxGeometry(x1 - x0, y1 - y0, z1 - z0, 4, r), name, { pos: [(x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2] })
}
function cyl(x, z, r, y0, h, name, seg = 24, rTop = r) {
  return add(new THREE.CylinderGeometry(rTop, r, h, seg), name, { pos: [x, y0 + h / 2, z] })
}
function pipe(a, b, r, name) {
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b)
  const mesh = add(new THREE.CylinderGeometry(r, r, A.distanceTo(B), 6), name, { pos: A.clone().add(B).multiplyScalar(0.5).toArray() })
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), B.sub(A).normalize())
  return mesh
}

// ------------------------------------------------------------ the box on its frame, the deck, the stair
const { container: K, glazing, deck, meeting, reception, desk, shelves, printer, screen, ac, fan, plants } = C
const L = K.l, H = K.w / 2, Y0 = K.raised, HC = K.h
const FL = Y0 + K.floor, CE = Y0 + K.ceiling // inside: the finished floor, the ceiling
const { x0: ix0, x1: ix1, y0: iz0, y1: iz1 } = K.inner
const front = H, edge = H + deck.d
if (!LINE && !ITEM) {
  T.grass.repeat.set(10, 10)
  add(new THREE.CircleGeometry(30, 64), "lawn", { rot: [-Math.PI / 2, 0, 0], pos: [L / 2, 0, 1] })
}
{
  // the steel frame the container and the deck stand on: red posts, a beam under the deck's front edge
  for (const x of [0.1, L / 2, L - 0.1]) for (const z of [edge - 0.1, front - 0.1, -H + 0.1]) blk(x - 0.05, z - 0.05, x + 0.05, z + 0.05, 0, Y0 - 0.1, "red")
  blk(0, edge - 0.08, L, edge, Y0 - 0.22, Y0 - 0.1, "red")
  for (const x of [0.1, L / 2, L - 0.1]) blk(x - 0.04, front, x + 0.04, edge, Y0 - 0.2, Y0 - 0.1, "red")
  blk(0, front, L, edge, Y0 - 0.1, Y0, "timber")
  // red pipe railings round the deck's three open sides, posts at 1.4 m or less, a top and a mid rail; the
  // stair end's rail stops short of the front corner, where the stair comes up
  const rail = (a, b) => {
    const len = Math.hypot(b[0] - a[0], b[1] - a[1]), n = Math.max(1, Math.ceil(len / 1.4))
    for (let i = 0; i <= n; i++) cyl(a[0] + ((b[0] - a[0]) * i) / n, a[1] + ((b[1] - a[1]) * i) / n, 0.022, Y0, 1.0, "red", 6)
    pipe([a[0], Y0 + 1.0, a[1]], [b[0], Y0 + 1.0, b[1]], 0.024, "red")
    pipe([a[0], Y0 + 0.5, a[1]], [b[0], Y0 + 0.5, b[1]], 0.016, "red")
  }
  const r = edge - 0.03, st = deck.stair
  rail([0.03, front], [0.03, edge - st.w]); rail([0.03, r], [L - 0.03, r]); rail([L - 0.03, r], [L - 0.03, front])
  // the stair down off the front corner at the cargo-door end: timber treads on two red stringers
  const rise = Y0 / st.risers
  for (let k = 1; k < st.risers; k++) blk(-st.tread * k, edge - st.w, -st.tread * (k - 1), edge, rise * (st.risers - k) - 0.04, rise * (st.risers - k), "timber")
  for (const z of [edge - st.w + 0.03, edge - 0.03]) pipe([-st.tread * (st.risers - 1), 0, z], [0, Y0 - 0.05, z], 0.03, "red")
  pipe([-st.tread * (st.risers - 1) + 0.05, 1.0, edge - 0.03], [0, Y0 + 1.0, edge - 0.03], 0.024, "red") // the handrail down
  cyl(-st.tread * (st.risers - 1) + 0.05, edge - 0.03, 0.022, 0, 1.0, "red", 6)
}
{
  // the container: floor, the back wall and both ends in saffron steel with their corrugations outside, the
  // corner posts and rails in a deeper shade; front wall and roof off, so the room shows
  const e = 0.03
  blk(0, -H, L, H, Y0, Y0 + 0.14, "frame") // the bottom rails and floor bearers
  blk(0, -H, L, -H + e, Y0 + 0.14, Y0 + HC - 0.1, "saffron")
  blk(0, -H, e, H, Y0 + 0.14, Y0 + HC - 0.1, "saffron")
  blk(L - e, -H, L, H, Y0 + 0.14, Y0 + HC - 0.1, "saffron")
  for (const x of [0, L - 0.15]) for (const z of [-H, H - 0.15]) blk(x, z, x + 0.15, z + 0.15, Y0, Y0 + HC, "frame")
  blk(0, -H, L, -H + 0.12, Y0 + HC - 0.1, Y0 + HC, "frame")
  for (const x of [0, L - 0.12]) blk(x, -H, x + 0.12, H, Y0 + HC - 0.1, Y0 + HC, "frame")
  // ribs: along the back wall outside, and across both end walls
  for (let a = 0.35; a <= L - 0.35; a += 0.278) blk(a - 0.04, -H - 0.03, a + 0.04, -H + 0.005, Y0 + 0.16, Y0 + HC - 0.12, "rib")
  for (const x of [-0.03, L - 0.005]) for (let a = -H + 0.3; a <= H - 0.3; a += 0.278) blk(x, a - 0.04, x + 0.035, a + 0.04, Y0 + 0.16, Y0 + HC - 0.12, "rib")
  // the cargo doors at the stair end: four locking bars down the outside
  for (const k of [0.2, 0.36, 0.64, 0.8]) cyl(-0.07, -H + K.w * k, 0.022, Y0 + 0.2, HC - 0.4, "steel", 8)
  // inside: the floor, off-white linings on the back and both ends, the ceiling line
  blk(ix0 - 0.07, iz0 - 0.07, ix1 + 0.07, front, Y0 + 0.14, FL, "floor")
  blk(e, iz0 - 0.06, ix1 + 0.07, iz0, FL, CE, "wall")
  blk(e, iz0, ix0, iz1 + 0.07, FL, CE, "wall")
  blk(ix1, iz0, L - e, iz1 + 0.07, FL, CE, "wall")
  // the front: the threshold with the glazing's track; its sliding panels stand in the 2D and the hero
  blk(0, front - 0.1, L, front, Y0 + 0.14, FL + 0.01, "frame")
  blk(glazing.x0, front - 0.09, glazing.x1, front - 0.02, FL, FL + 0.03, "white-frame")
}

// ------------------------------------------------------------ furniture
// an office chair: five-star base on castors, gas column, black seat and a mesh back; faces +z (rot turns it)
function officeChair(x, z, rot) {
  const g = new THREE.Group(); g.position.set(x, FL, z); g.rotation.y = rot
  const parts = []
  const put = (geo, name, pos, r) => { const m = add(geo, name, { pos }); if (r) m.rotation.set(...r); scene.remove(m); g.add(m); parts.push(m) }
  for (let k = 0; k < 5; k++) {
    const a = (k * 2 * Math.PI) / 5
    put(new THREE.BoxGeometry(0.03, 0.03, 0.3), "black", [Math.sin(a) * 0.14, 0.07, Math.cos(a) * 0.14], [0, a, 0])
    put(new THREE.CylinderGeometry(0.025, 0.025, 0.04, 8), "black", [Math.sin(a) * 0.29, 0.025, Math.cos(a) * 0.29], [Math.PI / 2, a, 0])
  }
  put(new THREE.CylinderGeometry(0.025, 0.025, 0.36, 8), "leg", [0, 0.26, 0])
  put(new RoundedBoxGeometry(0.48, 0.07, 0.46, 3, 0.025), "mesh", [0, 0.47, 0.02])
  put(new RoundedBoxGeometry(0.45, 0.52, 0.04, 3, 0.018), "mesh", [0, 0.82, -0.22], [-0.12, 0, 0])
  for (const s of [-1, 1]) {
    put(new THREE.BoxGeometry(0.03, 0.2, 0.03), "black", [s * 0.25, 0.58, 0.05])
    put(new THREE.BoxGeometry(0.05, 0.025, 0.24), "black", [s * 0.25, 0.69, 0.05])
  }
  scene.add(g)
  g.updateMatrixWorld(true)
}
// a timber meeting chair: four legs, a seat, a slatted back; faces +z
function woodChair(x, z, rot) {
  const { w, d, seat, back } = meeting.chair
  const g = new THREE.Group(); g.position.set(x, FL, z); g.rotation.y = rot
  const put = (geo, name, pos) => { const m = add(geo, name, { pos }); scene.remove(m); g.add(m) }
  for (const [lx, lz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
    const top = lz < 0 ? back : seat
    put(new THREE.BoxGeometry(0.035, top, 0.035), "oak", [lx * (w / 2 - 0.03), top / 2, lz * (d / 2 - 0.03)])
  }
  put(new THREE.BoxGeometry(w, 0.03, d), "oak", [0, seat, 0])
  for (const y of [seat + 0.18, seat + 0.32]) put(new THREE.BoxGeometry(w - 0.04, 0.07, 0.02), "oak", [0, y, -d / 2 + 0.03])
  scene.add(g)
  g.updateMatrixWorld(true)
}
// a desk with panel ends and a modesty panel, as in today's office
function panelDesk(x0, z0, x1, z1, h, modestyAt) {
  blk(x0, z0, x1, z1, FL + h - 0.025, FL + h, "oak")
  const along = x1 - x0 > z1 - z0
  if (along) {
    for (const x of [x0 + 0.01, x1 - 0.035]) blk(x, z0 + 0.03, x + 0.025, z1 - 0.03, FL, FL + h - 0.025, "oak")
    const z = modestyAt === "front" ? z1 - 0.06 : z0 + 0.03
    blk(x0 + 0.035, z, x1 - 0.035, z + 0.02, FL + 0.3, FL + h - 0.025, "oak")
  } else {
    for (const z of [z0 + 0.01, z1 - 0.035]) blk(x0 + 0.03, z, x1 - 0.03, z + 0.025, FL, FL + h - 0.025, "oak")
    blk(x1 - 0.05, z0 + 0.035, x1 - 0.03, z1 - 0.035, FL + 0.3, FL + h - 0.025, "oak")
  }
}
function monitor(x, z, top, rot) {
  const g = new THREE.Group(); g.position.set(x, top, z); g.rotation.y = rot
  const put = (geo, name, pos) => { const m = add(geo, name, { pos }); scene.remove(m); g.add(m) }
  put(new THREE.BoxGeometry(0.22, 0.012, 0.16), "black", [0, 0.006, 0])
  put(new THREE.BoxGeometry(0.04, 0.2, 0.025), "black", [0, 0.11, -0.03])
  put(new THREE.BoxGeometry(0.56, 0.34, 0.025), "black", [0, 0.36, -0.01])
  put(new THREE.BoxGeometry(0.53, 0.31, 0.004), "monitor", [0, 0.36, 0.004])
  put(new THREE.BoxGeometry(0.42, 0.015, 0.13), "black", [0, 0.008, 0.2]) // the keyboard
  scene.add(g)
  g.updateMatrixWorld(true)
}
function plant(x, z, y0, s) {
  cyl(x, z, 0.13 * s, y0, 0.28 * s, "pot", 20, 0.16 * s)
  cyl(x, z, 0.14 * s, y0 + 0.26 * s, 0.015, "soil", 20)
  const leaves = [[0, 0.62, 0, 0.22], [0.1, 0.48, 0.06, 0.15], [-0.1, 0.5, -0.04, 0.16], [0.03, 0.78, -0.05, 0.14], [-0.06, 0.4, 0.09, 0.12]]
  leaves.forEach(([dx, dy, dz, r], i) => add(new THREE.IcosahedronGeometry(r * s, 1), i % 2 ? "leaf2" : "leaf", { pos: [x + dx * s, y0 + dy * s, z + dz * s] }))
  if (s > 1) cyl(x, z, 0.012 * s, y0 + 0.26 * s, 0.3 * s, "leaf", 6)
}

// the meeting table for four, its chairs, the screen with the farm's map over it, the AC, the tall plant
{
  const { x, y, r, h } = meeting
  TAG = "table"
  cyl(x, y, r, FL + h - 0.03, 0.03, "oak", 48)
  cyl(x, y, 0.04, FL + 0.02, h - 0.05, "oak", 12)
  cyl(x, y, 0.26, FL, 0.025, "oak", 32)
  for (const [k, [cx, cz]] of meeting.chairs.entries()) { TAG = k ? `woodchair#${k}` : "woodchair"; woodChair(cx, cz, Math.atan2(x - cx, y - cz)) }
  TAG = "screen"
  const sy = screen.y, sb = FL + screen.bottom
  blk(ix0, sy - screen.w / 2, ix0 + 0.04, sy + screen.w / 2, sb, sb + screen.h, "black")
  blk(ix0 + 0.04, sy - screen.w / 2 + 0.02, ix0 + 0.045, sy + screen.w / 2 - 0.02, sb + 0.02, sb + screen.h - 0.02, "screen", { noShadow: true })
  TAG = "ac"
  soft(ac.x0, iz0, ac.x1, iz0 + ac.d, FL + ac.y0, FL + ac.y1, 0.03, "white")
  blk(ac.x0 + 0.05, iz0 + ac.d, ac.x1 - 0.05, iz0 + ac.d + 0.005, FL + ac.y0 + 0.03, FL + ac.y0 + 0.06, "black")
  TAG = ""
  plant(plants.floor[0], plants.floor[1], FL, 1.6)
}
// the filing wall: closed cupboards below, open shelves with box files above, a small plant
{
  TAG = "shelves"
  const { x0, x1, d, h, base, rows } = shelves, z0 = iz0, z1 = iz0 + d
  blk(x0, z0, x1, z1, FL, FL + 0.06, "oak")
  for (const x of [x0, x0 + (x1 - x0) / 2 - 0.009, x1 - 0.018]) blk(x, z0, x + 0.018, z1, FL, FL + h, "oak")
  const n = 4, dw = (x1 - x0) / n
  for (let i = 0; i < n; i++) blk(x0 + i * dw + 0.02, z1 - 0.018, x0 + (i + 1) * dw - 0.003, z1, FL + 0.065, FL + base - 0.005, "oak")
  for (let i = 0; i < n; i++) blk(x0 + (i + 0.5) * dw - 0.06, z1, x0 + (i + 0.5) * dw + 0.06, z1 + 0.015, FL + base - 0.09, FL + base - 0.075, "leg")
  const pitch = (h - base) / rows
  for (let k = 0; k <= rows; k++) blk(x0, z0, x1, z1, FL + base + k * pitch - (k === 0 ? 0.02 : 0.018), FL + base + k * pitch + (k === 0 ? 0 : 0), "oak")
  for (let k = 0; k < rows; k++) {
    const y = FL + base + k * pitch
    // files fill each shelf, with a gap where the plant stands
    const gap = k === 0 ? [plants.shelf[0] - 0.2, plants.shelf[0] + 0.2] : null
    const spans = gap ? [[x0 + 0.02, gap[0]], [gap[1], x1 - 0.02]] : [[x0 + 0.02, x1 - 0.02]]
    for (const [a, b] of spans) blk(a, z0 + 0.02, b, z0 + d - 0.04, y, y + pitch * 0.72, "files")
  }
  TAG = ""
  plant(plants.shelf[0], plants.shelf[1] + 0.08, FL + base, 0.6)
}
// the reception desk facing the glazing, its chair behind, a monitor
{
  const r = reception
  TAG = "reception"
  panelDesk(r.x0, r.y0, r.x1, r.y1, r.h, "front")
  TAG = "officechair"
  officeChair(r.chair[0], r.chair[1], 0)
  TAG = "monitor"
  monitor((r.x0 + r.x1) / 2, r.y0 + 0.2, FL + r.h, 0)
}
// the second desk on the far end wall, chair facing the wall, monitor; the printer cabinet; the wall fan
{
  TAG = "desk"
  panelDesk(desk.x0, desk.y0, desk.x1, desk.y1, desk.h)
  TAG = "officechair#2"
  officeChair(desk.chair[0], desk.chair[1], Math.PI / 2)
  TAG = "monitor#2"
  monitor(desk.x1 - 0.2, (desk.y0 + desk.y1) / 2, FL + desk.h, -Math.PI / 2)
  TAG = "printer"
  const p = printer
  blk(p.x0, p.y0, p.x1, p.y1, FL, FL + p.h, "oak")
  blk(p.x0 - 0.012, p.y0 + 0.02, p.x0, p.y1 - 0.02, FL + 0.05, FL + p.h - 0.03, "oak")
  soft(p.x0 + 0.05, p.y0 + 0.08, p.x1 - 0.06, p.y1 - 0.08, FL + p.h, FL + p.h + 0.26, 0.02, "white")
  blk(p.x0 + 0.02, p.y0 + 0.12, p.x0 + 0.05, p.y1 - 0.12, FL + p.h + 0.08, FL + p.h + 0.11, "black")
  TAG = "wallfan"
  const fy = FL + fan.at, fz = fan.y
  blk(ix1 - 0.06, fz - 0.06, ix1, fz + 0.06, fy - 0.08, fy + 0.08, "white")
  cyl(ix1 - 0.15, fz, 0.07, fy - 0.07, 0.14, "white", 16).rotation.z = Math.PI / 2
  const cage = add(new THREE.TorusGeometry(fan.r, 0.008, 6, 32), "cage", { pos: [ix1 - 0.26, fy, fz] })
  cage.rotation.y = Math.PI / 2
  const disc = add(new THREE.CircleGeometry(fan.r - 0.01, 24), "white", { pos: [ix1 - 0.265, fy, fz], noEdges: true })
  disc.rotation.y = -Math.PI / 2
  if (!LINE) { disc.material = disc.material.clone(); disc.material.transparent = true; disc.material.opacity = 0.35 }
}

TAG = ""

// ------------------------------------------------------------ the electrical and network installations (office.json)
const S = services({ scene, meshes, LINE, floor: FL, ceiling: K.ceiling - K.floor })
const SYS = NET ? C.network : C.electric
const existing = new Set(C.electric.points.filter((p) => p.existing).map((p) => p.model))
for (const o of meshes) if (existing.has(o.userData.tag) && (ELEC || ITEM)) o.userData.elec = true // the 3D's own fan
if (ELEC || NET) S.build(SYS.points, existing)
if (ITEM) { S.build(C.electric.points, existing); S.build(C.network.points) }

// ------------------------------------------------------------ camera: the front view, a little from the stair end
scene.updateMatrixWorld(true)
const ITEM_VIEW = { shelves: [0.6, 0.55, 1], desk: [-1, 0.6, 0.6], "officechair": [0.6, 0.6, -1], printer: [-1, 0.6, 0.75], screen: [1, 0.4, 0.6], ac: [0.5, 0.2, 1], wallfan: [-1, 0.3, 0.7] }
const camera = new THREE.PerspectiveCamera(22, FW / FH, 0.5, 200)
let itemBox = null
if (ITEM) {
  const view = (existing.has(ITEM) ? null : S.viewOf([...C.electric.points, ...C.network.points], ITEM)) ?? new THREE.Vector3(...(ITEM_VIEW[ITEM] ?? [0.75, 0.6, 1]))
  itemBox = frameItem({ camera, meshes, item: ITEM, view, FW, FH }).bb
} else {
const target = new THREE.Vector3(L / 2 - 0.2, Y0 + 0.9, 0.4)
const [el, az, dist] = [THREE.MathUtils.degToRad(27), THREE.MathUtils.degToRad(-14), 32]
camera.position.set(target.x + dist * Math.cos(el) * Math.sin(az), target.y + dist * Math.sin(el), target.z + dist * Math.cos(el) * Math.cos(az))
camera.lookAt(target)
camera.updateMatrixWorld(); camera.updateProjectionMatrix()
const bb = new THREE.Box3()
for (const o of meshes) if (!o.geometry.type.startsWith("Circle")) bb.expandByObject(o)
let px = [Infinity, Infinity, -Infinity, -Infinity]
for (const xx of [bb.min.x, bb.max.x]) for (const yy of [bb.min.y, bb.max.y]) for (const zz of [bb.min.z, bb.max.z]) {
  const p = new THREE.Vector3(xx, yy, zz).project(camera)
  const X = ((p.x + 1) / 2) * FW, Yp = ((1 - p.y) / 2) * FH
  px = [Math.min(px[0], X), Math.min(px[1], Yp), Math.max(px[2], X), Math.max(px[3], Yp)]
}
let w = (px[2] - px[0]) * 1.06, h = (px[3] - px[1]) * 1.08
if (w / h > FW / FH) h = (w * FH) / FW; else w = (h * FW) / FH
camera.setViewOffset(FW, FH, (px[0] + px[2]) / 2 - w / 2, (px[1] + px[3]) / 2 - h / 2, w, h)
}

// ------------------------------------------------------------ render
if (LINE) {
  // the services views draw the room faint, so the devices and the runs read first
  const FAINT = ELEC || NET
  const lines = (color, linewidth) => {
    const x = new LineMaterial({ color, linewidth, side: THREE.DoubleSide })
    x.resolution.set(FW, FH)
    x.userData.outlineParameters = { visible: false }
    return x
  }
  const lineMat = FAINT ? lines(0xbdbdbd, 1.2) : lines(INK, 1.3), devMat = lines(0x141414, 1.6)
  for (const o of meshes) {
    if (o.userData.noEdges || !o.visible) continue
    o.updateMatrixWorld(true)
    const g = new LineSegmentsGeometry().fromEdgesGeometry(new THREE.EdgesGeometry(o.geometry, 30))
    const l = new LineSegments2(g, o.userData.elec ? devMat : lineMat)
    l.matrixAutoUpdate = false; l.matrix.copy(o.matrixWorld)
    scene.add(l)
  }
  if (FAINT) {
    // the room's materials outline grey, except the 3D's own fan in the electric view, which stays dark
    for (const [k, m] of Object.entries(MAT)) m.userData.outlineParameters = { ...m.userData.outlineParameters, color: [0.74, 0.74, 0.74] }
    if (ELEC) for (const o of meshes) if (o.userData.elec && Object.values(MAT).includes(o.material)) {
      o.material = o.material.clone(); o.material.userData.outlineParameters = { ...o.material.userData.outlineParameters, color: [0.08, 0.08, 0.08] }
    }
    S.runs(SYS.points, SYS.circuits, NET ? "SW" : "DB", camera, FW, FH)
    window.TAGS = S.tags(SYS.points, camera)
  }
  const ink = new THREE.Color(INK)
  new OutlineEffect(renderer, { defaultThickness: 0.0025, defaultColor: [ink.r, ink.g, ink.b] }).render(scene, camera)
} else {
  const pmrem = new THREE.PMREMGenerator(renderer)
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture
  scene.environmentIntensity = 0.45
  scene.add(new THREE.HemisphereLight(0xeef3ff, 0x8a7a5a, 0.9))
  const sun = new THREE.DirectionalLight(0xfff0d8, 2.6)
  sun.position.set(L / 2 - 8, 12, 10) // from the front, over the left shoulder
  sun.target.position.set(L / 2, 0, 0); scene.add(sun.target)
  sun.castShadow = true
  sun.shadow.mapSize.set(4096, 4096)
  Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 40 })
  sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.02; sun.shadow.radius = 4
  scene.add(sun)
  if (ITEM) itemGround(scene, itemBox)
  const fill = new THREE.PointLight(0xfff4e0, 1.4, 6, 2) // the room's own light, so the back wall isn't dim
  fill.position.set(L / 2, CE - 0.1, 0.2); scene.add(fill)
  const composer = new EffectComposer(renderer)
  composer.setSize(FW, FH)
  composer.addPass(new RenderPass(scene, camera))
  const ao = new GTAOPass(scene, camera, FW, FH)
  ao.blendIntensity = 0.8
  ao.updateGtaoMaterial({ radius: 0.3, distanceExponent: 1.5, thickness: 1, scale: 1 })
  composer.addPass(ao)
  composer.addPass(new OutputPass())
  composer.render()
}
document.getElementById("out").src = renderer.domElement.toDataURL("image/png")
document.body.dataset.ready = "1"
</script>
</body>
</html>
