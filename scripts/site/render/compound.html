<!doctype html>
<!--
  The homepage 3D section, in the pattern of the studio's (scripts/studio/render/room.html): the compound
  seen from the front, from high beyond the gates through a long lens so verticals stay nearly straight, built from
  src/components/home/compound.json (the numbers the 2D plan draws). Like the 2D it leaves out the lake,
  the road and the trees, and it is mirrored the way the 2D is (study room at the back, guest rooms on the
  left, D-022). Details follow the 2026-10-25 footage (public/footage): corrugated walls, white-framed
  sliding doors, red pipe railings with the deck stairs at their ends, a concrete cap on the fire pit,
  hexagonal pop-up tents. Rendered two ways:

    ?mode=line  line drawing in the page's ink        -> public/designs/compound/render/compound-line.png
    ?mode=real  paint, timber, stone, sun and shadow  -> public/designs/compound/render/compound-real.webp

  Serve the repo root (python3 -m http.server <port>), open this page at 2400 x 1260, and once
  body[data-ready] is set save the data URL in #out: it has a transparent ground, flattened onto the
  page colour (#f7f5ef) when it is converted. Containers are ISO sizes; the rest is illustrative.
-->

<head>
<meta charset="utf-8">
<style>
html,body{margin:0;background:#f7f5ef}
#out{display:block;width:2400px;height:1260px}

{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}
</script>

<img id="out" alt="">
<script type="module">
import * as THREE from "three"
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js"
import { OutlineEffect } from "three/addons/effects/OutlineEffect.js"
import { LineSegments2 } from "three/addons/lines/LineSegments2.js"
import { LineSegmentsGeometry } from "three/addons/lines/LineSegmentsGeometry.js"
import { LineMaterial } from "three/addons/lines/LineMaterial.js"
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js"
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js"
import { RenderPass } from "three/addons/postprocessing/RenderPass.js"
import { GTAOPass } from "three/addons/postprocessing/GTAOPass.js"
import { OutputPass } from "three/addons/postprocessing/OutputPass.js"

const Q = new URLSearchParams(location.search)
const LINE = Q.get("mode") !== "real"
const [FW, FH] = [2400, 1260]
const C = await (await fetch(`/src/components/home/compound.json?${Date.now()}`)).json()
const INK = "#2b2a26", PAGE = "#f7f5ef" // the farm theme's soil and chalk
const HC = 2.591 // a container's height
// The 2D sets the compound half as far apart again sideways for a wide screen (compound.json's spread),
// every building at its true size; the model takes the same positions, so it reads as the 2D does.
{
  const { factor, mid } = C.spread
  const SX = (x) => mid + (x - mid) * factor
  const shift = (x0, x1) => SX((x0 + x1) / 2) - (x0 + x1) / 2
  const moveBox = (b) => { const d = shift(b[0], b[2]); return [b[0] + d, b[1], b[2] + d, b[3]] }
  for (const u of C.units) u.box = moveBox(u.box)
  const unit = Object.fromEntries(C.units.map((u) => [u.id, u]))
  const rooms = unit.rooms.box
  // as on the 2D: the bar flush with the guest rooms' courtyard side, the study room's end with their far side
  const bw = unit.bar.box[2] - unit.bar.box[0]
  unit.bar.box = [rooms[2] - bw, unit.bar.box[1], rooms[2], unit.bar.box[3]]
  const sw = unit.study.box[2] - unit.study.box[0]
  unit.study.box = [rooms[0], unit.study.box[1], rooms[0] + sw, unit.study.box[3]]
  const p = shift(C.parking.box[0], C.parking.box[2])
  C.parking.box = [C.parking.box[0] + p, C.parking.box[1], C.parking.box[2] + p, C.parking.box[3]]
  C.parking.bays = C.parking.bays.map((x) => x + p)
  C.sign = moveBox(C.sign)
  for (const g of [C.gate, C.innerGate]) { const d = shift(g.x[0], g.x[1]); g.x = [g.x[0] + d, g.x[1] + d] }
  C.rockRoad.curve = C.rockRoad.curve.map(([x, z]) => [SX(x), z])
  C.courtyard.firePit = [SX(C.courtyard.firePit[0]), ...C.courtyard.firePit.slice(1)]
  const cb = C.courtyard.box // the lawn widens with the spread
  C.courtyard.box = [SX(cb[0]), cb[1], SX(cb[2]), cb[3]]
  C.outdoor.tents = C.outdoor.tents.map(([x, z]) => [SX(x), z])
  // as on the 2D: the camping keeps its shape and ends at the fire pit's west edge
  const [fx, , fr] = C.courtyard.firePit
  const end = fx - fr - (Math.max(...C.outdoor.tents.map(([x]) => x)) + C.outdoor.tent)
  C.outdoor.tents = C.outdoor.tents.map(([x, z]) => [x + end, z])
  C.outdoor.longTable.x = SX(C.outdoor.longTable.x)
}
// plan (x east, y south) -> three: x = x, y = height, z = y

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true })
renderer.setClearColor(0xffffff, 0)
renderer.setPixelRatio(1)
renderer.setSize(FW, FH)
renderer.outputColorSpace = THREE.SRGBColorSpace
if (!LINE) {
  renderer.toneMapping = THREE.ACESFilmicToneMapping
  renderer.toneMappingExposure = 1.0
  renderer.shadowMap.enabled = true
  renderer.shadowMap.type = THREE.PCFShadowMap
}
const scene = new THREE.Scene()
// The 2D draws the compound mirrored from compound.json's north-up frame, so the model is mirrored the same
// way: from the front, left in the 3D is left in the 2D.
const root = new THREE.Group()
root.scale.x = -1
scene.add(root)

// ------------------------------------------------------------ procedural textures (real mode)
let seed = 11
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647)
function tex(draw, w = 512, h = 512) {
  const c = document.createElement("canvas"); c.width = w; c.height = h
  seed = 11 // each texture draws its own sequence, so editing one never reshuffles another
  draw(c.getContext("2d"), w, h)
  const t = new THREE.CanvasTexture(c)
  t.colorSpace = THREE.SRGBColorSpace
  t.wrapS = t.wrapT = THREE.RepeatWrapping
  t.anisotropy = 8
  return t
}
const speckle = (g, w, h, n, light, dark, size = 2) => {
  for (let i = 0; i < n; i++) {
    g.fillStyle = rnd() > 0.5 ? light : dark
    g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * size, 1 + rnd() * size)
  }
}
const T = LINE ? {} : {
  // one corrugation of a container wall (278 mm), shaded as if lit from the front, over the paint colour
  corr: tex((g, w, h) => {
    for (let x = 0; x < w; x++) {
      const p = x / w
      const v = p < 0.3 ? 0.95 : p < 0.42 ? 0.95 - (p - 0.3) * 2.2 : p < 0.72 ? 0.69 : p < 0.84 ? 0.69 + (p - 0.72) * 1.5 : 0.87
      g.fillStyle = `rgb(${Math.round(255 * v)},${Math.round(255 * v)},${Math.round(255 * v)})`
      g.fillRect(x, 0, 1, h)
    }
    for (let i = 0; i < 40; i++) { // weathering streaks running down
      g.fillStyle = `rgba(60,40,30,${0.02 + rnd() * 0.04})`
      g.fillRect(rnd() * w, rnd() * h * 0.3, 1 + rnd() * 3, h * (0.3 + rnd() * 0.7))
    }
  }, 64, 256),
  // eucalyptus deck boards, 140 mm wide, along u
  boards: tex((g, w, h) => {
    const n = 10, bh = h / n
    for (let i = 0; i < n; i++) {
      const k = 0.88 + rnd() * 0.2
      g.fillStyle = `rgb(${Math.round(196 * k)},${Math.round(139 * k)},${Math.round(85 * k)})`
      g.fillRect(0, i * bh, w, bh)
      for (let j = 0; j < 30; j++) {
        g.fillStyle = `rgba(110,70,35,${0.05 + rnd() * 0.08})`
        g.fillRect(rnd() * w, i * bh + rnd() * bh, 20 + rnd() * 120, 1)
      }
      g.fillStyle = "rgba(60,38,20,0.55)"; g.fillRect(0, i * bh, w, 2) // the gap between boards
    }
  }),
  grass: tex((g, w, h) => {
    g.fillStyle = "#6f9a4a"; g.fillRect(0, 0, w, h)
    speckle(g, w, h, 26000, "rgba(170,200,110,0.35)", "rgba(40,70,30,0.35)")
    g.filter = "blur(24px)" // soft patches, too faint to show the repeat
    for (let i = 0; i < 12; i++) {
      g.fillStyle = rnd() > 0.5 ? "rgba(140,170,80,0.06)" : "rgba(50,80,35,0.06)"
      g.beginPath(); g.ellipse(rnd() * w, rnd() * h, 40 + rnd() * 90, 30 + rnd() * 70, 0, 0, Math.PI * 2); g.fill()
    }
    g.filter = "none"
  }),
  meadow: tex((g, w, h) => {
    g.fillStyle = "#8d9a5c"; g.fillRect(0, 0, w, h)
    speckle(g, w, h, 26000, "rgba(200,190,120,0.35)", "rgba(70,80,40,0.35)")
    g.filter = "blur(30px)"
    for (let i = 0; i < 16; i++) {
      g.fillStyle = rnd() > 0.6 ? "rgba(170,110,70,0.07)" : "rgba(90,110,55,0.07)"
      g.beginPath(); g.ellipse(rnd() * w, rnd() * h, 40 + rnd() * 100, 30 + rnd() * 80, rnd() * 3, 0, Math.PI * 2); g.fill()
    }
    g.filter = "none"
  }),
  murram: tex((g, w, h) => {
    g.fillStyle = "#a8683f"; g.fillRect(0, 0, w, h)
    speckle(g, w, h, 20000, "rgba(220,170,120,0.35)", "rgba(90,45,25,0.35)")
  }),
  // grass pavers: a concrete grid with grass in its cells, 0.4 m a tile
  pavers: tex((g, w, h) => {
    g.fillStyle = "#b9b4a8"; g.fillRect(0, 0, w, h)
    const n = 4, s = w / n
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      g.fillStyle = (i + j) % 2 ? "#6f934a" : "#789c50"
      g.fillRect(i * s + s * 0.18, j * s + s * 0.18, s * 0.64, s * 0.64)
    }
    speckle(g, w, h, 6000, "rgba(255,255,255,0.2)", "rgba(0,0,0,0.15)")
  }, 256, 256),
  // grey granite setts laid in segmental arcs, after the founder's reference: about 100 mm setts, mixed
  // greys with the odd warm one, sand in the joints; one tile is 1.6 m, an arc row every sett
  setts: tex((g, w, h) => {
    g.fillStyle = "#bdb5a5"; g.fillRect(0, 0, w, h)
    const st = w / 16, R0 = w * 0.95, cx = w / 2, cy = h + R0 - h * 0.2
    for (let r = R0 - h * 0.15; r < R0 + h * 1.25; r += st) {
      const span = Math.asin(Math.min(1, (w / 2 + st) / r)), n = Math.ceil((2 * span * r) / st)
      for (let i = 0; i < n; i++) {
        const a = -Math.PI / 2 - span + ((i + 0.5) * 2 * span) / n
        const [x, y] = [cx + r * Math.cos(a), cy + r * Math.sin(a)]
        if (y < -st || y > h + st) continue
        const tone = rnd(), k = 0.92 + rnd() * 0.16
        const c = tone > 0.86 ? [150, 132, 124] : tone > 0.6 ? [140, 140, 136] : tone > 0.3 ? [162, 161, 155] : [118, 120, 118]
        g.fillStyle = `rgb(${c.map((v) => Math.round(v * k)).join(",")})`
        g.save(); g.translate(x, y); g.rotate(a + Math.PI / 2)
        g.beginPath(); g.roundRect(-st / 2 + 2.5, -st / 2 + 2.5, st - 5, st - 5, 5); g.fill()
        g.restore()
      }
    }
  }),
  // fieldstone: rounded stones of mixed size and tone in darker mortar; 1 m a tile
  stone: tex((g, w, h) => {
    g.fillStyle = "#6c6358"; g.fillRect(0, 0, w, h)
    for (let i = 0; i < 160; i++) {
      const x = rnd() * w, y = rnd() * h, rx = 14 + rnd() * 30, ry = 10 + rnd() * 20, tone = rnd()
      g.fillStyle = tone > 0.66 ? "#a8957a" : tone > 0.33 ? "#9a9184" : "#857a6b"
      g.beginPath(); g.ellipse(x, y, rx, ry, rnd() * Math.PI, 0, Math.PI * 2); g.fill()
    }
  }),
  tent: tex((g, w, h) => {
    const pw = w / 6
    g.fillStyle = "#ece7da"; g.fillRect(0, 0, w, h)
    for (let i = 0; i < 6; i++) {
      const x = i * pw
      g.fillStyle = "#5c6164"
      if (i === 0) { g.beginPath(); g.roundRect(x + pw * 0.22, h * 0.12, pw * 0.56, h * 0.8, [pw * 0.28, pw * 0.28, 2, 2]); g.fill() }
      else { g.beginPath(); g.roundRect(x + pw * 0.24, h * 0.18, pw * 0.52, h * 0.42, 10); g.fill() }
      g.fillStyle = "#c9b48f"; g.fillRect(x, 0, 5, h) // the beige trim on each seam
    }
    g.fillStyle = "#c9b48f"; g.fillRect(0, h - 10, w, 10)
  }, 768, 256),
  water: tex((g, w, h) => {
    g.fillStyle = "#6b8ea3"; g.fillRect(0, 0, w, h)
    for (let i = 0; i < 260; i++) {
      g.fillStyle = rnd() > 0.5 ? "rgba(220,235,240,0.18)" : "rgba(40,70,90,0.14)"
      g.fillRect(rnd() * w, rnd() * h, 20 + rnd() * 90, 1 + rnd() * 2)
    }
  }),
}
// metres one tile of each texture covers [along, across]
const TILE = { corr: [0.278, 2.6], boards: [1.4, 1.4], grass: [9, 9], meadow: [16, 16], murram: [4, 4],
  pavers: [0.4, 0.4], setts: [1.6, 1.6], stone: [1, 1], water: [12, 12] }
const MAP = { saffron: "corr", oxide: "corr", teal: "corr", timber: "boards", lawn: "grass", meadow: "meadow",
  murram: "murram", pavers: "pavers", setts: "setts", stone: "stone", water: "water" }

// ------------------------------------------------------------ materials
const PAINT = { saffron: "#d9a21b", oxide: "#8a3227", teal: "#3e8a86" }
// thin parts get crease lines but no silhouette, so railings and slats stay fine in the line drawing
const THIN = new Set(["red", "white-frame", "steel", "black", "slat", "cable", "frame-saffron", "frame-oxide", "frame-teal"])
const MAT = {}
function mat(name) {
  if (MAT[name]) return MAT[name]
  // a container's corrugations: the wall's own paint, but no silhouette in the line drawing
  if (name.startsWith("rib-")) {
    if (!LINE) return (MAT[name] = mat(name.slice(4)))
    const m = new THREE.MeshBasicMaterial({ color: PAGE, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 })
    m.userData.outlineParameters = { visible: false }
    return (MAT[name] = m)
  }
  let x
  if (LINE) {
    if (name === "glass" || name === "canopy") x = new THREE.MeshBasicMaterial({ color: PAGE, transparent: true, opacity: 0, depthWrite: false })
    else x = new THREE.MeshBasicMaterial({ color: PAGE, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 })
    if (THIN.has(name)) x.userData.outlineParameters = { visible: false }
    if (name === "bark") x.userData.outlineParameters = { thickness: 0.0011 } // trunks stay slender
  } else {
    const std = (o) => new THREE.MeshStandardMaterial(o)
    const tint = (hex, k) => new THREE.Color(hex).multiplyScalar(k)
    x = {
      saffron: () => std({ map: T.corr, color: PAINT.saffron, roughness: 0.55, metalness: 0.15 }),
      oxide: () => std({ map: T.corr, color: PAINT.oxide, roughness: 0.55, metalness: 0.15 }),
      teal: () => std({ map: T.corr, color: PAINT.teal, roughness: 0.55, metalness: 0.15 }),
      "frame-saffron": () => std({ color: tint(PAINT.saffron, 0.86), roughness: 0.5, metalness: 0.2 }),
      "frame-oxide": () => std({ color: tint(PAINT.oxide, 0.86), roughness: 0.5, metalness: 0.2 }),
      "frame-teal": () => std({ color: tint(PAINT.teal, 0.86), roughness: 0.5, metalness: 0.2 }),
      red: () => std({ color: "#7e2f26", roughness: 0.45, metalness: 0.35 }), // railings, door and window frames
      "white-frame": () => std({ color: "#f1f0eb", roughness: 0.4 }), // the sliding doors' frames, white as on site
      concrete: () => std({ color: "#c9c5bc", roughness: 0.85 }), // the fire pit's cap
      gatewood: () => std({ color: "#b48f63", roughness: 0.8 }), // weathered pine, as the reference gate
      lamp: () => std({ color: "#f6ecd2", roughness: 0.3, emissive: "#ffe2a8", emissiveIntensity: 0.35 }),
      tent: () => std({ map: T.tent, color: "#ffffff", roughness: 0.9, side: THREE.DoubleSide }), // canvas, mesh windows
      tentroof: () => std({ color: "#e9e4d6", roughness: 0.9 }),
      tentgreen: () => std({ color: "#46684a", roughness: 0.85 }), // one tent has a green fly, as today
      door: () => std({ color: "#a62b22", roughness: 0.5, metalness: 0.2 }),
      glass: () => new THREE.MeshPhysicalMaterial({ color: "#d3e3e8", roughness: 0.05, metalness: 0.1, transparent: true, opacity: 0.42, depthWrite: false }),
      canopy: () => new THREE.MeshPhysicalMaterial({ color: "#c7d3cc", roughness: 0.1, transparent: true, opacity: 0.32, depthWrite: false }),
      inside: () => std({ color: "#3b3631", roughness: 0.9 }),
      timber: () => std({ map: T.boards, color: "#ffffff", roughness: 0.75 }),
      slat: () => std({ color: "#b98250", roughness: 0.75 }),
      stone: () => std({ map: T.stone, color: "#ffffff", roughness: 0.95 }),
      lawn: () => std({ map: T.grass, color: "#ffffff", roughness: 1 }),
      meadow: () => std({ map: T.meadow, color: "#ffffff", roughness: 1 }),
      soil: () => std({ color: "#94573a", roughness: 1 }),
      murram: () => std({ map: T.murram, color: "#ffffff", roughness: 1 }),
      pavers: () => std({ map: T.pavers, color: "#ffffff", roughness: 0.95 }),
      setts: () => std({ map: T.setts, color: "#ffffff", roughness: 0.9 }),
      water: () => new THREE.MeshPhysicalMaterial({ map: T.water, color: "#ffffff", roughness: 0.14, clearcoat: 0.8, clearcoatRoughness: 0.08 }),
      steel: () => std({ color: "#b8bdc1", roughness: 0.3, metalness: 0.85 }),
      black: () => std({ color: "#26272b", roughness: 0.45, metalness: 0.5 }),
      cable: () => std({ color: "#c9ccd0", roughness: 0.3, metalness: 0.9 }),
      ash: () => std({ color: "#3a3431", roughness: 1 }),
      bark: () => std({ color: "#c9baa3", roughness: 0.9 }),
      leaf: () => std({ color: "#5f7c46", roughness: 0.9 }),
      leaf2: () => std({ color: "#6f8a52", roughness: 0.9 }),
      gum: () => std({ color: "#7a8d68", roughness: 0.9 }), // eucalyptus grey-green
      cushion: () => std({ color: "#e9e3d6", roughness: 0.95 }),

      white: () => std({ color: "#eeeeec", roughness: 0.3, metalness: 0.4 }),
      silver: () => std({ color: "#a9adb1", roughness: 0.3, metalness: 0.6 }),
      tyre: () => std({ color: "#1d1d1f", roughness: 0.9 }),
      carglass: () => std({ color: "#2e3a42", roughness: 0.1, metalness: 0.5 }),
    }[name]?.() ?? std({ color: "#cccccc", roughness: 0.8 })
  }
  MAT[name] = x
  return x
}

// ------------------------------------------------------------ geometry helpers (metres)
const meshes = []
let PARENT = root
// texture coordinates at true scale: each face takes the texture from its own plane, u along a wall
// and v up it, or u = x and v = z on a floor
function worldUV(geo, [tu, tv]) {
  const pos = geo.attributes.position, nrm = geo.attributes.normal, uv = geo.attributes.uv
  if (!uv) return
  for (let i = 0; i < pos.count; i++) {
    const n = [Math.abs(nrm.getX(i)), Math.abs(nrm.getY(i)), Math.abs(nrm.getZ(i))]
    const axis = n.indexOf(Math.max(...n))
    const p = [pos.getX(i), pos.getY(i), pos.getZ(i)]
    const [a, b] = axis === 0 ? [2, 1] : axis === 2 ? [0, 1] : [0, 2]
    uv.setXY(i, p[a] / tu, p[b] / tv)
  }
  uv.needsUpdate = true
}
function add(geo, name, opts = {}) {
  const tile = MAP[name.replace(/^rib-/, "")] // corrugations take their wall's texture
  if (!LINE && tile) worldUV(geo, TILE[tile])
  const mesh = new THREE.Mesh(geo, opts.sides && !LINE ? [mat(name), mat(opts.sides)] : mat(name))
  mesh.castShadow = !LINE && !opts.noShadow && name !== "glass" && name !== "canopy"
  mesh.receiveShadow = !LINE
  if (opts.pos) mesh.position.set(...opts.pos)
  if (opts.rot) mesh.rotation.set(...opts.rot)
  if (opts.scale) mesh.scale.set(...opts.scale)
  if (opts.noEdges) mesh.userData.noEdges = true
  PARENT.add(mesh)
  meshes.push(mesh)
  return mesh
}
// a box over a plan rectangle, from height y0 to y1; the corners may come in any order
function blk(xa, za, xb, zb, y0, y1, name, opts) {
  const [x0, x1, z0, z1] = [Math.min(xa, xb), Math.max(xa, xb), Math.min(za, zb), Math.max(za, zb)]
  const geo = new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0)
  return add(geo, name, { pos: [(x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2], ...opts })
}
function rounded(xa, za, xb, zb, y0, y1, r, name, opts) {
  const [x0, x1, z0, z1] = [Math.min(xa, xb), Math.max(xa, xb), Math.min(za, zb), Math.max(za, zb)]
  const geo = new RoundedBoxGeometry(x1 - x0, y1 - y0, z1 - z0, 4, r)
  return add(geo, name, { pos: [(x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2], ...opts })
}
function cyl(x, z, r, y0, h, name, seg = 20, rTop = r, opts) {
  return add(new THREE.CylinderGeometry(rTop, r, h, seg), name, { pos: [x, y0 + h / 2, z], ...opts })
}
// a bar between two points [x, y, z] in its parent's frame, square in section
function bar(a, b, s, name) {
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b)
  const mesh = add(new THREE.BoxGeometry(s, s, A.distanceTo(B)), name, { pos: A.clone().add(B).multiplyScalar(0.5).toArray() })
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), B.sub(A).normalize())
  return mesh
}
// a round pipe between two points (six-sided, so the line drawing still finds its edges)
function pipe(a, b, r, name) {
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b)
  const mesh = add(new THREE.CylinderGeometry(r, r, A.distanceTo(B), 6), name, { pos: A.clone().add(B).multiplyScalar(0.5).toArray() })
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), B.sub(A).normalize())
  return mesh
}
// shapes are drawn in the ground plane: u = x, v = -z, then stood up (as room.html does)
function extrude(shape, y0, h, name, opts = {}) {
  const geo = new THREE.ExtrudeGeometry(shape, { depth: h, curveSegments: 24, bevelEnabled: false })
  return add(geo, name, { pos: [0, y0, 0], rot: [-Math.PI / 2, 0, 0], ...opts })
}
function rrect(path, [x0, z0, x1, z1], r) {
  const [u0, u1, v0, v1] = [x0, x1, -z1, -z0]
  path.moveTo(u0 + r, v0)
  path.lineTo(u1 - r, v0); path.absarc(u1 - r, v0 + r, r, -Math.PI / 2, 0, false)
  path.lineTo(u1, v1 - r); path.absarc(u1 - r, v1 - r, r, 0, Math.PI / 2, false)
  path.lineTo(u0 + r, v1); path.absarc(u0 + r, v1 - r, r, Math.PI / 2, Math.PI, false)
  path.lineTo(u0, v0 + r); path.absarc(u0 + r, v0 + r, r, Math.PI, 1.5 * Math.PI, false)
  return path
}
const slab = (b, r, y0, h, name, opts) => extrude(rrect(new THREE.Shape(), b, r), y0, h, name, opts)
function ring(x, z, r, inner, y0, h, name) {
  const s = new THREE.Shape(); s.absarc(x, -z, r, 0, Math.PI * 2, false)
  const hole = new THREE.Path(); hole.absarc(x, -z, inner, 0, Math.PI * 2, true)
  s.holes.push(hole)
  return extrude(s, y0, h, name)
}
// build into a group, then place it
function group(build, pos, rotY = 0) {
  const g = new THREE.Group()
  g.position.set(...pos); g.rotation.y = rotY
  PARENT.add(g)
  const prev = PARENT; PARENT = g
  build()
  PARENT = prev
  return g
}

// The gates, after the founder's reference photo: two leaves of vertical boards on a frame of stiles and
// top, middle and bottom rails, braced in an X, with black iron strap hinges and a latch, hung closed between
// fieldstone pillars with timber caps, a lantern on one. Both gates take the same design.
function pillar([x0, z0, x1, z1], h, lantern) {
  blk(x0, z0, x1, z1, 0, h, "stone")
  blk(x0 - 0.06, z0 - 0.06, x1 + 0.06, z1 + 0.06, h, h + 0.12, "gatewood") // the timber cap
  if (lantern) {
    const [cx, cz] = [(x0 + x1) / 2, (z0 + z1) / 2]
    blk(cx - 0.08, cz - 0.08, cx + 0.08, cz + 0.08, h + 0.12, h + 0.16, "black")
    blk(cx - 0.07, cz - 0.07, cx + 0.07, cz + 0.07, h + 0.16, h + 0.38, "lamp")
    blk(cx - 0.1, cz - 0.1, cx + 0.1, cz + 0.1, h + 0.38, h + 0.42, "black")
  }
}
// a flat piece of timber in the leaf's plane (x along the leaf, y up), from a to b, w wide and t thick
function plank([ax, ay], [bx, by], w, z0, z1, name) {
  const len = Math.hypot(bx - ax, by - ay)
  const mesh = add(new THREE.BoxGeometry(len, w, z1 - z0), name, { pos: [(ax + bx) / 2, (ay + by) / 2, (z0 + z1) / 2] })
  mesh.rotation.z = Math.atan2(by - ay, bx - ax)
  return mesh
}
function leaf(len, h) {
  const b = 0.14 // one board
  for (let x = 0; x < len - 0.02; x += b) blk(x + 0.003, -0.012, Math.min(x + b, len) - 0.003, 0.012, 0.08, h, "gatewood")
  const [z0, z1] = [-0.045, -0.012] // the frame and the brace on the boards' outer face, toward the approach
  for (const x of [0.06, len - 0.06]) plank([x, 0.08], [x, h], 0.12, z0, z1, "gatewood")
  for (const y of [0.16, h / 2, h - 0.07]) plank([0.12, y], [len - 0.12, y], 0.13, z0, z1, "gatewood")
  plank([0.14, 0.22], [len - 0.14, h - 0.13], 0.11, z0, z1, "gatewood")
  plank([0.14, h - 0.13], [len - 0.14, 0.22], 0.11, z0, z1, "gatewood")
  for (const y of [0.16, h - 0.07]) blk(0, z0 - 0.006, 0.42, z0, y - 0.025, y + 0.025, "black") // strap hinges
  blk(len - 0.12, z0 - 0.012, len - 0.02, z0, h / 2 - 0.05, h / 2 + 0.05, "black") // the latch
}
function gate({ x: [l, r], y, post: p }, h, lanternSide) {
  pillar([l - p, y - p / 2, l, y + p / 2], h + 0.3, lanternSide === "left")
  pillar([r, y - p / 2, r + p, y + p / 2], h + 0.3, lanternSide === "right")
  const len = (r - l) / 2 - 0.01
  group(() => leaf(len, h), [l + 0.005, 0.03, y], 0) // closed, as the 2D draws them
  group(() => leaf(len, h), [r - 0.005, 0.03, y], 0).scale.x = -1 // the other leaf, mirrored, braced face out too
}
gate(C.gate, 1.8, "left")
{

// the rock road: 4 m of stone setts along the curve from the parking to the inner gate
{
  const [a, b, c, d] = C.rockRoad.curve.map(([x, z]) => new THREE.Vector2(x, z))
  const curve = new THREE.CubicBezierCurve(a, b, c, d)
  const half = C.rockRoad.width / 2
  const pts = curve.getSpacedPoints(32)
  const side = (k) => pts.map((p, i) => {
    const t = curve.getTangentAt(i / 32)
    return new THREE.Vector2(p.x - t.y * half * k, p.y + t.x * half * k)
  })
  const L = side(1), R = side(-1).reverse()
  const s = new THREE.Shape(); s.moveTo(L[0].x, -L[0].y)
  for (const p of [...L.slice(1), ...R]) s.lineTo(p.x, -p.y)
  s.lineTo(L[0].x, -L[0].y)
  extrude(s, 0, 0.05, "setts", { noShadow: true })
}

// ------------------------------------------------------------ containers
// The steel box: walls and roof a hair inside the corner posts and rails, as on a real container. Its long
// walls are kept for the corrugations, added once every opening is cut (ribs: which long walls get them).
const walls = []
function container([x0, z0, x1, z1], paint, y0, ribs = [true, true]) {
  const y1 = y0 + HC, e = 0.02, fr = `frame-${paint}`
  const alongX = x1 - x0 > z1 - z0
  const sides = alongX ? [{ axis: "z", at: z0, out: -1 }, { axis: "z", at: z1, out: 1 }] : [{ axis: "x", at: x0, out: -1 }, { axis: "x", at: x1, out: 1 }]
  const [a0, a1] = alongX ? [x0, x1] : [z0, z1]
  sides.forEach((w, i) => ribs[i] && walls.push({ ...w, a0: a0 + 0.25, a1: a1 - 0.25, y0: y0 + 0.16, y1: y1 - 0.12, paint, skip: [] }))
  blk(x0 + e, z0 + e, x1 - e, z1 - e, y0 + 0.14, y1 - 0.1, paint)
  for (const cx of [x0, x1]) for (const cz of [z0, z1]) {
    const sx = cx === x0 ? 1 : -1, sz = cz === z0 ? 1 : -1
    blk(cx, cz, cx + sx * 0.15, cz + sz * 0.15, y0, y1, fr)
  }
  for (const [y, t] of [[y0, 0.14], [y1 - 0.1, 0.1]]) {
    blk(x0, z0, x1, z0 + 0.12, y, y + t, fr); blk(x0, z1 - 0.12, x1, z1, y, y + t, fr)
    blk(x0, z0, x0 + 0.12, z1, y, y + t, fr); blk(x1 - 0.12, z0, x1, z1, y, y + t, fr)
  }
}
// the cargo doors at one end: four locking bars down the end wall
function cargoDoors(end, [x0, z0, x1, z1], y0) {
  const across = end === "north" || end === "south"
  const at = { north: z0, south: z1, west: x0, east: x1 }[end], out = end === "north" || end === "west" ? -1 : 1
  const [a0, a1] = across ? [x0, x1] : [z0, z1]
  for (const k of [0.2, 0.36, 0.64, 0.8]) {
    const a = a0 + (a1 - a0) * k
    across ? cyl(a, at + out * 0.04, 0.022, y0 + 0.2, HC - 0.4, "steel", 8)
      : cyl(at + out * 0.04, a, 0.022, y0 + 0.2, HC - 0.4, "steel", 8)
  }
}
// an opening in a wall. wall: { axis: "x" (a wall facing east or west) | "z", at, out: +1 | -1 };
// along the wall from a0 to a1, from height b0 to b1
function skipRibs(wall, a0, a1) {
  const w = walls.find((v) => v.axis === wall.axis && v.out === wall.out && Math.abs(v.at - wall.at) < 0.05 && a1 > v.a0 - 0.5 && a0 < v.a1 + 0.5)
  if (w) w.skip.push([a0 - 0.1, a1 + 0.1])
}
function opening(wall, a0, a1, b0, b1, kind) {
  skipRibs(wall, a0, a1)
  const trim = kind === "glazed" ? "white-frame" : "red"
  const put = (u0, u1, v0, v1, w0, w1, name) => wall.axis === "x"
    ? blk(wall.at + wall.out * w0, u0, wall.at + wall.out * w1, u1, v0, v1, name)
    : blk(u0, wall.at + wall.out * w0, u1, wall.at + wall.out * w1, v0, v1, name)
  const f = 0.06
  const fill = kind === "door" ? "door" : "glass"
  if (kind !== "door") put(a0, a1, b0, b1, -0.005, 0.01, "inside")
  put(a0, a1, b0, b1, 0.012, 0.03, fill)
  if (kind === "door") put(a0 + 0.18, a1 - 0.18, b0 + (b1 - b0) * 0.55, b1 - 0.2, 0.03, 0.04, "glass")
  put(a0 - f, a0, b0, b1 + f, 0, 0.055, trim); put(a1, a1 + f, b0, b1 + f, 0, 0.055, trim)
  put(a0, a1, b1, b1 + f, 0, 0.055, trim)
  if (kind !== "door") put(a0, a1, b0 - f, b0, 0, 0.07, trim)
  if (kind === "barred") for (let a = a0 + 0.2; a < a1 - 0.1; a += 0.2) put(a - 0.012, a + 0.012, b0, b1, 0.035, 0.06, "red")
  if (kind === "glazed") { // sliding panels: a mullion every 1.5 m or so
    const n = Math.max(2, Math.round((a1 - a0) / 1.5))
    for (let i = 1; i < n; i++) { const a = a0 + ((a1 - a0) * i) / n; put(a - 0.03, a + 0.03, b0, b1, 0.01, 0.05, trim) }
  }
}
const units = Object.fromEntries(C.units.map((u) => [u.id, u]))

// the bar: a 20 ft container on a stone plinth, its hatch open onto the courtyard under a propped flap
{
  const u = units.bar, [x0, z0, x1, z1] = u.box, y0 = u.plinth, [h0, h1] = u.hatch

  const [b0, b1] = [y0 + 1.05, y0 + 2.15]

  blk(x1 - 0.01, h0, x1 + 0.005, h1, b0, b1, "inside")
  blk(x1, h0 - 0.06, x1 + 0.05, h1 + 0.06, b1, b1 + 0.06, "red")
  blk(x1, h0, x1 + 0.45, h1, b0 - 0.06, b0, "timber") // the counter
  group(() => blk(0, 0, 0.035, h1 - h0, -1.0, 0, u.paint), [x1, b1 + 0.03, h0], 0).rotation.z = 2.0 // the flap, propped up
  for (const z of [h0 + 0.1, h1 - 0.1]) bar([x1, b0 + 0.1, z], [x1 + 0.84, b1 + 0.42, z], 0.025, "black")
  for (const z of [h0 + 0.5, (h0 + h1) / 2, h1 - 0.5]) {

    cyl(x1 + 0.95, z, 0.17, 0.72, 0.05, "slat", 20)

}

// the guest rooms: two 40 ft containers joined on a stone plinth, three doors and barred windows onto a

{

  blk(x0 - 0.1, z0 - 0.1, x1 + 0.1, z1 + 0.1, 0, y0, "stone")

  container([mid, z0, x1, z1], u.paint, y0, [false, true])
  cargoDoors("north", [x0, z0, mid, z1], y0); cargoDoors("north", [mid, z0, x1, z1], y0)
  const room = (z1 - z0) / u.rooms, wall = { axis: "x", at: x1, out: 1 }
  const v = u.veranda
  blk(x1, z0, x1 + v, z1, 0.12, y0 + 0.12, "timber")
  for (let k = 0; k < u.rooms; k++) {
    const z = z0 + k * room
    opening(wall, z + 0.5, z + 1.4, y0 + 0.16, y0 + 2.1, "door")
    opening(wall, z + 2.2, z + 3.4, y0 + 0.95, y0 + 2.0, "barred")
    blk(x1 + v, z + 0.4, x1 + v + 0.4, z + 1.5, 0, 0.2, "timber") // a step down from each door
  }
  const top = y0 + 2.25
  for (let z = z0 + 0.1; z <= z1 - 0.05; z += (z1 - z0 - 0.2) / 4) blk(x1 + v - 0.14, z - 0.05, x1 + v - 0.04, z + 0.05, y0 + 0.12, top, "slat")
  blk(x1 + v - 0.16, z0, x1 + v - 0.02, z1, top, top + 0.12, "slat")
  for (let z = z0 + 0.12; z < z1 - 0.05; z += 0.26) blk(x1, z - 0.03, x1 + v, z + 0.03, top + 0.12, top + 0.17, "slat")
}

// the row along the south of the courtyard: three 20 ft containers on raised steel decks facing north
function rowUnit(u) {
  const [x0, z0, x1, z1] = u.box, y0 = u.raised, top = y0 + HC, cx = (x0 + x1) / 2
  const front = z0 - u.deck
  // the steel frame the container and its deck stand on
  for (const x of [x0 + 0.1, cx, x1 - 0.1]) for (const z of [front + 0.1, z0 + 0.1, z1 - 0.1]) blk(x - 0.05, z - 0.05, x + 0.05, z + 0.05, 0, y0 - 0.1, "red")
  blk(x0, front, x1, z0, y0 - 0.1, y0, "timber")
  blk(x0, front, x1, front + 0.08, y0 - 0.22, y0 - 0.1, "red")
  container(u.box, u.paint, y0)
  cargoDoors("west", u.box, y0)
  // red pipe railings round the deck, as on site: posts, a top rail and a mid rail; the stair down at the
  // deck's west end, at its front corner
  const rail = (a, b) => {
    const len = Math.hypot(b[0] - a[0], b[1] - a[1]), n = Math.max(1, Math.ceil(len / 1.4))
    for (let i = 0; i <= n; i++) {
      const [x, z] = [a[0] + ((b[0] - a[0]) * i) / n, a[1] + ((b[1] - a[1]) * i) / n]
      cyl(x, z, 0.022, y0, 1.0, "red", 6)
    }
    pipe([a[0], y0 + 1.0, a[1]], [b[0], y0 + 1.0, b[1]], 0.024, "red")
    pipe([a[0], y0 + 0.5, a[1]], [b[0], y0 + 0.5, b[1]], 0.016, "red")
  }
  const r = front + 0.03, stair = front + 1.0
  rail([x0 + 0.03, z0], [x0 + 0.03, stair]); rail([x0 + 0.03, r], [x1 - 0.03, r]); rail([x1 - 0.03, r], [x1 - 0.03, z0])
  for (let k = 1; k <= 3; k++) blk(x0 - 0.28 * (4 - k), front, x0 - 0.28 * (3 - k), stair, 0, 0.2 * k, "timber")
  const wall = { axis: "z", at: z0, out: -1 }
  if (u.terrace) {
    opening(wall, cx - 1.5, cx + 1.5, y0 + 0.16, y0 + 2.25, "glazed")
    // the tinted clear canopy over the deck, on a slim steel edge
    blk(x0, front, x1, z0, y0 + 2.42, y0 + 2.45, "canopy", { noShadow: true })
    blk(x0, front, x1, front + 0.05, y0 + 2.38, y0 + 2.45, "black")
    for (const x of [x0 + 0.05, x1 - 0.05]) blk(x - 0.025, front, x + 0.025, front + 0.05, y0 + 1.0, y0 + 2.38, "black")
    // the open roof terrace with two loungers, no rail round it (the founder's call)
    for (const x of [x0 + 0.9, x0 + 1.75]) {
      blk(x - 0.32, z0 + 0.4, x + 0.32, z0 + 1.55, top, top + 0.3, "slat")
      blk(x - 0.3, z0 + 0.45, x + 0.3, z0 + 1.5, top + 0.3, top + 0.36, "cushion")
      group(() => blk(-0.3, 0, 0.3, 0.06, 0, 0.7, "cushion"), [x, top + 0.3, z0 + 1.5], 0).rotation.x = 0.5
    }
    // a slim steel stair up the east end to the roof
    const [s0, s1] = [x1 + 0.08, x1 + 0.72], [t0, t1] = [z0 + 0.25, z1 - 0.2]
    for (const x of [s0, s1]) bar([x, 0, t0], [x, top, t1], 0.05, "black")
    for (let i = 1; i <= 13; i++) {
      const k = i / 14, z = t0 + (t1 - t0) * k, y = top * k
      blk(s0, z - 0.09, s1, z + 0.09, y - 0.025, y, "black")
    }
  } else { // the office: a glazed door, a window behind a slatted timber screen
    opening(wall, cx - 1.6, cx - 0.7, y0 + 0.16, y0 + 2.1, "door")
    opening(wall, cx - 0.2, cx + 1.4, y0 + 0.9, y0 + 2.0, "glazed")
    for (let x = cx - 0.3; x <= cx + 1.5; x += 0.12) blk(x - 0.025, z0 - 0.32, x + 0.025, z0 - 0.27, y0 + 0.6, y0 + 2.3, "slat")
    blk(cx - 0.35, z0 - 0.33, cx + 1.55, z0 - 0.26, y0 + 2.3, y0 + 2.36, "slat")
  }
}
for (const u of C.units.filter((u) => u.kind === "20" && u.front === "north")) rowUnit(u)

  blk(x0 + 0.5, z0 - 0.44, x1 - 0.5, z0 - 0.28, y0 + 2.4, y0 + 2.5, "slat")
  blk(x0, z0 - u.deck, x1, z0, 0.12, y0, "timber")

// beside the study room: a 40 ft galley and a 20 ft public bathroom, each its own building
for (const [id, windows] of [["galley", [[3.2, 4.8], [7.4, 9.0]]], ["bath", [[0.4, 0.9], [1.7, 2.2]]]]) {
  const u = units[id], [x0, z0, x1, z1] = u.box, y0 = u.plinth
  blk(x0 - 0.1, z0 - 0.1, x1 + 0.1, z1 + 0.1, 0, y0, "stone")
  container(u.box, u.paint, y0)
  const wall = { axis: "z", at: z0, out: -1 }
  const doors = id === "bath" ? [[x0 + 3.0, x0 + 3.9]] : [[x0 + 1.2, x0 + 2.1], [x1 - 2.1, x1 - 1.2]]
  for (const [a, b] of doors) opening(wall, a, b, y0 + 0.16, y0 + 2.1, "door")
  for (const [a, b] of windows) opening(wall, x0 + a, x0 + b, y0 + 1.3, y0 + 2.0, "glazed")
}

// the corrugations: a rib every corrugation (278 mm) in the real render, every other one in the line drawing
{
  const pitch = LINE ? 0.556 : 0.278
  for (const w of walls) {
    for (let a = w.a0; a <= w.a1 + 1e-6; a += pitch) {
      if (w.skip.some(([s0, s1]) => a > s0 && a < s1)) continue
      const [r0, r1] = [w.at - w.out * 0.015, w.at + w.out * 0.03]
      w.axis === "z" ? blk(a - 0.04, r0, a + 0.04, r1, w.y0, w.y1, `rib-${w.paint}`)
        : blk(r0, a - 0.04, r1, a + 0.04, w.y0, w.y1, `rib-${w.paint}`)
    }
  }
}

// ------------------------------------------------------------ outdoors (D-022)
// Six small pop-up tents on the camping lawn between the guest rooms and the fire pit, a long timber
// table with benches in front of the middle studio, and log stools round the fire pit.
{
  const O = C.outdoor, t = O.tent
  // hexagonal pop-up tents as in the footage: walls leaning in to a low six-sided roof and a cap, a mesh
  // window on each face and the door on the face toward the fire pit; one has a green fly
  O.tents.forEach(([x, z], k) => {
    const toward = Math.round(Math.atan2(C.courtyard.firePit[1] - z, C.courtyard.firePit[0] - x) / (Math.PI / 3)) * (Math.PI / 3)
    group(() => {
      add(new THREE.CylinderGeometry(t * 0.8, t, 1.0, 6), "tent", { pos: [0, 0.535, 0] })
      add(new THREE.ConeGeometry(t * 0.88, 0.48, 6), k === 2 ? "tentgreen" : "tentroof", { pos: [0, 1.275, 0] })
      add(new THREE.CylinderGeometry(0.13, 0.17, 0.1, 6), k === 2 ? "tentgreen" : "tentroof", { pos: [0, 1.52, 0] })
    }, [x, 0, z], Math.PI / 3 - toward)
  })
  const { x, y, length, width, bench, gap } = O.longTable
  const [a, b] = [x - length / 2, x + length / 2]
  blk(a, y - width / 2, b, y + width / 2, 0.68, 0.76, "timber")
  for (const lx of [a + 0.35, b - 0.35]) blk(lx - 0.08, y - width / 2 + 0.12, lx + 0.08, y + width / 2 - 0.12, 0.035, 0.68, "slat")
  for (const side of [-1, 1]) {
    const z0 = y + side * (width / 2 + gap), z1 = z0 + side * bench
    blk(a, z0, b, z1, 0.41, 0.45, "timber")
    for (const lx of [a + 0.3, b - 0.3]) blk(lx - 0.04, Math.min(z0, z1) + 0.06, lx + 0.04, Math.max(z0, z1) - 0.06, 0.035, 0.41, "slat")
  }
  const [px, pz] = C.courtyard.firePit, { count, ring, r } = O.firePitSeats
  for (let k = 0; k < count; k++) {
    const ang = (k * 2 * Math.PI) / count
    cyl(px + ring * Math.cos(ang), pz + ring * Math.sin(ang), r, 0.035, 0.42, "slat", 16)
  }
}

// ------------------------------------------------------------ camera: the front view
// As the studio's 3D is seen from its front, the compound is seen from beyond the gates, centred, from high
// up through a long lens, so the containers' verticals stay nearly straight and the back row still shows.
// The model is mirrored, so its middle sits at -x.
const mid = -(MX0 + MX1) / 2
const target = new THREE.Vector3(mid, 0, (MZ0 + MZ1) / 2 + 4)
const [el, dist] = [THREE.MathUtils.degToRad(46), 160]
const camera = new THREE.PerspectiveCamera(22, FW / FH, 1, 600)
camera.position.set(mid, dist * Math.sin(el), target.z - dist * Math.cos(el))
camera.lookAt(target)
camera.updateMatrixWorld(); camera.updateProjectionMatrix()
scene.updateMatrixWorld(true)
const bb = new THREE.Box3()
for (const o of meshes) bb.expandByObject(o)
let px = [Infinity, Infinity, -Infinity, -Infinity]
for (const xx of [bb.min.x, bb.max.x]) for (const yy of [bb.min.y, bb.max.y]) for (const zz of [bb.min.z, bb.max.z]) {
  const p = new THREE.Vector3(xx, yy, zz).project(camera)
  const X = ((p.x + 1) / 2) * FW, Y = ((1 - p.y) / 2) * FH
  px = [Math.min(px[0], X), Math.min(px[1], Y), Math.max(px[2], X), Math.max(px[3], Y)]
}
let w = (px[2] - px[0]) * 1.03, h = (px[3] - px[1]) * 1.05
if (w / h > FW / FH) h = (w * FH) / FW; else w = (h * FW) / FH
camera.setViewOffset(FW, FH, (px[0] + px[2]) / 2 - w / 2, (px[1] + px[3]) / 2 - h / 2, w, h)

// ------------------------------------------------------------ render
if (LINE) {
  // crease lines from the geometry, silhouettes from the outline effect, both in the page's ink
  // both sides: the mirrored model turns the line quads round
  const lineMat = new LineMaterial({ color: INK, linewidth: 1.25, side: THREE.DoubleSide })
  lineMat.resolution.set(FW, FH)
  lineMat.userData.outlineParameters = { visible: false }
  for (const o of meshes) {
    if (o.userData.noEdges) continue
    const g = new LineSegmentsGeometry().fromEdgesGeometry(new THREE.EdgesGeometry(o.geometry, 30))
    const l = new LineSegments2(g, lineMat)
    l.matrixAutoUpdate = false; l.matrix.copy(o.matrixWorld)
    scene.add(l)
  }
  const ink = new THREE.Color(INK)
  const effect = new OutlineEffect(renderer, { defaultThickness: 0.0024, defaultColor: [ink.r, ink.g, ink.b] })
  effect.render(scene, camera)
} else {
  const pmrem = new THREE.PMREMGenerator(renderer)
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture
  scene.environmentIntensity = 0.35
  scene.add(new THREE.HemisphereLight(0xeef3ff, 0x8a7a5a, 0.9))
  const sun = new THREE.DirectionalLight(0xfff0d8, 3.0)
  sun.position.set(target.x + 40, 70, MZ0 - 30) // from the front, over the left shoulder
  sun.target.position.copy(target)
  sun.castShadow = true
  sun.shadow.mapSize.set(4096, 4096)
  Object.assign(sun.shadow.camera, { left: -45, right: 45, top: 45, bottom: -45, near: 1, far: 200 })
  sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03; sun.shadow.radius = 3
  scene.add(sun, sun.target)
  const composer = new EffectComposer(renderer)
  composer.setSize(FW, FH)
  composer.addPass(new RenderPass(scene, camera))
  const ao = new GTAOPass(scene, camera, FW, FH)
  ao.output = GTAOPass.OUTPUT.Default
  ao.blendIntensity = 0.8
  ao.updateGtaoMaterial({ radius: 0.6, distanceExponent: 1.5, thickness: 1.5, scale: 1 })
  composer.addPass(ao)
  composer.addPass(new OutputPass())
  composer.render()
}
document.getElementById("out").src = renderer.domElement.toDataURL("image/png")
document.body.dataset.ready = "1"
</script>
