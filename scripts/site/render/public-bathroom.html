<!doctype html>
<!--
  /en/public-bathroom's 3D, in the pattern of the office's (scripts/site/render/office.html): the public bathroom seen
  from the courtyard with its front wall and roof off, built from src/components/public-bathroom/public-bathroom.json
  (the numbers the 2D draws). The box follows the homepage model (scripts/site/render/compound.html, the galley and
  bathroom loop): a teal 20 ft container with ribs on a fieldstone plinth, a red door and two white-framed windows in
  its front. Inside, tiled to 1.5 m and painted above: the two toilet rooms along the front, the passage behind them
  with the cleaner's cupboard at its end, the lobby with two basins on a Medium Oak counter, the urinal in a room of
  its own. The walls across the box are cut low so the passage and the lobby's far end show, as the studio's cross
  wall (scripts/studio/render/room.html). Rendered two ways:

    ?mode=line  line drawing on a transparent ground   -> public/designs/public-bathroom/render/public-bathroom-line.png
    ?mode=real  materials, daylight and shadow         -> public/designs/public-bathroom/render/public-bathroom-real.webp
    &hero=1     real mode, front wall and roof on, from eye level in the courtyard, 2400 x 1340 -> the stand-in public-bathroom-hero.jpg
    &view=plumbing  the front view with every pipe run of the json's plumbing: in line mode the room faint, the
                fittings dark, each run in its system's colour, dashed where a wall, the floor or the plinth hides it,
                and window.TAGS (each point's spot) -> render/plumbing-line.png + plumbing-tags.json; in real mode the
                floor, the tiles and the plinth see-through so the pipes show -> render/plumbing-real.webp
    &view=electric  the same for the json's electric: the board, the ceiling lights, the fan, the socket and every
                cable route in its circuit's colour -> render/electric-line.png + electric-tags.json; real mode at
                dusk with the lights on -> render/electric-real.webp
    &item=<id>  one piece on its own, real mode, three-quarter view, 1200 x 900, on a transparent ground with its
                shadow (ITEMS below) -> render/fixtures/<id>.webp, render/plumbing/<id>.webp, render/electric/<id>.webp
    &top=<layer>  straight down, the courtyard at the bottom, for the BuildUp: base (opaque: the box on its plinth,
                its outer walls lined, the container's bare floor), pipes, walls, floor, fittings (transparent; each
                masked by the layers built before it). window.TAGS holds each layer's piece rectangles as fractions
                of the frame -> render/top-<layer>.webp + top-pieces.json

  Serve the repo root on a spare port, open this page at 2400 x 1100, and once body[data-ready] is set
  save the data URL in #out.
-->
<html>

#out{display:block;width:2400px;height:auto}
</style>

{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}
</script>
</head>
<body>
<img id="out" alt="">
<script type="module">
import * as THREE from "three"
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js"
import { OutlineEffect } from "three/addons/effects/OutlineEffect.js"
import { LineSegments2 } from "three/addons/lines/LineSegments2.js"
import { LineSegmentsGeometry } from "three/addons/lines/LineSegmentsGeometry.js"
import { LineMaterial } from "three/addons/lines/LineMaterial.js"
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js"
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js"
import { RenderPass } from "three/addons/postprocessing/RenderPass.js"
import { GTAOPass } from "three/addons/postprocessing/GTAOPass.js"
import { OutputPass } from "three/addons/postprocessing/OutputPass.js"

const Q = new URLSearchParams(location.search)
const ITEM = Q.get("item"), TOP = Q.get("top"), VIEW = ITEM || TOP ? null : Q.get("view")
const PLUMB = VIEW === "plumbing", ELEC = VIEW === "electric"
const LINE = Q.get("mode") !== "real" && !ITEM && !TOP
const HERO = !LINE && Q.get("hero") === "1"
const C = await (await fetch(`/src/components/public-bathroom/public-bathroom.json?${Date.now()}`)).json()
// the top view's frame, in plan metres: the box, its plinth and the landing and step in front
const TOPBOX = { x0: -0.3, x1: C.container.l + 0.3, z0: -C.container.w / 2 - 0.3, z1: C.container.w / 2 + C.entry.landing.d + C.entry.step.d + 0.15 }
const [FW, FH] = HERO ? [2400, 1340] : ITEM ? [1200, 900]
  : TOP ? [2400, Math.round((2400 * (TOPBOX.z1 - TOPBOX.z0)) / (TOPBOX.x1 - TOPBOX.x0))] : [2400, 1100]
const INK = "#2b2a26", PAGE = "#ffffff"
// plan (x right from the west end, y toward the courtyard) -> three: x = x, y = height, z = y; the camera stands in
// the courtyard, at +z

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true })
renderer.setClearColor(0xffffff, 0)
renderer.setPixelRatio(1)
renderer.setSize(FW, FH)
renderer.outputColorSpace = THREE.SRGBColorSpace
if (!LINE) {
  renderer.toneMapping = THREE.ACESFilmicToneMapping
  renderer.shadowMap.enabled = true
  renderer.shadowMap.type = THREE.PCFSoftShadowMap
}
const scene = new THREE.Scene()

// ------------------------------------------------------------ procedural textures (real mode)
let seed = 7
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647)
function tex(draw, w = 512, h = 512) {
  const c = document.createElement("canvas"); c.width = w; c.height = h
  seed = 7
  draw(c.getContext("2d"), w, h)
  const t = new THREE.CanvasTexture(c)
  t.colorSpace = THREE.SRGBColorSpace
  t.wrapS = t.wrapT = THREE.RepeatWrapping
  t.anisotropy = 8
  return t
}
const T = LINE ? {} : {
  // the container's corrugation, as compound.html: light and shade across one pitch, a few streaks down it
  corr: tex((g, w, h) => {
    for (let x = 0; x < w; x++) {
      const p = x / w
      const v = p < 0.3 ? 0.95 : p < 0.42 ? 0.95 - (p - 0.3) * 2.2 : p < 0.72 ? 0.69 : p < 0.84 ? 0.69 + (p - 0.72) * 1.5 : 0.87
      g.fillStyle = `rgb(${Math.round(255 * v)},${Math.round(255 * v)},${Math.round(255 * v)})`
      g.fillRect(x, 0, 1, h)
    }
    for (let i = 0; i < 40; i++) {
      g.fillStyle = `rgba(30,50,50,${0.02 + rnd() * 0.04})`
      g.fillRect(rnd() * w, rnd() * h * 0.3, 1 + rnd() * 3, h * (0.3 + rnd() * 0.7))
    }
  }, 64, 256),
  // fieldstone in darker mortar, as compound.html: the plinth, the landing and the step
  stone: tex((g, w, h) => {
    g.fillStyle = "#6c6358"; g.fillRect(0, 0, w, h)
    for (let i = 0; i < 160; i++) {
      const x = rnd() * w, y = rnd() * h, rx = 14 + rnd() * 30, ry = 10 + rnd() * 20, tone = rnd()
      g.fillStyle = tone > 0.66 ? "#a8957a" : tone > 0.33 ? "#9a9184" : "#857a6b"
      g.beginPath(); g.ellipse(x, y, rx, ry, rnd() * Math.PI, 0, Math.PI * 2); g.fill()
    }
  }),
  // white wall tiles, 200 mm square in pale grout: five a side on the 1 m tile
  tiles: tex((g, w, h) => {
    g.fillStyle = "#d3d0c9"; g.fillRect(0, 0, w, h)
    const n = 5, s = w / n
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      const k = 0.975 + rnd() * 0.025
      g.fillStyle = `rgb(${Math.round(247 * k)},${Math.round(246 * k)},${Math.round(242 * k)})`
      g.fillRect(i * s + 2, j * s + 2, s - 4, s - 4)
    }
  }),
  // non-slip floor tiles in warm grey, 400 mm square, a fine speckle: three a side on the 1.2 m tile
  floor: tex((g, w, h) => {
    g.fillStyle = "#77726a"; g.fillRect(0, 0, w, h)
    const n = 3, s = w / n
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      const k = 0.95 + rnd() * 0.07
      g.fillStyle = `rgb(${Math.round(176 * k)},${Math.round(169 * k)},${Math.round(158 * k)})`
      g.fillRect(i * s + 2, j * s + 2, s - 4, s - 4)
      for (let m = 0; m < 400; m++) {
        g.fillStyle = rnd() > 0.5 ? "rgba(255,255,255,0.07)" : "rgba(50,45,40,0.07)"
        g.fillRect(i * s + 2 + rnd() * (s - 6), j * s + 2 + rnd() * (s - 6), 2, 2)
      }
    }
  }),
  // pine in a Medium Oak finish, as the studio's furniture: fine grain along u
  oak: tex((g, w, h) => {
    g.fillStyle = "#b9824c"; g.fillRect(0, 0, w, h)
    g.filter = "blur(10px)"
    for (let i = 0; i < 50; i++) {
      g.fillStyle = rnd() > 0.45 ? `rgba(146,88,38,${0.06 + rnd() * 0.1})` : `rgba(238,196,132,${0.06 + rnd() * 0.1})`
      g.beginPath(); g.ellipse(rnd() * w, rnd() * h, 60 + rnd() * 160, 8 + rnd() * 20, 0, 0, Math.PI * 2); g.fill()
    }
    g.filter = "none"
    for (let i = 0; i < 1800; i++) {
      const x = rnd() * w, y = rnd() * h, len = 20 + rnd() * 110
      g.strokeStyle = rnd() > 0.35 ? `rgba(116,70,30,${0.04 + rnd() * 0.08})` : `rgba(244,206,148,${0.04 + rnd() * 0.07})`
      g.lineWidth = 0.6 + rnd() * 0.7
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + len, y + (rnd() - 0.5) * 1.5); g.stroke()
    }
  }, 1024, 512),
  grass: tex((g, w, h) => {
    g.fillStyle = "#6f9a4a"; g.fillRect(0, 0, w, h)
    for (let i = 0; i < 26000; i++) {
      g.fillStyle = rnd() > 0.5 ? "rgba(170,200,110,0.35)" : "rgba(40,70,30,0.35)"
      g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 2, 1 + rnd() * 2)
    }
  }),
  // the hero's sky: the upper half of the sphere, a clear blue overhead to a pale haze at the horizon
  sky: tex((g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h)
    gr.addColorStop(0, "#3f7cc0"); gr.addColorStop(0.36, "#78a5d6"); gr.addColorStop(0.46, "#c3d7e8"); gr.addColorStop(0.5, "#dfe8ee"); gr.addColorStop(1, "#dfe8ee")
    g.fillStyle = gr; g.fillRect(0, 0, w, h)
  }, 16, 512),
}
// metres one tile covers [along, across]
const TILE = { teal: [0.278, 2.6], stone: [1, 1], walltile: [1, 1], floortile: [1.2, 1.2], oak: [1.2, 0.6] }

// ------------------------------------------------------------ materials
const TEAL = C.container.paint
// thin parts get crease lines but no silhouette, so frames, taps and brackets stay fine in the line drawing
const THIN = new Set(["red", "white-frame", "chrome", "black"])
const MAT = {}
function mat(name) {
  if (MAT[name]) return MAT[name]
  if (name === "rib") { // the corrugations: the wall's paint, no silhouette in the line drawing
    if (!LINE) return (MAT[name] = mat("teal"))
    const m = new THREE.MeshBasicMaterial({ color: PAGE, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 })
    m.userData.outlineParameters = { visible: false }
    return (MAT[name] = m)
  }
  let x
  if (LINE) {
    x = new THREE.MeshBasicMaterial({ color: PAGE, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 })
    if (THIN.has(name)) x.userData.outlineParameters = { visible: false }
  } else {
    const std = (o) => new THREE.MeshStandardMaterial(o)
    x = {
      teal: () => std({ map: T.corr, color: TEAL, roughness: 0.55, metalness: 0.15 }),
      frame: () => std({ color: new THREE.Color(TEAL).multiplyScalar(0.86), roughness: 0.5, metalness: 0.2 }),
      red: () => std({ color: "#7e2f26", roughness: 0.45, metalness: 0.35 }), // the door's frame, as compound.html's trims
      door: () => std({ color: "#a62b22", roughness: 0.5, metalness: 0.2 }), // the homepage's red door
      "white-frame": () => std({ color: "#f1f0eb", roughness: 0.4 }), // the windows' frames
      obscured: () => std({ color: "#a9b7bc", roughness: 0.22, metalness: 0.2 }), // obscured glass: pale, a little sheen
      stone: () => std({ map: T.stone, roughness: 0.95 }),
      concrete: () => std({ color: "#c9c5bc", roughness: 0.85 }), // the landing's and the step's cap, as the fire pit's
      lawn: () => std({ map: T.grass, roughness: 1 }),
      wall: () => std({ color: "#f0ece3", roughness: 0.88 }), // off-white paint above the tiles
      walltile: () => std({ map: T.tiles, roughness: 0.3 }),
      floortile: () => std({ map: T.floor, roughness: 0.75 }),
      oak: () => std({ map: T.oak, roughness: 0.6 }), // the counter and the cupboard, Medium Oak
      ceramic: () => std({ color: "#f6f6f2", roughness: 0.16, side: THREE.DoubleSide }),
      seat: () => std({ color: "#fbfbf8", roughness: 0.35 }),
      chrome: () => std({ color: "#c9cdd1", roughness: 0.18, metalness: 0.95 }),
      black: () => std({ color: "#232427", roughness: 0.5, metalness: 0.3 }),
      white: () => std({ color: "#f3f2ee", roughness: 0.5 }),
      mirror: () => std({ color: "#dfe6e9", roughness: 0.03, metalness: 1 }),
      lamp: () => std({ color: "#f6f1e4", roughness: 0.4, emissive: "#fff2d0", emissiveIntensity: ELEC ? 1.6 : 0.15 }),
      ppr: () => std({ color: "#e9e7e1", roughness: 0.42 }), // PP-R supply pipe, as the studio's
      // the plumbing view's runs, in the diagram's colours so they read through the see-through floor
      "run-cold": () => std({ color: C.plumbing.colours.cold, roughness: 0.4 }),
      "run-soil": () => std({ color: C.plumbing.colours.soil, roughness: 0.4 }),
      "run-waste": () => std({ color: C.plumbing.colours.waste, roughness: 0.4 }),
      "run-vent": () => std({ color: C.plumbing.colours.vent, roughness: 0.4 }),
      upvc: () => std({ color: "#8f9397", roughness: 0.5 }), // uPVC soil, waste and vent, as the studio's
      ply: () => std({ color: "#a98f6a", roughness: 0.9 }), // the container's own floor, bare
      stud: () => std({ color: "#c9a878", roughness: 0.85 }), // the partitions' timber studs
      panel: () => std({ color: "#fbfaf6", roughness: 0.3, emissive: "#fff3dc", emissiveIntensity: ELEC ? 2.2 : 0 }), // an LED ceiling light's diffuser
      meter: () => std({ color: "#2f5fa8", roughness: 0.4 }), // the check meter's blue body
      brass: () => std({ color: "#b8913f", roughness: 0.3, metalness: 0.9 }),
      smoked: () => std({ color: "#5a6066", roughness: 0.1, metalness: 0.3, transparent: true, opacity: 0.7 }),
      sky: () => new THREE.MeshBasicMaterial({ map: T.sky, side: THREE.BackSide, fog: false, toneMapped: false }),
    }[name]?.() ?? std({ color: "#cccccc", roughness: 0.8 })
    if (PLUMB && ["floortile", "walltile", "stone", "frame", "concrete"].includes(name)) Object.assign(x, { transparent: true, opacity: name === "walltile" ? 0.25 : 0.1, depthWrite: false })
  }
  return (MAT[name] = x)
}

// ------------------------------------------------------------ geometry helpers (metres)
const meshes = []
// texture coordinates at true scale: each face takes the texture from its own plane. Timber turns its grain along
// the piece; the corrugation always runs across the wall, however narrow the piece between two openings
function worldUV(geo, [tu, tv], grain) {
  const pos = geo.attributes.position, nrm = geo.attributes.normal, uv = geo.attributes.uv
  if (!uv) return
  geo.computeBoundingBox()
  const size = geo.boundingBox.getSize(new THREE.Vector3()).toArray()
  const long = size.indexOf(Math.max(...size))
  for (let i = 0; i < pos.count; i++) {
    const n = [Math.abs(nrm.getX(i)), Math.abs(nrm.getY(i)), Math.abs(nrm.getZ(i))]
    const axis = n.indexOf(Math.max(...n))
    const p = [pos.getX(i), pos.getY(i), pos.getZ(i)]
    let [a, b] = axis === 0 ? [2, 1] : axis === 2 ? [0, 1] : [0, 2]
    if (grain && b === long) [a, b] = [b, a]
    uv.setXY(i, p[a] / tu, p[b] / tv)
  }
  uv.needsUpdate = true
}
// what add() stamps on each mesh: its BuildUp layer and piece, the item tags it renders under (?item=), and whether it
// is a plumbing fitting or an electric device (drawn dark in the service views)
let LAYER = "base", PIECE = null, TAG = [], FIT = false, DEV = false
const as = (layer, tag = [], fn) => { const k = [LAYER, PIECE, TAG]; [LAYER, PIECE, TAG] = [layer, tag[0] ?? null, tag]; fn(); [LAYER, PIECE, TAG] = k }
function add(geo, name, opts = {}) {
  const tile = TILE[name === "rib" ? "teal" : name]
  if (!LINE && tile) worldUV(geo, tile, name === "oak")
  const mesh = new THREE.Mesh(geo, mat(name))
  mesh.castShadow = !LINE && !["lawn", "sky"].includes(name) && !opts.noShadow
  mesh.receiveShadow = !LINE && name !== "sky"
  if (opts.pos) mesh.position.set(...opts.pos)
  if (opts.rot) mesh.rotation.set(...opts.rot)
  if (opts.noEdges) mesh.userData.noEdges = true
  Object.assign(mesh.userData, { layer: LAYER, piece: PIECE ?? mesh.uuid, tags: TAG, fit: FIT, dev: DEV })
  scene.add(mesh)
  meshes.push(mesh)
  return mesh
}
// a box over a plan rectangle (x, z in any order), from height y0 to y1. Geometry is built in place, so the
// textures land at world scale and the tiles run on from one box to the next
function blk(xa, za, xb, zb, y0, y1, name, opts) {
  const [x0, x1, z0, z1] = [Math.min(xa, xb), Math.max(xa, xb), Math.min(za, zb), Math.max(za, zb)]
  const g = new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0)
  g.translate((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2)
  return add(g, name, opts)
}
function soft(xa, za, xb, zb, y0, y1, r, name) {
  const [x0, x1, z0, z1] = [Math.min(xa, xb), Math.max(xa, xb), Math.min(za, zb), Math.max(za, zb)]
  return add(new RoundedBoxGeometry(x1 - x0, y1 - y0, z1 - z0, 4, r), name, { pos: [(x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2] })
}
function cyl(x, z, r, y0, h, name, seg = 24, rTop = r) {
  return add(new THREE.CylinderGeometry(rTop, r, h, seg), name, { pos: [x, y0 + h / 2, z] })
}
function pipe(a, b, r, name) {
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b)
  const mesh = add(new THREE.CylinderGeometry(r, r, A.distanceTo(B), 8), name, { pos: A.clone().add(B).multiplyScalar(0.5).toArray() })
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), B.sub(A).normalize())
  return mesh
}
// the stretches of a wall from a to b between its openings ([d0, d1], west to east)
function spans(a, b, openings) {
  const out = []
  let x = a
  for (const [d0, d1] of openings) { out.push([x, d0]); x = d1 }
  return [...out, [x, b]]
}

// ------------------------------------------------------------ the plinth, the landing, the box
const { container: K, front: F, entry: E, partitions: P, finishes: FI, toilets: TO, passage: PA, cupboard: CU, lobby: LO, basins: BA, towels: TW, urinal: UR } = C
const L = K.l, H = K.w / 2, Y0 = K.plinth, HC = K.h, ROOF = Y0 + HC
const FL = Y0 + K.floor, CE = Y0 + K.ceiling // inside: the finished floor, the ceiling
const TL = FL + FI.tile // where the tiles stop and the paint begins
const { x0: ix0, x1: ix1, y0: iz0, y1: iz1 } = K.inner
const t = P.t
if (!LINE && !ITEM && !TOP && !PLUMB) { // the plumbing view stands on the white page, so the see-through plinth reads
  T.grass.repeat.set(HERO ? 14 : 10, HERO ? 14 : 10)
  add(new THREE.CircleGeometry(HERO ? 40 : 30, 64), "lawn", { rot: [-Math.PI / 2, 0, 0], pos: [L / 2, 0, 1] })
}
// a wall where the tiles stop: tiles below, paint above (the linings and the partitions alike)
function lined(xa, za, xb, zb, y0, y1) {
  if (y0 < TL) blk(xa, za, xb, zb, y0, Math.min(y1, TL), "walltile")
  if (y1 > TL) blk(xa, za, xb, zb, Math.max(y0, TL), y1, "wall")
}
{
  // the plinth, a fieldstone course 100 mm proud all round, as the homepage; the landing at its height in front of
  // the door and one step down to the grass, fieldstone under a concrete cap like the fire pit's
  const p = K.proud, { landing: LA, step: ST } = E, cap = 0.05
  blk(-p, -H - p, L + p, H + p, 0, Y0, "stone")
  blk(LA.x0, H + p, LA.x1, H + LA.d, 0, Y0 - cap, "stone")
  blk(LA.x0, H + p, LA.x1, H + LA.d, Y0 - cap, Y0, "concrete")
  blk(ST.x0, H + LA.d, ST.x1, H + LA.d + ST.d, 0, ST.h - cap, "stone")
  blk(ST.x0, H + LA.d, ST.x1, H + LA.d + ST.d, ST.h - cap, ST.h, "concrete")
}
{
  // the container: floor, the back wall and both ends in teal steel with their corrugations outside, the corner
  // posts and rails in a deeper shade; the front wall and the roof off, so the rooms show, except in the hero
  const e = 0.03
  blk(0, -H, L, H, Y0, Y0 + 0.14, "frame") // the bottom rails and floor bearers
  blk(0, -H, L, -H + e, Y0 + 0.14, ROOF - 0.1, "teal")
  blk(0, -H, e, H, Y0 + 0.14, ROOF - 0.1, "teal")
  blk(L - e, -H, L, H, Y0 + 0.14, ROOF - 0.1, "teal")
  for (const x of [0, L - 0.15]) for (const z of [-H, H - 0.15]) blk(x, z, x + 0.15, z + 0.15, Y0, ROOF, "frame")
  blk(0, -H, L, -H + 0.12, ROOF - 0.1, ROOF, "frame")
  for (const x of [0, L - 0.12]) blk(x, -H, x + 0.12, H, ROOF - 0.1, ROOF, "frame")
  // ribs: along the back wall outside, and across both end walls
  for (let a = 0.35; a <= L - 0.35; a += 0.278) blk(a - 0.04, -H - 0.03, a + 0.04, -H + 0.005, Y0 + 0.16, ROOF - 0.12, "rib")
  for (const x of [-0.03, L - 0.005]) for (let a = -H + 0.3; a <= H - 0.3; a += 0.278) blk(x, a - 0.04, x + 0.035, a + 0.04, Y0 + 0.16, ROOF - 0.12, "rib")
  // inside: the floor tiles; wall tiles and paint on the back and both ends
  // the floor tiles; seen from above (the BuildUp) they go down in strips from the west end, over the container's
  // own floor, bare until then
  if (TOP) {

  const holes = [...F.windows.map(([a, b]) => [a, b, Y0 + F.sill, Y0 + F.head]), [F.door.x0, F.door.x1, Y0 + F.door.bottom, Y0 + F.door.top]]

const PL = C.plumbing, EL = C.electric
const SAMPLE = new Set(["ppr", "upvc"])
const pipeLines = [] // line mode: [colour, width, positions]
if (PLUMB || TOP || ITEM === "meter" || ITEM === "chamber" || ITEM === "vent") {
  for (const r of PL.runs) {
    const drain = r.system !== "cold", rad = Math.max(0.011, r.dn / 2000)
    for (const path of r.paths) {
      if (TOP) {
        // first fix, from above: the supply along the walls, before the tiles hide it, and each drain's stub up through
        // the floor where it goes down, capped. Kept just inside the linings, so nothing built before hides them
        const k = ([x, y, z]) => [Math.min(ix1 - 0.03, Math.max(ix0 + 0.03, x)), Math.min(iz1 - 0.03, Math.max(iz0 + 0.03, y)), z]
        if (!drain) as("pipes", [r.run], () => { for (let i = 1; i < path.length; i++) pipe(P3(k(path[i - 1])), P3(k(path[i])), rad, "ppr") })
        else if (r.system !== "vent") {
          const i = path.findIndex((q, j) => q[2] >= 0 && path[j + 1]?.[2] < 0)
          if (i >= 0) { const [x, y] = k(path[i]); as("pipes", [`${r.run}-${x}`], () => cyl(x, y, rad, FL - 0.2, 0.3, "upvc", 20)) }
        }
        continue
      }
      if (!PLUMB) continue
      if (LINE) {
        const pos = []
        for (let i = 1; i < path.length; i++) pos.push(...P3(path[i - 1]), ...P3(path[i]))
        pipeLines.push([PL.colours[r.system], drain && r.dn >= 50 ? 4.4 : 3.2, pos])
      } else for (let i = 1; i < path.length; i++) as("pipes", [r.run], () => pipe(P3(path[i - 1]), P3(path[i]), rad * 1.4, `run-${r.system}`))
    }

  FIT = !TOP
  const fit = Object.fromEntries(PL.fittings.map((f) => [f.point, f]))
  as("pipes", ["meter"], () => { // the stop valve, the Y-filter and the blue check meter on the main, in the cupboard
    const [x, y, z] = P3(fit.SV.at)
    pipe([x, y - 0.12, z], [x, y + 0.16, z], 0.014, "ppr")
    cyl(x, z, 0.03, y + 0.1, 0.05, "brass", 20)
    blk(x - 0.05, z - 0.006, x + 0.05, z + 0.006, y + 0.155, y + 0.165, "red") // the valve's lever

    cyl(x, z, 0.04, y - 0.02, 0.012, "smoked", 24)

// ------------------------------------------------------------ the BuildUp layers, seen from above
const ORDER = ["base", "pipes", "walls", "floor", "fittings"]
if (TOP) {
  if (!ORDER.includes(TOP)) throw new Error(`no layer ${TOP}`)
  // the layer asked for in its colours; the layers built before it only hide what they cover; the rest left out.
  // The base alone is opaque
  const hide = new THREE.MeshBasicMaterial({ colorWrite: false })
  for (const m of meshes) {
    const k = ORDER.indexOf(m.userData.layer), at = ORDER.indexOf(TOP)
    if (m.userData.tags.includes("fan")) { m.visible = false; continue } // high on the wall: from above it would float
    if (k > at) m.visible = false
    else if (k < at) { m.material = hide; m.castShadow = false; m.renderOrder = -1 } // drawn first, so its depth masks
  }
  if (TOP === "base") renderer.setClearColor(0xffffff, 1)
}

// ------------------------------------------------------------ camera
let camera
if (TOP) {
  // straight down, x to the right and the courtyard at the bottom
  const B = TOPBOX
  camera = new THREE.OrthographicCamera(B.x0, B.x1, -B.z0, -B.z1, 0.1, 100)
  camera.position.set(0, 30, 0)
  camera.up.set(0, 0, -1)
  camera.lookAt(0, 0, 0)
} else if (ITEM) {
  // a piece on its own, three-quarter view toward the wall it hangs on, a little above (a ceiling light from below)
  const bb = new THREE.Box3()
  for (const o of meshes) bb.expandByObject(o)
  const mid = bb.getCenter(new THREE.Vector3()), r = bb.getBoundingSphere(new THREE.Sphere()).radius
  const west = ["wc", "roll", "cupboard"], east = ["urinal", "flushvalve", "fan"]
  const view = ITEM === "light" ? [0.5, -0.55, 1] : ITEM === "floordrain" ? [0.35, 1, 0.7] : ITEM === "chamber" ? [0.5, 0.9, 1]
    : west.includes(ITEM) ? [1, 0.55, 0.8] : east.includes(ITEM) ? [-1, 0.55, 0.8] : [0.6, 0.5, 1]
  camera = new THREE.PerspectiveCamera(30, FW / FH, 0.05, 100)
  camera.position.copy(mid).addScaledVector(new THREE.Vector3(...view).normalize(), r * 4)
  camera.lookAt(mid)
} else {
  camera = new THREE.PerspectiveCamera(HERO ? 38 : 22, FW / FH, 0.3, 300)
  if (HERO) {
    // eye level in the courtyard, front-left: the bathroom right of centre and open lawn bottom-left for the words
    camera.position.set(L / 2 - 6.8, 1.6, 11)
    camera.lookAt(new THREE.Vector3(L / 2 - 1.8, 1.45, 0.5))
    add(new THREE.SphereGeometry(150, 32, 16), "sky", { noEdges: true })
    scene.fog = new THREE.Fog(0xdfe8ee, 30, 140)
  } else {
    // the front view, a little from the west end, raised so the passage shows over the cut walls
    const target = new THREE.Vector3(L / 2 - 0.1, Y0 + 0.9, 0.4)
    const [el, az, dist] = [THREE.MathUtils.degToRad(56), THREE.MathUtils.degToRad(-14), 32]
    camera.position.set(target.x + dist * Math.cos(el) * Math.sin(az), target.y + dist * Math.sin(el), target.z + dist * Math.cos(el) * Math.cos(az))
    camera.lookAt(target)
  }
}
camera.updateMatrixWorld(); camera.updateProjectionMatrix()
scene.updateMatrixWorld(true)
if (!HERO && !TOP) { // fit the frame to the model (the service views to the same box as the plain 3D, so they line up)
  const bb = new THREE.Box3()
  // the vent's top and the chamber stand outside the plain 3D's box: leave them out, so the service views line up with it
  for (const o of meshes) if (!o.geometry.type.startsWith("Circle") && (ITEM || !["vent", "chamber"].includes(o.userData.tags[0]) && !(o.userData.layer === "pipes" && o.userData.tags[0] !== "meter"))) bb.expandByObject(o)
  let px = [Infinity, Infinity, -Infinity, -Infinity]
  for (const xx of [bb.min.x, bb.max.x]) for (const yy of [bb.min.y, bb.max.y]) for (const zz of [bb.min.z, bb.max.z]) {
    const p = new THREE.Vector3(xx, yy, zz).project(camera)
    const X = ((p.x + 1) / 2) * FW, Yp = ((1 - p.y) / 2) * FH
    px = [Math.min(px[0], X), Math.min(px[1], Yp), Math.max(px[2], X), Math.max(px[3], Yp)]
  }
  const pad = ITEM ? 1.16 : 1
  let w = (px[2] - px[0]) * 1.06 * pad, h = (px[3] - px[1]) * 1.08 * pad
  if (w / h > FW / FH) h = (w * FH) / FW; else w = (h * FW) / FH
  camera.setViewOffset(FW, FH, (px[0] + px[2]) / 2 - w / 2, (px[1] + px[3]) / 2 - h / 2, w, h)
}

// where a point lands in the frame (the page puts its tag there); off-frame points sit on the edge
function tagAt(id, v) {
  const q = new THREE.Vector3(...v).project(camera)
  const x = (q.x + 1) / 2, y = (1 - q.y) / 2
  const edge = x < 0.015 ? "left" : x > 0.985 ? "right" : y < 0.02 ? "top" : y > 0.98 ? "bottom" : ""
  const clamp = (n, a, b) => +Math.min(b, Math.max(a, n)).toFixed(4)
  return { id, x: clamp(x, 0.015, 0.985), y: clamp(y, 0.02, 0.98), edge }
}
if (TOP) { // each piece's rectangle on the picture, as fractions, in the order it was built
  const B = TOPBOX, W = B.x1 - B.x0, D = B.z1 - B.z0, out = {}
  for (const layer of ORDER.slice(1)) {
    const by = new Map()
    for (const m of meshes) if (m.userData.layer === layer && m.visible) {
      const bb = (by.get(m.userData.piece) ?? new THREE.Box3()).expandByObject(m)
      by.set(m.userData.piece, bb)
    }
    out[layer] = [...by.values()].map((b) => {
      const x0 = Math.max(0, (b.min.x - 0.03 - B.x0) / W), y0 = Math.max(0, (b.min.z - 0.03 - B.z0) / D)
      const x1 = Math.min(1, (b.max.x + 0.03 - B.x0) / W), y1 = Math.min(1, (b.max.z + 0.03 - B.z0) / D)
      return [+x0.toFixed(5), +y0.toFixed(5), +(x1 - x0).toFixed(5), +(y1 - y0).toFixed(5)]
    })
  }
  window.TAGS = out
}

// ------------------------------------------------------------ render
if (LINE) {
  const lines = (color, linewidth) => {
    const m = new LineMaterial({ color, linewidth, side: THREE.DoubleSide })
    m.resolution.set(FW, FH)
    m.userData.outlineParameters = { visible: false }
    return m
  }
  // the same line drawn only where something stands in front of it, dashed: a pipe in a wall, under the floor, in the plinth
  const hidden = (m) => Object.assign(m, { depthFunc: THREE.GreaterDepth, depthWrite: false, dashed: true, dashSize: 0.035, gapSize: 0.025 })
  // the service views draw the room faint, so the fittings, the devices and the runs read first
  const FAINT = PLUMB || ELEC, dev = (o) => (PLUMB && o.userData.fit) || (ELEC && o.userData.dev)
  if (FAINT) {
    const devMat = {}
    for (const o of meshes) if (dev(o)) {
      const thin = o.material.userData.outlineParameters?.visible === false
      o.material = devMat[thin] ??= Object.assign(o.material.clone(), { userData: thin ? { outlineParameters: { visible: false } } : {} })
    }
    for (const o of meshes) if (!dev(o) && o.material.userData.outlineParameters?.visible !== false) o.material.userData.outlineParameters = { color: [0.74, 0.74, 0.74] }
  }
  const lineMat = FAINT ? lines(0xbdbdbd, 1.2) : lines(INK, 1.3), devLine = lines(0x141414, 1.6)
  for (const o of meshes) {
    if (o.userData.noEdges) continue
    const g = new LineSegmentsGeometry().fromEdgesGeometry(new THREE.EdgesGeometry(o.geometry, 30))
    const l = new LineSegments2(g, FAINT && dev(o) ? devLine : lineMat)
    l.matrixAutoUpdate = false; l.matrix.copy(o.matrixWorld)
    scene.add(l)
  }
  // each run in its colour, solid where it shows and dashed where it is hidden
  for (const [colour, w, pos] of [...pipeLines, ...cableLines]) {
    const g = new LineSegmentsGeometry().setPositions(pos)
    const seen = new LineSegments2(g, lines(colour, w)), hid = new LineSegments2(g, hidden(lines(colour, w * 0.8)))
    seen.renderOrder = 2; hid.renderOrder = 3; hid.computeLineDistances()
    scene.add(seen, hid)
  }
  if (PLUMB) window.TAGS = PL.fittings.map((f) => tagAt(f.point, P3(f.at)))
  if (ELEC) window.TAGS = [tagAt("DB", P3([EL.board.at[0], EL.board.at[1] + EL.board.d, EL.board.at[2]])),
    ...EL.points.filter((p) => !["earth", "walllight"].includes(p.model)).map((p) => tagAt(p.point, P3(p.at)))]
  const ink = new THREE.Color(FAINT ? 0x141414 : INK)
  new OutlineEffect(renderer, { defaultThickness: FAINT ? 0.003 : 0.0025, defaultColor: [ink.r, ink.g, ink.b] }).render(scene, camera)
} else {
  const pmrem = new THREE.PMREMGenerator(renderer)
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture
  scene.environmentIntensity = ELEC ? 0.12 : 0.45
  scene.add(new THREE.HemisphereLight(ELEC ? 0x8090b0 : 0xeef3ff, 0x8a7a5a, HERO ? 0.7 : ELEC ? 0.25 : 0.9))
  // the sun from the front, over the left shoulder: daylight on the courtyard; at dusk for the lights; straight down
  // for the top view, so no shadow falls across a neighbouring piece
  const sun = new THREE.DirectionalLight(ELEC ? 0xffc28a : 0xfff0d8, HERO ? 2.8 : ELEC ? 0.45 : 2.6)
  if (TOP) sun.position.set(L / 2 + 0.01, 30, 0.01)
  else if (ITEM) { const c = new THREE.Box3().setFromObject(meshes[0]).getCenter(new THREE.Vector3()); sun.position.set(c.x - 2, c.y + 5, c.z + 3.5) }
  else sun.position.set(L / 2 - 8, HERO ? 10 : 12, 10)
  sun.target.position.set(ITEM ? sun.position.x + 2 : L / 2, ITEM ? sun.position.y - 5 : 0, ITEM ? sun.position.z - 3.5 : 0); scene.add(sun.target)
  sun.castShadow = true
  sun.shadow.mapSize.set(4096, 4096)
  Object.assign(sun.shadow.camera, { left: -7, right: 7, top: 7, bottom: -7, near: 1, far: 40 })
  sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.02; sun.shadow.radius = 4
  scene.add(sun)
  if (ITEM) { // the piece stands on the white page: only its shadow shows
    const bb = new THREE.Box3()
    for (const o of meshes) bb.expandByObject(o)
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.ShadowMaterial({ opacity: 0.16 }))
    ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true
    ground.position.set((bb.min.x + bb.max.x) / 2, bb.min.y - 0.002, (bb.min.z + bb.max.z) / 2)
    scene.add(ground)
  }
  // the rooms' own light, so the deep corners aren't dim: one in each toilet room, the lobby, the passage and the
  // urinal room; at dusk, the ceiling lights themselves
  if (!HERO && !ITEM && !TOP) {
    const spots = ELEC ? EL.points.filter((p) => p.model === "light").map((p) => [p.at[0], p.at[1]])
      : [[(r1.x0 + r1.x1) / 2, 0.5], [(r2.x0 + r2.x1) / 2, 0.5], [(LO.x0 + LO.x1) / 2, 0], [1.6, -0.65], [(UR.x0 + UR.x1) / 2, 0.5]]
    for (const [x, z] of spots) {
      const l = new THREE.PointLight(0xfff0d6, ELEC ? 3.5 : 0.8, ELEC ? 4 : 3.5, 2)
      l.position.set(x, CE - (ELEC ? 0.2 : 0.1), z); scene.add(l)
    }
  }
  const composer = new EffectComposer(renderer)
  composer.setSize(FW, FH)
  composer.addPass(new RenderPass(scene, camera))
  if (!TOP) {
    const ao = new GTAOPass(scene, camera, FW, FH)
    ao.blendIntensity = 0.8
    ao.updateGtaoMaterial({ radius: ITEM ? 0.1 : 0.3, distanceExponent: 1.5, thickness: 1, scale: 1 })
    composer.addPass(ao)
  }
  composer.addPass(new OutputPass())
  composer.render()
}
document.getElementById("out").src = renderer.domElement.toDataURL("image/png")
document.body.dataset.ready = "1"
</script>
</body>
</html>
