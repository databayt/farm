<!doctype html>
<!--
  The /en/studio 3D section: one detailed room built from render/scene.json (the generator's
  layout numbers), seen from the front with the front wall and roof off, rendered two ways.

    ?mode=line  black-and-white line drawing (the 2D section's pattern)  -> render/front-line.png
    ?mode=real  realistic render: materials, sun, soft shadows, AO        -> render/front-real.jpg

  Serve the repo root on :3000 (python3 -m http.server 3000), open this page at 2400 x 1150 and
  screenshot #out once body[data-ready] is set. The furniture follows the photos in ~/farm/ikea
  for look (FRIDHULT sofa, MALM bed with storage boxes, LACK tables, a vessel basin on a black
  console, a wall-hung WC, a frameless shower screen); sizes come from the design. Pillows, duvet,
  cushions, towels, books, plants and the kettle are render-only props. Textures are drawn
  here procedurally; no photo is copied into the render.
-->

<script type="module">
import * as THREE from "three"
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js"
import { OutlineEffect } from "three/addons/effects/OutlineEffect.js"
import { LineSegments2 } from "three/addons/lines/LineSegments2.js"
import { LineSegmentsGeometry } from "three/addons/lines/LineSegmentsGeometry.js"
import { LineMaterial } from "three/addons/lines/LineMaterial.js"
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js"
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js"
import { RenderPass } from "three/addons/postprocessing/RenderPass.js"
import { GTAOPass } from "three/addons/postprocessing/GTAOPass.js"
import { OutputPass } from "three/addons/postprocessing/OutputPass.js"

const MODE = new URLSearchParams(location.search).get("mode") === "real" ? "real" : "line"
const LINE = MODE === "line"
const FW = 2400, FH = 1100
const S = await (await fetch(`/public/designs/studio/render/scene.json?${Date.now()}`)).json()
const m = (v) => v / 1000 // layout mm -> metres; three: x = x, y = height (layout z), z = depth (layout y)

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
renderer.setPixelRatio(1)
renderer.setSize(FW, FH)
renderer.outputColorSpace = THREE.SRGBColorSpace
if (!LINE) {
  renderer.toneMapping = THREE.ACESFilmicToneMapping
  renderer.toneMappingExposure = 1.05
  renderer.shadowMap.enabled = true
  renderer.shadowMap.type = THREE.PCFShadowMap
}
const scene = new THREE.Scene()
// white page ground; in real mode tone mapping would dim plain white to grey, so it starts brighter
scene.background = LINE ? new THREE.Color("#ffffff") : new THREE.Color(12, 12, 12)

// ------------------------------------------------------------ procedural textures (real mode)
function tex(draw, w = 512, h = 512) {
  const c = document.createElement("canvas"); c.width = w; c.height = h
  draw(c.getContext("2d"), w, h)
  const t = new THREE.CanvasTexture(c)
  t.colorSpace = THREE.SRGBColorSpace
  t.wrapS = t.wrapT = THREE.RepeatWrapping
  t.anisotropy = 8
  return t
}
let seed = 7
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647)
const T = LINE ? {} : {
  // soft dark grey knit
  fabric: tex((g, w, h) => {
    g.fillStyle = "#7b7d80"; g.fillRect(0, 0, w, h)
    for (let i = 0; i < 9000; i++) {
      g.fillStyle = rnd() > 0.5 ? "rgba(255,255,255,0.10)" : "rgba(60,60,60,0.10)"
      g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 2, 1)
    }
    for (let y = 0; y < h; y += 3) { g.fillStyle = "rgba(0,0,0,0.035)"; g.fillRect(0, y, w, 1) }
  }, 256, 256),
  // white marble with soft grey veins, after the RIVI bathroom
  marble: tex((g, w, h) => {
    g.fillStyle = "#f2f1ee"; g.fillRect(0, 0, w, h)
    g.filter = "blur(1.2px)"
    for (let i = 0; i < 26; i++) {
      g.strokeStyle = `rgba(110,112,116,${0.08 + rnd() * 0.22})`; g.lineWidth = 0.6 + rnd() * 2.2
      g.beginPath(); let x = rnd() * w, y = rnd() * h; g.moveTo(x, y)
      for (let k = 0; k < 5; k++) {
        const nx = x + (rnd() - 0.3) * 260, ny = y + (rnd() - 0.5) * 160
        g.quadraticCurveTo(x + (rnd() - 0.5) * 120, y + (rnd() - 0.5) * 120, nx, ny); x = nx; y = ny
      }
      g.stroke()
    }
    g.filter = "none"
    g.strokeStyle = "rgba(150,150,150,0.55)"; g.lineWidth = 2; g.strokeRect(0, 0, w, h) // tile joint
  }, 1024, 1024),
  // birch ply joinery under a light PU varnish
  ply: tex((g, w, h) => {
    g.fillStyle = "#e6d3b1"; g.fillRect(0, 0, w, h)
    for (let i = 0; i < 70; i++) {
      g.strokeStyle = `rgba(150,110,60,${0.05 + rnd() * 0.08})`; g.lineWidth = 1 + rnd() * 2
      const y = rnd() * h
      g.beginPath(); g.moveTo(0, y)
      g.bezierCurveTo(w * 0.3, y + (rnd() - 0.5) * 18, w * 0.7, y + (rnd() - 0.5) * 18, w, y + (rnd() - 0.5) * 8)
      g.stroke()
    }
  }),
  // golden knotty pine (the founder's reference, ~/Downloads/IMG_3235.jpg): warm honey-gold, matte,
  // soft long grain and dark knots
  pine: tex((g, w, h) => {
    g.fillStyle = "#c08a45"; g.fillRect(0, 0, w, h)
    for (let i = 0; i < 170; i++) {
      const y = rnd() * h, dark = rnd() > 0.45
      g.strokeStyle = dark ? `rgba(150,98,40,${0.1 + rnd() * 0.18})` : `rgba(236,200,132,${0.1 + rnd() * 0.18})`
      g.lineWidth = 0.8 + rnd() * 3
      g.beginPath(); g.moveTo(0, y)
      g.bezierCurveTo(w * 0.33, y + (rnd() - 0.5) * 20, w * 0.66, y + (rnd() - 0.5) * 20, w, y + (rnd() - 0.5) * 8)
      g.stroke()
    }
    for (let k = 0; k < 10; k++) {
      const x = rnd() * w, y = rnd() * h, rx = 6 + rnd() * 13, ry = rx * (0.45 + rnd() * 0.35)
      const grd = g.createRadialGradient(x, y, 0, x, y, rx)
      grd.addColorStop(0, "rgba(92,56,20,0.95)"); grd.addColorStop(0.55, "rgba(125,80,32,0.6)"); grd.addColorStop(1, "rgba(160,110,50,0)")
      g.fillStyle = grd; g.beginPath(); g.ellipse(x, y, rx * 1.6, ry * 1.6, 0, 0, Math.PI * 2); g.fill()
      for (let r = 1; r <= 3; r++) {
        g.strokeStyle = `rgba(120,76,30,${0.35 / r})`; g.lineWidth = 1
        g.beginPath(); g.ellipse(x, y, rx * (1 + r * 0.6), ry * (1 + r * 0.6), 0, 0, Math.PI * 2); g.stroke()
      }
    }
    for (let i = 0; i < 1600; i++) { g.fillStyle = "rgba(110,70,28,0.10)"; g.fillRect(rnd() * w, rnd() * h, 2 + rnd() * 3, 1) }
  }, 1024, 512),
  // SPC floor planks
  planks: tex((g, w, h) => {
    const tones = ["#7a5b40", "#6f5139", "#836345", "#694c35", "#76573c"] // smoked oak
    const rows = 10, rh = h / rows
    for (let r = 0; r < rows; r++) {
      let x = -((r * 173) % 400)
      while (x < w) {
        const len = 360 + ((r * 97 + Math.abs(x)) % 240)
        g.fillStyle = tones[(r * 7 + Math.abs(x)) % tones.length]; g.fillRect(x, r * rh, len, rh)
        for (let k = 0; k < 6; k++) {
          g.fillStyle = "rgba(90,60,30,0.06)"; g.fillRect(x, r * rh + rnd() * rh, len, 1)
        }
        g.fillStyle = "rgba(60,40,20,0.45)"; g.fillRect(x, r * rh, 2, rh)
        x += len
      }
      g.fillStyle = "rgba(60,40,20,0.4)"; g.fillRect(0, r * rh, w, 2)
    }
  }, 1024, 1024),
}

// ------------------------------------------------------------ materials
const MAT = {}
function mat(name) {
  if (MAT[name]) return MAT[name]
  let x
  if (LINE) {
    if (name === "cut") x = new THREE.MeshBasicMaterial({ color: "#111111" })
    else if (name === "glass") x = new THREE.MeshBasicMaterial({ color: "#ffffff", transparent: true, opacity: 0, depthWrite: false })
    else x = new THREE.MeshBasicMaterial({ color: "#ffffff", polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 })
  } else {
    const std = (o) => new THREE.MeshStandardMaterial(o)
    x = {
      wall: () => std({ color: "#f0ece3", roughness: 0.88 }), // off-white painted linings
      pine: () => std({ map: T.pine, roughness: 0.62 }), // golden knotty pine joinery, matte
      white: () => std({ color: "#f3f2ee", roughness: 0.55 }),
      ply: () => std({ map: T.ply, roughness: 0.6 }),
      worktop: () => std({ color: "#c4996a", roughness: 0.45 }),
      fabric: () => std({ map: T.fabric, roughness: 0.95 }),
      linen: () => std({ color: "#f7f6f2", roughness: 0.9 }),
      duvet: () => std({ color: "#eef0ef", roughness: 0.92 }),
      throw: () => std({ color: "#8c8f93", roughness: 0.95 }),
      yellow: () => std({ color: "#e2b43a", roughness: 0.9 }),
      blue: () => std({ color: "#8ea2b4", roughness: 0.9 }),
      marble: () => std({ map: T.marble, roughness: 0.22 }),
      vinyl: () => std({ color: "#dcdcda", roughness: 0.6 }),
      floor: () => std({ map: T.planks, roughness: 0.55 }),
      ceramic: () => new THREE.MeshPhysicalMaterial({ color: "#fbfbfa", roughness: 0.12, clearcoat: 0.7, clearcoatRoughness: 0.1 }),
      black: () => std({ color: "#1f2023", roughness: 0.45, metalness: 0.5 }),
      hob: () => std({ color: "#0f1012", roughness: 0.12, metalness: 0.2 }),
      steel: () => std({ color: "#c7cacd", roughness: 0.28, metalness: 0.9 }),
      glass: () => new THREE.MeshPhysicalMaterial({ color: "#e4f1f3", roughness: 0.04, transparent: true, opacity: 0.16, depthWrite: false }),
      mirror: () => std({ color: "#d9e0e3", roughness: 0.03, metalness: 1 }),
      led: () => std({ color: "#fffaf0", emissive: "#fff6e0", emissiveIntensity: 1.6 }),
      cut: () => std({ color: "#2c2c2c", roughness: 0.9 }),
      leaf: () => std({ color: "#4f7d3a", roughness: 0.7 }),
      leaf2: () => std({ color: "#3f6b30", roughness: 0.7 }),
      pot: () => std({ color: "#d9d4cc", roughness: 0.8 }),
      wood: () => std({ color: "#7a5537", roughness: 0.6 }),
      book1: () => std({ color: "#c8b79a", roughness: 0.8 }), book2: () => std({ color: "#7f8f7a", roughness: 0.8 }),
      book3: () => std({ color: "#b56b4f", roughness: 0.8 }), book4: () => std({ color: "#41536b", roughness: 0.8 }),
      towel: () => std({ color: "#d8cdbd", roughness: 0.95 }),
      shade: () => std({ color: "#efe6d4", roughness: 0.9, emissive: "#ffd9a0", emissiveIntensity: 0.35 }),
    }[name]?.() ?? std({ color: "#dddddd", roughness: 0.7 })
  }
  MAT[name] = x
  return x
}

// ------------------------------------------------------------ geometry helpers (metres)
const meshes = []
function add(geo, name, opts = {}) {
  const mesh = new THREE.Mesh(geo, mat(name))
  mesh.castShadow = !LINE && name !== "glass" && name !== "floor" && name !== "vinyl" && !opts.noShadow
  mesh.receiveShadow = !LINE
  if (opts.rot) mesh.rotation.set(...opts.rot)
  if (opts.pos) mesh.position.set(...opts.pos)
  scene.add(mesh)
  meshes.push(mesh)
  return mesh
}
// a box between two corners (three coordinates), optionally with rounded edges
function box(x0, y0, z0, x1, y1, z1, name, r = 0, opts = {}) {
  const w = x1 - x0, h = y1 - y0, d = z1 - z0
  const rr = Math.min(r, w / 2 - 1e-4, h / 2 - 1e-4, d / 2 - 1e-4)
  const geo = rr > 0 ? new RoundedBoxGeometry(w, h, d, 5, rr) : new THREE.BoxGeometry(w, h, d)
  const mesh = add(geo, name, { pos: [(x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2], ...opts })
  // a lightly rounded panel still reads as a panel: draw its box edges too (a silhouette pressed
  // against a wall is lost in the wall)
  if (rr > 0 && rr <= 0.012) mesh.userData.edgesFrom = new THREE.BoxGeometry(w, h, d)
  return mesh
}
// a layout box [x0, y0, z0, x1, y1, z1] in mm -> three corners
const L3 = (b) => [m(b[0]), m(b[2]), m(b[1]), m(b[3]), m(b[5]), m(b[4])]
function cyl(x, y, z, r, h, name, axis = "y", seg = 32, rTop = r) {
  const geo = new THREE.CylinderGeometry(rTop, r, h, seg)
  const rot = axis === "x" ? [0, 0, Math.PI / 2] : axis === "z" ? [Math.PI / 2, 0, 0] : [0, 0, 0]
  return add(geo, name, { pos: [x, y, z], rot })
}
// a wall cut by the section: the body, then a thin dark cap on its cut top, as on the plan
function cutWall(x0, y0, z0, x1, y1, z1, name) {
  box(x0, y0, z0, x1, y1, z1, name)
  box(x0, y1 - 0.004, z0, x1, y1 + 0.002, z1, "cut")
}
function plant(x, y, z, s = 1) {
  cyl(x, y + 0.09 * s, z, 0.08 * s, 0.18 * s, "pot", "y", 32, 0.1 * s)
  for (let i = 0; i < 11; i++) {
    const a = (i / 11) * Math.PI * 2
    const leaf = add(new THREE.SphereGeometry(0.075 * s, 20, 14), i % 2 ? "leaf" : "leaf2")
    leaf.scale.set(0.45, 1.6, 1)
    leaf.position.set(x + Math.cos(a) * 0.06 * s, y + (0.27 + (i % 3) * 0.05) * s, z + Math.sin(a) * 0.06 * s)
    leaf.rotation.set(Math.sin(a) * 0.55, a, Math.cos(a) * 0.55)
  }
}

// a rounded rectangle in the floor plane (world x, z), drawn in shape space (u = x, v = -z)
function rr(path, x0, z0, x1, z1, r) {
  const u0 = x0, u1 = x1, v0 = -z1, v1 = -z0
  path.moveTo(u0 + r, v0)
  path.lineTo(u1 - r, v0); path.absarc(u1 - r, v0 + r, r, -Math.PI / 2, 0, false)
  path.lineTo(u1, v1 - r); path.absarc(u1 - r, v1 - r, r, 0, Math.PI / 2, false)
  path.lineTo(u0 + r, v1); path.absarc(u0 + r, v1 - r, r, Math.PI / 2, Math.PI, false)
  path.lineTo(u0, v0 + r); path.absarc(u0 + r, v0 + r, r, Math.PI, 1.5 * Math.PI, false)
  return path
}
function extrude(shape, y0, h, name, bevel = 0) {
  const g = new THREE.ExtrudeGeometry(shape, {
    depth: h, curveSegments: 16, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 3,
  })
  return add(g, name, { pos: [0, y0, 0], rot: [-Math.PI / 2, 0, 0] })
}
const slab = (x0, z0, x1, z1, r, y0, h, name, bevel = 0) => extrude(rr(new THREE.Shape(), x0, z0, x1, z1, r), y0, h, name, bevel)
// a hollow rounded rectangle: walls t thick, open at the top, so a bowl's depth shows
function ring(x0, z0, x1, z1, r, t, y0, h, name, bevel = 0) {
  const shape = rr(new THREE.Shape(), x0, z0, x1, z1, r)
  shape.holes.push(rr(new THREE.Path(), x0 + t, z0 + t, x1 - t, z1 - t, Math.max(r - t, 0.004)))
  return extrude(shape, y0, h, name, bevel)
}

const L = m(S.L), W = m(S.W), H = m(S.H), e = m(S.lining)
const px0 = m(S.part_x0), bx0 = m(S.bath_x0), cy0 = m(S.bath_y1), cy1 = m(S.bath_y1 + S.cross_t), wb = m(S.wall_b)

// ------------------------------------------------------------ the room: floor, walls, section cuts
box(-e, -0.03, -e, px0, 0, W + e, "floor", 0, { noShadow: true })
box(px0, -0.03, -e, L + e, 0, W + e, "vinyl", 0, { noShadow: true })
cutWall(-e, 0, -e, bx0, H, 0, "wall") // back wall, living side
cutWall(bx0, 0, -e, L + e, H, 0, "marble") // back wall, bathroom
cutWall(-e, 0, 0, 0, H, W, "wall") // end A
cutWall(wb, 0, 0, L + e, H, cy0, "marble") // end B, bathroom: built out flat over the concealed cistern
cutWall(L, 0, cy1, L + e, H, W, "marble") // end B behind the basin
cutWall(L, 0, cy0, L + e, H, cy1, "wall")
// front wall off: a low curb either side of the sliding glass (the entrance)
const curb = 0.12
cutWall(-e, 0, W, m(S.o1[0]), curb, W + e, "wall")
cutWall(m(S.o1[1]), 0, W, L + e, curb, W + e, "wall") // solid past the glazing: W1 has steel infill below its sill
// the partition between the galley and the bathroom stands full height, in place
cutWall(px0, 0, 0, bx0, H, cy1, "wall")
box(bx0 - 0.012, 0, 0, bx0, H, cy0, "marble")
// the cross wall is cut low so the shower and WC show behind it; the door opening is left open
const cut = 0.55, d0 = m(S.bdoor[0]), d1 = m(S.bdoor[1])
cutWall(d1, 0, cy0, L, cut, cy1, "marble")

// ------------------------------------------------------------ bed (MALM look), bedside table, reading lamps
{
  const x1 = m(S.bed_x1), z0 = m(S.bed_y0), z1 = m(S.bed_y1)
  box(0, 0, 0, x1, 1.0, z0, "pine", 0.008) // tall headboard, straight on the back wall
  box(0, 0, z0, x1, 0.45, z1, "pine", 0.01) // high frame, tight to end A
  // two storage boxes in the room side, each front with a finger-pull slot
  for (const [da, db] of S.drawers) {
    const a = m(da) + 0.003, b = m(db) - 0.003
    box(x1, 0.062, a, x1 + 0.006, 0.35, b, "pine", 0.004)
    box(x1 + 0.004, 0.296, (a + b) / 2 - 0.09, x1 + 0.0068, 0.322, (a + b) / 2 + 0.09, LINE ? "white" : "black", 0.004)
  }
  box(0.025, 0.45, z0 + 0.02, x1 - 0.025, 0.65, 0.66, "linen", 0.05) // mattress, seen at the head
  box(0.012, 0.45, 0.62, x1 - 0.012, 0.69, z1, "duvet", 0.06) // duvet over the mattress
  box(0.01, 0.65, 0.62, x1 - 0.01, 0.715, 0.8, "duvet", 0.03) // turned-down fold
  for (const px of [0.1, x1 / 2 + 0.03]) box(px, 0.65, z0 + 0.05, px + x1 / 2 - 0.13, 0.8, z0 + 0.4, "linen", 0.07) // pillows
  // bedside table (LACK look): thick top, thick legs, a lower shelf
  const [bx0_, , bz0_, bx1_, bh, bz1_] = L3(S.bedside)
  const lg = 0.036
  box(bx0_, bh - 0.035, bz0_, bx1_, bh, bz1_, "pine", 0.006)
  for (const lx of [bx0_, bx1_ - lg]) for (const lz of [bz0_, bz1_ - lg]) box(lx, 0, lz, lx + lg, bh - 0.035, lz + lg, "pine", 0.003)
  box(bx0_ + lg, 0.18, bz0_ + lg, bx1_ - lg, 0.198, bz1_ - lg, "pine", 0.003)
  // reading lamp on it: round base, thin stem, linen drum shade
  const [lx0, ly0, lz0, lx1, ly1, lz1] = L3(S.lamp)
  const lcx = (lx0 + lx1) / 2, lcz = (lz0 + lz1) / 2
  cyl(lcx, ly0 + 0.012, lcz, 0.07, 0.024, "black", "y", 40, 0.06)
  cyl(lcx, ly0 + 0.15, lcz, 0.007, 0.26, "black")
  const shade = add(new THREE.CylinderGeometry(0.1, 0.13, 0.18, 48, 1, true), "shade")
  shade.material = shade.material.clone(); shade.material.side = THREE.DoubleSide
  shade.position.set(lcx, ly1 - 0.09, lcz)
  // a wall reading lamp over the wall-side pillow
  box(0.26, 1.12, 0, 0.34, 1.2, 0.012, "black", 0.004)
  const arm = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0.3, 1.16, 0.012), new THREE.Vector3(0.3, 1.21, 0.12), new THREE.Vector3(0.3, 1.15, 0.23),
  ])
  add(new THREE.TubeGeometry(arm, 24, 0.006, 10, false), "black")
  const head = add(new THREE.CylinderGeometry(0.03, 0.055, 0.08, 32, 1, true), "black")
  head.material = head.material.clone(); head.material.side = THREE.DoubleSide
  head.position.set(0.3, 1.11, 0.24)
  if (!LINE) {
    const glow = new THREE.PointLight(0xffd9a0, 0.7, 1.6)
    glow.position.set(lcx, ly1 - 0.12, lcz); scene.add(glow)
  }
}

// ------------------------------------------------------------ seating: FRIDHULT-look sofa, LACK-look table, two chairs
{
  const [sx0, , sz0, sx1, sh, sz1] = L3(S.sofa)
  const arm = 0.09, legH = 0.06
  for (const lx of [sx0 + 0.06, sx1 - 0.06]) for (const lz of [sz0 + 0.06, sz1 - 0.06]) cyl(lx, legH / 2, lz, 0.018, legH, "pine", "y", 20, 0.022)
  box(sx0, legH, sz0, sx1, 0.3, sz1, "fabric", 0.035) // base
  box(sx0, legH, sz0, sx0 + arm, 0.56, sz1, "fabric", 0.04) // arms
  box(sx1 - arm, legH, sz0, sx1, 0.56, sz1, "fabric", 0.04)
  box(sx0 + arm, 0.3, sz0, sx1 - arm, 0.58, sz0 + 0.14, "fabric", 0.035) // back frame
  const sw = (sx1 - sx0 - 2 * arm) / 2
  for (let i = 0; i < 2; i++) {
    const x = sx0 + arm + i * sw
    box(x + 0.005, 0.3, sz0 + 0.14, x + sw - 0.005, 0.4, sz1 - 0.01, "fabric", 0.05) // seat cushion
    const back = box(x + 0.01, 0.0, -0.06, x + sw - 0.01, 0.34, 0.06, "fabric", 0.055) // back cushion, tilted
    back.position.set(x + sw / 2, 0.55, sz0 + 0.21); back.rotation.x = -0.2
  }
  const c1 = box(-0.19, -0.19, -0.06, 0.19, 0.19, 0.06, "yellow", 0.06) // scatter cushions
  c1.position.set(sx0 + arm + 0.22, 0.56, sz0 + 0.34); c1.rotation.set(-0.35, 0.25, 0.12)
  const c2 = box(-0.19, -0.19, -0.06, 0.19, 0.19, 0.06, "blue", 0.06)
  c2.position.set(sx1 - arm - 0.22, 0.56, sz0 + 0.34); c2.rotation.set(-0.35, -0.25, -0.12)

  const [tx0, , tz0, tx1, th, tz1] = L3(S.table)
  const leg = 0.028, top = 0.04 // slim legs under a solid top
  box(tx0, th - top, tz0, tx1, th, tz1, "pine", 0.006)
  for (const lx of [tx0 + 0.02, tx1 - 0.02 - leg]) for (const lz of [tz0 + 0.02, tz1 - 0.02 - leg]) {
    box(lx, 0, lz, lx + leg, th - top, lz + leg, "pine", 0.003)
  }

  for (const c of S.chairs) {
    const [cx0, , cz0, cx1, ch, cz1] = L3(c)
    const seatY = 0.4
    box(cx0 + 0.01, seatY - 0.03, cz0 + 0.01, cx1 - 0.01, seatY, cz1 - 0.04, "pine", 0.012) // seat
    for (const lx of [cx0 + 0.035, cx1 - 0.035]) for (const lz of [cz0 + 0.04, cz1 - 0.06]) {
      cyl(lx, (seatY - 0.03) / 2, lz, 0.016, seatY - 0.03, "pine", "y", 20, 0.012) // tapered legs
    }
    for (const lx of [cx0 + 0.035, cx1 - 0.035]) cyl(lx, seatY + (ch - seatY) / 2, cz1 - 0.05, 0.012, ch - seatY, "pine")
    // curved back rail: a slice of a cylinder, bowing toward the table
    // (the arc's apex sits on the rear posts, its ends curve forward around the sitter)
    const rail = add(new THREE.CylinderGeometry(0.42, 0.42, 0.11, 40, 1, true, -0.5, 1.0), "pine")
    rail.material = rail.material.clone(); rail.material.side = THREE.DoubleSide
    rail.position.set((cx0 + cx1) / 2, ch - 0.08, cz1 - 0.05 - 0.42)
  }
}

// ------------------------------------------------------------ galley on the partition
{
  const gx = m(S.galley_x0), wt = 0.62, run = m(S.sink[1])
  const fr0 = m(S.fridge[0]), fr1 = m(S.fridge[1]), hb0 = m(S.hob[0]), hb1 = m(S.hob[1]), sk0 = m(S.sink[0])
  box(gx + 0.04, 0, 0, px0, 0.1, run, "black") // plinth, set back
  box(gx, 0.1, 0, px0, 0.862, sk0, "pine") // carcasses
  box(gx, 0.1, sk0, px0, 0.7, run, "pine") // the sink base stops under the bowl
  box(gx, 0, run, px0, 0.862, run + 0.012, "pine") // galley end panel (K7)
  // fronts with shadow gaps: fridge door (white), two hob drawers, the sink door; bar handles
  const front = (z0, z1, y0, y1, name) => box(gx - 0.019, y0, z0 + 0.002, gx - 0.001, y1, z1 - 0.002, name, 0.004)
  front(fr0, fr1, 0.1, 0.858, "white")
  front(hb0, hb1, 0.1, 0.476, "pine"); front(hb0, hb1, 0.482, 0.858, "pine")
  front(sk0, run, 0.1, 0.858, "pine")
  const bar = (y, z0, z1) => cyl(gx - 0.035, y, (z0 + z1) / 2, 0.006, Math.min(0.16, z1 - z0 - 0.08), "steel", "z", 16)
  bar(0.8, fr0, fr1); bar(0.43, hb0, hb1); bar(0.82, hb0, hb1); bar(0.8, sk0, run)
  // induction hob: black glass with two rings
  const [hx0, , hz0, hx1, , hz1] = L3(S.hob_box)
  box(hx0, 0.9, hz0, hx1, 0.906, hz1, "hob", 0.004)
  for (const k of [0.32, 0.68]) {
    const ring = add(new THREE.RingGeometry(0.075, 0.085, 48), LINE ? "white" : "steel")
    ring.rotation.x = -Math.PI / 2; ring.position.set((hx0 + hx1) / 2, 0.9065, hz0 + (hz1 - hz0) * k)
  }
  // worktop in four pieces around the sink cut-out, so the bowl's depth shows
  const [sx0, , sz0, sx1, , sz1] = L3(S.sink_box)
  const sox0 = sx0 + 0.025, sox1 = sx1 - 0.025, soz0 = sz0 + 0.025, soz1 = sz1 - 0.025, wx = px0 - wt
  box(wx, 0.862, 0, px0, 0.9, soz0, "worktop", 0.004)
  box(wx, 0.862, soz1, px0, 0.9, run + 0.002, "worktop", 0.004)
  box(wx, 0.862, soz0, sox0, 0.9, soz1, "worktop")
  box(sox1, 0.862, soz0, px0, 0.9, soz1, "worktop")
  // inset steel sink: a thin rim, a 180 mm deep bowl with rounded corners, a drain; then the tap
  ring(sx0, sz0, sx1, sz1, 0.035, 0.025, 0.9, 0.003, "steel")
  ring(sox0, soz0, sox1, soz1, 0.03, 0.008, 0.72, 0.18, "steel")
  slab(sox0, soz0, sox1, soz1, 0.03, 0.714, 0.006, "steel")
  cyl((sox0 + sox1) / 2, 0.7215, (soz0 + soz1) / 2, 0.035, 0.003, LINE ? "white" : "black", "y", 40)
  const tapX = px0 - 0.05, tapZ = (sz0 + sz1) / 2
  cyl(tapX, 0.94, tapZ, 0.018, 0.08, "steel")
  const curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(tapX, 0.97, tapZ), new THREE.Vector3(tapX, 1.18, tapZ),
    new THREE.Vector3(tapX - 0.09, 1.22, tapZ), new THREE.Vector3(tapX - 0.17, 1.12, tapZ),
  ])
  add(new THREE.TubeGeometry(curve, 40, 0.011, 16, false), "steel")
  // overhead cabinet with two doors, and the hood under it
  const [ox0, oy0, oz0, ox1, oy1, oz1] = L3(S.overhead)
  box(ox0 + 0.02, oy0, oz0, ox1, oy1, oz1, "pine")
  const half = (oz1 - oz0) / 2
  for (let i = 0; i < 2; i++) {
    const z0 = oz0 + i * half
    box(ox0, oy0 + 0.002, z0 + 0.002, ox0 + 0.02, oy1 - 0.002, z0 + half - 0.002, "pine", 0.004)
    cyl(ox0 - 0.015, oy0 + 0.06, z0 + half / 2, 0.006, 0.16, "steel", "z", 16)
  }
  const [hdx0, hdy0, hdz0, hdx1, hdy1, hdz1] = L3(S.hood)
  box(hdx0, hdy0, hdz0, hdx1, hdy1, hdz1, "steel", 0.01)
  // on the worktop: a kettle and a small plant
  cyl(px0 - 0.22, 0.9 + 0.09, fr0 + 0.25, 0.075, 0.18, "white", "y", 32, 0.06)
  const handle = add(new THREE.TorusGeometry(0.055, 0.012, 12, 32, Math.PI), "white")
  handle.position.set(px0 - 0.22, 0.99, fr0 + 0.33); handle.rotation.set(0, Math.PI / 2, -Math.PI / 2)
}

// ------------------------------------------------------------ bathroom: shower, WC, basin (look of the photos)
{
  // shower: low tray with a round drain, frameless glass screen, a bar and a round head on end wall B
  const [tx0, , tz0, tx1, ty1, tz1] = L3(S.tray)
  box(tx0, 0, tz0, tx1, ty1, tz1, "ceramic", 0.01)
  cyl((tx0 + tx1) / 2, ty1 + 0.001, (tz0 + tz1) / 2, 0.05, 0.004, "steel")
  const [gx0, gy0, gz0, gx1, gy1, gz1] = L3(S.screen)
  box(gx0, gy0, gz0, gx1, gy1, gz1, "glass")
  box(gx0 - 0.004, gy0, gz0 - 0.002, gx0 + 0.004, gy1, gz1 + 0.002, "steel") // the free edge
  box(gx1 - 0.012, gy0, gz0 - 0.004, gx1, gy1, gz1 + 0.004, "steel") // wall channel
  const barX = wb - 0.035, barZ = (tz0 + tz1) / 2
  cyl(barX, 1.45, barZ, 0.012, 1.0, "steel")
  cyl(barX - 0.02, 1.98, barZ, 0.1, 0.015, "steel", "x", 48) // shower head
  box(wb - 0.06, 1.05, barZ - 0.09, wb, 1.17, barZ + 0.09, "steel", 0.02) // thermostatic valve
  cyl(wb - 0.075, 1.11, barZ, 0.03, 0.03, "black", "x")

  // WC: a wall-hung pan straight off the finished end wall, no box; the flush plate sits on the wall above
  const [wx0, wy0, wz0, wx1, wy1, wz1] = L3(S.wc)
  box(wx0, wy0, wz0 + 0.005, wx1, wy1 - 0.03, wz1 - 0.005, "ceramic", 0.07) // pan
  box(wx0 - 0.004, wy1 - 0.03, wz0, wx1 - 0.03, wy1, wz1, "ceramic", 0.03) // seat and lid
  const pcz = (wz0 + wz1) / 2
  box(wb - 0.006, 0.93, pcz - 0.12, wb, 1.09, pcz + 0.12, "steel", 0.006) // flush plate
  box(wb - 0.009, 0.97, pcz - 0.1, wb - 0.005, 1.05, pcz - 0.006, "steel", 0.004) // two buttons
  box(wb - 0.009, 0.97, pcz + 0.006, wb - 0.005, 1.05, pcz + 0.1, "steel", 0.004)
  // roll holder on the cross wall's bath face
  cyl(L - 0.45, 0.72, cy0 - 0.05, 0.055, 0.1, "white", "x", 32)
  box(L - 0.52, 0.715, cy0 - 0.012, L - 0.38, 0.725, cy0, "steel")

  // basin: white vessel basin on a black metal console with a slatted shelf and two rolled towels
  const [bx0_, , bz0, bx1_, , bz1] = L3(S.basin)
  const top = 0.8, cx0 = L - 0.33, cz0 = cy1 + 0.02, cz1 = W - 0.01
  for (const lx of [cx0, L - 0.02]) for (const lz of [cz0, cz1 - 0.02]) box(lx, 0, lz, lx + 0.02, top, lz + 0.02, "black")
  box(cx0, top - 0.02, cz0, L, top, cz1, "black") // top frame
  box(cx0 + 0.005, top, cz0 + 0.005, L - 0.005, top + 0.02, cz1 - 0.005, "marble", 0.004) // stone top
  box(cx0, 0.24, cz0, cx0 + 0.02, 0.26, cz1, "black"); box(L - 0.02, 0.24, cz0, L, 0.26, cz1, "black")
  for (let i = 0; i < 6; i++) {
    const z = cz0 + 0.02 + ((cz1 - cz0 - 0.06) * i) / 5
    box(cx0, 0.255, z, L, 0.27, z + 0.022, "black") // slats
  }
  for (const tz of [cz0 + 0.12, cz0 + 0.25]) cyl(cx0 + 0.15, 0.32, tz, 0.05, 0.24, "towel", "x", 32)
  const by = top + 0.02
  // vessel basin: thin ceramic walls; its bowl and drain show from above
  const vx0 = bx0_ + 0.012, vx1 = bx1_ - 0.03, vz0 = bz0 + 0.03, vz1 = bz1 - 0.03
  ring(vx0, vz0, vx1, vz1, 0.045, 0.012, by, 0.13, "ceramic")
  slab(vx0 + 0.006, vz0 + 0.006, vx1 - 0.006, vz1 - 0.006, 0.04, by, 0.02, "ceramic")
  cyl((vx0 + vx1) / 2, by + 0.0215, (vz0 + vz1) / 2, 0.022, 0.003, "steel", "y", 32)
  box(L - 0.045, by, (bz0 + bz1) / 2 - 0.015, L - 0.015, by + 0.27, (bz0 + bz1) / 2 + 0.015, "black", 0.006) // tap
  box(L - 0.12, by + 0.24, (bz0 + bz1) / 2 - 0.013, L - 0.03, by + 0.27, (bz0 + bz1) / 2 + 0.013, "black", 0.006)
  // a rounded LED mirror above
  const [mx0, my0, mz0, mx1, my1, mz1] = L3(S.mirror)
  box(L - 0.03, my0, mz0, L - 0.012, my1 - 0.08, mz1, "led", 0.05)
  box(L - 0.034, my0 + 0.02, mz0 + 0.02, L - 0.03, my1 - 0.1, mz1 - 0.02, "mirror", 0.04)
}

// ------------------------------------------------------------ camera: a front view, verticals straight
const cx = L / 2
const camera = new THREE.PerspectiveCamera(56, FW / FH, 0.1, 100)
camera.position.set(cx, 3.3, W + 5.2)
camera.lookAt(cx, 3.3, 0) // level; the view offset below frames the room without tilting
camera.updateMatrixWorld(); camera.updateProjectionMatrix()
const bb = new THREE.Box3()
for (const o of meshes) bb.expandByObject(o)
let px = [Infinity, Infinity, -Infinity, -Infinity]
for (const xx of [bb.min.x, bb.max.x]) for (const yy of [bb.min.y, bb.max.y]) for (const zz of [bb.min.z, bb.max.z]) {
  const p = new THREE.Vector3(xx, yy, zz).project(camera)
  const X = ((p.x + 1) / 2) * FW, Y = ((1 - p.y) / 2) * FH
  px = [Math.min(px[0], X), Math.min(px[1], Y), Math.max(px[2], X), Math.max(px[3], Y)]
}
let w = (px[2] - px[0]) * 1.04, h = (px[3] - px[1]) * 1.06
if (w / h > FW / FH) h = (w * FH) / FW; else w = (h * FW) / FH
camera.setViewOffset(FW, FH, (px[0] + px[2]) / 2 - w / 2, (px[1] + px[3]) / 2 - h / 2, w, h)

// ------------------------------------------------------------ render
if (LINE) {
  // crease lines from the geometry (rounded parts have none), silhouettes from the outline effect
  const lineMat = new LineMaterial({ color: 0x141414, linewidth: 1.6 })
  lineMat.resolution.set(FW, FH)
  lineMat.userData.outlineParameters = { visible: false }
  for (const o of meshes) {
    if (o.material === MAT.cut) continue
    o.updateMatrixWorld()
    const g = new LineSegmentsGeometry().fromEdgesGeometry(new THREE.EdgesGeometry(o.userData.edgesFrom ?? o.geometry, 32))
    const l = new LineSegments2(g, lineMat)
    l.matrixAutoUpdate = false; l.matrix.copy(o.matrixWorld)
    scene.add(l)
  }
  const effect = new OutlineEffect(renderer, { defaultThickness: 0.0032, defaultColor: [0.08, 0.08, 0.08] })
  MAT.cut && (MAT.cut.userData.outlineParameters = { visible: false })
  effect.render(scene, camera)
} else {
  const pmrem = new THREE.PMREMGenerator(renderer)
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture
  scene.environmentIntensity = 0.45
  scene.add(new THREE.HemisphereLight(0xffffff, 0xd8cdbc, 0.55))
  const sun = new THREE.DirectionalLight(0xffefd6, 2.4)
  sun.position.set(cx - 2.6, 5.5, W + 4.5); sun.target.position.set(cx, 0, W / 2)
  sun.castShadow = true
  sun.shadow.mapSize.set(4096, 4096)
  Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 0.5, far: 20 })
  sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.02; sun.shadow.radius = 4
  scene.add(sun, sun.target)
  const strip = new THREE.PointLight(0xfff1d6, 0.6, 2.2) // LED under the overhead cabinet
  strip.position.set(px0 - 0.3, 1.72, m(S.sink[1]) / 2); scene.add(strip)
  const composer = new EffectComposer(renderer)
  composer.setSize(FW, FH)
  composer.addPass(new RenderPass(scene, camera))
  const ao = new GTAOPass(scene, camera, FW, FH)
  ao.output = GTAOPass.OUTPUT.Default
  ao.blendIntensity = 0.85
  composer.addPass(ao)
  composer.addPass(new OutputPass())
  composer.render()
}
document.getElementById("out").src = renderer.domElement.toDataURL("image/png")
document.body.dataset.ready = "1"
</script>
