<!doctype html>
<!--
  Renders the studio hero image (public/designs/studio/model/studio-hero.png) from studio.glb:
  walls and roof removed, only the base, floor, furniture and fixtures, soft shadows and outlines.
  Serve the repo root (python3 -m http.server 3000 from ~/farm), open
  /scripts/studio/render/hero.html, and screenshot the canvas (see scripts/studio/render/README.md).
-->
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:#f4f1ec}canvas{display:block}</style>
<script type="importmap">
{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three"
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js"

const W = 2400, H = 1350
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
renderer.setPixelRatio(1)
renderer.setSize(W, H)
renderer.shadowMap.enabled = true
renderer.shadowMap.type = THREE.PCFSoftShadowMap
renderer.outputColorSpace = THREE.SRGBColorSpace
renderer.toneMapping = THREE.ACESFilmicToneMapping
renderer.toneMappingExposure = 1.05
document.body.appendChild(renderer.domElement)

const scene = new THREE.Scene()
scene.background = new THREE.Color("#f4f1ec")
scene.add(new THREE.HemisphereLight(0xffffff, 0xd8cbb8, 1.5))
const sun = new THREE.DirectionalLight(0xfff4e6, 2.6)
sun.position.set(1.5, 12, 4.5)
sun.target.position.set(2.9, 0, 1.1)
sun.castShadow = true
sun.shadow.mapSize.set(4096, 4096)
Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 0.5, far: 30 })
sun.shadow.bias = -0.0004
sun.shadow.radius = 6
scene.add(sun, sun.target)
const fill = new THREE.DirectionalLight(0xffffff, 0.6)
fill.position.set(8, 5, -4)
scene.add(fill)

const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.ShadowMaterial({ opacity: 0.16 }))
ground.rotation.x = -Math.PI / 2
ground.position.y = -0.19
ground.receiveShadow = true
scene.add(ground)

// keep: base, floors, furniture, fixtures, the bathroom partition; drop every wall, the roof, services
const hide = (id) =>
  (/^K0-/.test(id) && id !== "K0-FLOOR") ||
  (/^K1-/.test(id) && id !== "K1-SPC") ||
  /^K2-CB-(BACK|ENDB|FRONT)/.test(id) || /^K2-STUD/.test(id) ||
  /^K(7|8|10|11)-/.test(id) || id === "K9-HEATER-BOX" || /^K3-W[12]-/.test(id) || id === "K3-HS" || id === "K3-HOOD"

const COLORS = {
  PLY18: "#e2c9a0", PLY12: "#e8d3ae", MPLY18: "#d8bb8c", WTOP38: "#9a6a3e", floor: "#c99b6b", base: "#3b3d40",
  white: "#f7f7f5", glass: "#bfe0f2", stainless: "#c4c8cc", black: "#26282b", tile: "#eceff1", fabric: "#eeeeee",
  door: "#f0ece4", timber: "#c99b6b", electric: "#ffd23f", steel: "#5b5e63",
}

const gltf = await new GLTFLoader().loadAsync("/public/designs/studio/model/studio.glb")
const lines = new THREE.LineBasicMaterial({ color: 0x3a342c, transparent: true, opacity: 0.55 })
const edges = []
gltf.scene.traverse((o) => {
  if (!o.isMesh) return
  if (hide(o.name)) { o.visible = false; return }
  const key = o.material.name
  const col = new THREE.Color(COLORS[key] ?? "#dddddd")
  const glass = key === "glass"
  o.material = new THREE.MeshStandardMaterial({
    color: col, roughness: glass ? 0.05 : key === "stainless" ? 0.35 : 0.8, metalness: key === "stainless" ? 0.5 : 0,
    transparent: glass, opacity: glass ? 0.35 : 1, side: THREE.DoubleSide,
  })
  if (o.name === "K4-MATT") o.material.color.set("#f6f6f4")
  o.castShadow = !glass
  o.receiveShadow = true
  edges.push(o)
})
scene.add(gltf.scene)
gltf.scene.updateMatrixWorld(true)
for (const o of edges) {
  const g = new THREE.EdgesGeometry(o.geometry)
  const l = new THREE.LineSegments(g, lines)
  l.matrixAutoUpdate = false
  l.matrix.copy(o.matrixWorld)
  scene.add(l)
}

// render-only props (not part of the build): pillows, throw, rug, plant
const prop = (w, h, d, x, y, z, color, round = 0.8) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color, roughness: round }))
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; scene.add(m); return m
}
prop(0.62, 0.13, 0.38, 0.45, 0.72, 0.42, "#ffffff")
prop(0.62, 0.13, 0.38, 1.17, 0.72, 0.42, "#ffffff")
prop(1.62, 0.025, 0.55, 0.82, 0.665, 1.75, "#7d8590")
prop(1.2, 0.01, 0.9, 2.95, 0.005, 1.95, "#e9e2d6", 1)
const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.1, 0.26, 24), new THREE.MeshStandardMaterial({ color: "#5d5f63", roughness: 0.6 }))
pot.position.set(3.75, 0.13, 2.05); pot.castShadow = true; scene.add(pot)
for (let i = 0; i < 7; i++) {
  const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 12), new THREE.MeshStandardMaterial({ color: "#4f7d3a", roughness: 0.7 }))
  leaf.scale.set(1, 1.8, 0.35); const a = (i / 7) * Math.PI * 2
  leaf.position.set(3.75 + Math.cos(a) * 0.1, 0.48 + (i % 2) * 0.08, 2.05 + Math.sin(a) * 0.1)
  leaf.rotation.set(Math.sin(a) * 0.5, a, Math.cos(a) * 0.5); leaf.castShadow = true; scene.add(leaf)
}
const plant2 = pot.clone(); plant2.scale.setScalar(0.5); plant2.position.set(3.25, 0.965, 0.25); scene.add(plant2)

const camera = new THREE.PerspectiveCamera(24, W / H, 0.1, 100)
camera.position.set(1.0, 8.6, 10.4)
camera.lookAt(2.95, 0.7, 1.0)
renderer.render(scene, camera)
document.body.dataset.ready = "1"
</script>
</body>
</html>
