<!doctype html>
<!--
  The /en/studio wall section, the pattern of the floor section (floor.html): the back wall seen straight on
  from inside, the container's bare corrugated steel first, then its lining built on in layers, each layer
  rendered as its own transparent picture so the page can put the pieces up one by one.

    ?layer=base     the bare wall as it arrives, in its frame              -> render/wall-base.webp
    ?layer=battens  layer 1: 38 x 50 battens at 600 centres (S03)          -> render/wall-battens.webp
    ?layer=foam     ... and foam sprayed onto the steel between them (S03)  -> render/wall-foam.webp
    ?layer=panels   layer 2: the numbered 12 mm ply lining panels (S04)    -> render/wall-panels.webp
    ?layer=screws   the screws into the battens                            -> render/wall-screws.webp
    ?layer=paint    layer 3: primer + off-white satin paint, rolled on      -> render/wall-paint.webp
    ?layer=cement   the bathroom side: 12 mm cement board (S08)            -> render/wall-cement.webp
    ?layer=tiles    ... and its tiles, 300 x 600, from the floor up (S08)   -> render/wall-tiles.webp

  Every layer is the full scene lit as one, cut down to its own meshes by a mask pass, so they stack
  exactly. window.PIECES lists each piece as a rectangle in fractions of the picture, in the order it
  goes up (-> render/wall-pieces.json).

  The wall follows the generator (kits.py K1, sheets.py "WALL (steel to room)") and the CIMC 20 ft spec
  [STU-02]: 1.6 mm side wall, 36 mm-deep corrugation at 278 mm pitch; battens at 600 centres up to the
  bathroom; ply panels split evenly to the partition line, no wider than 1,220. The frame round it, in the
  box's painted steel, chipped to bare metal at the edges: the bottom side rail (a channel), the top side
  rail (a square tube), the pressed corner posts and the four corner castings, each with its side hole.

  Serve the repo root (python3 -m http.server <port>), open this page at 2400 x 1070, wait for
  body[data-ready] (attached) and save window.OUT (a PNG data URL with alpha).
-->
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:#fff}</style>
<script type="importmap">
{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three"
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js"
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js"
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js"
import { RenderPass } from "three/addons/postprocessing/RenderPass.js"
import { GTAOPass } from "three/addons/postprocessing/GTAOPass.js"
import { OutputPass } from "three/addons/postprocessing/OutputPass.js"

const LAYER = new URLSearchParams(location.search).get("layer") ?? "base"
const FW = 2400, FH = 1070
const S = await (await fetch(`/public/designs/studio/render/scene.json?${Date.now()}`)).json()
const m = (v) => v / 1000 // layout mm -> metres; three: x along the wall, y up, z out of the wall into the room

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
renderer.setPixelRatio(1)
renderer.setSize(FW, FH)
renderer.outputColorSpace = THREE.SRGBColorSpace
renderer.toneMapping = THREE.ACESFilmicToneMapping
renderer.toneMappingExposure = 1.05
renderer.shadowMap.enabled = true
renderer.shadowMap.type = THREE.PCFShadowMap
const scene = new THREE.Scene()
scene.background = new THREE.Color(12, 12, 12)

// ------------------------------------------------------------ dimensions (metres)
const L = m(S.L), H = m(S.H), e = m(S.lining), px0 = m(S.part_x0), bx0 = m(S.bath_x0)
const X0 = -e, X1 = L + e // the wall between the end walls' steel
const STEEL = -e // the inner face of the corrugation's ribs; battens and ply build out to 0
const DEPTH = 0.036, PITCH = 0.278, BAT = [0.05, 0.038], PLY = 0.012
const TOP = H + 0.05 // the roof's underside over the lining
const POST = 0.113, RAIL = 0.158, TRAIL = 0.06, CAST = [0.178, 0.118] // frame members, as seen face on
const FOAM = STEEL + BAT[1] - 0.017 // the sprayed foam's mean face, short of the battens' so they stand proud

// ------------------------------------------------------------ textures
let seed = 7
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647)
function tex(draw, w = 2048, h = 1024) {
  const c = document.createElement("canvas"); c.width = w; c.height = h
  seed = 7
  draw(c.getContext("2d"), w, h)
  const t = new THREE.CanvasTexture(c)
  t.colorSpace = THREE.SRGBColorSpace
  t.anisotropy = 8
  return t
}
// a texture over a wall rectangle [x0, y0, x1, y1]: canvas x with x, canvas y down from y1
const area = (r, w = 2048, h = 1024) => ({ r, w, h, px: (x) => ((x - r[0]) / (r[2] - r[0])) * w, py: (y) => ((r[3] - y) / (r[3] - r[1])) * h })

// the bare wall: the box's red paint, scuffed and marked by cargo, rust weeping from the floor line and the
// odd scrape. One texture over the whole wall face, so ribs and valleys carry the same marks
const WALL = area([X0, 0, X1, TOP])
const steelTex = tex((g, w, h) => {
  g.fillStyle = "#93433a"; g.fillRect(0, 0, w, h)
  for (let i = 0; i < 9000; i++) {
    g.fillStyle = rnd() > 0.5 ? "rgba(255,255,255,0.03)" : "rgba(0,0,0,0.04)"
    g.fillRect(rnd() * w, rnd() * h, 2 + rnd() * 4, 2 + rnd() * 4)
  }
  for (let i = 0; i < 60; i++) { // cargo scuffs, mostly low
    const x = rnd() * w, y = h * (0.45 + rnd() * 0.55)
    g.strokeStyle = `rgba(${rnd() > 0.5 ? "220,190,170" : "40,20,15"},${0.08 + rnd() * 0.12})`; g.lineWidth = 1 + rnd() * 3
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + (rnd() - 0.5) * 220, y + (rnd() - 0.5) * 30); g.stroke()
  }
  for (let i = 0; i < 18; i++) { // rust weeping up from the floor line
    const x = rnd() * w, r = 10 + rnd() * 30, len = 30 + rnd() * 120
    const gr = g.createLinearGradient(0, h, 0, h - len)
    gr.addColorStop(0, "rgba(110,52,20,0.55)"); gr.addColorStop(1, "rgba(110,52,20,0)")
    g.fillStyle = gr; g.fillRect(x - r, h - len, 2 * r, len)
  }
  for (let i = 0; i < 6; i++) { // ghosts of old labels and tape
    g.fillStyle = `rgba(230,215,200,${0.06 + rnd() * 0.06})`
    g.fillRect(rnd() * w, h * (0.2 + rnd() * 0.5), 40 + rnd() * 80, 20 + rnd() * 40)
  }
})
// treated pine battens
const BATTENS = []
for (let x = 0; x <= m(S.bath_x0) + 1e-6; x += 0.6) BATTENS.push(Math.min(x, bx0 - BAT[0]))
const battenTex = tex((g, w, h) => {
  g.fillStyle = "#c9a56e"; g.fillRect(0, 0, w, h)
  for (let i = 0; i < 160; i++) {
    const x = rnd() * w
    g.strokeStyle = `rgba(120,80,40,${0.06 + rnd() * 0.12})`; g.lineWidth = 1 + rnd() * 2
    g.beginPath(); g.moveTo(x, 0); g.bezierCurveTo(x + (rnd() - 0.5) * 8, h * 0.3, x + (rnd() - 0.5) * 8, h * 0.7, x, h); g.stroke()
  }
  g.fillStyle = "rgba(90,120,70,0.10)"; g.fillRect(0, 0, w, h) // the green cast of the treatment
}, 256, 1024)
// spray foam: closed-cell, cream-yellow, a skin that went off in passes, each pass a shade apart
const foamTex = tex((g, w, h) => {
  g.fillStyle = "#e6c96c"; g.fillRect(0, 0, w, h)
  for (let i = 0; i < 400; i++) { // the passes' blotches, drawn round the edges too so the tiles meet
    const x = rnd() * w, y = rnd() * h, r = 20 + rnd() * 70
    const c = rnd() > 0.5 ? "246,226,160" : "200,165,85", o = 0.18 + rnd() * 0.22
    for (const dx of [-w, 0, w]) for (const dy of [-h, 0, h]) {
      const gr = g.createRadialGradient(x + dx, y + dy, 0, x + dx, y + dy, r)
      gr.addColorStop(0, `rgba(${c},${o})`); gr.addColorStop(1, `rgba(${c},0)`)
      g.fillStyle = gr; g.fillRect(x + dx - r, y + dy - r, 2 * r, 2 * r)
    }
  }
  for (let i = 0; i < 20000; i++) { // the skin's pores
    g.fillStyle = `rgba(120,95,40,${0.03 + rnd() * 0.06})`
    g.beginPath(); g.arc(rnd() * w, rnd() * h, 0.6 + rnd() * 1.4, 0, 7); g.fill()
  }
}, 1024, 1024)
foamTex.wrapS = foamTex.wrapT = THREE.RepeatWrapping
foamTex.repeat.set(1.2, 1.2)
// the frame's paint: the box's red, worn, chipped through to grey steel and orange rust, scratched along its
// run. The same chips mark the metalness map, so bare steel shines where the paint has gone
const CHIPS = []
for (let i = 0; i < 240; i++) CHIPS.push([rnd(), rnd(), 3 + rnd() * (rnd() > 0.85 ? 26 : 10), rnd(), rnd() > 0.5])
const chip = (g, w, h, [x, y, r, k], fill) => {
  g.fillStyle = fill; g.beginPath()
  for (let a = 0; a < 7; a++) { // a ragged flake
    const t = (a / 7) * Math.PI * 2, q = r * (0.5 + ((k * 97 + a * 0.37) % 1) * 0.8)
    a ? g.lineTo(x * w + Math.cos(t) * q * 1.6, y * h + Math.sin(t) * q) : g.moveTo(x * w + Math.cos(t) * q * 1.6, y * h + Math.sin(t) * q)
  }
  g.fill()
}
const frameTex = tex((g, w, h) => {
  g.fillStyle = "#86392e"; g.fillRect(0, 0, w, h)
  for (let i = 0; i < 20000; i++) {
    g.fillStyle = rnd() > 0.5 ? "rgba(255,230,220,0.025)" : "rgba(30,10,5,0.035)"
    g.fillRect(rnd() * w, rnd() * h, 2 + rnd() * 6, 1 + rnd() * 3)
  }
  for (let i = 0; i < 90; i++) { // scratches along the member
    const x = rnd() * w, y = rnd() * h
    g.strokeStyle = `rgba(${rnd() > 0.4 ? "170,160,150" : "50,25,20"},${0.12 + rnd() * 0.2})`; g.lineWidth = 0.8 + rnd() * 1.6
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + (rnd() - 0.5) * 160, y + (rnd() - 0.5) * 12); g.stroke()
  }
  for (const c of CHIPS) {
    chip(g, w, h, [c[0], c[1], c[2] * 1.5, c[3]], c[4] ? "rgba(140,62,22,0.9)" : "rgba(118,48,30,0.9)") // a rust halo
    chip(g, w, h, c, c[4] ? "#5a5754" : "#8a4019") // bare steel, or rust bloomed on it
  }
}, 2048, 2048)
const frameMetal = tex((g, w, h) => {
  g.fillStyle = "#1a1a1a"; g.fillRect(0, 0, w, h) // paint: barely metallic
  for (const c of CHIPS) if (c[4]) chip(g, w, h, c, "#c8c8c8")
}, 2048, 2048)
frameMetal.colorSpace = THREE.NoColorSpace
for (const t of [frameTex, frameMetal]) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(0.4, 0.4) }
// the lining: 12 mm ply under a light PU varnish, split evenly to the partition line, no wider than 1,220,
// each panel pencilled with its number
const PANELS = []
{
  const n = Math.ceil((px0 - 0) / 1.22), w = px0 / n
  for (let i = 0; i < n; i++) PANELS.push([i * w, 0, (i + 1) * w, H])
}
const LIN = area([0, 0, px0, H])
const panelTex = tex((g, w, h) => {
  const tones = ["#e6d3b1", "#e1cca8", "#e9d8b8", "#dfc9a4"]
  PANELS.forEach(([a, , b], i) => {
    const x = LIN.px(a), xw = LIN.px(b) - x
    g.fillStyle = tones[i % tones.length]; g.fillRect(x, 0, xw, h)
    for (let k = 0; k < 50; k++) { // face grain up the panel
      const gx = x + rnd() * xw
      g.strokeStyle = `rgba(150,110,60,${0.05 + rnd() * 0.08})`; g.lineWidth = 1 + rnd() * 2
      g.beginPath(); g.moveTo(gx, 0)
      g.bezierCurveTo(gx + (rnd() - 0.5) * 14, h * 0.3, gx + (rnd() - 0.5) * 14, h * 0.7, gx + (rnd() - 0.5) * 8, h)
      g.stroke()
    }
    g.strokeStyle = "rgba(110,80,45,0.55)"; g.lineWidth = 2; g.strokeRect(x + 1, 1, xw - 2, h - 2)
    g.fillStyle = "rgba(70,70,75,0.55)"; g.font = "22px sans-serif"
    g.fillText(`K1-${String(i + 1).padStart(2, "0")}`, x + 14, h - 18)
  })
})
// the bathroom side: cement board, then 300 x 600 tiles in white marble, laid from the floor up
const BATH = area([px0, 0, X1, H], 512, 1024)
const cementTex = tex((g, w, h) => {
  g.fillStyle = "#b9bab6"; g.fillRect(0, 0, w, h)
  for (let i = 0; i < 20000; i++) {
    g.fillStyle = rnd() > 0.5 ? "rgba(255,255,255,0.08)" : "rgba(0,0,0,0.08)"
    g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 2, 1 + rnd() * 2)
  }
}, 512, 1024)
const TILES = []
for (let y = 0, r = 0; y < H - 0.01; y += 0.6, r++) {
  for (let x = px0; x < X1 - 0.01; x += 0.3) TILES.push([x, y, Math.min(X1, x + 0.3), Math.min(H, y + 0.6), r])
}
const tileTex = tex((g, w, h) => {
  g.fillStyle = "#cfcfcc"; g.fillRect(0, 0, w, h) // grout
  for (const [a, b, c, d] of TILES) {
    const x = BATH.px(a) + 2, y = BATH.py(d) + 2, tw = BATH.px(c) - BATH.px(a) - 4, th = BATH.py(b) - BATH.py(d) - 4
    g.save(); g.beginPath(); g.rect(x, y, tw, th); g.clip()
    g.fillStyle = "#f2f1ee"; g.fillRect(x, y, tw, th)
    g.filter = "blur(1px)"
    for (let i = 0; i < 6; i++) { // soft grey veins, after room.html's marble
      g.strokeStyle = `rgba(110,112,116,${0.08 + rnd() * 0.2})`; g.lineWidth = 0.6 + rnd() * 2
      g.beginPath(); let vx = x + rnd() * tw, vy = y + rnd() * th; g.moveTo(vx, vy)
      for (let k = 0; k < 4; k++) {
        const nx = vx + (rnd() - 0.3) * 120, ny = vy + (rnd() - 0.5) * 90
        g.quadraticCurveTo(vx + (rnd() - 0.5) * 60, vy + (rnd() - 0.5) * 60, nx, ny); vx = nx; vy = ny
      }
      g.stroke()
    }
    g.filter = "none"; g.restore()
  }
}, 512, 1024)

// the finish: room.html's off-white (#f0ece3) in a satin sheen, the roller's faint stipple and lap marks
const paintTex = tex((g, w, h) => {
  g.fillStyle = "#f0ece3"; g.fillRect(0, 0, w, h)
  for (let i = 0; i < 40000; i++) {
    g.fillStyle = rnd() > 0.5 ? "rgba(255,255,255,0.05)" : "rgba(120,110,95,0.035)"
    g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 2, 1 + rnd() * 2)
  }
  for (let x = 0; x < w; x += LIN.px(0.3) - LIN.px(0)) { g.fillStyle = "rgba(120,110,95,0.025)"; g.fillRect(x, 0, 6, h) }
})

const std = (o) => new THREE.MeshStandardMaterial(o)
const MAT = {
  steel: std({ map: steelTex, roughness: 0.6, metalness: 0.25 }),
  frame: std({ map: frameTex, metalnessMap: frameMetal, metalness: 1, roughness: 0.42, envMapIntensity: 1.4 }),
  cast: std({ map: frameTex, metalnessMap: frameMetal, metalness: 1, color: "#9a8f8c", roughness: 0.55 }),
  hole: std({ color: "#151210", roughness: 1 }),
  ring: std({ color: "#3c3e40", roughness: 0.5, metalness: 0.8 }),
  batten: std({ map: battenTex, roughness: 0.8 }),
  foam: std({ map: foamTex, roughness: 0.85 }),
  panel: std({ map: panelTex, roughness: 0.6 }),
  screw: std({ color: "#3a3a3c", roughness: 0.4, metalness: 0.8 }),
  paint: std({ map: paintTex, roughness: 0.32 }), // satin: a soft sheen, short of gloss
  cement: std({ map: cementTex, roughness: 0.9 }),
  tile: std({ map: tileTex, roughness: 0.25 }),
}

// ------------------------------------------------------------ geometry
const meshes = [], layers = { base: [], battens: [], foam: [], panels: [], screws: [], paint: [], cement: [], tiles: [] }
function add(mesh, layer) { scene.add(mesh); meshes.push(mesh); layers[layer].push(mesh); return mesh }
// a box between two corners; `a` (an area) maps its texture once across the wall face
function box(x0, y0, z0, x1, y1, z1, name, layer = "base", a) {
  const geo = new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0)
  if (a) {
    const pos = geo.attributes.position, uv = geo.attributes.uv
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i) + (x0 + x1) / 2, y = pos.getY(i) + (y0 + y1) / 2
      uv.setXY(i, (x - a.r[0]) / (a.r[2] - a.r[0]), (y - a.r[1]) / (a.r[3] - a.r[1]))
    }
  }
  const mesh = new THREE.Mesh(geo, MAT[name])
  mesh.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2)
  mesh.castShadow = true; mesh.receiveShadow = true
  return add(mesh, layer)
}

// the wall: a skin with trapezoid-ish ribs standing in from it every 278 mm
box(X0, 0, STEEL - DEPTH - 0.002, X1, TOP, STEEL - DEPTH, "steel", "base", WALL)
for (let x = X0 + PITCH / 4; x + PITCH / 2 <= X1; x += PITCH) {
  box(x, 0, STEEL - DEPTH, x + PITCH / 2 - 0.03, TOP, STEEL, "steel", "base", WALL)
  box(x - 0.015, 0, STEEL - DEPTH, x, TOP, STEEL - DEPTH / 2, "steel", "base", WALL) // the sloped flanks, stepped
  box(x + PITCH / 2 - 0.03, 0, STEEL - DEPTH, x + PITCH / 2 - 0.015, TOP, STEEL - DEPTH / 2, "steel", "base", WALL)
}
// the frame round it, as pressed and rolled steel sections with rounded edges that catch the light: each a
// profile across the member, [depth out of the wall from STEEL, across], run along it
const B = 0.004 // the edges' radius
function member(profile, a0, a1, along, mat = "frame") {
  const shape = new THREE.Shape(profile.map(([z, v]) => new THREE.Vector2(-z, v))) // shape (-z, across)
  const geo = new THREE.ExtrudeGeometry(shape, { depth: a1 - a0 - 2 * B, bevelEnabled: true, bevelThickness: B, bevelSize: B, bevelSegments: 3, curveSegments: 6 })
  const mesh = new THREE.Mesh(geo, MAT[mat])
  if (along === "x") { mesh.rotation.y = Math.PI / 2; mesh.position.set(a0 + B, 0, STEEL) } // (u, v, w) -> (w, v, -u)
  else { // up a post, across is x: (u, v, w) -> (v, -w, -u), run down from the top
    geo.rotateZ(-Math.PI / 2); geo.rotateX(Math.PI / 2)
    mesh.position.set(0, a1 - B, STEEL)
  }
  mesh.castShadow = true; mesh.receiveShadow = true
  return add(mesh, "base")
}
const rrect = (z0, v0, z1, v1, r) => { // a rounded rectangle's outline, for the tube
  const pts = []
  for (const [cz, cv, a] of [[z1 - r, v0 + r, -90], [z1 - r, v1 - r, 0], [z0 + r, v1 - r, 90], [z0 + r, v0 + r, 180]])
    for (let k = 0; k <= 4; k++) { const t = ((a + k * 22.5) * Math.PI) / 180; pts.push([cz + r * Math.cos(t), cv + r * Math.sin(t)]) }
  return pts
}
// bottom side rail: a channel under the floor line, its web set back between two flanges
member([[-0.06, -RAIL], [0.006, -RAIL], [0.006, -RAIL + 0.016], [-0.028, -RAIL + 0.022], [-0.028, -0.022], [0.006, -0.016], [0.006, 0], [-0.06, 0]],
  X0 - POST, X1 + POST, "x")
// top side rail: a 60 x 60 square tube over the roof line
member(rrect(-0.058, TOP, 0.002, TOP + TRAIL, 0.012), X0 - POST, X1 + POST, "x")
// corner posts: pressed sections, a face flange at the end and a recessed step towards the wall
const post = (o, s) => [[-0.06, o], [0.004, o], [0.004, o + s * 0.048], [-0.026, o + s * 0.068], [-0.026, o + s * POST], [-0.06, o + s * POST]]
member(post(X0 - POST, 1), -RAIL, TOP + TRAIL, "y")
member(post(X1 + POST, -1).reverse(), -RAIL, TOP + TRAIL, "y")
const castGeo = (w, h, d) => new RoundedBoxGeometry(w, h, d, 3, 0.006)
const oval = new THREE.CylinderGeometry(0.025, 0.025, 0.003, 32)
for (const [xa, xb] of [[X0 - POST - 0.04, X0 - POST - 0.04 + CAST[0]], [X1 + POST + 0.04 - CAST[0], X1 + POST + 0.04]]) {
  for (const [ya, yb] of [[-RAIL - 0.01, -RAIL - 0.01 + CAST[1] + 0.03], [TOP + TRAIL - CAST[1] + 0.01, TOP + TRAIL + 0.01]]) {
    const c = add(new THREE.Mesh(castGeo(xb - xa, yb - ya, 0.07), MAT.cast), "base")
    c.position.set((xa + xb) / 2, (ya + yb) / 2, STEEL - 0.025); c.castShadow = c.receiveShadow = true
    const hole = new THREE.Mesh(oval, MAT.hole)
    hole.rotation.x = Math.PI / 2; hole.scale.set(1.56, 1, 1) // 78 x 51 mm side hole
    hole.position.set((xa + xb) / 2, (ya + yb) / 2, STEEL + 0.0115)
    add(hole, "base")
  }
}
// lashing rings along the floor line and under the roof, about a metre apart
for (let x = X0 + 0.5; x < X1 - 0.3; x += 1.0) for (const y of [0.06, TOP - 0.07]) {
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.022, 0.006, 8, 24), MAT.ring)
  ring.position.set(x, y, STEEL + 0.006)
  add(ring, "base")
}

// layer 1: battens up to the bathroom, then foam sprayed onto the steel between them and on to end B. It
// fills the corrugations behind; what shows is its face, lumped where the passes overlapped
for (const x of BATTENS) box(x, 0, STEEL, x + BAT[0], H, STEEL + BAT[1], "batten", "battens", area([x, 0, x + BAT[0], H], 256, 1024))
const BAYS = []
{
  const cuts = [X0, ...BATTENS.flatMap((x) => [x, x + BAT[0]]), X1]
  for (let i = 0; i < cuts.length; i += 2) if (cuts[i + 1] - cuts[i] > 0.005) BAYS.push([cuts[i], cuts[i + 1]])
}
const vn = (x, y) => { // smooth value noise, one per metre-ish cell
  const h = (i, j) => { const v = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return v - Math.floor(v) }
  const i = Math.floor(x), j = Math.floor(y), u = x - i, v = y - j, su = u * u * (3 - 2 * u), sv = v * v * (3 - 2 * v)
  return (h(i, j) * (1 - su) + h(i + 1, j) * su) * (1 - sv) + (h(i, j + 1) * (1 - su) + h(i + 1, j + 1) * su) * sv
}
// big lumps where a pass dwelt, a ridge along each pass's lap (about every 180 mm up), and the skin's pebbling
const lump = (x, y) => 0.018 * (vn(x * 6, y * 5) - 0.5) + 0.0035 * vn(x * 3, y * 2) * Math.sin(y * 33 + 9 * vn(x * 5, y * 4)) ** 6
  + 0.009 * (vn(x * 16 + 5, y * 14) - 0.5) + 0.0025 * (vn(x * 60, y * 60 + 3) - 0.5)
for (const [a, b] of BAYS) {
  const geo = new THREE.PlaneGeometry(b - a, H, Math.max(8, Math.round((b - a) / 0.008)), Math.round(H / 0.008))
  const pos = geo.attributes.position, uv = geo.attributes.uv
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i) + (a + b) / 2, y = pos.getY(i) + H / 2
    const edge = Math.min(x - a, b - x) // it creeps a little up each batten's side
    pos.setZ(i, lump(x, y) + 0.004 * Math.exp(-edge / 0.012))
    uv.setXY(i, x / 1.2, y / 1.2)
  }
  geo.computeVertexNormals()
  const mesh = new THREE.Mesh(geo, MAT.foam)
  mesh.position.set((a + b) / 2, H / 2, FOAM)
  mesh.castShadow = true; mesh.receiveShadow = true
  add(mesh, "foam")
  box(a, 0, STEEL - DEPTH, b, H, FOAM - 0.008, "foam", "foam") // the body behind it, filling the corrugations
}

// layer 2: the lining panels on the battens, screws into each batten every 300 mm
const LZ = STEEL + BAT[1]
for (const [a, , b] of PANELS) box(a, 0, LZ, b - 0.002, H, LZ + PLY, "panel", "panels", LIN)
const head = new THREE.CylinderGeometry(0.0055, 0.0055, 0.0015, 16)
for (const [a, , b] of PANELS) {
  for (const x of BATTENS) {
    const cx = x + BAT[0] / 2
    if (cx < a + 0.01 || cx > b - 0.01) continue
    for (let y = 0.15; y < H - 0.05; y += 0.3) {
      const s = new THREE.Mesh(head, MAT.screw)
      s.rotation.x = Math.PI / 2; s.position.set(cx, y, LZ + PLY + 0.0008)
      add(s, "screws")
    }
  }
}
// layer 3: the paint over the lining, filling the joints and screw heads
box(0, 0, LZ + PLY + 0.0016, px0, H, LZ + PLY + 0.0018, "paint", "paint", LIN)
const STRIPS = [] // the roller's passes, about 300 mm wide, from end A
{
  const n = Math.ceil(px0 / 0.3)
  for (let i = 0; i < n; i++) STRIPS.push([(i * px0) / n, ((i + 1) * px0) / n])
}

// the bathroom side: cement board on the studs, then the tiles on it
box(px0, 0, LZ, X1, H, LZ + PLY, "cement", "cement", BATH)
box(px0, 0, LZ + PLY, X1, H, LZ + PLY + 0.01, "tile", "tiles", BATH)

const ORDER = ["base", "battens", "foam", "panels", "screws", "paint", "cement", "tiles"]
const show = ORDER.slice(0, ORDER.indexOf(LAYER) + 1)
for (const [k, list] of Object.entries(layers)) for (const o of list) o.visible = show.includes(k)

// ------------------------------------------------------------ camera: straight at the wall, end A on the left
const pad = 0.08
const VX0 = X0 - POST - 0.04 - pad, VX1 = X1 + POST + 0.04 + pad
const yc = (-RAIL - 0.01 + TOP + TRAIL + 0.01) / 2, half = ((VX1 - VX0) * FH) / FW / 2
const cxm = (VX0 + VX1) / 2
const camera = new THREE.OrthographicCamera(-(VX1 - VX0) / 2, (VX1 - VX0) / 2, half, -half, 0.1, 50)
camera.position.set(cxm, yc, 10)
camera.lookAt(cxm, yc, 0)
camera.updateProjectionMatrix()
const fx = (x) => (x - VX0) / (VX1 - VX0), fy = (y) => (yc + half - y) / (2 * half)

// ------------------------------------------------------------ colour pass: daylight raking from end A
const pmrem = new THREE.PMREMGenerator(renderer)
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture
scene.environmentIntensity = 0.45
scene.add(new THREE.HemisphereLight(0xffffff, 0xd8cdbc, 0.6))
const sun = new THREE.DirectionalLight(0xffefd6, 2.2)
sun.position.set(X0 - 3, H + 2, 4); sun.target.position.set(L / 2, H / 2, STEEL)
sun.castShadow = true
sun.shadow.mapSize.set(4096, 4096)
Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 0.5, far: 25 })
sun.shadow.bias = -0.0002; sun.shadow.normalBias = 0.01; sun.shadow.radius = 3
scene.add(sun, sun.target)
const composer = new EffectComposer(renderer)
composer.setSize(FW, FH)
composer.addPass(new RenderPass(scene, camera))
const ao = new GTAOPass(scene, camera, FW, FH)
ao.output = GTAOPass.OUTPUT.Default
ao.blendIntensity = 0.7
composer.addPass(ao)
composer.addPass(new OutputPass())
composer.render()
const color = document.createElement("canvas"); color.width = FW; color.height = FH
color.getContext("2d").drawImage(renderer.domElement, 0, 0)

// ------------------------------------------------------------ mask pass: this layer's meshes, white
const black = new THREE.MeshBasicMaterial({ color: 0x000000 }), white = new THREE.MeshBasicMaterial({ color: 0xffffff })
for (const o of meshes) o.material = layers[LAYER].includes(o) ? white : black
scene.background = new THREE.Color(0x000000); scene.environment = null
renderer.toneMapping = THREE.NoToneMapping; renderer.shadowMap.enabled = false
renderer.render(scene, camera)
const mask = document.createElement("canvas"); mask.width = FW; mask.height = FH
mask.getContext("2d").drawImage(renderer.domElement, 0, 0)
const out = color.getContext("2d").getImageData(0, 0, FW, FH)
const a = mask.getContext("2d").getImageData(0, 0, FW, FH).data
for (let i = 0; i < a.length; i += 4) out.data[i + 3] = a[i]
color.getContext("2d").putImageData(out, 0, 0)
window.OUT = color.toDataURL("image/png")

// ------------------------------------------------------------ the pieces, in the order they go up
const rect = (x0, y0, x1, y1) => [fx(x0), fy(y1), fx(x1) - fx(x0), fy(y0) - fy(y1)].map((v) => +v.toFixed(5))
window.PIECES = {
  aspect: FW / FH,
  battens: BATTENS.map((x) => rect(x, 0, x + BAT[0], H)),
  foam: BAYS.map(([a, b]) => rect(a, 0, b, H)),
  panels: PANELS.map(([a, y0, b, y1]) => rect(a, y0, b, y1)),
  paint: STRIPS.map(([a, b]) => rect(a, 0, b, H)),
  cement: [rect(px0, 0, X1, H)],
  tiles: TILES.map(([a, b, c, d]) => rect(a, b, c, d)), // row by row from the floor, each row from the partition
}
document.body.dataset.ready = "1"
</script>
</body>
