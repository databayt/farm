<!doctype html>
<!--
  The /en/studio floor section: the container's base alone (no walls, no roof), seen from above the
  front-left corner, and the two layers of the living floor (sheets.py "FLOOR (living)", kits.py S02 + S05)
  rendered as separate transparent pictures, so the page can lay them on in motion.

    ?layer=base   the empty base as it arrives                                    -> render/floor-base.webp
    ?layer=epoxy  layer 1: primer + epoxy seal, wall to wall (S02)               -> render/floor-epoxy.webp
    ?layer=spc    layer 2: underlay + 5 mm SPC oak over the living area (S05)    -> render/floor-spc.webp

  Each picture is the full scene lit as one, cut down to its own layer by a mask pass, so the three stack
  exactly. The base follows the CIMC 20 ft spec and the container references [STU-02, STU-07]: 28 mm
  insecticide-treated hardwood ply in 1,160 x 2,400 mm panels laid along the box, screwed to C-section
  cross-members about 300 mm apart; bottom side rails and end sills; four ISO 1161 bottom corner castings
  (178 x 162 x 118 mm, an oval hole in the top, side and end).

  Serve the repo root on :3000 (python3 -m http.server 3000), open this page at 2400 x 1350, wait for
  body[data-ready] and save window.OUT (a PNG data URL with alpha). The plank texture is room.html's,
  so the finished floor matches the 3D section; change both together.
-->
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:#fff}</style>
<script type="importmap">
{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three"
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js"
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js"
import { RenderPass } from "three/addons/postprocessing/RenderPass.js"
import { GTAOPass } from "three/addons/postprocessing/GTAOPass.js"
import { OutputPass } from "three/addons/postprocessing/OutputPass.js"

const LAYER = new URLSearchParams(location.search).get("layer") ?? "base"
const STAGE = { base: 0, epoxy: 1, spc: 2 }[LAYER]
const FW = 2400, FH = 1350
const S = await (await fetch(`/public/designs/studio/render/scene.json?${Date.now()}`)).json()
const m = (v) => v / 1000 // layout mm -> metres; three: x = x, y = height (layout z), z = depth (layout y)

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
renderer.setPixelRatio(1)
renderer.setSize(FW, FH)
renderer.outputColorSpace = THREE.SRGBColorSpace
renderer.toneMapping = THREE.ACESFilmicToneMapping
renderer.toneMappingExposure = 1.05
renderer.shadowMap.enabled = true
renderer.shadowMap.type = THREE.PCFShadowMap
const scene = new THREE.Scene()
scene.background = new THREE.Color(12, 12, 12)

// ------------------------------------------------------------ dimensions (metres)
const L = m(S.L), W = m(S.W), e = m(S.lining), px0 = m(S.part_x0)
// the floor between the steel: the layout's lining face is 50 mm in from it
const X0 = -e, X1 = L + e, Z0 = -e, Z1 = W + e
// the outside of the base: 6,058 x 2,438 (ISO 20 ft); the sills and side rails take up the rest
const OX = (6.058 - (X1 - X0)) / 2, OZ = (2.438 - (Z1 - Z0)) / 2
const BX0 = X0 - OX, BX1 = X1 + OX, BZ0 = Z0 - OZ, BZ1 = Z1 + OZ
const PLY = 0.028, RAIL = 0.158, CAST = [0.178, 0.118, 0.162] // casting: along x, height, along z

// ------------------------------------------------------------ procedural textures
let seed = 7
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647)
function tex(draw, w = 512, h = 512) {
  const c = document.createElement("canvas"); c.width = w; c.height = h
  seed = 7
  draw(c.getContext("2d"), w, h)
  const t = new THREE.CanvasTexture(c)
  t.colorSpace = THREE.SRGBColorSpace
  t.anisotropy = 8
  return t
}
// the container floor at true scale over (X1 - X0) x (Z1 - Z0): two runs of 1,160 mm panels along the box,
// 2,400 long with an offcut at the end, staggered; the face grain runs across the box; a row of screws over
// every cross-member; the treatment has darkened it, and years of cargo have worn and stained it
const PX = 2048 / (X1 - X0), PZ = 1024 / (Z1 - Z0) // px per metre
const ply = tex((g, w, h) => {
  const tones = ["#6e4630", "#7b5036", "#664029", "#80553a", "#73492f", "#5f3c27"]
  const half = h / 2
  const runs = [[2.4, 2.4], [1.2, 2.4, 2.4]] // the second run starts with a half panel: no joint lines up
  runs.forEach((run, r) => {
    let x = 0, k = r * 3
    for (const len of [...run, 99]) {
      const x1 = Math.min(w, x + len * PX), y0 = r * half
      g.fillStyle = tones[k++ % tones.length]; g.fillRect(x, y0, x1 - x, half)
      for (let i = 0; i < 90; i++) { // face veneer grain, across the box
        const gx = x + rnd() * (x1 - x)
        g.strokeStyle = `rgba(40,22,10,${0.05 + rnd() * 0.1})`; g.lineWidth = 0.8 + rnd() * 2.2
        g.beginPath(); g.moveTo(gx, y0)
        g.bezierCurveTo(gx + (rnd() - 0.5) * 10, y0 + half * 0.3, gx + (rnd() - 0.5) * 10, y0 + half * 0.7, gx + (rnd() - 0.5) * 6, y0 + half)
        g.stroke()
      }
      g.fillStyle = "rgba(25,14,6,0.7)"; g.fillRect(x1 - 2, y0, 3, half) // butt joint over a cross-member
      x = x1
      if (x >= w) break
    }
  })
  g.fillStyle = "rgba(25,14,6,0.7)"; g.fillRect(0, half - 1, w, 3) // the long joint down the middle
  for (let i = 0; i < 22; i++) { // cargo wear, scuffs and old stains
    const x = rnd() * w, y = rnd() * h, r = 20 + rnd() * 110
    const gr = g.createRadialGradient(x, y, 0, x, y, r)
    const a = 0.08 + rnd() * 0.14
    gr.addColorStop(0, rnd() > 0.3 ? `rgba(30,16,8,${a})` : `rgba(190,150,110,${a * 0.7})`); gr.addColorStop(1, "rgba(0,0,0,0)")
    g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r)
  }
  for (let i = 0; i < 40; i++) { // forklift and pallet scrapes along the box
    const x = rnd() * w, y = rnd() * h
    g.strokeStyle = `rgba(200,165,125,${0.06 + rnd() * 0.1})`; g.lineWidth = 1 + rnd() * 2
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + 40 + rnd() * 160, y + (rnd() - 0.5) * 8); g.stroke()
  }
  for (let x = 0.15 * PX; x < w; x += 0.3 * PX) { // screws over each cross-member, four per panel width
    for (const f of [0.06, 0.32, 0.68, 0.94]) for (const r of [0, 1]) {
      g.fillStyle = "#2a2420"; g.beginPath(); g.arc(x, r * half + half * f, 3.2, 0, 7); g.fill()
    }
  }
}, 2048, 1024)
// the epoxy seal: a grey satin coat; the joints and screw heads still telegraph through it
const epoxy = tex((g, w, h) => {
  g.fillStyle = "#a3a5a5"; g.fillRect(0, 0, w, h)
  for (let i = 0; i < 5000; i++) {
    g.fillStyle = rnd() > 0.5 ? "rgba(255,255,255,0.04)" : "rgba(0,0,0,0.04)"
    g.fillRect(rnd() * w, rnd() * h, 2 + rnd() * 3, 2 + rnd() * 3)
  }
  g.fillStyle = "rgba(60,60,60,0.18)"; g.fillRect(0, h / 2 - 1, w, 2)
  for (let x = 0.15 * PX; x < w; x += 0.3 * PX) for (const f of [0.03, 0.16, 0.34, 0.47, 0.53, 0.66, 0.84, 0.97]) {
    g.fillStyle = "rgba(70,70,70,0.22)"; g.beginPath(); g.arc(x, h * f, 3, 0, 7); g.fill()
  }
}, 2048, 1024)
// room.html's oak planks: boards about 133 mm wide, 0.9-1.8 m long, laid like a fitter would
const planks = tex((g, w, h) => {
  const tones = ["#b98b5b", "#c39663", "#a97c4f", "#bd9264", "#ae8255", "#c79b6a", "#b38556"]
  const rows = 18, rh = h / rows
  const MIN1 = 128, MIN2 = 64
  let bag = [], last = -1, above = [], above2 = []
  const shade = () => {
    if (!bag.length) {
      bag = tones.map((_, i) => i)
      for (let i = bag.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [bag[i], bag[j]] = [bag[j], bag[i]] }
    }
    let i = bag.pop()
    if (i === last && bag.length) { const j = bag.pop(); bag.unshift(i); i = j }
    return tones[(last = i)]
  }
  const clear = (j) => above.every((p) => Math.abs(p - j) >= MIN1) && above2.every((p) => Math.abs(p - j) >= MIN2)
  for (let r = 0; r < rows; r++) {
    const joints = []
    let x = -Math.floor(rnd() * 700)
    while (x < w) {
      const y0 = r * rh
      let len = 0
      for (let t = 0; t < 40; t++) {
        len = 384 + Math.floor(rnd() * 384)
        if (x + len >= w || clear(x + len)) break
      }
      joints.push(x + len)
      g.fillStyle = shade(); g.fillRect(x, y0, len, rh)
      for (let i = 0; i < 7; i++) {
        const y = y0 + rnd() * rh
        g.strokeStyle = `rgba(110,72,38,${0.08 + rnd() * 0.14})`; g.lineWidth = 0.7 + rnd() * 1.4
        g.beginPath(); g.moveTo(x, y)
        g.bezierCurveTo(x + len * 0.3, y + (rnd() - 0.5) * 6, x + len * 0.7, y + (rnd() - 0.5) * 6, x + len, y + (rnd() - 0.5) * 4)
        g.stroke()
      }
      if (rnd() > 0.35) {
        const cx = x + len * (0.25 + rnd() * 0.5), cy = y0 + rh * (0.3 + rnd() * 0.4)
        for (let k = 1; k <= 4; k++) {
          g.strokeStyle = `rgba(104,66,34,${0.10 + rnd() * 0.12})`; g.lineWidth = 0.9
          g.beginPath(); g.moveTo(cx - 40 * k, cy - 3 * k)
          g.quadraticCurveTo(cx + 30 * k, cy, cx - 40 * k, cy + 3 * k + 2); g.stroke()
        }
      }
      g.fillStyle = "rgba(70,44,22,0.55)"; g.fillRect(x, y0, 2, rh)
      x += len
    }
    above2 = above; above = joints
    g.fillStyle = "rgba(70,44,22,0.5)"; g.fillRect(0, r * rh, w, 2)
  }
}, 2048, 1024)

const std = (o) => new THREE.MeshStandardMaterial(o)
const MAT = {
  ply: std({ map: ply, roughness: 0.82 }),
  epoxy: std({ map: epoxy, roughness: 0.3 }),
  floor: std({ map: planks, color: "#d1c8c1", roughness: 0.55 }), // room.html's floor material
  steel: std({ color: "#8e3f33", roughness: 0.55, metalness: 0.3 }), // the studio's red box (the roof's #9c4436)
  cast: std({ color: "#5f2a22", roughness: 0.75, metalness: 0.35 }), // cast steel, a shade darker than the rails
  hole: std({ color: "#151210", roughness: 1 }),
}

// ------------------------------------------------------------ geometry
const meshes = [], layers = { base: [], epoxy: [], spc: [] }
// a box between two corners; `span` [x0, z0, sx, sz] maps a floor texture once across it from above
function box(x0, y0, z0, x1, y1, z1, name, layer = "base", span) {
  const geo = new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0)
  if (span) {
    const pos = geo.attributes.position, uv = geo.attributes.uv
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i) + (x0 + x1) / 2, z = pos.getZ(i) + (z0 + z1) / 2
      uv.setXY(i, (x - span[0]) / span[2], 1 - (z - span[1]) / span[3])
    }
  }
  const mesh = new THREE.Mesh(geo, MAT[name])
  mesh.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2)
  mesh.castShadow = true; mesh.receiveShadow = true
  scene.add(mesh); meshes.push(mesh); layers[layer].push(mesh)
  return mesh
}
const FLOORSPAN = [X0, Z0, X1 - X0, Z1 - Z0]

// the frame: bottom side rails and end sills, their tops flush with the floor
box(BX0 + CAST[0], -RAIL, BZ0, BX1 - CAST[0], 0, Z0, "steel") // back side rail
box(BX0 + CAST[0], -RAIL, Z1, BX1 - CAST[0], 0, BZ1, "steel") // front side rail
box(BX0, -RAIL, BZ0 + CAST[2], X0, 0, BZ1 - CAST[2], "steel") // end sill A
box(X1, -RAIL, BZ0 + CAST[2], BX1, 0, BZ1 - CAST[2], "steel") // end sill B
// a lip along the front rail, so the C-section reads
box(BX0 + CAST[0], -RAIL, BZ1 - 0.004, BX1 - CAST[0], -RAIL + 0.012, BZ1 + 0.03, "steel")
// the ply on the cross-members
box(X0, -PLY, Z0, X1, 0, Z1, "ply", "base", FLOORSPAN)
// four bottom corner castings: they carry the box, so they stand lowest, 10 mm below the rails, and their
// tops rise past the floor; drawn taller than ISO's 118 so they read at this scale
for (const [xa, xb] of [[BX0, BX0 + CAST[0]], [BX1 - CAST[0], BX1]]) for (const [za, zb] of [[BZ0, BZ0 + CAST[2]], [BZ1 - CAST[2], BZ1]]) {
  const y0 = -RAIL - 0.01, y1 = 0.045 // proud of the floor, where the corner post would stand
  box(xa, y0, za, xb, y1, zb, "cast")
  const cx = (xa + xb) / 2, cz = (za + zb) / 2, d = 0.003
  box(cx - 0.062, y1, cz - 0.032, cx + 0.062, y1 + d, cz + 0.032, "hole") // top: the twistlock hole
  const sz = zb > Z1 ? zb : za, sd = zb > Z1 ? 1 : -1 // side hole on the long face
  box(cx - 0.039, y0 + 0.04, sz - (sd < 0 ? d : 0), cx + 0.039, y0 + 0.09, sz + (sd > 0 ? d : 0), "hole")
  const ex = xb > X1 ? xb : xa, ed = xb > X1 ? 1 : -1 // end hole
  box(ex - (ed < 0 ? d : 0), y0 + 0.04, cz - 0.032, ex + (ed > 0 ? d : 0), y0 + 0.09, cz + 0.032, "hole")
}
// layer 1: the seal over the whole ply; layer 2: underlay + SPC over the living area, to the partition line
box(X0, 0, Z0, X1, 0.003, Z1, "epoxy", "epoxy", FLOORSPAN)
box(X0, 0.003, Z0, px0, 0.010, Z1, "floor", "spc", [X0, Z0, 4.8, 2.4])
for (const o of layers.epoxy) o.visible = STAGE >= 1
for (const o of layers.spc) o.visible = STAGE >= 2

// ------------------------------------------------------------ camera: above the front-left corner
const cx = (BX0 + BX1) / 2
const camera = new THREE.PerspectiveCamera(32, FW / FH, 0.1, 100)
camera.position.set(cx - 2.2, 4.6, W + 6.2)
camera.lookAt(cx, -0.1, W / 2)
camera.updateMatrixWorld(); camera.updateProjectionMatrix()
const bb = new THREE.Box3()
for (const o of meshes) bb.expandByObject(o)
let px = [Infinity, Infinity, -Infinity, -Infinity]
for (const xx of [bb.min.x, bb.max.x]) for (const yy of [bb.min.y, bb.max.y]) for (const zz of [bb.min.z, bb.max.z]) {
  const p = new THREE.Vector3(xx, yy, zz).project(camera)
  const X = ((p.x + 1) / 2) * FW, Y = ((1 - p.y) / 2) * FH
  px = [Math.min(px[0], X), Math.min(px[1], Y), Math.max(px[2], X), Math.max(px[3], Y)]
}
let w = (px[2] - px[0]) * 1.04, h = (px[3] - px[1]) * 1.12
if (w / h > FW / FH) h = (w * FH) / FW; else w = (h * FW) / FH
camera.setViewOffset(FW, FH, (px[0] + px[2]) / 2 - w / 2, (px[1] + px[3]) / 2 - h / 2, w, h)

// ------------------------------------------------------------ colour pass: room.html's daylight
const pmrem = new THREE.PMREMGenerator(renderer)
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture
scene.environmentIntensity = 0.45
const lights = [new THREE.HemisphereLight(0xffffff, 0xd8cdbc, 0.55)]
const sun = new THREE.DirectionalLight(0xffefd6, 2.4)
sun.position.set(cx - 2.6, 5.5, W + 4.5); sun.target.position.set(cx, 0, W / 2)
sun.castShadow = true
sun.shadow.mapSize.set(4096, 4096)
Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 0.5, far: 20 })
sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.02; sun.shadow.radius = 4
lights.push(sun, sun.target)
scene.add(...lights)
const composer = new EffectComposer(renderer)
composer.setSize(FW, FH)
composer.addPass(new RenderPass(scene, camera))
const ao = new GTAOPass(scene, camera, FW, FH)
ao.output = GTAOPass.OUTPUT.Default
ao.blendIntensity = 0.85
composer.addPass(ao)
composer.addPass(new OutputPass())
composer.render()
const color = document.createElement("canvas"); color.width = FW; color.height = FH
color.getContext("2d").drawImage(renderer.domElement, 0, 0)

// ------------------------------------------------------------ mask pass: this picture's own meshes, white
const black = new THREE.MeshBasicMaterial({ color: 0x000000 }), white = new THREE.MeshBasicMaterial({ color: 0xffffff })
for (const o of meshes) o.material = layers[LAYER].includes(o) ? white : black
scene.background = new THREE.Color(0x000000); scene.environment = null
renderer.toneMapping = THREE.NoToneMapping; renderer.shadowMap.enabled = false
renderer.render(scene, camera)
const mask = document.createElement("canvas"); mask.width = FW; mask.height = FH
mask.getContext("2d").drawImage(renderer.domElement, 0, 0)

const out = color.getContext("2d").getImageData(0, 0, FW, FH)
const a = mask.getContext("2d").getImageData(0, 0, FW, FH).data
for (let i = 0; i < a.length; i += 4) out.data[i + 3] = a[i]
color.getContext("2d").putImageData(out, 0, 0)
window.OUT = color.toDataURL("image/png")
document.body.dataset.ready = "1"
</script>
</body>
</html>
