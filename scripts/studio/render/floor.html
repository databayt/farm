<!doctype html>
<!--
  The /en/studio floor section, seen straight down: the container's base alone (no walls, no roof) and the
  floor built on it in two layers, each rendered as its own transparent picture so the page can lay the
  pieces on one by one.

    ?layer=base    the empty base as it arrives                         -> render/floor-base.webp
    ?layer=sheets  layer 1: flat wood sheets, wall to wall              -> render/floor-sheets.webp
    ?layer=screws  the screws that fix the sheets down                  -> render/floor-screws.webp
    ?layer=planks  layer 2: oak planks over the living area             -> render/floor-planks.webp
    ?layer=vinyl   the bathroom end: safety vinyl in one sheet (S08)     -> render/floor-vinyl.webp
    ?layer=tray    the shower tray set on the vinyl (S09)                -> render/floor-tray.webp

  Every layer is the full scene lit as one, cut down to its own meshes by a mask pass, so they stack
  exactly. window.PIECES lists each sheet and plank as a rectangle in fractions of the picture, in the
  order a fitter would lay them (-> render/floor-pieces.json).

  The base follows the CIMC 20 ft spec and the container references [STU-02, STU-07]: 28 mm treated
  hardwood ply in 1,160 x 2,400 mm panels laid along the box, screwed to cross-members about 300 mm
  apart, inside the bottom side rails and end sills, with four ISO 1161 bottom corner castings (an oval
  hole in each top). Sheets are 2,440 x 1,220 [AS-20]; the planks are room.html's (about 133 mm wide,
  0.9-1.8 m long, laid with staggered joints), so the finished floor matches the 3D section.

  Serve the repo root (python3 -m http.server <port>), open this page at 2400 x 1020, wait for
  body[data-ready] (attached) and save window.OUT (a PNG data URL with alpha).
-->
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:#fff}</style>
<script type="importmap">
{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three"
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js"
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js"
import { RenderPass } from "three/addons/postprocessing/RenderPass.js"
import { GTAOPass } from "three/addons/postprocessing/GTAOPass.js"
import { OutputPass } from "three/addons/postprocessing/OutputPass.js"

const LAYER = new URLSearchParams(location.search).get("layer") ?? "base"
const FW = 2400, FH = 1020
const S = await (await fetch(`/public/designs/studio/render/scene.json?${Date.now()}`)).json()
const m = (v) => v / 1000 // layout mm -> metres; three: x = x, y = height (layout z), z = depth (layout y)

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
renderer.setPixelRatio(1)
renderer.setSize(FW, FH)
renderer.outputColorSpace = THREE.SRGBColorSpace
renderer.toneMapping = THREE.ACESFilmicToneMapping
renderer.toneMappingExposure = 1.05
renderer.shadowMap.enabled = true
renderer.shadowMap.type = THREE.PCFShadowMap
const scene = new THREE.Scene()
scene.background = new THREE.Color(12, 12, 12)

// ------------------------------------------------------------ dimensions (metres)
const L = m(S.L), W = m(S.W), e = m(S.lining), px0 = m(S.part_x0)
const X0 = -e, X1 = L + e, Z0 = -e, Z1 = W + e // the floor between the steel
const OX = (6.058 - (X1 - X0)) / 2, OZ = (2.438 - (Z1 - Z0)) / 2 // ISO 20 ft outside: 6,058 x 2,438
const BX0 = X0 - OX, BX1 = X1 + OX, BZ0 = Z0 - OZ, BZ1 = Z1 + OZ
const RAIL = 0.158, CAST = [0.178, 0.162] // casting plan: along x, along z
const SHEET_T = 0.012, PLANK_T = 0.005, VINYL_T = 0.002
const TRAY = S.tray.map(m) // [x0, y0, z0, x1, y1, z1] in layout axes

// ------------------------------------------------------------ textures
let seed = 7
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647)
function tex(draw, w = 2048, h = 1024) {
  const c = document.createElement("canvas"); c.width = w; c.height = h
  seed = 7
  draw(c.getContext("2d"), w, h)
  const t = new THREE.CanvasTexture(c)
  t.colorSpace = THREE.SRGBColorSpace
  t.anisotropy = 8
  return t
}
// one texture covers the floor between the steel, (X1 - X0) x (Z1 - Z0); canvas y runs with z
const FX = 2048 / (X1 - X0), FZ = 1024 / (Z1 - Z0)

// the container floor: two runs of 1,160 mm panels along the box, staggered; grain across; worn and stained
const ply = tex((g, w, h) => {
  const tones = ["#6e4630", "#7b5036", "#664029", "#80553a", "#73492f", "#5f3c27"]
  const half = h / 2
  ;[[2.4, 2.4], [1.2, 2.4, 2.4]].forEach((run, r) => {
    let x = 0, k = r * 3
    for (const len of [...run, 99]) {
      const x1 = Math.min(w, x + len * FX), y0 = r * half
      g.fillStyle = tones[k++ % tones.length]; g.fillRect(x, y0, x1 - x, half)
      for (let i = 0; i < 90; i++) {
        const gx = x + rnd() * (x1 - x)
        g.strokeStyle = `rgba(40,22,10,${0.05 + rnd() * 0.1})`; g.lineWidth = 0.8 + rnd() * 2.2
        g.beginPath(); g.moveTo(gx, y0)
        g.bezierCurveTo(gx + (rnd() - 0.5) * 10, y0 + half * 0.3, gx + (rnd() - 0.5) * 10, y0 + half * 0.7, gx + (rnd() - 0.5) * 6, y0 + half)
        g.stroke()
      }
      g.fillStyle = "rgba(25,14,6,0.7)"; g.fillRect(x1 - 2, y0, 3, half)
      x = x1
      if (x >= w) break
    }
  })
  g.fillStyle = "rgba(25,14,6,0.7)"; g.fillRect(0, half - 1, w, 3)
  for (let i = 0; i < 22; i++) {
    const x = rnd() * w, y = rnd() * h, r = 20 + rnd() * 110, a = 0.08 + rnd() * 0.14
    const gr = g.createRadialGradient(x, y, 0, x, y, r)
    gr.addColorStop(0, rnd() > 0.3 ? `rgba(30,16,8,${a})` : `rgba(190,150,110,${a * 0.7})`); gr.addColorStop(1, "rgba(0,0,0,0)")
    g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r)
  }
  for (let i = 0; i < 40; i++) {
    const x = rnd() * w, y = rnd() * h
    g.strokeStyle = `rgba(200,165,125,${0.06 + rnd() * 0.1})`; g.lineWidth = 1 + rnd() * 2
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + 40 + rnd() * 160, y + (rnd() - 0.5) * 8); g.stroke()
  }
  for (let x = 0.15 * FX; x < w; x += 0.3 * FX) for (const f of [0.03, 0.16, 0.34, 0.47, 0.53, 0.66, 0.84, 0.97]) {
    g.fillStyle = "#2a2420"; g.beginPath(); g.arc(x, h * f, 3.2, 0, 7); g.fill()
  }
})

// layer 1: 2,440 x 1,220 sheets, long side along the box; the second run starts with a half sheet so no
// joint lines up, and the last sheet in each run is cut to fit
const SHEETS = []
;[[2.44, 2.44, 9], [1.22, 2.44, 9]].forEach((run, r) => {
  const z0 = Z0 + r * 1.22, z1 = Math.min(Z1, z0 + 1.22)
  let x = X0
  for (const len of run) {
    const x1 = Math.min(X1, x + len)
    SHEETS.push({ x0: x, z0, x1, z1 })
    x = x1
    if (x >= X1) break
  }
})
const sheetTex = tex((g) => {
  const tones = ["#e3cfa9", "#dcc69e", "#e8d5b2", "#d8c39b", "#e1cca5", "#dac49f"]
  SHEETS.forEach((s, i) => {
    const x = (s.x0 - X0) * FX, y = (s.z0 - Z0) * FZ, sw = (s.x1 - s.x0) * FX, sh = (s.z1 - s.z0) * FZ
    g.fillStyle = tones[i % tones.length]; g.fillRect(x, y, sw, sh)
    for (let k = 0; k < 60; k++) { // face grain along the sheet
      const gy = y + rnd() * sh
      g.strokeStyle = `rgba(150,110,60,${0.05 + rnd() * 0.08})`; g.lineWidth = 1 + rnd() * 2
      g.beginPath(); g.moveTo(x, gy)
      g.bezierCurveTo(x + sw * 0.3, gy + (rnd() - 0.5) * 16, x + sw * 0.7, gy + (rnd() - 0.5) * 16, x + sw, gy + (rnd() - 0.5) * 8)
      g.stroke()
    }
    g.strokeStyle = "rgba(110,80,45,0.55)"; g.lineWidth = 2; g.strokeRect(x + 1, y + 1, sw - 2, sh - 2) // sheet edge
  })
})

// layer 2: room.html's plank layout, recorded piece by piece. The texture covers FLOOR (4.8 x 2.4 m) from
// the floor's corner; boards about 133 mm wide, end joints at least 300 mm from the row before and 150 mm
// from two rows back, shades from a shuffled bag
const FLOOR = [4.8, 2.4], PLANKS = []
const planks = tex((g, w, h) => {
  const tones = ["#b98b5b", "#c39663", "#a97c4f", "#bd9264", "#ae8255", "#c79b6a", "#b38556"]
  const rows = 18, rh = h / rows
  const MIN1 = 128, MIN2 = 64
  let bag = [], last = -1, above = [], above2 = []
  const shade = () => {
    if (!bag.length) {
      bag = tones.map((_, i) => i)
      for (let i = bag.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [bag[i], bag[j]] = [bag[j], bag[i]] }
    }
    let i = bag.pop()
    if (i === last && bag.length) { const j = bag.pop(); bag.unshift(i); i = j }
    return tones[(last = i)]
  }
  const clear = (j) => above.every((p) => Math.abs(p - j) >= MIN1) && above2.every((p) => Math.abs(p - j) >= MIN2)
  for (let r = 0; r < rows; r++) {
    const joints = []
    let x = -Math.floor(rnd() * 700)
    while (x < w) {
      const y0 = r * rh
      let len = 0
      for (let t = 0; t < 40; t++) {
        len = 384 + Math.floor(rnd() * 384)
        if (x + len >= w || clear(x + len)) break
      }
      joints.push(x + len)
      PLANKS.push({ r, x0: X0 + (x / w) * FLOOR[0], x1: X0 + ((x + len) / w) * FLOOR[0], z0: Z0 + (y0 / h) * FLOOR[1], z1: Z0 + ((y0 + rh) / h) * FLOOR[1] })
      g.fillStyle = shade(); g.fillRect(x, y0, len, rh)
      for (let i = 0; i < 7; i++) {
        const y = y0 + rnd() * rh
        g.strokeStyle = `rgba(110,72,38,${0.08 + rnd() * 0.14})`; g.lineWidth = 0.7 + rnd() * 1.4
        g.beginPath(); g.moveTo(x, y)
        g.bezierCurveTo(x + len * 0.3, y + (rnd() - 0.5) * 6, x + len * 0.7, y + (rnd() - 0.5) * 6, x + len, y + (rnd() - 0.5) * 4)
        g.stroke()
      }
      if (rnd() > 0.35) {
        const cx = x + len * (0.25 + rnd() * 0.5), cy = y0 + rh * (0.3 + rnd() * 0.4)
        for (let k = 1; k <= 4; k++) {
          g.strokeStyle = `rgba(104,66,34,${0.10 + rnd() * 0.12})`; g.lineWidth = 0.9
          g.beginPath(); g.moveTo(cx - 40 * k, cy - 3 * k)
          g.quadraticCurveTo(cx + 30 * k, cy, cx - 40 * k, cy + 3 * k + 2); g.stroke()
        }
      }
      g.fillStyle = "rgba(70,44,22,0.55)"; g.fillRect(x, y0, 2, rh)
      x += len
    }
    above2 = above; above = joints
    g.fillStyle = "rgba(70,44,22,0.5)"; g.fillRect(0, r * rh, w, 2)
  }
})

// safety vinyl: light grey with the fine flecks and grip of a wet-room sheet
const vinyl = tex((g, w, h) => {
  g.fillStyle = "#cfd1d0"; g.fillRect(0, 0, w, h)
  for (let i = 0; i < 26000; i++) {
    const v = rnd()
    g.fillStyle = v > 0.66 ? "rgba(255,255,255,0.35)" : v > 0.33 ? "rgba(90,95,98,0.3)" : "rgba(150,155,160,0.35)"
    g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 2, 1 + rnd() * 2)
  }
}, 1024, 1024)
vinyl.wrapS = vinyl.wrapT = THREE.RepeatWrapping

const std = (o) => new THREE.MeshStandardMaterial(o)
const MAT = {
  ply: std({ map: ply, roughness: 0.82 }),
  sheet: std({ map: sheetTex, roughness: 0.7 }),
  floor: std({ map: planks, color: "#d1c8c1", roughness: 0.55 }), // room.html's floor material
  screw: std({ color: "#3a3a3c", roughness: 0.4, metalness: 0.8 }),
  vinyl: std({ map: vinyl, roughness: 0.75 }),
  tray: new THREE.MeshPhysicalMaterial({ color: "#f7f7f5", roughness: 0.2, clearcoat: 0.6, clearcoatRoughness: 0.15 }),
  dish: new THREE.MeshPhysicalMaterial({ color: "#e4e5e3", roughness: 0.3, clearcoat: 0.4 }), // the dished floor inside the rim
  drain: std({ color: "#8f9397", roughness: 0.3, metalness: 0.9 }),
  steel: std({ color: "#8e3f33", roughness: 0.55, metalness: 0.3 }), // the studio's red box (the roof's #9c4436)
  cast: std({ color: "#5f2a22", roughness: 0.75, metalness: 0.35 }),
  hole: std({ color: "#151210", roughness: 1 }),
}

// ------------------------------------------------------------ geometry
const meshes = [], layers = { base: [], sheets: [], screws: [], planks: [], vinyl: [], tray: [] }
function add(mesh, layer) { scene.add(mesh); meshes.push(mesh); layers[layer].push(mesh); return mesh }
// a box between two corners; `span` [x0, z0, sx, sz] maps a texture once across it, seen from above
function box(x0, y0, z0, x1, y1, z1, name, layer = "base", span) {
  const geo = new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0)
  if (span) {
    const pos = geo.attributes.position, uv = geo.attributes.uv
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i) + (x0 + x1) / 2, z = pos.getZ(i) + (z0 + z1) / 2
      uv.setXY(i, (x - span[0]) / span[2], 1 - (z - span[1]) / span[3])
    }
  }
  const mesh = new THREE.Mesh(geo, MAT[name])
  mesh.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2)
  mesh.castShadow = true; mesh.receiveShadow = true
  return add(mesh, layer)
}
const SPAN = [X0, Z0, X1 - X0, Z1 - Z0]

// the frame, its top flush with the floor, and the ply on the cross-members
box(BX0 + CAST[0], -RAIL, BZ0, BX1 - CAST[0], 0, Z0, "steel")
box(BX0 + CAST[0], -RAIL, Z1, BX1 - CAST[0], 0, BZ1, "steel")
box(BX0, -RAIL, BZ0 + CAST[1], X0, 0, BZ1 - CAST[1], "steel")
box(X1, -RAIL, BZ0 + CAST[1], BX1, 0, BZ1 - CAST[1], "steel")
box(X0, -0.028, Z0, X1, 0, Z1, "ply", "base", SPAN)
// four corner castings, their tops proud of the floor where the corner posts would stand, an oval hole in each
const oval = new THREE.CylinderGeometry(0.032, 0.032, 0.003, 32)
for (const [xa, xb] of [[BX0, BX0 + CAST[0]], [BX1 - CAST[0], BX1]]) for (const [za, zb] of [[BZ0, BZ0 + CAST[1]], [BZ1 - CAST[1], BZ1]]) {
  box(xa, -RAIL - 0.01, za, xb, 0.045, zb, "cast")
  const hole = new THREE.Mesh(oval, MAT.hole)
  hole.scale.set(1.94, 1, 1) // 124 x 64 mm
  hole.position.set((xa + xb) / 2, 0.0465, (za + zb) / 2)
  add(hole, "base")
}
// layer 1: the sheets as one board (the texture draws each sheet), then the screws: a row every 300 mm
// and round the edges 25 mm in
box(X0, 0, Z0, X1, SHEET_T, Z1, "sheet", "sheets", SPAN)
const head = new THREE.CylinderGeometry(0.0055, 0.0055, 0.0015, 16)
for (const s of SHEETS) {
  const xs = [], zs = []
  for (let x = s.x0 + 0.025; x < s.x1 - 0.02; x += 0.3) xs.push(x)
  xs.push(s.x1 - 0.025)
  for (let z = s.z0 + 0.025; z < s.z1 - 0.02; z += 0.3) zs.push(z)
  zs.push(s.z1 - 0.025)
  for (const x of xs) for (const z of zs) {
    const h = new THREE.Mesh(head, MAT.screw)
    h.position.set(x, SHEET_T + 0.0008, z)
    add(h, "screws")
  }
}
// layer 2: the planks over the living area, to the partition line
box(X0, SHEET_T + 0.0015, Z0, px0, SHEET_T + 0.0015 + PLANK_T, Z1, "floor", "planks", [X0, Z0, ...FLOOR])

// the bathroom end: one vinyl sheet from the partition line to end B, then the low tray on it, its rim a
// shade proud of the dished floor, the waste in the middle
const VTOP = SHEET_T + 0.0015 + VINYL_T
box(px0, SHEET_T + 0.0015, Z0, X1, VTOP, Z1, "vinyl", "vinyl", [px0, Z0, 1.2, 1.2])
const [tx0, tz0, , tx1, tz1, th] = TRAY
box(tx0, VTOP, tz0, tx1, VTOP + th, tz1, "tray", "tray")
box(tx0 + 0.05, VTOP + th, tz0 + 0.05, tx1 - 0.05, VTOP + th + 0.001, tz1 - 0.05, "dish", "tray").castShadow = false
const waste = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.002, 32), MAT.drain)
waste.position.set((tx0 + tx1) / 2, VTOP + th + 0.0015, (tz0 + tz1) / 2)
add(waste, "tray")

const ORDER = ["base", "sheets", "screws", "planks", "vinyl", "tray"]
const show = ORDER.slice(0, ORDER.indexOf(LAYER) + 1)
for (const [k, list] of Object.entries(layers)) for (const o of list) o.visible = show.includes(k)

// ------------------------------------------------------------ camera: straight down, end A on the left
const pad = 0.1
const zc = (BZ0 + BZ1) / 2, half = (((BX1 - BX0 + 2 * pad) * FH) / FW) / 2
const VX0 = BX0 - pad, VX1 = BX1 + pad
const camera = new THREE.OrthographicCamera(VX0, VX1, half, -half, 0.1, 50)
camera.position.set(0, 10, zc)
camera.up.set(0, 0, -1)
camera.lookAt(0, 0, zc)
camera.updateProjectionMatrix()
// world (x, z) -> fractions of the picture
const fx = (x) => (x - VX0) / (VX1 - VX0), fz = (z) => (z - (zc - half)) / (2 * half)

// ------------------------------------------------------------ colour pass: soft daylight from end A
const pmrem = new THREE.PMREMGenerator(renderer)
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture
scene.environmentIntensity = 0.45
scene.add(new THREE.HemisphereLight(0xffffff, 0xd8cdbc, 0.6))
const sun = new THREE.DirectionalLight(0xffefd6, 2.2)
sun.position.set(-2.5, 8, zc - 3); sun.target.position.set(L / 2, 0, zc)
sun.castShadow = true
sun.shadow.mapSize.set(4096, 4096)
Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 0.5, far: 25 })
sun.shadow.bias = -0.0002; sun.shadow.normalBias = 0.01; sun.shadow.radius = 3
scene.add(sun, sun.target)
const composer = new EffectComposer(renderer)
composer.setSize(FW, FH)
composer.addPass(new RenderPass(scene, camera))
const ao = new GTAOPass(scene, camera, FW, FH)
ao.output = GTAOPass.OUTPUT.Default
ao.blendIntensity = 0.7
composer.addPass(ao)
composer.addPass(new OutputPass())
composer.render()
const color = document.createElement("canvas"); color.width = FW; color.height = FH
color.getContext("2d").drawImage(renderer.domElement, 0, 0)

// ------------------------------------------------------------ mask pass: this layer's meshes, white
const black = new THREE.MeshBasicMaterial({ color: 0x000000 }), white = new THREE.MeshBasicMaterial({ color: 0xffffff })
for (const o of meshes) o.material = layers[LAYER].includes(o) ? white : black
scene.background = new THREE.Color(0x000000); scene.environment = null
renderer.toneMapping = THREE.NoToneMapping; renderer.shadowMap.enabled = false
renderer.render(scene, camera)
const mask = document.createElement("canvas"); mask.width = FW; mask.height = FH
mask.getContext("2d").drawImage(renderer.domElement, 0, 0)
const out = color.getContext("2d").getImageData(0, 0, FW, FH)
const a = mask.getContext("2d").getImageData(0, 0, FW, FH).data
for (let i = 0; i < a.length; i += 4) out.data[i + 3] = a[i]
color.getContext("2d").putImageData(out, 0, 0)
window.OUT = color.toDataURL("image/png")

// ------------------------------------------------------------ the pieces, in laying order
const rect = (x0, z0, x1, z1) => [fx(x0), fz(z0), fx(x1) - fx(x0), fz(z1) - fz(z0)].map((v) => +v.toFixed(5))
window.PIECES = {
  aspect: FW / FH,
  sheets: SHEETS.map((s) => rect(s.x0, s.z0, s.x1, s.z1)),
  // from the back wall forward, each row from end A; clipped to the living floor
  planks: PLANKS.map((p) => ({ ...p, x0: Math.max(X0, p.x0), x1: Math.min(px0, p.x1), z1: Math.min(Z1, p.z1) }))
    .filter((p) => p.x1 - p.x0 > 0.01 && p.z1 - p.z0 > 0.01)
    .sort((a, b) => a.r - b.r || a.x0 - b.x0)
    .map((p) => rect(p.x0, p.z0, p.x1, p.z1)),
  vinyl: rect(px0, Z0, X1, Z1),
  tray: rect(tx0, tz0, tx1, tz1),
}
document.body.dataset.ready = "1"
</script>
</body>
</html>
