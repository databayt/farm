<!doctype html>
<!--
  The /en/studio floor section: the bare container seen from above the front, with the front wall
  and roof off, at each stage of the living floor (sheets.py "FLOOR (living)", kits.py S02 + S05).

    ?stage=0  the empty container: 28 mm treated plywood on the cross-members  -> render/floor-0.jpg
    ?stage=1  layer 1: primer + epoxy seal over the ply (S02)                 -> render/floor-1.jpg
    ?stage=2  layer 2: underlay + 5 mm SPC oak in the living area (S05);      -> render/floor-2.jpg
              the bathroom end keeps the seal until its coved vinyl (S08)

  Serve the repo root on :3000 (python3 -m http.server 3000), open this page at 2400 x 1350 and
  screenshot #out once body[data-ready] is set. The plank texture is room.html's, so the finished
  floor matches the 3D section; change both together.
-->
<html>
<head>
<meta charset="utf-8">
<style>
html,body{margin:0;background:#fff}
#out{display:block;width:2400px;height:1350px}
</style>
<script type="importmap">
{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}
</script>
</head>
<body>
<img id="out" alt="">
<script type="module">
import * as THREE from "three"
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js"
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js"
import { RenderPass } from "three/addons/postprocessing/RenderPass.js"
import { GTAOPass } from "three/addons/postprocessing/GTAOPass.js"
import { OutputPass } from "three/addons/postprocessing/OutputPass.js"

const STAGE = Number(new URLSearchParams(location.search).get("stage") ?? 0)
const FW = 2400, FH = 1350
const S = await (await fetch(`/public/designs/studio/render/scene.json?${Date.now()}`)).json()
const m = (v) => v / 1000 // layout mm -> metres; three: x = x, y = height (layout z), z = depth (layout y)

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
renderer.setPixelRatio(1)
renderer.setSize(FW, FH)
renderer.outputColorSpace = THREE.SRGBColorSpace
renderer.toneMapping = THREE.ACESFilmicToneMapping
renderer.toneMappingExposure = 1.05
renderer.shadowMap.enabled = true
renderer.shadowMap.type = THREE.PCFShadowMap
const scene = new THREE.Scene()
scene.background = new THREE.Color(12, 12, 12) // white page after tone mapping, as in room.html

// ------------------------------------------------------------ procedural textures
let seed = 7
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647)
function tex(draw, w = 512, h = 512) {
  const c = document.createElement("canvas"); c.width = w; c.height = h
  seed = 7
  draw(c.getContext("2d"), w, h)
  const t = new THREE.CanvasTexture(c)
  t.colorSpace = THREE.SRGBColorSpace
  t.anisotropy = 8
  return t
}
// a container floor: marine ply boards laid along the box, darkened by the treatment, with the rows of
// screws into each cross-member. Covers the whole floor (FLOOR_ALL) once.
const ply = tex((g, w, h) => {
  const tones = ["#7a4a2c", "#86553a", "#6f4428", "#8b5a3c", "#7d4f31"]
  const rows = 5, rh = h / rows
  for (let r = 0; r < rows; r++) {
    const y0 = r * rh
    g.fillStyle = tones[r % tones.length]; g.fillRect(0, y0, w, rh)
    for (let i = 0; i < 26; i++) { // veneer grain
      const y = y0 + rnd() * rh
      g.strokeStyle = `rgba(50,28,14,${0.06 + rnd() * 0.12})`; g.lineWidth = 0.8 + rnd() * 2
      g.beginPath(); g.moveTo(0, y)
      g.bezierCurveTo(w * 0.3, y + (rnd() - 0.5) * 14, w * 0.7, y + (rnd() - 0.5) * 14, w, y + (rnd() - 0.5) * 8)
      g.stroke()
    }
    g.fillStyle = "rgba(30,16,8,0.6)"; g.fillRect(0, y0, w, 3) // board joint
  }
  for (let i = 0; i < 14; i++) { // wear and old stains
    const x = rnd() * w, y = rnd() * h, r = 30 + rnd() * 120
    const gr = g.createRadialGradient(x, y, 0, x, y, r)
    gr.addColorStop(0, `rgba(35,20,10,${0.10 + rnd() * 0.12})`); gr.addColorStop(1, "rgba(35,20,10,0)")
    g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r)
  }
  for (let x = 40; x < w; x += w / 19) { // screws into the cross-members, about 300 mm apart
    for (let r = 0; r < rows; r++) for (const f of [0.3, 0.7]) {
      g.fillStyle = "#2b2622"; g.beginPath(); g.arc(x, r * rh + rh * f, 3, 0, 7); g.fill()
    }
  }
}, 2048, 1024)
// the epoxy seal: a grey satin coat that still shows the board joints and screw heads under it
const epoxy = tex((g, w, h) => {
  g.fillStyle = "#9a9c9c"; g.fillRect(0, 0, w, h)
  for (let i = 0; i < 4000; i++) {
    g.fillStyle = rnd() > 0.5 ? "rgba(255,255,255,0.05)" : "rgba(0,0,0,0.05)"
    g.fillRect(rnd() * w, rnd() * h, 2 + rnd() * 3, 2 + rnd() * 3)
  }
  const rows = 5, rh = h / rows
  for (let r = 1; r < rows; r++) { g.fillStyle = "rgba(60,60,60,0.25)"; g.fillRect(0, r * rh, w, 2) }
  for (let x = 40; x < w; x += w / 19) for (let r = 0; r < rows; r++) for (const f of [0.3, 0.7]) {
    g.fillStyle = "rgba(70,70,70,0.35)"; g.beginPath(); g.arc(x, r * rh + rh * f, 3, 0, 7); g.fill()
  }
}, 2048, 1024)
// room.html's oak planks: boards about 133 mm wide, 0.9-1.8 m long, laid like a fitter would
const planks = tex((g, w, h) => {
  const tones = ["#b98b5b", "#c39663", "#a97c4f", "#bd9264", "#ae8255", "#c79b6a", "#b38556"]
  const rows = 18, rh = h / rows
  const MIN1 = 128, MIN2 = 64
  let bag = [], last = -1, above = [], above2 = []
  const shade = () => {
    if (!bag.length) {
      bag = tones.map((_, i) => i)
      for (let i = bag.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [bag[i], bag[j]] = [bag[j], bag[i]] }
    }
    let i = bag.pop()
    if (i === last && bag.length) { const j = bag.pop(); bag.unshift(i); i = j }
    return tones[(last = i)]
  }
  const clear = (j) => above.every((p) => Math.abs(p - j) >= MIN1) && above2.every((p) => Math.abs(p - j) >= MIN2)
  for (let r = 0; r < rows; r++) {
    const joints = []
    let x = -Math.floor(rnd() * 700)
    while (x < w) {
      const y0 = r * rh
      let len = 0
      for (let t = 0; t < 40; t++) {
        len = 384 + Math.floor(rnd() * 384)
        if (x + len >= w || clear(x + len)) break
      }
      joints.push(x + len)
      g.fillStyle = shade(); g.fillRect(x, y0, len, rh)
      for (let i = 0; i < 7; i++) {
        const y = y0 + rnd() * rh
        g.strokeStyle = `rgba(110,72,38,${0.08 + rnd() * 0.14})`; g.lineWidth = 0.7 + rnd() * 1.4
        g.beginPath(); g.moveTo(x, y)
        g.bezierCurveTo(x + len * 0.3, y + (rnd() - 0.5) * 6, x + len * 0.7, y + (rnd() - 0.5) * 6, x + len, y + (rnd() - 0.5) * 4)
        g.stroke()
      }
      if (rnd() > 0.35) {
        const cx = x + len * (0.25 + rnd() * 0.5), cy = y0 + rh * (0.3 + rnd() * 0.4)
        for (let k = 1; k <= 4; k++) {
          g.strokeStyle = `rgba(104,66,34,${0.10 + rnd() * 0.12})`; g.lineWidth = 0.9
          g.beginPath(); g.moveTo(cx - 40 * k, cy - 3 * k)
          g.quadraticCurveTo(cx + 30 * k, cy, cx - 40 * k, cy + 3 * k + 2); g.stroke()
        }
      }
      g.fillStyle = "rgba(70,44,22,0.55)"; g.fillRect(x, y0, 2, rh)
      x += len
    }
    above2 = above; above = joints
    g.fillStyle = "rgba(70,44,22,0.5)"; g.fillRect(0, r * rh, w, 2)
  }
}, 2048, 1024)

const std = (o) => new THREE.MeshStandardMaterial(o)
const MAT = {
  ply: std({ map: ply, roughness: 0.8 }),
  epoxy: std({ map: epoxy, roughness: 0.32 }),
  floor: std({ map: planks, color: "#d1c8c1", roughness: 0.55 }), // room.html's floor material
  steel: std({ color: "#c9c7c1", roughness: 0.6, metalness: 0.25 }), // the box's factory-painted inside
  cut: std({ color: "#2c2c2c", roughness: 0.9 }),
}

// ------------------------------------------------------------ geometry (metres)
const meshes = []
// a box between two corners; a floor box maps its texture once across `span` (x, z extent) from `at`
function box(x0, y0, z0, x1, y1, z1, name, span) {
  const geo = new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0)
  if (span) {
    const pos = geo.attributes.position, uv = geo.attributes.uv
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i) + (x0 + x1) / 2, z = pos.getZ(i) + (z0 + z1) / 2
      uv.setXY(i, (x - span[0]) / span[2], 1 - (z - span[1]) / span[3])
    }
  }
  const mesh = new THREE.Mesh(geo, MAT[name])
  mesh.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2)
  mesh.castShadow = !span; mesh.receiveShadow = true
  scene.add(mesh); meshes.push(mesh)
  return mesh
}

const L = m(S.L), W = m(S.W), H = m(S.H), e = m(S.lining), px0 = m(S.part_x0)
// the bare box: steel at the lining's outer face, so the floor spans wall to wall
const X0 = -e, X1 = L + e, Z0 = -e, Z1 = W + e
const ALL = [X0, Z0, X1 - X0, Z1 - Z0]

// floor: the ply always; then the seal; then the SPC over the living area (its 7 mm reads as a step at the
// partition line, where the bathroom's vinyl will meet it)
box(X0, -0.12, Z0, X1, 0, Z1, STAGE >= 1 ? "epoxy" : "ply", ALL)
if (STAGE >= 2) box(X0, 0, Z0, px0, 0.007, Z1, "floor", [X0, Z0, 4.8, 2.4])
box(X0, -0.12, Z1, X1, 0, Z1 + 0.006, "cut") // the front cut edge of the floor

// corrugated steel: a 2 mm skin with trapezoid valleys every 278 mm, 36 mm deep, facing in
const P = 0.278, D = 0.036
function corrugated(axis, a0, a1, fixed, inward) {
  const t = 0.004
  if (axis === "x") box(a0, 0, fixed - (inward > 0 ? t : 0), a1, H, fixed + (inward > 0 ? 0 : t), "steel")
  else box(fixed - (inward > 0 ? t : 0), 0, a0, fixed + (inward > 0 ? 0 : t), H, a1, "steel")
  for (let a = a0 + P / 4; a + P / 2 <= a1; a += P) { // the ribs stand in from the skin
    const r0 = a, r1 = a + P / 2 - 0.03
    const f0 = inward > 0 ? fixed : fixed - D, f1 = inward > 0 ? fixed + D : fixed
    if (axis === "x") box(r0, 0, f0, r1, H, f1, "steel")
    else box(f0, 0, r0, f1, H, r1, "steel")
  }
}
corrugated("x", X0, X1, Z0, 1) // back wall
corrugated("z", Z0, Z1, X0, 1) // end A
corrugated("z", Z0, Z1, X1, -1) // end B
// the cut tops of the walls, dark, so the section reads
box(X0 - 0.004, H, Z0 - 0.004, X1 + 0.004, H + 0.01, Z0 + D, "cut")
box(X0 - 0.004, H, Z0, X0 + D, H + 0.01, Z1, "cut")
box(X1 - D, H, Z0, X1 + 0.004, H + 0.01, Z1, "cut")

// ------------------------------------------------------------ camera: from above the open front
const cx = (X0 + X1) / 2
const camera = new THREE.PerspectiveCamera(40, FW / FH, 0.1, 100)
camera.position.set(cx, 5.6, W + 5.4)
camera.lookAt(cx, 0.4, W / 2 - 0.2)
camera.updateMatrixWorld(); camera.updateProjectionMatrix()
const bb = new THREE.Box3()
for (const o of meshes) bb.expandByObject(o)
let px = [Infinity, Infinity, -Infinity, -Infinity]
for (const xx of [bb.min.x, bb.max.x]) for (const yy of [bb.min.y, bb.max.y]) for (const zz of [bb.min.z, bb.max.z]) {
  const p = new THREE.Vector3(xx, yy, zz).project(camera)
  const X = ((p.x + 1) / 2) * FW, Y = ((1 - p.y) / 2) * FH
  px = [Math.min(px[0], X), Math.min(px[1], Y), Math.max(px[2], X), Math.max(px[3], Y)]
}
let w = (px[2] - px[0]) * 1.06, h = (px[3] - px[1]) * 1.08
if (w / h > FW / FH) h = (w * FH) / FW; else w = (h * FW) / FH
camera.setViewOffset(FW, FH, (px[0] + px[2]) / 2 - w / 2, (px[1] + px[3]) / 2 - h / 2, w, h)

// ------------------------------------------------------------ render: room.html's daylight
const pmrem = new THREE.PMREMGenerator(renderer)
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture
scene.environmentIntensity = 0.45
scene.add(new THREE.HemisphereLight(0xffffff, 0xd8cdbc, 0.55))
const sun = new THREE.DirectionalLight(0xffefd6, 2.4)
sun.position.set(cx - 2.6, 5.5, W + 4.5); sun.target.position.set(cx, 0, W / 2)
sun.castShadow = true
sun.shadow.mapSize.set(4096, 4096)
Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 0.5, far: 20 })
sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.02; sun.shadow.radius = 4
scene.add(sun, sun.target)
const composer = new EffectComposer(renderer)
composer.setSize(FW, FH)
composer.addPass(new RenderPass(scene, camera))
const ao = new GTAOPass(scene, camera, FW, FH)
ao.output = GTAOPass.OUTPUT.Default
ao.blendIntensity = 0.85
composer.addPass(ao)
composer.addPass(new OutputPass())
composer.render()
document.getElementById("out").src = renderer.domElement.toDataURL("image/png")
document.body.dataset.ready = "1"
</script>
</body>
</html>
